<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps — Metric Story Review</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #ccc; min-height: 100vh; }

  /* ── Header ── */
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 16px; font-weight: 700; color: #00d4ff; }
  .header .meta { font-size: 12px; color: #666; }
  .header .spacer { flex: 1; }
  .btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #00d4ff; color: #0d1117; }
  .btn-secondary { background: #21262d; color: #ccc; border: 1px solid #30363d; }
  .btn-load { background: #238636; color: #fff; }

  /* ── Filters ── */
  .filters { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .filters label { font-size: 12px; color: #666; margin-right: 4px; }
  select { background: #21262d; border: 1px solid #30363d; color: #ccc; padding: 5px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .filter-sep { width: 1px; height: 24px; background: #30363d; }
  .progress { font-size: 12px; color: #666; margin-left: auto; }
  .progress span { color: #00d4ff; font-weight: 600; }
  .progress .regen-count { color: #f0b94a; }
  .progress .carry-count { color: #555; }

  /* ── Layout ── */
  .main { max-width: 960px; margin: 0 auto; padding: 24px; }

  /* ── Country section ── */
  .country-section { margin-bottom: 32px; }
  .country-heading { font-size: 14px; font-weight: 700; color: #00d4ff; padding: 8px 0; border-bottom: 1px solid #21262d; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .country-heading .flag { font-size: 18px; }
  .country-heading .country-summary { font-size: 11px; color: #555; font-weight: 400; margin-left: auto; }

  /* ── Metric card ── */
  .metric-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 12px; overflow: hidden; transition: opacity 0.2s; }
  .metric-card.carried { opacity: 0.55; }
  .metric-card.carried:hover { opacity: 0.85; }
  .metric-header { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .metric-header:hover { background: #1c2128; }
  .metric-name { font-size: 13px; font-weight: 600; color: #e6edf3; flex: 1; }
  .metric-value { font-size: 12px; color: #00d4ff; font-weight: 600; }
  .metric-section { font-size: 11px; color: #444; background: #21262d; padding: 2px 6px; border-radius: 4px; }
  .metric-chevron { font-size: 11px; color: #444; transition: transform 0.2s; }
  .metric-card.open .metric-chevron { transform: rotate(180deg); }

  /* ── Status badge ── */
  .status-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
  .status-badge.regen  { background: #3a2810; color: #f0b94a; border: 1px solid #5a3d18; }
  .status-badge.carry  { background: #1a1f26; color: #555; border: 1px solid #30363d; }
  .trigger-reason { font-size: 11px; color: #777; margin-left: 4px; font-style: italic; }

  .metric-body { display: none; padding: 0 14px 14px; border-top: 1px solid #21262d; }
  .metric-card.open .metric-body { display: block; }

  /* ── Level tabs ── */
  .level-tabs { display: flex; gap: 4px; padding: 10px 0 8px; }
  .level-tab { padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #30363d; background: transparent; color: #666; transition: all 0.15s; }
  .level-tab.active { background: #00d4ff; color: #0d1117; border-color: #00d4ff; font-weight: 600; }

  /* ── Bullet editors ── */
  .bullets { display: flex; flex-direction: column; gap: 6px; }
  .bullet-row { display: flex; align-items: flex-start; gap: 8px; }
  .bullet-num { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #00d4ff; color: #00d4ff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 8px; }
  .metric-card.carried .bullet-num { border-color: #555; color: #555; }
  .bullet-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; color: #ccc; padding: 7px 10px; font-size: 12px; line-height: 1.5; resize: none; min-height: 52px; font-family: inherit; transition: border-color 0.15s; }
  .bullet-input:focus { outline: none; border-color: #00d4ff; }
  .metric-card.carried .bullet-input { background: #14181f; color: #888; }

  /* ── Empty / load state ── */
  .empty-state { text-align: center; padding: 80px 24px; color: #444; }
  .empty-state .big { font-size: 32px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; margin-bottom: 16px; }

  /* ── Toast ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="header">
  <h1>Metric Story Review</h1>
  <span class="meta" id="meta">No file loaded</span>
  <div class="spacer"></div>
  <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">Load Draft</button>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadFile(event)">
  <button class="btn btn-primary" onclick="exportApproved()" id="exportBtn" disabled>Export Approved</button>
</div>

<div class="filters" id="filters" style="display:none">
  <label>Country</label>
  <select id="filterCountry" onchange="render()">
    <option value="">All</option>
  </select>
  <div class="filter-sep"></div>
  <label>Section</label>
  <select id="filterSection" onchange="render()">
    <option value="">All</option>
    <option value="macro">Macro</option>
    <option value="market">Market</option>
  </select>
  <div class="filter-sep"></div>
  <label>Status</label>
  <select id="filterStatus" onchange="render()">
    <option value="">All</option>
    <option value="regen">Regenerated only</option>
    <option value="carry">Carried forward only</option>
  </select>
  <div class="progress" id="progressText"></div>
</div>

<div class="main" id="main">
  <div class="empty-state">
    <div class="big">📋</div>
    <p>Load a metric_stories_draft file to begin review.</p>
    <button class="btn btn-load" onclick="document.getElementById('fileInput').click()">Load Draft JSON</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let draft      = null;
let edited     = {};   // edited[code][metric] = { beginner, moderate, expert, _regenerated, _trigger_reason, _section, _value }

const LEVELS   = ['beginner','moderate','expert'];
const COUNTRY_ORDER = ['USA','CAN','GBR','JPN','DEU','FRA','ITA','CHN','IND','ZAF','BRA','RUS'];
const FLAGS    = {USA:'🇺🇸',CAN:'🇨🇦',GBR:'🇬🇧',JPN:'🇯🇵',DEU:'🇩🇪',FRA:'🇫🇷',ITA:'🇮🇹',CHN:'🇨🇳',IND:'🇮🇳',ZAF:'🇿🇦',BRA:'🇧🇷',RUS:'🇷🇺'};
const MACRO_METRICS = ['GDP Growth','Inflation (CPI)','Unemployment','Budget Deficit','Current Account','Policy Rate'];

// ── Load file ──────────────────────────────────────────────────────────────
function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      draft  = JSON.parse(ev.target.result);
      edited = {};
      // Deep-copy draft into edited, preserving metadata flags
      for (const [code, metrics] of Object.entries(draft.countries || {})) {
        edited[code] = {};
        for (const [name, payload] of Object.entries(metrics)) {
          edited[code][name] = {
            _regenerated:    payload._regenerated !== false,
            _trigger_reason: payload._trigger_reason || '',
            _section:        payload._section || (MACRO_METRICS.includes(name) ? 'macro' : 'market'),
            _value:          payload._value || '',
          };
          for (const lv of LEVELS) {
            const arr = (payload[lv] || ['','','']).slice(0,3);
            while (arr.length < 3) arr.push('');
            edited[code][name][lv] = arr;
          }
        }
      }
      const tot = countMetrics();
      document.getElementById('meta').textContent =
        `${file.name} — ${draft.date || ''} ${draft.generated_at || ''} — ${tot.regen} regen / ${tot.carry} carried`;
      document.getElementById('exportBtn').disabled = false;
      document.getElementById('filters').style.display = 'flex';
      populateCountryFilter();
      render();
      toast(`Loaded: ${tot.regen} regen, ${tot.carry} carried forward`);
    } catch(err) {
      alert('Could not parse JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Counts ─────────────────────────────────────────────────────────────────
function countMetrics() {
  let regen = 0, carry = 0;
  for (const metrics of Object.values(edited)) {
    for (const m of Object.values(metrics)) {
      if (m._regenerated) regen++;
      else carry++;
    }
  }
  return { regen, carry, total: regen + carry };
}

// ── Populate country filter ────────────────────────────────────────────────
function populateCountryFilter() {
  const sel = document.getElementById('filterCountry');
  sel.innerHTML = '<option value="">All countries</option>';
  for (const code of COUNTRY_ORDER) {
    if (edited[code]) {
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = `${FLAGS[code]||''} ${code}`;
      sel.appendChild(opt);
    }
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  if (!draft) return;
  const filterCode    = document.getElementById('filterCountry').value;
  const filterSection = document.getElementById('filterSection').value;
  const filterStatus  = document.getElementById('filterStatus').value;
  const main          = document.getElementById('main');
  main.innerHTML      = '';

  const codes = filterCode ? [filterCode] : COUNTRY_ORDER.filter(c => edited[c]);

  let totalShown = 0, regenShown = 0, carryShown = 0, countriesShown = 0;

  for (const code of codes) {
    const metrics = edited[code];
    if (!metrics) continue;

    const metricNames = Object.keys(metrics).filter(name => {
      const m = metrics[name];
      if (filterSection && m._section !== filterSection) return false;
      if (filterStatus === 'regen' && !m._regenerated) return false;
      if (filterStatus === 'carry' &&  m._regenerated) return false;
      return true;
    });
    if (!metricNames.length) continue;

    countriesShown++;
    let countryRegen = 0, countryCarry = 0;
    for (const name of metricNames) {
      if (metrics[name]._regenerated) countryRegen++; else countryCarry++;
    }
    totalShown += metricNames.length;
    regenShown += countryRegen;
    carryShown += countryCarry;

    const section = document.createElement('div');
    section.className = 'country-section';
    section.innerHTML = `
      <div class="country-heading">
        <span class="flag">${FLAGS[code]||''}</span>${code}
        <span class="country-summary">${countryRegen} regen, ${countryCarry} carried</span>
      </div>`;

    for (const name of metricNames) {
      section.appendChild(buildMetricCard(code, name, metrics[name]));
    }
    main.appendChild(section);
  }

  document.getElementById('progressText').innerHTML =
    `Showing <span>${totalShown}</span> across <span>${countriesShown}</span> countries ` +
    `(<span class="regen-count">${regenShown}</span> regen, <span class="carry-count">${carryShown}</span> carried)`;
}

// ── Build metric card ──────────────────────────────────────────────────────
function buildMetricCard(code, name, payload) {
  const card = document.createElement('div');
  const isCarried = !payload._regenerated;
  card.className = 'metric-card' + (isCarried ? ' carried' : '');
  card.id = `card-${code}-${name.replace(/\s/g,'_')}`;

  const sectionLabel = payload._section || (MACRO_METRICS.includes(name) ? 'macro' : 'market');
  const badgeClass   = isCarried ? 'carry' : 'regen';
  const badgeLabel   = isCarried ? 'carried' : 'regen';
  const reason       = payload._trigger_reason || '';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'metric-header';
  hdr.innerHTML = `
    <span class="metric-section">${sectionLabel}</span>
    <span class="metric-name">${name}</span>
    <span class="status-badge ${badgeClass}">${badgeLabel}</span>
    ${reason ? `<span class="trigger-reason">${reason}</span>` : ''}
    <span class="metric-chevron">▼</span>
  `;
  hdr.onclick = () => { card.classList.toggle('open'); };
  card.appendChild(hdr);

  // Body
  const body = document.createElement('div');
  body.className = 'metric-body';

  // Level tabs
  const tabs = document.createElement('div');
  tabs.className = 'level-tabs';
  let activeLevel = 'beginner';

  const bulletContainers = {};
  for (const lv of LEVELS) {
    const tab = document.createElement('button');
    tab.className = 'level-tab' + (lv === activeLevel ? ' active' : '');
    tab.textContent = lv.charAt(0).toUpperCase() + lv.slice(1);
    tab.onclick = () => {
      tabs.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      for (const l of LEVELS) {
        bulletContainers[l].style.display = l === lv ? 'flex' : 'none';
      }
    };
    tabs.appendChild(tab);
  }
  body.appendChild(tabs);

  // Bullet editors per level
  for (const lv of LEVELS) {
    const container = document.createElement('div');
    container.className = 'bullets';
    container.style.display = lv === activeLevel ? 'flex' : 'none';
    bulletContainers[lv] = container;

    const bullets = (edited[code] && edited[code][name] && edited[code][name][lv]) || ['','',''];
    for (let i = 0; i < 3; i++) {
      const row = document.createElement('div');
      row.className = 'bullet-row';
      row.innerHTML = `<div class="bullet-num">${i+1}</div>`;
      const ta = document.createElement('textarea');
      ta.className = 'bullet-input';
      ta.value = bullets[i] || '';
      ta.rows = 2;
      ta.oninput = () => {
        if (!edited[code]) edited[code] = {};
        if (!edited[code][name]) edited[code][name] = {};
        if (!edited[code][name][lv]) edited[code][name][lv] = ['','',''];
        edited[code][name][lv][i] = ta.value;
        autoResize(ta);
      };
      ta.onload = autoResize(ta);
      row.appendChild(ta);
      container.appendChild(row);
    }
    body.appendChild(container);
  }

  card.appendChild(body);
  return card;
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

// ── Export approved ────────────────────────────────────────────────────────
async function exportApproved() {
  if (!draft) return;
  // Preserve _regenerated / _trigger_reason / _section / _value flags so apply step
  // can skip carried-forward metrics and leave their stamps untouched.
  const approved = {
    date:         draft.date,
    generated_at: draft.generated_at,
    approved_at:  new Date().toISOString().slice(0,16).replace('T',' '),
    countries:    edited
  };
  const json    = JSON.stringify(approved, null, 2);
  const dateStr = draft.date || new Date().toISOString().slice(0,10);
  const filename = `METRICS_approved_${dateStr}.json`;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      toast('Saved METRICS_approved_' + dateStr + '.json');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      // fall through to legacy download on unexpected error
    }
  }

  // Fallback for browsers without File System Access API
  const blob = new Blob([json], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported METRICS_approved_' + dateStr + '.json');
}

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
