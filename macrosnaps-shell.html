<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps - Global Economic Dashboard</title>
<meta name="description" content="Daily macro and market snapshots for 12 major economies. Three expertise levels. Updated every morning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ralphlazar.github.io/macrosnaps/macrosnaps-globe.html">
<meta property="og:title" content="MacroSnaps - Global Economic Dashboard">
<meta property="og:description" content="Daily macro and market snapshots for 12 major economies. Three expertise levels. Updated every morning.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="MacroSnaps - Global Economic Dashboard">
<meta name="twitter:description" content="Daily macro and market snapshots for 12 major economies. Three expertise levels. Updated every morning.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00d4ff;--hot:#ff3d5a;--gold:#ffd700;--green:#00e68a;
  --font-display:'Space Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
html{background:#091426;color:#e8e8e8;font-family:var(--font-body)}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#091426}

/* ── View Container ── */
#main-views{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
#globe-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
#globe-view.hidden{display:none}
#rankings-view{flex:1;overflow-y:auto;display:none;padding:0 0 80px}
#rankings-view.active{display:block}

/* ── View Toggle ── */
.view-toggle{
  display:none;
  position:absolute;right:24px;top:50%;transform:translateY(-50%);
}
.view-btn{
  font-family:var(--font-display);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.14);border-radius:4px;
  background:transparent;color:#777;cursor:pointer;transition:all .25s;
}
.view-btn:hover{border-color:rgba(255,255,255,.3);color:#bbb}
.view-btn.active{
  background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 12px rgba(0,212,255,.1);
}

/* ── Commodities FAB ── */
/* ── Commodity inline link ── */
.comm-term{color:#e8a838;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(232,168,56,.5);text-underline-offset:2px;cursor:pointer;transition:color .15s;border-radius:2px}
.comm-term:hover{color:#f5c46a;text-decoration-color:rgba(232,168,56,.9);background:rgba(232,168,56,.07)}

/* ── Sortable headers ── */
.wh-table thead th.wh-sortable{cursor:pointer;user-select:none;transition:color .15s}
.wh-table thead th.wh-sortable:hover{color:#bbb}
.wh-sort-arrow{font-size:8px;margin-left:3px;opacity:.25;vertical-align:middle}
.wh-sort-arrow.active{opacity:1;color:var(--cyan)}

/* ── Cell hover tip ── */
#wh-hover-tip{
  position:fixed;pointer-events:none;z-index:300;display:none;
  background:rgba(9,20,38,.96);border:1px solid rgba(0,212,255,.35);
  border-radius:4px;padding:3px 9px;
  font-family:var(--font-display);font-size:10px;letter-spacing:.5px;
  color:#fff;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
@media(hover:none){#wh-hover-tip{display:none!important}}

/* ── Metric picker button ── */
.wh-metric-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--font-display);font-size:11px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--cyan);padding:4px 8px;
  display:inline-flex;align-items:center;gap:6px;
  border-radius:4px;transition:background .15s,color .15s;
}
.wh-metric-btn:hover{background:rgba(0,212,255,.08);color:#fff}
.wh-metric-arrow{font-size:10px;opacity:.5}

/* ── Metric dropdown ── */
.wh-metric-dropdown{
  position:fixed;z-index:400;
  background:rgba(9,20,38,.98);border:1px solid rgba(0,212,255,.25);
  border-radius:8px;padding:6px 0;min-width:200px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
  animation:ttIn .15s ease-out;
}
.wh-metric-group{
  font-family:var(--font-display);font-size:7px;letter-spacing:1.5px;
  text-transform:uppercase;color:#444;padding:8px 14px 3px;
}
.wh-metric-group:first-child{padding-top:4px}
.wh-metric-item{
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  text-transform:uppercase;color:#888;padding:6px 14px;
  cursor:pointer;transition:all .12s;
}
.wh-metric-item:hover{background:rgba(255,255,255,.06);color:#ddd}
.wh-metric-item.active{color:var(--cyan)}

/* ── Ranked (non-grid) table ── */
.wh-table-ranked{max-width:320px;margin:0 auto}
.wh-table-ranked-dual{max-width:420px}
.wh-rank-val{text-align:center;padding-right:0}
.wh-rank-th-val{text-align:center!important;width:58px}
.wh-rank-num{
  font-family:var(--font-display);font-size:12px;letter-spacing:.5px;color:#ccc;
}
.wh-rank-num.positive{color:var(--cyan)}
.wh-rank-num.negative{color:var(--hot)}

/* ── USD toggle ── */

/* ── Weather Homepage Table ── */
.wh-wrap{
  width:100%;max-width:720px;margin:0 auto;
  padding:10px 12px 0;
}
.wh-title{
  text-align:center;padding:8px 0 10px;
}
.wh-title h2{
  font-family:var(--font-display);font-size:11px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--cyan);margin-bottom:3px;
}
.wh-title p{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#555;
}
.wh-table{width:100%;border-collapse:collapse;table-layout:fixed}
.wh-table thead th{
  font-family:var(--font-display);font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:#555;padding:0 2px 8px;
  text-align:center;font-weight:400;
}
.wh-table thead th.wh-country-hd{text-align:left;color:#555;width:110px}
.wh-table thead th.wh-fc{color:var(--cyan)}
.wh-table tbody tr{
  border-bottom:1px solid rgba(255,255,255,.04);
  cursor:pointer;transition:background .15s;
}
.wh-table tbody tr:last-child{border-bottom:none}
.wh-table tbody tr:hover{background:rgba(255,255,255,.04)}
.wh-country-cell{
  padding:6px 8px 6px 0;text-align:left;
}
.wh-country-inner{display:flex;align-items:center;gap:7px}
.wh-flag{font-size:16px;line-height:1;flex-shrink:0}
.wh-name{font-size:12px;color:#ccc;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-code{font-family:var(--font-display);font-size:9px;letter-spacing:.8px;color:#777;display:none}
.wh-cell{padding:4px 2px;text-align:center;vertical-align:middle}
.wh-cell-inner{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.wh-icon{font-size:26px;line-height:1;display:block}
.wh-icon.sunny{filter:none}
.wh-icon.cloudy{filter:brightness(.6) contrast(1.05) saturate(.3)}
.wh-icon.stormy{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.3))}
.wh-val{
  font-family:var(--font-display);font-size:8px;letter-spacing:.3px;
  white-space:nowrap;
}
.wh-val.positive{color:var(--cyan)}
.wh-val.negative{color:var(--hot)}
.wh-val.neutral{color:#555}
.wh-cell.wh-fc-col{border-left:1px solid rgba(0,212,255,.12)}
.wh-asof{
  text-align:center;padding:10px 0 0;
  font-family:var(--font-display);font-size:9px;letter-spacing:.8px;
  color:#777;text-transform:uppercase;
}
/* News icons row inside rankings view */
.rk-news-icons{
  display:flex;gap:36px;justify-content:center;align-items:center;
  padding:10px 0 4px;
}
/* Mobile view-toggle adjustments */
@media(max-width:768px){
  .view-toggle{position:static;transform:none;margin-top:4px}
  .view-btn{font-size:9px;padding:5px 10px;letter-spacing:.8px}
  .top-bar{flex-wrap:wrap;justify-content:center;gap:6px}
  .wh-wrap{padding:8px 8px 0}
  .wh-icon{font-size:20px}
  .wh-val{font-size:7px}
  .wh-name{display:none}
  .wh-code{display:block}
  .wh-country-cell{padding:4px 6px 4px 0}
  .wh-country-inner{gap:5px}
  .wh-flag{font-size:14px}
  .wh-table thead th.wh-country-hd{width:64px}
  .wh-table thead th{font-size:7px;padding-bottom:6px}
  .rk-news-icons{gap:20px;padding:8px 0 2px}
}
@media(max-width:380px){
  .wh-icon{font-size:17px}
  .wh-val{font-size:6px}
  .wh-flag{font-size:12px}
  .wh-table thead th.wh-country-hd{width:52px}
}

/* ── Top Bar ── */
.top-bar{
  display:flex;align-items:center;justify-content:center;
  padding:16px 24px;position:relative;z-index:10;
  border-bottom:1px solid rgba(255,255,255,.14);flex-shrink:0;
}
.logo{
  position:absolute;left:28px;font-family:var(--font-display);
  font-size:14px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;line-height:1.3;
}
.logo span{color:#aaa;font-weight:400}
.logo .sub1{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#aaa;text-transform:uppercase;font-weight:400;margin-top:1px;
}
.logo .sub2{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#aaa;text-transform:uppercase;font-weight:400;
}
.exp-group{display:flex;align-items:center;gap:6px}
.exp-btn{
  font-family:var(--font-display);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 20px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  background:transparent;color:#999;cursor:pointer;transition:all .25s;
}
.exp-btn:hover{border-color:var(--cyan);color:#ccc}
.exp-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 16px rgba(0,212,255,.12);
}

/* ── Tagline ── */
.tagline{
  text-align:center;padding:6px 0;
  font-family:var(--font-body);font-size:11px;font-style:italic;
  color:#bbb;letter-spacing:.3px;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}

/* ── Welcome Banner ── */
.welcome-banner{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:7px 16px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(0,212,255,.07);
  font-family:var(--font-body);font-size:12px;color:#bbb;
  animation:ttIn .3s ease-out;
}
.welcome-banner a{
  color:var(--cyan);text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;background:none;border:none;font:inherit;padding:0;
}
.welcome-banner a:hover{color:#fff}
.welcome-banner .wb-close{
  position:absolute;right:16px;background:none;border:none;
  color:#555;font-size:16px;cursor:pointer;line-height:1;padding:2px 4px;
  transition:color .2s;
}
.welcome-banner .wb-close:hover{color:#aaa}
.welcome-banner.hidden{display:none}

/* ── Hero (legacy, kept for any external refs) ── */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* ── News Icons ── */
.news-icons{
  display:flex;gap:48px;margin-bottom:20px;z-index:5;position:relative;
}
.news-icon{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:transform .2s;
}
.news-icon:hover{transform:translateY(-3px)}
.news-icon .ni-emoji{font-size:32px;filter:grayscale(.15);transition:filter .2s,transform .2s}
.news-icon:hover .ni-emoji{filter:none;transform:scale(1.15)}
.news-icon .ni-label{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#999;transition:color .25s;white-space:nowrap;
}
.news-icon:hover .ni-label{color:#aaa}
.news-icon.hot:hover .ni-label{color:var(--hot)}
.news-icon.movers:hover .ni-label{color:var(--gold)}
.news-icon.connection:hover .ni-label{color:var(--cyan)}
.news-icon::after{
  content:'';width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.35);transition:background .2s;
}
.news-icon.hot:hover::after{background:var(--hot)}
.news-icon.movers:hover::after{background:var(--gold)}
.news-icon.connection:hover::after{background:var(--cyan)}

/* ── Globe ── */
.globe-wrap{
  position:relative;width:min(65vh,600px);aspect-ratio:1;cursor:grab;z-index:1;
  touch-action:none; /* Critical: tells iOS to let JS handle all touch input */
}
.globe-wrap:active{cursor:grabbing}
.globe-wrap canvas{width:100%!important;height:100%!important;display:block}
.globe-wrap::before{
  content:'';position:absolute;top:50%;left:50%;width:80%;height:80%;
  transform:translate(-50%,-50%);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(0,212,255,.18) 0%,rgba(0,212,255,.08) 30%,transparent 65%);
  box-shadow:0 0 100px 50px rgba(0,212,255,.08);
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.globe-hint{
  margin-top:14px;font-family:var(--font-display);font-size:9px;
  letter-spacing:2px;color:#aaa;text-transform:uppercase;z-index:5;
  animation:hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:.9}}
.hint-mobile{display:none}
@media(max-width:768px){.hint-desktop{display:none}.hint-mobile{display:inline}}

/* ── Pole (Commodities) Labels ── */
.pole-label{
  position:absolute;padding:3px 8px;border-radius:3px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#e8a838;background:rgba(0,0,0,.85);border:1px solid rgba(232,168,56,.35);
  cursor:pointer;transition:all .2s;pointer-events:auto;white-space:nowrap;
  text-transform:uppercase;z-index:5;
}
.pole-label:hover{border-color:#e8a838;color:#fff;box-shadow:0 0 12px rgba(232,168,56,.3)}


/* ── Country Labels ── */
.country-label{
  position:absolute;padding:3px 8px;border-radius:3px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#ccc;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.16);
  cursor:pointer;transition:all .2s;pointer-events:auto;white-space:nowrap;
  text-transform:uppercase;z-index:5;
}
.country-label:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.25)}
.country-label .flag{font-size:12px;margin-right:3px}

/* ── Tooltip ── */
.tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(9,20,38,.98);border:1px solid #00d4ff;border-radius:8px;
  padding:16px;z-index:1000;width:90%;max-width:400px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,0.3);
  animation:ttIn .2s ease-out;
}
.tooltip.active{display:block}
@keyframes ttIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tt-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#aaa;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.tt-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.tt-nav{
  position:absolute;top:12px;right:48px;display:flex;gap:3px;z-index:10;
}
.tt-nav-btn{
  width:28px;height:28px;
  background:rgba(255,255,255,.06);border:1px solid #333;border-radius:50%;
  color:#999;font-size:14px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.tt-nav-btn:hover{background:rgba(0,212,255,.1);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.tt-title{font-size:16px;font-weight:700;color:#00d4ff;margin-bottom:10px;padding-right:100px}
.tt-story{font-size:12px;color:#ccc;line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
.tt-source{font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#777;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.tt-section{margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid #333}
.tt-section:last-child{border-bottom:none;margin-bottom:0}
.tt-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tt-value{font-size:16px;font-weight:600;color:#fff}
.tt-header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt-header-row .m-strip{gap:3px}
.tt-explanation{font-size:11px;color:#aaa;line-height:1.4;margin-top:6px}
.tt-source{font-size:10px;color:#888;margin-top:6px}

/* ── Card Overlay ── */
.card-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.country-card{
  width:92%;max-width:420px;background:#0e1d35;border:2px solid #243650;border-radius:12px;
  padding:16px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:cardIn .25s ease-out;margin:auto;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.country-card:hover{border-color:#555}
.card-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#aaa;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.card-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card-head .c-flag{font-size:32px}
.card-head .c-name{font-size:24px;font-weight:600;color:#fff;flex:1;min-width:0}
.card-nav{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.card-nav-btn{
  width:28px;height:28px;
  background:rgba(255,255,255,.06);border:1px solid #333;border-radius:50%;
  color:#999;font-size:14px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.card-nav-btn:hover{background:rgba(0,212,255,.1);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.weather-sec{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.w-icon{font-size:48px;line-height:1;margin-bottom:8px}
.w-icon.sunny{filter:none}
.w-icon.cloudy{filter:brightness(.65) contrast(1.05) saturate(.3)}
.w-icon.stormy{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.c-stories{list-style:none;padding:0;margin:0}
.c-stories li{font-size:13px;color:#bbb;line-height:1.6;padding-left:16px;position:relative;margin-bottom:3px}
.c-stories li::before{content:"•";position:absolute;left:0;color:#00d4ff;font-weight:bold}
.sec-head{margin:14px 0 8px;padding:6px 12px;background:linear-gradient(90deg,rgba(0,212,255,.2),transparent);border-left:3px solid #00d4ff;font-size:12px;color:#00d4ff;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.metrics{display:flex;flex-direction:column;margin-bottom:4px}
.metrics.mkt{background:rgba(255,255,255,.015);border-radius:8px;padding:8px 0}
.metric{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.metric:last-child{border-bottom:none}
.metric:hover{background:rgba(255,255,255,.04)}
.m-name{font-size:12px;color:#bbb;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.m-val{font-size:20px;font-weight:700;color:#fff}
.m-val-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}

/* ── Per-metric weather strip ── */
.m-strip .wh-icon{font-size:18px;display:inline}
.m-strip{display:flex;gap:4px;align-items:center;flex-shrink:0}
.m-si{font-size:16px;line-height:1;cursor:default;position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;transition:background .15s}
.m-si:hover{background:rgba(255,255,255,.08)}
.m-si-fc{opacity:.6}
.m-si-fc::after{content:'F';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:6px;color:#888;letter-spacing:.5px;font-family:var(--font-display)}
/* Hover tooltip */
.m-si[data-tip]:hover::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(8,12,24,.97);color:#e0e0e0;font-size:10px;font-family:var(--font-display);letter-spacing:.5px;white-space:nowrap;padding:4px 8px;border-radius:4px;border:1px solid rgba(255,255,255,.12);pointer-events:none;z-index:200}
/* Mobile tap overlay */
.m-strip-tip{position:absolute;bottom:calc(100% + 8px);left:0;background:rgba(8,12,24,.97);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;display:flex;gap:10px;z-index:201;pointer-events:none}
.m-strip-tip-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-display)}
.m-strip-tip-yr{font-size:8px;color:#888;letter-spacing:.5px}
.m-strip-tip-val{font-size:10px;color:#e0e0e0;font-weight:600}


/* ── Commodities Card ── */
.comm-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden;margin-top:4px}
.comm-item{background:#0e1d35;padding:12px 14px;display:flex;flex-direction:column;gap:4px;transition:background .2s;cursor:pointer}
.comm-item:hover{background:rgba(255,255,255,.06)}
.comm-head{display:flex;align-items:center;justify-content:space-between}
.comm-name{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.8px;font-family:var(--font-display)}
.comm-cat{font-size:7px;color:#555;text-transform:uppercase;letter-spacing:1px;font-family:var(--font-display)}
.comm-price{font-size:20px;font-weight:700;color:#fff;line-height:1.1}
.comm-change{font-size:11px;font-weight:600;letter-spacing:.3px}
.comm-change.up{color:#00e68a}
.comm-change.down{color:#ff3d5a}
.comm-change.flat{color:#888}
.comm-section-label{grid-column:1/-1;padding:8px 14px 4px;background:#0e1d35;font-size:9px;color:#e8a838;text-transform:uppercase;letter-spacing:2px;font-family:var(--font-display);font-weight:700;border-top:1px solid rgba(232,168,56,.15)}
.comm-section-label:first-child{border-top:none}
.comm-unit{font-size:9px;color:#666;font-weight:400;margin-left:4px}
.comm-footer{margin-top:8px;font-size:9px;color:#555;text-align:center;font-family:var(--font-display);letter-spacing:.5px}
.comm-commentary{font-size:13px;color:#bbb;line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}

/* ── Glossary ── */
.glossary-term{color:#8ec8f0;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(142,200,240,.45);text-underline-offset:2px;cursor:help;transition:color .15s;border-radius:2px}
.glossary-term:hover{color:#b8dcf8;text-decoration-color:rgba(142,200,240,.8);background:rgba(142,200,240,.07)}
.glossary-bubble{
  position:fixed;z-index:2000;background:rgba(9,20,38,.98);
  border:1px solid rgba(0,212,255,.45);border-radius:10px;padding:14px 16px 12px;
  max-width:320px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 12px rgba(0,212,255,.12);
  pointer-events:auto;animation:gbIn .15s ease-out;
}
@keyframes gbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.glossary-bubble::before{content:'';position:absolute;top:-6px;left:24px;width:10px;height:10px;background:rgba(9,20,38,.98);border-left:1px solid rgba(0,212,255,.45);border-top:1px solid rgba(0,212,255,.45);transform:rotate(45deg)}
.glossary-bubble.arrow-bottom::before{top:auto;bottom:-6px;border-left:none;border-top:none;border-right:1px solid rgba(0,212,255,.45);border-bottom:1px solid rgba(0,212,255,.45)}
.gb-term{font-size:11px;font-weight:700;color:#00d4ff;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;display:flex;align-items:center;gap:6px;padding-right:28px}
.gb-badge{display:inline-block;font-size:8px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.gb-badge.basic{background:rgba(76,175,80,.2);color:#81c784;border:1px solid rgba(76,175,80,.3)}
.gb-badge.intermediate{background:rgba(255,183,77,.2);color:#ffcc80;border:1px solid rgba(255,183,77,.3)}
.gb-badge.advanced{background:rgba(239,83,80,.2);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}
.gb-def{font-size:12px;color:#ccc;line-height:1.55}
.gb-close{
  position:absolute;top:8px;right:8px;width:22px;height:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:50%;
  color:#999;font-size:13px;line-height:20px;text-align:center;cursor:pointer;transition:all .2s;
}
.gb-close:hover{background:rgba(255,255,255,.12);color:#ccc;border-color:#444}
.gb-level{display:flex;gap:3px;margin-bottom:8px}
.gb-level .lt-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 8px;border:1px solid rgba(255,255,255,.08);border-radius:3px;
  background:transparent;color:#999;cursor:pointer;transition:all .2s;
}
.gb-level .lt-btn:hover{border-color:rgba(0,212,255,.25);color:#ccc}
.gb-level .lt-btn.active{background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan)}

/* ── BLUF Read More Expansion ── */
.glossary-bubble.has-full{max-width:420px}
.glossary-bubble.has-full.expanded{max-height:70vh;overflow-y:auto}
.glossary-bubble.has-full.expanded::-webkit-scrollbar{width:3px}
.glossary-bubble.has-full.expanded::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.ge-expand{
  display:inline-block;font-family:var(--font-display);font-size:9px;
  letter-spacing:1px;text-transform:uppercase;color:var(--cyan);
  cursor:pointer;margin-top:8px;padding:0;border:none;background:none;
  transition:opacity .2s;opacity:.8;
}
.ge-expand:hover{opacity:1}
.ge-full{
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
  animation:geIn .2s ease-out;
}
.ge-full.open{display:block}
@keyframes geIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ge-section{margin-bottom:10px}
.ge-section:last-child{margin-bottom:0}
.ge-head{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--cyan);margin-bottom:4px;opacity:.8;
}
.ge-body{font-size:12px;color:#aaa;line-height:1.55}
.ge-body ul{margin:4px 0 0;padding:0;list-style:none}
.ge-body li{position:relative;padding-left:12px;margin-bottom:3px}
.ge-body li::before{content:'·';position:absolute;left:2px;color:var(--cyan);font-weight:bold}
.ge-formal{
  font-size:11px;color:#aaa;font-style:italic;line-height:1.5;
  padding:8px 10px;background:rgba(255,255,255,.02);border-radius:4px;
  border-left:2px solid rgba(0,212,255,.2);
}
/* Metric tooltip BLUF expand */
.tt-story .ge-expand{margin-top:12px;display:block}
.tt-story .ge-full{margin-top:8px;padding-top:8px}

/* ── Metric Chart ── */
.metric-chart-wrap{
  margin:10px 0;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.metric-chart-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.metric-chart-title{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#aaa;
}
.metric-chart-range{display:flex;gap:2px}
.metric-chart-range .mcr-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border:1px solid rgba(255,255,255,.06);border-radius:2px;
  background:transparent;color:#999;cursor:pointer;transition:all .2s;
}
.metric-chart-range .mcr-btn:hover{border-color:rgba(0,212,255,.3);color:#ccc}
.metric-chart-range .mcr-btn.active{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.metric-chart-canvas{height:120px;position:relative}
.metric-chart-canvas canvas{width:100%!important;height:100%!important}
.metric-chart-minmax{
  display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#888;
}
.metric-chart-nodata{
  height:80px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#888;text-transform:uppercase;
}

/* ── Inline Level Toggle ── */
.level-toggle{
  display:flex;gap:4px;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.level-toggle .lt-btn{
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#999;cursor:pointer;transition:all .2s;
}
.level-toggle .lt-btn:hover{border-color:rgba(0,212,255,.3);color:#ccc}
.level-toggle .lt-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
}



/* ── Policy Explainer ── */

/* ── Compare View ── */
.compare-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:10px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#999;cursor:pointer;transition:all .2s;
}
.compare-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.compare-btn .cb-icon{font-size:12px}
.compare-row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;
}
.compare-row:last-child{border-bottom:none}
.compare-row.highlight{background:rgba(0,212,255,.06);border-radius:4px;padding:7px 8px;margin:0 -8px}
.compare-row .cr-flag{font-size:16px;width:24px;text-align:center}
.compare-row .cr-name{font-size:11px;color:#bbb;width:50px;font-family:var(--font-display);letter-spacing:.5px}
.compare-row .cr-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden;position:relative}
.compare-row .cr-bar{height:100%;border-radius:2px;transition:width .4s ease-out;min-width:2px}
.compare-row .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.3),rgba(0,212,255,.5))}
.compare-row .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.3),rgba(255,61,90,.5))}
.compare-row.highlight .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.5),rgba(0,212,255,.8))}
.compare-row.highlight .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.5),rgba(255,61,90,.8))}
.compare-row .cr-val{font-size:11px;font-weight:600;color:#ccc;width:80px;text-align:right;font-family:var(--font-display);line-height:1.3}
.compare-row.highlight .cr-name{color:var(--cyan)}
.compare-row.highlight .cr-val{color:#fff}

/* Regime tag in compare rows */
.cr-regime{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  color:#aaa;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:3px;padding:2px 6px;cursor:pointer;transition:all .2s;white-space:nowrap;
  flex-shrink:0;
}

/* ── Weather GDP Grid ── */
.weather-btn{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#999;cursor:pointer;transition:all .2s;
}
.weather-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.weather-btn .wb-icon{display:inline-flex;align-items:center;gap:2px}
.wg-table{width:100%;border-collapse:collapse;margin-top:10px}
.wg-table th{
  font-family:var(--font-display);font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:#aaa;padding:6px 4px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.wg-table th:first-child{text-align:left;color:#bbb}
.wg-table th.forecast{color:var(--cyan);font-style:italic}
.wg-table td{padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.wg-table td:first-child{text-align:left}
.wg-table tr:last-child td{border-bottom:none}
.wg-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.wg-cell .wg-val{font-family:var(--font-display);font-size:8px;letter-spacing:.3px}
.wg-cell.sunny .wg-val{color:#e8c840}
.wg-cell.cloudy .wg-val{color:#999}
.wg-cell.storm .wg-val{color:#1a1a1a}
/* Weather icons - emoji based, matching card icons */
.wi{display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;width:24px;height:24px}
.wi-sun{filter:none}
.wi-cloud{filter:brightness(.65) contrast(1.05) saturate(.3)}
.wi-storm{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.wg-country{display:flex;align-items:center;gap:6px}
.wg-country .wg-flag{font-size:14px}
.wg-country .wg-code{font-family:var(--font-display);font-size:9px;letter-spacing:.5px;color:#aaa}
.wg-legend{
  display:flex;gap:12px;margin-top:10px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap;justify-content:center;
}
.wg-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#999}
.cr-regime:hover{border-color:rgba(0,212,255,.4);color:var(--cyan);background:rgba(0,212,255,.06)}
.cr-regime.free{border-color:rgba(0,230,138,.15);color:#5a9}
.cr-regime.managed{border-color:rgba(255,183,77,.15);color:#c96}
.cr-regime.peg{border-color:rgba(255,61,90,.15);color:#c66}
.cr-regime.euro{border-color:rgba(100,140,255,.15);color:#7a9cf0}

/* ── Footer ── */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:12px 24px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 30%);
}
.footer-link{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:#aaa;cursor:pointer;
  transition:color .2s;text-decoration:none;
}
.footer-link:hover{color:var(--cyan)}
.footer-sep{color:#777;font-size:10px;user-select:none}

/* Footer tooltip overlay */
.footer-tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(9,20,38,.98);border:1px solid #00d4ff;border-radius:8px;
  padding:20px;z-index:1000;width:90%;max-width:500px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,.3);
  animation:ttIn .2s ease-out;
}
.footer-tooltip.active{display:block}
.footer-tooltip h2{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin-bottom:14px;
}
.footer-tooltip h2::after{
  content:'';display:block;width:30px;height:1px;margin-top:8px;
  background:linear-gradient(90deg,#00d4ff,transparent);
}
.footer-tooltip p{font-size:13px;color:#bbb;line-height:1.7;margin-bottom:12px}
.footer-tooltip p strong{color:#e8e8e8;font-weight:600}
.footer-tooltip .ft-highlight{color:#00d4ff}
.footer-tooltip .ft-sub{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin:20px 0 8px;font-weight:700;
}
.footer-tooltip .ft-legal{font-size:11px;color:#999;line-height:1.6;font-style:italic}
/* Contact form */
.contact-form{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.contact-form input,.contact-form textarea{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:10px 12px;color:#ddd;font-family:var(--font-body);
  font-size:13px;outline:none;transition:border-color .2s;
}
.contact-form input:focus,.contact-form textarea:focus{border-color:rgba(0,212,255,.4)}
.contact-form textarea{min-height:100px;resize:vertical}
.contact-form button{
  align-self:flex-start;font-family:var(--font-display);font-size:10px;
  letter-spacing:1.5px;text-transform:uppercase;padding:10px 24px;
  background:rgba(0,212,255,.12);border:1px solid var(--cyan);border-radius:4px;
  color:var(--cyan);cursor:pointer;transition:all .25s;
}
.contact-form button:hover{background:rgba(0,212,255,.2);box-shadow:0 0 16px rgba(0,212,255,.15)}
/* ── Full Glossary Panel ── */

/* ══════════════════════════════════════════════════════════
   MOBILE RESPONSIVE  (iPhone-first, ≤768px)
   ══════════════════════════════════════════════════════════ */

  /* Safe area for notched phones */

  /* ── Top Bar ── */

    flex-direction:column;align-items:center;justify-content:flex-start;
    gap:8px;padding:10px 14px;
  }
  .logo{
    position:static;text-align:center;font-size:12px;letter-spacing:2px;
    line-height:1.2;
  }
  .logo .sub1{display:inline;font-size:8px;letter-spacing:1px;margin-top:0}
  .logo .sub1::after{content:' · '}
  .logo .sub2{display:inline;font-size:8px;letter-spacing:1px}
  .exp-group{gap:4px;flex-wrap:wrap;justify-content:center}
  .exp-btn{font-size:10px;padding:6px 14px;letter-spacing:1px;min-height:36px}

  /* ── Hero ── */
  #globe-view{justify-content:flex-start;padding-top:6px}

  /* ── News Icons ── */
  .news-icons{gap:20px;margin-bottom:10px}
  .news-icon .ni-emoji{font-size:26px}
  .news-icon .ni-label{font-size:7px;letter-spacing:1px}

  /* ── Globe ── */
  .globe-wrap{width:min(52vh,88vw)}
  .globe-wrap::before{width:90%;height:90%}
  .globe-hint{font-size:8px;letter-spacing:1.5px;margin-top:8px}

  /* ── Country Labels ── */
  .country-label{
    font-size:8px;padding:4px 8px;letter-spacing:.8px;
    min-height:28px;display:flex;align-items:center;
  }
  .country-label .flag{font-size:11px}

  /* ── Card Overlay ── */
  .card-overlay{padding:12px 0;align-items:flex-start}
  .country-card{
    width:96%;max-width:none;padding:14px 12px;border-radius:10px;
    margin:0 auto;
  }
  .card-head .c-flag{font-size:26px}
  .card-head .c-name{font-size:20px}
  .card-head{gap:10px;margin-bottom:8px}
  .w-icon{font-size:38px}
  .c-stories li{font-size:12px;line-height:1.5;padding-left:14px}
  .sec-head{font-size:11px;letter-spacing:1.5px;padding:5px 10px;margin:12px 0 6px}
  .metric{padding:9px 10px}
  .m-name{font-size:11px}
  .m-val{font-size:18px}
  .card-close{width:32px;height:32px;font-size:18px;line-height:30px}
  .card-nav-btn{width:32px;height:32px;font-size:15px}

  /* ── Metric Tooltip ── */
  .tooltip{
    width:96%;max-width:none;padding:14px 12px;max-height:85vh;
  }
  .tt-title{font-size:15px;padding-right:90px}
  .tt-close{width:32px;height:32px;font-size:18px;line-height:30px}

  "inflation": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Inflation is a sustained increase in the overall price level of goods and services, which reduces the purchasing power of money over time. When inflation rises, each unit of currency buys fewer things.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation affects how far wages go, how savings lose or keep value, how interest rates are set, and how governments and central banks make policy. Too much inflation erodes trust in money; too little can signal economic stagnation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Think of money as a measuring stick for value. Inflation means the stick is slowly shrinking. Prices aren't just going up randomly - the value of money itself is going down relative to goods and services across the economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a basket of everyday items costs $100 this year and $103 next year, the inflation rate is 3%. If your income didn't rise by at least 3%, you're effectively poorer, even though your paycheck is the same in dollar terms.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What inflation is not</div><div class=\"ge-body\"><ul><li>A one-time price increase for a single good</li><li>The same thing as \"high prices\" (inflation is about change, not level)</li><li>Always caused by greed or shortages alone</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Common causes</div><div class=\"ge-body\"><ul><li><strong>Demand-pull:</strong> too much spending chasing too few goods</li><li><strong>Cost-push:</strong> rising production costs passed to consumers</li><li><strong>Monetary factors:</strong> growth in the money supply faster than real output</li></ul></div></div><div class=\"ge-formal\">Inflation is the rate of change of a general price index (such as the Consumer Price Index) over time.</div>"
      },
      "moderate": {
        "bluf": "Inflation is the sustained rate of increase in the general price level, measured by indices like CPI or PCE. Central banks target ~2% as the sweet spot - high enough to avoid the zero lower bound, low enough to preserve purchasing power.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation determines real interest rates, erodes nominal debt burdens, affects wage negotiations, and is the primary variable central banks target. It transmits directly to bond yields, FX, and equity valuations.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is the economy's temperature gauge. Moderate inflation signals healthy demand. Too high means overheating. Deflation (negative inflation) is often worse than moderate inflation because it increases the real burden of debt and delays consumption.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US CPI at 3.1% means the consumer price basket rose 3.1% year-over-year. Core CPI strips out volatile food and energy to reveal the underlying trend. The Fed watches core PCE (not CPI) as its preferred gauge.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>Price level</strong> - inflation is the rate of <em>change</em>, not how expensive things are</li><li><strong>CPI</strong> - CPI is one index that measures inflation, not inflation itself</li><li><strong>Deflation</strong> - not just \"low inflation\" but sustained negative price changes</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Key types</div><div class=\"ge-body\"><ul><li><strong>Headline:</strong> all items including food and energy</li><li><strong>Core:</strong> excludes food and energy - the Fed's focus</li><li><strong>Supercore:</strong> core services excluding housing - the \"last mile\" measure</li></ul></div></div><div class=\"ge-formal\">The percentage change in a broad consumer price index over a defined period, typically expressed year-over-year.</div>"
      },
      "expert": {
        "bluf": "Inflation is the rate of change of the general price level. Operationally, the distinction between headline, core, trimmed mean, and supercore measures is critical - each captures different persistence dynamics and has different policy signal content.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation expectations anchoring is the central bank's most valuable asset. De-anchoring triggers nonlinear policy responses. The real interest rate (nominal minus expected inflation) drives all asset pricing, investment decisions, and currency valuation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is ultimately a monetary phenomenon in the long run (Friedman), but in the short run, supply shocks, expectations, and labour market tightness all matter. The Phillips Curve slope is nonlinear - flat at moderate unemployment, steep below ~4%.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Post-COVID US: headline CPI peaked at 9.1% (June 2022). Goods disinflation was rapid (supply chains), but services inflation - particularly shelter and core services ex-housing (supercore) - proved sticky. The \"last mile\" from 3% to 2% required 500bp of tightening and 18+ months of lag.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>CPI vs PCE:</strong> PCE uses Fisher weighting (substitution-adjusted), broader scope, typically 30-40bps below CPI</li><li><strong>Breakevens vs expectations:</strong> TIPS breakevens include an inflation risk premium, not pure expectations</li><li><strong>Transitory vs persistent:</strong> trimmed mean and median CPI better identify persistence than core</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Measurement nuances</div><div class=\"ge-body\"><ul><li><strong>Boskin bias:</strong> CPI overstates inflation by ~0.5-1pp (substitution, quality, new goods effects)</li><li><strong>Shelter lag:</strong> OER/rent of shelter lags market rents by 12-18 months - distorts turning points</li><li><strong>Trimmed mean:</strong> Dallas Fed 16% trimmed mean is the best real-time persistence signal</li></ul></div></div><div class=\"ge-formal\">The rate of change of a general price index. Operationally: π = ΔP/P, where measurement methodology (Laspeyres vs Fisher, scope, quality adjustment) materially affects the signal.</div>"
      }
    },

    "metricLinks": []

  "GDP Growth": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "GDP Growth measures how fast a country's economy is expanding or shrinking. It is the single most important number for understanding whether an economy is healthy, struggling, or in recession.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">GDP Growth tells you whether there are more jobs being created, more goods being produced, and more income being earned than before. Governments, businesses, and investors all watch this number closely because it affects everything from tax revenue to corporate profits to your chances of getting a raise.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the economy as a pie. GDP Growth tells you whether the pie is getting bigger or smaller. A growing pie means more to go around for everyone. A shrinking pie - recession - means painful choices about who gets less.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a country's GDP grew 2.5% this year, it means the total value of everything the economy produced went up by 2.5% compared to last year. If you earned $50,000 last year and the economy grew 2.5%, there is more national income to support wage growth, new hiring, and business expansion.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Growth above 3% in developed economies is strong - it typically means falling unemployment and rising wages</li><li>Growth near 0% signals stagnation - the economy is barely treading water</li><li>Negative growth for two consecutive quarters is the informal definition of a recession</li><li>China and India grow faster (4-7%) because they are catching up from lower starting points</li></ul></div></div><div class=\"ge-formal\">The annualised percentage change in real (inflation-adjusted) Gross Domestic Product over a given period.</div>"
      },
      "moderate": {
        "bluf": "GDP Growth is the annualised change in real output. It drives corporate earnings trajectories, fiscal arithmetic, employment, and is the macro variable most correlated with risk asset performance across cycles.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">GDP growth is the numerator in almost every macro ratio that matters - debt-to-GDP, deficit-to-GDP, earnings growth. Above-trend growth compresses credit spreads, supports equity multiples, and gives central banks room to normalise rates. Below-trend growth does the opposite. The growth rate also determines whether fiscal deficits are sustainable (the r-g dynamic).</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Growth is the economy's velocity. It determines whether the debt burden is rising or falling in real terms, whether tax receipts are expanding, and whether corporate top-line revenue growth is achievable. A 1% GDP miss typically translates to a 2-3% miss in earnings growth via operating leverage.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US GDP grew 2.5% in 2024 despite 525bp of cumulative rate hikes - a textbook soft landing. This above-trend growth supported S&P 500 earnings growth of ~8% and kept the unemployment rate below 4%. Contrast with Germany at 0.2% - near stagnation - where the DAX lagged and fiscal pressures mounted.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Output gap:</strong> actual vs potential GDP - positive gap means overheating, negative means slack</li><li><strong>Composition:</strong> consumption-led growth is stickier than inventory-led growth</li><li><strong>Revisions:</strong> GDP data gets revised heavily - the first print is a rough estimate</li><li><strong>Leading indicators:</strong> PMIs, yield curve slope, and credit growth all lead GDP by 6-12 months</li></ul></div></div><div class=\"ge-formal\">The annualised percentage change in real GDP, typically reported quarterly with advance, second, and third estimates subject to significant revision.</div>"
      },
      "expert": {
        "bluf": "Real GDP growth is the broadest measure of aggregate output change. The r-g differential (real rate vs real growth) is the key structural variable for debt sustainability, while the output gap drives inflation dynamics via the Phillips Curve.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Growth is the denominator that makes everything else work. When g > r, debt-to-GDP ratios stabilise even with primary deficits. When r > g, fiscal consolidation becomes mathematically necessary. For markets, the growth-rate transition (acceleration vs deceleration) matters more than the level - equities price the second derivative.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Potential growth is the economy's speed limit - determined by demographics (labour force growth), capital deepening, and TFP. Actual growth oscillates around potential. The gap between them is what central banks really target, since it maps to inflation pressure via the Phillips Curve. Secular stagnation thesis: potential growth has structurally declined across DM (from ~3% to ~1.5-2%) due to demographics and slowing productivity.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's nominal GDP was roughly flat for two decades (1995-2015) despite massive fiscal stimulus, because deflation offset real growth. The lesson: nominal GDP growth (real + inflation) is what actually matters for debt dynamics, tax revenue, and corporate top-line. Abenomics targeted nominal GDP explicitly for this reason.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>GDI vs GDP:</strong> gross domestic income should equal GDP but divergences signal measurement noise - trust the average</li><li><strong>Residual seasonality:</strong> Q1 GDP in the US is systematically biased downward</li><li><strong>Nowcasting:</strong> Atlanta Fed GDPNow and NY Fed nowcast are real-time tracking estimates worth following</li><li><strong>Nominal vs real:</strong> for debt sustainability and corporate revenue, nominal GDP growth is the relevant metric</li></ul></div></div><div class=\"ge-formal\">The annualised rate of change in chain-weighted real GDP. Measurement: expenditure approach (C + I + G + NX) or income approach (GDI). The statistical discrepancy between the two averages ~0.5pp in any given quarter.</div>"
      }
    },

  "Unemployment": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The unemployment rate measures what percentage of people who want to work cannot find a job. It is one of the clearest signals of whether an economy is providing enough opportunity for its citizens.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Unemployment directly affects living standards, consumer spending, government finances, and social stability. High unemployment means wasted potential - people who could be contributing to the economy are sitting idle. It also means lower tax revenue and higher welfare spending for governments.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the economy as a team. The unemployment rate tells you how many players are on the bench who want to be in the game. Some bench-sitting is normal (people between jobs), but too much means the team is underperforming.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">An unemployment rate of 4% means that out of every 100 people looking for work, 4 cannot find a job. In the US, anything below 4% is considered very tight - employers struggle to find workers, and wages tend to rise faster.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Below 4% in the US or UK signals a tight labour market - good for workers, potentially inflationary</li><li>Above 7-8% signals real distress - demand is too weak to employ everyone</li><li>Youth unemployment is often 2-3x the headline rate and can signal deeper structural problems</li><li>The rate can fall for bad reasons - people stop looking for work and drop out of the count</li></ul></div></div><div class=\"ge-formal\">The percentage of the labour force (those employed plus those actively seeking work) that is unemployed.</div>"
      },
      "moderate": {
        "bluf": "Unemployment is a lagging indicator that reflects labour market slack. Central banks watch it alongside wages and participation to gauge how much capacity remains before inflation accelerates - the Phillips Curve trade-off.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The unemployment rate is half of the Fed's dual mandate (alongside price stability). It drives consumer spending (70% of US GDP), wage growth dynamics, and determines how much room central banks have to keep rates elevated. A rising unemployment rate is the most reliable recession signal and the trigger for rate cuts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Unemployment is a lagging indicator - it rises after a recession has already begun and falls after recovery is underway. But the rate of change matters more than the level. The Sahm Rule: if the 3-month moving average of unemployment rises 0.5pp above its 12-month low, the economy is already in recession 100% of the time historically.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US unemployment hit 3.4% in early 2023 - a 53-year low. This ultra-tight market fuelled 5%+ wage growth, which fed into services inflation. The Fed needed unemployment to rise toward 4-4.5% to ease wage pressure. The question was whether this could happen without a recession (soft landing) or not (hard landing).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>U-3 vs U-6:</strong> U-3 is the headline rate; U-6 includes discouraged workers and part-time for economic reasons - a broader measure of slack</li><li><strong>Participation rate:</strong> a falling unemployment rate with falling participation is not a healthy signal</li><li><strong>JOLTS:</strong> job openings and quits rate show labour demand and worker confidence</li><li><strong>Sahm Rule:</strong> 0.5pp rise from the trough in 3-month average triggers recession signal</li></ul></div></div><div class=\"ge-formal\">The U-3 unemployment rate: the number of unemployed persons actively seeking work, divided by the civilian labour force, expressed as a percentage.</div>"
      },
      "expert": {
        "bluf": "The unemployment rate is a lagging, survey-based measure of labour slack. NAIRU estimation, the Beveridge Curve, and the distinction between U-3 and broader measures (U-6, prime-age EPOP) are essential for assessing true tightness.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The gap between actual unemployment and NAIRU (the non-accelerating inflation rate of unemployment) is the labour market's contribution to inflation dynamics. Post-COVID, NAIRU estimates have been unreliable - the Beveridge Curve shifted outward (more vacancies per unit of unemployment), suggesting matching efficiency declined, then partially recovered.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The unemployment rate is a noisy signal of slack. The household survey (which generates unemployment) and the establishment survey (which generates payrolls) frequently diverge. Prime-age employment-to-population ratio (25-54 EPOP) is a cleaner measure of labour utilisation because it is unaffected by participation definition issues and demographic shifts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Post-COVID labour market: US unemployment fell from 14.7% (April 2020) to 3.4% (January 2023) - the fastest decline on record. But participation remained 1pp below pre-COVID levels, and the Beveridge Curve showed structurally higher vacancies per unemployed worker. This meant the headline rate understated actual tightness relative to historical norms.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Sahm Rule:</strong> 0.5pp rise in 3-month average from 12-month trough - perfect recession predictor historically</li><li><strong>JOLTS quits rate:</strong> the best real-time indicator of worker bargaining power and wage pressure</li><li><strong>Beveridge Curve:</strong> the vacancy-unemployment relationship reveals matching efficiency changes</li><li><strong>Birth-death model:</strong> BLS business birth-death adjustment adds phantom jobs in downturns - trust benchmark revisions</li></ul></div></div><div class=\"ge-formal\">The ratio of unemployed persons (defined as jobless, available for work, and actively seeking employment in the prior 4 weeks) to the civilian labour force. Subject to household survey sampling noise of approximately +/-100k per month.</div>"
      }
    },

  "Budget Deficit": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The budget deficit measures how much more a government spends than it earns in a given year. A deficit means the government is borrowing to cover the gap, adding to national debt.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Deficits determine how much a government needs to borrow. Persistent large deficits mean growing national debt, which eventually means higher interest payments, higher taxes, or reduced public services. Markets watch deficits closely because they affect bond supply, interest rates, and confidence in a country's finances.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it like a household budget. If you earn $4,000 a month but spend $5,000, you have a $1,000 deficit. You cover it with a credit card (borrowing). One month is fine - but if you do it every month for years, the interest payments start eating into your spending. Governments work the same way, just with more zeros.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">A budget deficit of -6% of GDP means the government spent 6% more than the entire economy's annual output in extra borrowing. The US deficit has averaged around -5% to -7% of GDP in recent years - historically high for a peacetime economy not in recession.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Deficits below -3% of GDP are generally considered manageable for developed economies</li><li>Deficits above -6% outside of recessions signal structural overspending</li><li>Deficits matter more when interest rates are high - borrowing costs compound</li><li>A surplus (positive number) is rare and means the government is paying down debt</li></ul></div></div><div class=\"ge-formal\">Government revenue minus government expenditure, expressed as a percentage of GDP. A negative number indicates a deficit (spending exceeds revenue).</div>"
      },
      "moderate": {
        "bluf": "The fiscal deficit as a percentage of GDP measures structural and cyclical government borrowing needs. It drives bond supply, affects term premia, and determines the trajectory of debt-to-GDP - the key solvency metric.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The deficit is the flow that drives the debt stock. Large deficits increase bond issuance, which can push up term premia and crowd out private investment. The sustainability question hinges on whether nominal GDP growth exceeds the effective interest rate on debt (the r-g framework). When deficits are large and r > g, debt-to-GDP spirals upward.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Deficits are not inherently bad - during recessions, automatic stabilisers (falling tax revenue, rising welfare spending) widen the deficit to cushion the economy. The concern is structural deficits - persistent borrowing even when the economy is at full employment. That signals a political inability to match spending with revenue.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US ran a ~6.5% deficit in 2024 despite sub-4% unemployment - unprecedented in peacetime at full employment. This deficit was driven by interest payments (~3.5% of GDP), defence, and entitlements. Bond market concerns about supply pushed the 10Y yield above 4.5%, effectively tightening financial conditions from the fiscal side.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Primary deficit:</strong> deficit excluding interest payments - shows the discretionary fiscal stance</li><li><strong>Cyclically adjusted:</strong> structural deficit removes automatic stabilisers - the true policy choice</li><li><strong>Interest expense ratio:</strong> interest payments as % of revenue - above 15% starts constraining fiscal flexibility</li><li><strong>Bond auction demand:</strong> weak bid-to-cover ratios signal market fatigue with supply</li></ul></div></div><div class=\"ge-formal\">General government net lending/borrowing as a percentage of GDP. Negative values indicate a deficit. The structural (cyclically adjusted) deficit strips out automatic stabiliser effects.</div>"
      },
      "expert": {
        "bluf": "The fiscal deficit is the flow variable driving debt dynamics. The key identity: change in debt-to-GDP = (r-g) x existing debt ratio + primary deficit. At current DM debt levels, the r-g sign determines whether consolidation is arithmetically necessary.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Fiscal dominance risk has re-emerged. When debt-to-GDP exceeds ~100%, the deficit-interest payment feedback loop becomes self-reinforcing if r > g. The US is running 6%+ deficits at full employment with net interest approaching 4% of GDP. This is the bond market's central concern and the driver of term premium repricing since 2023.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The debt dynamics equation is unforgiving: d(debt/GDP)/dt = (r-g)(debt/GDP) - primary surplus. When debt/GDP is 120% (US) and r-g is +1%, you need a 1.2% primary surplus just to stabilise - before any new spending. The US currently runs a ~3% primary deficit. The math requires either much faster growth, much lower rates, or fiscal consolidation that no political coalition will deliver.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Italy (debt/GDP ~140%) survived the 2010s because ECB policy kept r far below g. With ECB tightening, Italian BTP spreads widened to 250bp as markets priced the return of debt sustainability risk. The Transmission Protection Instrument (TPI) was explicitly created to prevent deficit concerns from fragmenting the euro area - fiscal backstopped by monetary.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>r-g differential:</strong> the single most important variable for debt sustainability - tracks via 10Y yield minus nominal GDP growth</li><li><strong>Fiscal impulse:</strong> change in cyclically adjusted primary balance - positive = fiscal drag, negative = fiscal stimulus</li><li><strong>Duration of issuance:</strong> Treasury shifting to more bills (short-term) vs bonds signals concern about long-end demand</li><li><strong>CBO baseline vs reality:</strong> US deficit projections assume expiring tax cuts and spending restraint that never materialise</li></ul></div></div><div class=\"ge-formal\">General government net lending/borrowing as % of GDP. Debt dynamics identity: Δ(D/Y) = (r - g)(D/Y) - pb, where r = effective interest rate, g = nominal GDP growth, D/Y = debt ratio, pb = primary balance.</div>"
      }
    },

  "Current Account": {
    "complexity": 1,
    "category": "trade",
    "levels": {
      "beginner": {
        "bluf": "The current account measures whether a country earns more from the rest of the world than it spends. It tracks trade in goods and services, plus income flows like investment returns and remittances.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">A current account deficit means a country is spending more abroad than it earns - it needs foreign money to fill the gap. This makes it dependent on foreign investors being willing to lend. A surplus means the country is a net saver, lending money to the rest of the world.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Imagine your household's relationship with the outside world. You earn money (exports, investment income) and you spend money (imports, money sent abroad). If you spend more than you earn, you borrow the difference from abroad. The current account is this balance for an entire country.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">A current account of -3% of GDP means the country spent 3% more on foreign goods, services, and transfers than it earned. The US runs a persistent deficit (it imports more than it exports). Germany and Japan run surpluses (they export more than they import). China's surplus means it accumulates foreign reserves.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Deficits beyond -4% of GDP make a currency vulnerable - they need constant foreign financing</li><li>Surpluses above +5% invite trade tensions and accusations of currency manipulation</li><li>Oil price swings dramatically affect current accounts of energy importers and exporters</li><li>The current account must always mirror the financial account - deficits are funded by capital inflows</li></ul></div></div><div class=\"ge-formal\">The sum of a country's trade balance (goods and services), net primary income (investment returns), and net secondary income (transfers and remittances), expressed as a percentage of GDP.</div>"
      },
      "moderate": {
        "bluf": "The current account balance reflects a country's net external position - the sum of trade, income, and transfer flows. Persistent deficits require capital account financing and create FX vulnerability; surpluses accumulate net foreign assets.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The current account is the external constraint. A deficit country needs foreign capital inflows to finance the gap - if those flows reverse, the currency collapses (classic balance of payments crisis). For markets, widening deficits put pressure on the exchange rate and increase sovereign risk. The twin deficits hypothesis links fiscal and current account deficits through national savings.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The current account identity: CA = S - I (savings minus investment). A deficit means the country invests more than it saves - not necessarily bad if the investment is productive. The US deficit reflects both high investment and low savings. Germany's surplus reflects high savings and weak domestic investment - a different problem.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The UK ran a current account deficit of ~4% of GDP in 2022. When the Truss mini-budget spooked markets, foreign investors briefly questioned whether they wanted to keep financing that deficit. Sterling fell 10% in days. This is the current account vulnerability channel in action - deficits are fine until the capital flows that finance them aren't.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Financing composition:</strong> FDI-financed deficits are stable; portfolio-flow-financed deficits are fragile</li><li><strong>NIIP:</strong> net international investment position - cumulative current account balance over time</li><li><strong>Terms of trade:</strong> commodity price shifts can swing the current account 2-3% of GDP for resource economies</li><li><strong>Real exchange rate:</strong> persistent overvaluation worsens the current account - the correction is usually sharp</li></ul></div></div><div class=\"ge-formal\">The current account balance as a percentage of GDP. Composed of: trade balance + net primary income (investment returns) + net secondary income (transfers). By accounting identity: current account + capital account + financial account = 0.</div>"
      },
      "expert": {
        "bluf": "The current account is the mirror image of the financial account. The savings-investment balance (S-I = CA) determines external financing needs. For EM, the current account is the binding constraint; for DM with reserve currencies, the constraint is softer but not absent, as GBP in 2022 demonstrated.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The current account determines the rate of change of the net international investment position (NIIP). The US NIIP is -$20tn (~-70% of GDP) - the world's largest debtor position - yet it earns positive net investment income because US foreign assets earn higher returns than US liabilities pay (the exorbitant privilege). This privilege persists only as long as dollar reserve status holds.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The intertemporal current account approach: today's deficit is a claim on future surpluses. If the deficit finances productive investment, it is self-correcting. If it finances consumption (the US pattern), it requires either future fiscal adjustment or perpetual willingness of foreigners to hold your debt. The Feldstein-Horioka puzzle showed savings and investment are more correlated within countries than theory predicts - capital is less mobile than assumed.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's persistent current account surplus (~3-4% of GDP) finances its own government debt domestically - a key reason JGB yields stayed low despite 250% debt-to-GDP. Contrast with Turkey: persistent CA deficits (~-5%) financed by hot money meant that any loss of confidence triggered a currency crisis (lira lost 80%+ from 2018-2023).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Basic balance:</strong> current account + net FDI - the stable financing component. If negative, the country relies on flighty portfolio flows</li><li><strong>Valuation effects:</strong> NIIP changes from asset price movements can dwarf the current account flow</li><li><strong>Reserve adequacy:</strong> Guidotti rule - reserves should cover 12 months of short-term external debt. Below this, crisis risk rises sharply</li><li><strong>Global imbalances:</strong> large surplus countries (China, Germany) are exporting demand deficiency - trade tensions are the political manifestation</li></ul></div></div><div class=\"ge-formal\">The current account balance as % of GDP. Identity: CA = S - I = -(KA + FA). The intertemporal budget constraint requires the present value of future current accounts to sum to the initial NIIP - deficits today must be offset by surpluses eventually.</div>"
      }
    },
