  "Policy Rate": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The policy rate is the interest rate set by a country's central bank. It is the most powerful tool for controlling inflation and influencing economic growth, because it affects the cost of borrowing for everyone.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When the central bank raises the policy rate, borrowing becomes more expensive - mortgages, car loans, business loans all cost more. This slows spending and cools inflation. When it cuts, borrowing gets cheaper, which encourages spending and investment. Every other interest rate in the economy is influenced by this single number.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the policy rate as the economy's thermostat. If the economy is overheating (too much inflation), the central bank turns the temperature down by raising rates. If the economy is too cold (recession, rising unemployment), it turns the temperature up by cutting rates. The effects take 12-18 months to fully work through.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US Federal Reserve raised its policy rate (the fed funds rate) from near 0% to 5.25-5.50% between 2022 and 2023 - the fastest hiking cycle in 40 years - to fight inflation that had hit 9%. Mortgage rates doubled to 7%+, slowing the housing market and gradually bringing inflation back down.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>In developed economies, rates between 2-3% are considered neutral - neither stimulating nor restraining</li><li>Rates above neutral are restrictive - designed to slow the economy and fight inflation</li><li>Rates near zero limit what central banks can do in a crisis (the \"zero lower bound\")</li><li>Different central banks have different mandates - the Fed targets both inflation and employment, while the ECB focuses primarily on inflation</li></ul></div></div><div class=\"ge-formal\">The short-term interest rate set by a central bank as the primary instrument of monetary policy. Examples: Federal Funds Rate (US), Bank Rate (UK), Main Refinancing Rate (ECB), Overnight Call Rate (Japan).</div>"
      },
      "moderate": {
        "bluf": "The policy rate is the central bank's primary tool for managing the output gap and inflation. It anchors the short end of the yield curve and transmits to the real economy via credit conditions, asset prices, and the exchange rate channel.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The policy rate is the fulcrum of monetary policy transmission. It sets the risk-free rate, which determines mortgage rates, corporate borrowing costs, equity discount rates, and currency attractiveness. The gap between the policy rate and the neutral rate (r*) defines the monetary policy stance - restrictive, neutral, or accommodative.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Monetary policy operates with long and variable lags (Friedman). A rate hike today affects housing in 6 months, consumption in 12 months, and inflation in 18 months. This means central banks are always flying partially blind - setting policy based on forecasts of where inflation will be, not where it is. Forward guidance tries to reduce this uncertainty by telegraphing the path ahead.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The ECB held rates at negative levels (-0.5%) until July 2022, then hiked 450bp in 14 months. The delay (hiking later than the Fed) weakened the euro to parity with the dollar and imported additional inflation through higher energy prices denominated in dollars. The sequencing of rate cycles across central banks drives FX markets.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Dot plot / rate path:</strong> the Fed's projected rate path signals intentions - markets trade the gap between dot plot and market pricing</li><li><strong>Real policy rate:</strong> nominal rate minus inflation - the true measure of how tight policy is. Above 2% real is meaningfully restrictive</li><li><strong>Terminal rate:</strong> the peak rate expected this cycle - the key variable for bond and equity pricing</li><li><strong>r* (neutral rate):</strong> the equilibrium rate that neither stimulates nor restricts - estimated, not observed, and subject to debate</li></ul></div></div><div class=\"ge-formal\">The short-term nominal interest rate set by the central bank. The Taylor Rule approximation: policy rate = r* + inflation + 0.5(inflation gap) + 0.5(output gap). In practice, central banks exercise discretion around this formula.</div>"
      },
      "expert": {
        "bluf": "The policy rate is the operational target of monetary policy, anchoring the overnight rate. The key debate is the level and stability of r* - the neutral real rate - which determines whether any given policy rate is restrictive or accommodative. Post-COVID r* estimates have drifted higher, repricing the entire curve.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The policy rate defines the stance of monetary policy only relative to r*. If r* has risen from ~0.5% to ~1.5% (as Laubach-Williams and other models suggest post-COVID), then a 5% fed funds rate with 3% inflation is only mildly restrictive (real rate 2% vs r* 1.5%) - not the severe tightening it appears in nominal terms. This r* uncertainty is the single biggest source of policy risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The transmission mechanism has evolved. QE/QT means the policy rate is not the only lever - the balance sheet affects term premia independently. Financial conditions indices (Goldman FCI, Chicago NFCI) capture the combined effect of rates, spreads, equity prices, and the dollar. The Fed increasingly watches financial conditions rather than the policy rate in isolation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">BOJ under Ueda ended yield curve control and moved the policy rate from -0.1% to 0.25% - the first hike in 17 years. Despite the small absolute move, the signal effect was massive: it repriced the entire JGB curve, triggered yen carry trade unwinds, and demonstrated that even the most dovish central bank has limits. The yen moved 15% on the policy shift.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>OIS pricing:</strong> overnight index swap curves show the market-implied policy path - trade the gap between this and your own view</li><li><strong>Quantitative tightening:</strong> balance sheet runoff is equivalent to ~25bp per $500bn in reduced holdings - the shadow rate hike</li><li><strong>Financial conditions:</strong> if equity rallies and spreads compress, they offset rate hikes - the Fed may need to hike more</li><li><strong>Central bank reaction function:</strong> is the bar for cutting symmetrical with the bar for hiking? Typically no - cuts are reactive (to data), hikes are pre-emptive (to forecasts)</li></ul></div></div><div class=\"ge-formal\">The overnight nominal interest rate target. Taylor Rule: i = r* + π + α(π - π*) + β(y - y*). In practice, the effective stance is better measured by the real policy rate (i - πe) relative to the Laubach-Williams r* estimate, or by broad financial conditions indices.</div>"
      }
    },

  "Stock Market YTD": {
    "complexity": 1,
    "category": "equity",
    "levels": {
      "beginner": {
        "bluf": "Stock Market YTD shows how much a country's main stock market index has gone up or down since the start of the year. It is the most visible daily scoreboard for investor confidence in a country's economy and companies.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The stock market reflects what investors collectively think about a country's economic future. Rising markets signal optimism about corporate profits, growth, and stability. Falling markets signal worry. While the stock market is not the economy, it affects wealth, consumer confidence, retirement savings, and business investment.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">A stock index tracks a basket of a country's biggest companies. The YTD return tells you whether those companies are collectively worth more or less than on January 1st. It is a forward-looking measure - markets price in expectations about the future, not just what is happening now.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the S&P 500 is up +12% YTD, it means the 500 largest US companies are collectively worth 12% more than at the start of the year. If the Nikkei 225 is down -5% YTD, Japanese large-caps have lost 5% of their value since January 1st.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>YTD returns can be misleading if a market crashed in December - always look at the starting point</li><li>A rising market with falling breadth (only a few stocks driving the gain) is fragile</li><li>Compare local-currency returns with dollar-denominated returns - a 15% gain in yen can be flat in dollars if the yen weakened 15%</li><li>Stock markets typically lead the real economy by 6-9 months</li></ul></div></div><div class=\"ge-formal\">The percentage change in a country's benchmark equity index from the last trading day of the prior year to the current date, measured in local currency.</div>"
      },
      "moderate": {
        "bluf": "The equity benchmark YTD return captures market expectations for earnings growth, discount rates, and risk appetite. It is a composite signal - driven by EPS growth, multiple expansion/contraction, and sector rotation - not a single economic variable.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Equity returns decompose into earnings growth + multiple change + dividend yield. In a rate-hiking cycle, multiples compress even if earnings grow - the discount rate rises. In an easing cycle, multiples expand. Understanding which component is driving YTD returns tells you whether the move is sustainable. Multiple-driven rallies are fragile; earnings-driven rallies have legs.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The stock market is a discounted cash flow machine. It prices the present value of all future corporate earnings. When rates rise, the discount rate increases, and future earnings are worth less today - even if the earnings themselves are unchanged. This is why stocks can fall despite a strong economy: the discount rate effect overwhelms the earnings effect.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In 2022, the S&P 500 fell 19% despite earnings growing ~5%. The entire decline was multiple compression - the forward P/E fell from 21x to 17x as the Fed hiked 425bp. In 2023, the index gained 24% on multiple expansion back to 20x, concentrated in 7 mega-cap tech stocks (the Magnificent 7). Breadth was historically narrow.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>EPS revisions:</strong> the direction of analyst earnings revisions is a better forward indicator than the price level</li><li><strong>Breadth:</strong> advance-decline ratios and equal-weight vs cap-weight performance measure participation</li><li><strong>Currency-adjusted:</strong> for international comparisons, convert to a common currency - local returns can be misleading</li><li><strong>Sector composition:</strong> the S&P 500 is ~30% tech; the FTSE 100 is heavy energy and financials - they respond to different macro drivers</li></ul></div></div><div class=\"ge-formal\">Year-to-date total return of the benchmark equity index in local currency. Decomposition: YTD return ≈ EPS growth + ΔP/E multiple + dividend yield.</div>"
      },
      "expert": {
        "bluf": "The benchmark equity return is a composite of earnings revisions, multiple re-rating (driven by the equity risk premium and rate expectations), and positioning/flow dynamics. Index-level returns mask sector dispersion and concentration risk - breadth divergences are the leading fragility signal.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Equity markets are the most liquid expression of growth expectations. But index returns are increasingly dominated by concentration - the top 10 S&P 500 stocks represent ~35% of market cap. This makes the index a poor proxy for the broad economy. For macro analysis, equal-weighted indices, small-cap performance, and cyclical vs defensive ratios are more informative than the headline number.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The equity risk premium (ERP) - the excess return demanded over risk-free bonds - is the key unobservable. When the ERP compresses (risk appetite rises), multiples expand mechanically. Current ERP estimates (~3-4% for US) are below historical averages (~5%), implying markets are priced for a benign macro outcome. Any negative surprise reprices the ERP violently.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's Nikkei 225 broke its 1989 all-time high in 2024 after 34 years. The drivers were not primarily earnings but structural: Tokyo Stock Exchange governance reforms (pushing companies above 1x book value), yen weakness boosting exporters, and Buffett's endorsement catalysing global inflows. The Japan trade was a regime change in corporate governance, not an earnings cycle.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ERP vs bond yields:</strong> when the earnings yield (1/PE) approaches the 10Y yield, the TINA (There Is No Alternative) argument for equities evaporates</li><li><strong>Gamma positioning:</strong> options dealer hedging amplifies moves in both directions - monitor gamma exposure levels at key strikes</li><li><strong>Buyback vs issuance:</strong> net corporate equity supply is the largest source of equity demand - when buybacks slow, a key support disappears</li><li><strong>Cross-asset signals:</strong> equity-credit divergence (equities rallying while spreads widen) typically resolves in favour of credit being right</li></ul></div></div><div class=\"ge-formal\">Benchmark index YTD return in local currency. For cross-country comparison: USD-adjusted return = local return + FX return. Index construction (cap-weighted vs price-weighted vs equal-weighted) materially affects interpretation. Free-float market cap weighting is the global standard (MSCI methodology).</div>"
      }
    },

  "10Y Bond Yield": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The 10-year bond yield is the annual return investors earn for lending money to a government for 10 years. It is the most important interest rate in any economy - the benchmark that influences mortgage rates, corporate borrowing costs, and stock valuations.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When governments need money, they issue bonds. The 10-year bond is the most watched because it balances short-term policy (which affects 2-year rates) with long-term economic expectations. Mortgage rates, corporate bonds, and pension fund returns all reference the 10-year yield. When it rises, borrowing gets more expensive across the entire economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it as the economy's long-term interest rate. If you lend the government money for 10 years, the yield is your compensation for inflation risk, the chance the government might struggle to repay, and the opportunity cost of locking up your money. Higher yields mean investors need more compensation - they see more risk or expect more inflation ahead.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the US 10Y yield is 4.5%, it means you earn 4.5% per year for lending to the US government for a decade. In 2020, this yield was below 1% - investors were willing to accept almost nothing because they were scared about the economy. By 2023, it rose above 5% as inflation and government borrowing surged.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Rising yields mean tighter financial conditions - harder and more expensive for everyone to borrow</li><li>Falling yields signal a flight to safety or expectations of rate cuts and weaker growth</li><li>The gap between 10Y yields across countries reflects relative growth and inflation expectations</li><li>Bond prices move inversely to yields - when yields rise, bond holders lose money</li></ul></div></div><div class=\"ge-formal\">The yield-to-maturity on a government's 10-year benchmark bond, expressed as an annualised percentage. It represents the market-determined risk-free rate for that currency at a 10-year horizon.</div>"
      },
      "moderate": {
        "bluf": "The 10Y sovereign yield is the risk-free rate for a currency at a medium-term horizon. It decomposes into expected short rates (monetary policy path), an inflation premium, and a term premium that compensates for duration risk and supply/demand dynamics.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The 10Y yield is the anchor for all long-duration asset pricing. Corporate bond yields = 10Y government yield + credit spread. Mortgage rates = 10Y + spread. Equity valuations use the 10Y as the discount rate baseline. A 100bp move in the 10Y reprices every long-duration asset in the economy - it is the single most consequential market price.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Decompose the 10Y yield: rate expectations (average of expected fed funds over 10 years) + term premium (compensation for holding duration). Rate expectations are driven by the monetary policy outlook. Term premium is driven by supply (government deficits), demand (central bank QE/QT, pension funds, foreign central banks), and inflation uncertainty.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The 10Y UST yield rose from 3.8% to 5.0% between July-October 2023. Only ~50bp was explained by higher rate expectations - the rest was term premium expansion driven by Treasury announcing larger-than-expected issuance to fund the deficit. This distinction matters: rate expectation moves affect the whole curve; term premium moves are concentrated in the long end.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real yield (TIPS):</strong> 10Y yield minus inflation breakeven - the true cost of capital. Above 2% real is historically tight</li><li><strong>Term premium:</strong> ACM or Kim-Wright models - when it turns positive, long bonds are genuinely compensating for risk</li><li><strong>Foreign holdings:</strong> Japan and China hold ~$2tn in Treasuries - any diversification shift affects demand structurally</li><li><strong>Auction metrics:</strong> bid-to-cover, primary dealer takedown, and tail (vs when-issued) signal real-time demand</li></ul></div></div><div class=\"ge-formal\">The yield-to-maturity on the benchmark 10-year sovereign bond. Decomposition: 10Y yield = expected average short rate over 10Y + term premium. The term premium compensates for interest rate risk, inflation uncertainty, and supply/demand imbalances.</div>"
      },
      "expert": {
        "bluf": "The 10Y yield is the sum of the expected policy path and the term premium. Post-QE, the term premium has been the dominant driver of 10Y moves, with supply dynamics (fiscal deficits, QT, foreign reserve management) replacing rate expectations as the marginal price setter at the long end.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The 10Y yield determines the discount rate for all long-duration assets and the cost of capital for the real economy. The decomposition into rate expectations and term premium is essential: rate expectations are observable (via OIS), but term premium is model-dependent (ACM, Kim-Wright, term structure models all give different answers). The current regime: with QT reducing Fed holdings by ~$60bn/month and fiscal deficits requiring $2tn+ annual issuance, the marginal buyer of duration is no longer the central bank but the private sector - which demands compensation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The 10Y yield is an equilibrium price set by the intersection of duration supply (Treasury issuance, agency MBS) and duration demand (pensions, insurance, banks, foreign CBs). QE suppressed term premium by removing duration supply. QT and fiscal deficits are increasing duration supply while the traditional buyers (Japan, China) are reducing purchases. The market must find a clearing price - that price is a higher term premium.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's 10Y JGB yield was pinned at 0% by yield curve control (2016-2024). When the BOJ widened the band and then abandoned YCC, the JGB 10Y moved to ~1%. The Japanese life insurance sector began reallocating from foreign bonds back to JGBs - reducing demand for USTs and Bunds at the margin. BOJ policy normalisation is a global term premium event, not just a Japanese one.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ACM term premium:</strong> the Adrian-Crump-Moench model is the Fed's reference - positive term premium is the new normal</li><li><strong>Duration supply calendar:</strong> Treasury quarterly refunding announcements (QRA) set the near-term supply trajectory - February and August QRAs are market-moving events</li><li><strong>Basis trades:</strong> hedge fund Treasury basis trades (long cash, short futures) are now ~$1tn - a leveraged bet on term premium that creates fragility</li><li><strong>10Y-3M spread:</strong> the most reliable recession predictor when inverted. But: false signals are more likely when term premium drives the inversion rather than rate expectations</li></ul></div></div><div class=\"ge-formal\">Yield-to-maturity on the on-the-run 10Y sovereign benchmark. Decomposition: y(10) = (1/10)Σ E[r(t)] + tp(10), where tp is the term premium. Model-dependent estimates (ACM, KW, DKW) can diverge by 50-100bp. Duration: ~8.5 years for a 4% coupon 10Y, meaning a 100bp yield rise produces an ~8.5% price decline.</div>"
      }
    },

  "Yield Curve": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The yield curve shows the difference between short-term and long-term government bond yields. Its shape is one of the most reliable predictors of recessions - when long-term rates fall below short-term rates (an \"inversion\"), a recession has followed almost every time in history.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Normally, you earn more for lending money for longer periods (long-term yields are higher than short-term). When this flips and short-term rates pay more than long-term, it signals that investors expect economic trouble ahead - they think the central bank will have to cut rates in the future to rescue a weakening economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the yield curve as the bond market's weather forecast. A normal upward-sloping curve says \"sunshine ahead.\" A flat curve says \"clouds forming.\" An inverted curve says \"storm warning.\" Bond markets have predicted recessions more accurately than most economists.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">We show the yield curve as the gap between the 10-year and 2-year government bond yields. A positive number (say +1.5%) means the curve is normal - long rates are higher. A negative number (say -0.8%) means the curve is inverted - short rates are higher. The US yield curve inverted in 2022-2023, its longest inversion in over 40 years.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Positive spread (above 0): normal - no recession signal</li><li>Flat (near 0): transition zone - the market is uncertain about the outlook</li><li>Negative spread (below 0): inverted - historically a recession follows within 6-18 months</li><li>When an inverted curve starts steepening back to normal, the recession is often imminent - this is the \"bull steepener\" that precedes rate cuts</li></ul></div></div><div class=\"ge-formal\">The spread between the 10-year and 2-year government bond yields, expressed in percentage points. A positive spread indicates a normal (upward-sloping) yield curve; a negative spread indicates an inverted curve.</div>"
      },
      "moderate": {
        "bluf": "The 10Y-2Y yield curve slope reflects the term premium and market expectations for the rate cycle. Inversion has preceded every US recession since 1970, but the signal's timing is variable (6-24 months) and the mechanism matters - rate-expectation-driven inversions are more reliable than term-premium-driven ones.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The yield curve slope is the bond market's summary of the economic outlook. A steep curve means easy money and growth expectations. A flat or inverted curve means tight money and expectations that central banks will need to ease in the future. For banks, the yield curve directly affects profitability - they borrow short and lend long, so a steep curve is profitable and an inverted curve squeezes margins.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The 2Y yield reflects where markets expect the policy rate to average over the next two years. The 10Y yield reflects the longer-term equilibrium. When the 2Y exceeds the 10Y, markets are saying: \"Rates are high now, but will need to come down significantly\" - which implies something bad is coming that forces cuts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US 2s10s curve inverted to -108bp in July 2023 - the deepest inversion since 1981. This reflected a Fed at 5.5% (pulling up the 2Y) while markets expected an eventual return to ~3% (holding down the 10Y). The curve began steepening in late 2024 as the Fed started cutting - the classic late-cycle pattern.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>2s10s vs 3m10s:</strong> the 3-month/10-year spread has a marginally better recession prediction record than 2s10s</li><li><strong>Bull steepener:</strong> the curve steepening because front-end yields fall (rate cuts) - this is the recession-imminent signal</li><li><strong>Bear steepener:</strong> the curve steepening because long-end yields rise (term premium) - signals fiscal concerns, not recession</li><li><strong>Bank profitability:</strong> the curve slope directly maps to net interest margin for banks - watch bank stocks diverge from the curve as an early signal</li></ul></div></div><div class=\"ge-formal\">The 10Y-2Y spread on sovereign bonds, in percentage points. Decomposition: slope = (10Y rate expectations + 10Y term premium) - (2Y rate expectations + 2Y term premium). The rate expectations component carries the recession signal; the term premium component carries the supply/fiscal signal.</div>"
      },
      "expert": {
        "bluf": "The 2s10s slope is the market's summary statistic for the policy cycle. The predictive power for recessions comes from the rate expectations component, not the term premium component. The 2022-2024 inversion was historically deep but the recession signal was muddied by an unusually positive term premium repricing at the long end.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The curve slope encodes two distinct signals: (1) the rate expectations channel - an inverted curve means markets expect rate cuts, implying an expected downturn; (2) the term premium channel - a steep curve can reflect fiscal supply concerns rather than growth optimism. Decomposing these is essential. The near-term forward spread (6-quarter-ahead forward minus 3-month T-bill) has the cleanest recession signal because it strips out most of the term premium noise.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The yield curve is a forward rate curve in disguise. The 10Y yield is the geometric average of expected 1Y rates over the next decade plus a term premium. Inversion means the market expects the 1Y rate to decline substantially over the coming years - and in a hiking cycle, the only reason rates decline substantially is recession. The timing lag (6-24 months from inversion to recession) reflects the variable lag of monetary policy transmission.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The 2022-2024 inversion was unique: the deepest since 1981 but accompanied by a positive term premium expansion at the long end (driven by fiscal deficits and QT). This meant the rate-expectations-implied inversion was even deeper than the observed curve suggested. The Bauer-Mertens near-term forward spread gave a cleaner signal but also triggered a false positive as the soft landing materialised.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Near-term forward spread:</strong> Engstrom-Sharpe's measure (18-month forward minus 3-month yield) - the Fed's preferred recession indicator</li><li><strong>Breakeven curve:</strong> the slope of TIPS breakevens reveals whether inflation expectations are driving the nominal curve</li><li><strong>Swap spreads:</strong> negative swap spreads at the long end signal Treasury supply saturation and balance sheet constraints</li><li><strong>Conditional probability:</strong> probit models using the curve slope give ~70% recession probability 12 months after sustained inversion - useful but not deterministic</li></ul></div></div><div class=\"ge-formal\">The 10Y-2Y sovereign yield spread. Formally: slope = y(10) - y(2) = [Σ₁₋₁₀ E(r) + tp(10)] - [Σ₁₋₂ E(r) + tp(2)]. The rate expectations differential dominates the recession signal. The near-term forward spread (f(t+6) - y(3m)) has a superior signal-to-noise ratio for recession prediction.</div>"
      }
    },
    "aliases": [

    ],

  "Exchange Rate": {
    "complexity": 1,
    "category": "fx",
    "levels": {
      "beginner": {
        "bluf": "The exchange rate is how much one currency is worth in terms of another. It determines the price of everything a country imports and exports, and is one of the most visible daily indicators of a country's economic standing in the world.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Exchange rates affect the price of imported goods (a weaker currency makes imports more expensive), the competitiveness of exports (a weaker currency makes your goods cheaper for foreigners to buy), the value of foreign investments, and the cost of foreign travel. For countries that import energy or food, a weak currency can directly raise the cost of living.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of currencies as shares in a country. When investors are confident about a country's economy, they buy its currency (pushing it up). When they are worried, they sell (pushing it down). Interest rates, growth, inflation, and political stability all affect how attractive a currency is to hold.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If USD/JPY is 155, it means one US dollar buys 155 Japanese yen. If this moves to 160, the yen has weakened (you get more yen per dollar). If it moves to 145, the yen has strengthened. A weaker yen makes Japanese exports cheaper for American buyers but makes imported oil more expensive for Japan.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Interest rate differentials are the primary short-term driver - money flows to currencies with higher rates</li><li>Large, rapid moves (10%+ in weeks) can destabilise an economy and often prompt central bank intervention</li><li>The US dollar is the world's reserve currency - its strength or weakness affects every other country</li><li>Some countries fix or manage their exchange rates rather than letting markets decide</li></ul></div></div><div class=\"ge-formal\">The price of one currency expressed in units of another. Quoted either directly (domestic per unit of foreign) or indirectly (foreign per unit of domestic). FX markets are the largest in the world, with over $7 trillion traded daily.</div>"
      },
      "moderate": {
        "bluf": "Exchange rates are driven by interest rate differentials, growth differentials, current account flows, and risk appetite. In the short run, rate expectations dominate (via the carry channel). In the long run, purchasing power parity (PPP) and external balances provide an anchor - but convergence is slow and unreliable.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">FX is the asset class that connects everything: it transmits monetary policy across borders, adjusts external imbalances, and channels capital flows. For equity investors, FX can be half the return when investing internationally. For central banks in open economies, the exchange rate is a key transmission mechanism - a 10% depreciation is roughly equivalent to a 50bp rate cut in terms of financial conditions impact.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Short-term FX is driven by rate expectations (uncovered interest rate parity: high-rate currencies should depreciate to equalise returns, but in practice they appreciate - the carry trade anomaly). Medium-term, current account flows matter: persistent deficits create selling pressure. Long-term, PPP provides a gravitational pull - currencies that are 30%+ overvalued on PPP tend to weaken eventually, but \"eventually\" can be years.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">USD/JPY moved from 115 to 155 between 2022-2024, driven almost entirely by the rate differential: the Fed hiked to 5.5% while the BOJ held at -0.1%. The 550bp rate gap made yen carry trades enormously profitable - borrow yen, invest in dollars. When the BOJ finally hiked in mid-2024, the unwind was violent: USD/JPY fell 15 yen in three weeks.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real effective exchange rate (REER):</strong> trade-weighted and inflation-adjusted - the best measure of competitiveness</li><li><strong>Rate differentials:</strong> 2Y swap rate differentials are the strongest short-term FX predictor</li><li><strong>Positioning:</strong> CFTC Commitment of Traders data shows speculative FX positioning - crowded positions unwind sharply</li><li><strong>Central bank intervention:</strong> BOJ intervention at USD/JPY 160; PBOC manages CNY daily fix - intervention limits are market-moving information</li></ul></div></div><div class=\"ge-formal\">The bilateral exchange rate between two currencies, determined by supply and demand in the foreign exchange market. Key frameworks: uncovered interest parity (UIP), purchasing power parity (PPP), and the balance of payments approach. Empirically, exchange rate models perform poorly vs a random walk at short horizons (Meese-Rogoff puzzle).</div>"
      },
      "expert": {
        "bluf": "FX is the residual asset class - it clears all cross-border capital account and current account flows. The carry trade (forward rate bias) violates UIP systematically, generating positive returns punctuated by sharp reversals during risk-off events. Dollar cycle dynamics (driven by relative monetary policy, risk appetite, and reserve diversification) dominate the global macro landscape.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The dollar cycle is the single most important macro variable globally. Dollar strength tightens global financial conditions (via dollar-denominated debt servicing costs), compresses EM growth, and drains global liquidity. Dollar weakness does the reverse. The DXY is not just a price - it is a global financial conditions index. The Milkshake Theory (Brent Johnson): structural demand for dollars (reserve status, eurodollar system, dollar-denominated liabilities) creates persistent dollar strength that eventually destabilises the system.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">FX models are famously bad (Meese-Rogoff). In practice, the three factors that work: (1) relative rate expectations (2Y OIS differentials), (2) terms of trade shocks (commodity prices for resource currencies), and (3) positioning extremes (crowded carry trades unwind violently). PPP is a 10-year anchor with ~5-year half-life of deviations. Most FX alpha comes from timing the carry trade regime (risk-on vs risk-off) rather than predicting equilibrium rates.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The yen carry trade unwind of August 2024 demonstrated the nonlinearity of FX positioning. An estimated $1tn in yen-funded carry positions unwound in days when the BOJ hiked and the Fed signalled cuts simultaneously - compressing the rate differential from both sides. USD/JPY moved 15% in three weeks, the Nikkei fell 12% in a day, and VIX spiked to 65. The carry trade is a slow escalator up and a fast elevator down.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Cross-currency basis:</strong> the deviation from covered interest parity reveals dollar funding stress. Persistent negative basis = structural dollar shortage</li><li><strong>FX reserve composition (IMF COFER):</strong> gradual diversification away from USD (~59% of reserves, down from 70%) is a slow structural headwind for the dollar</li><li><strong>Real rate differentials:</strong> nominal rate differentials adjusted for inflation expectations - the true carry adjusted for purchasing power erosion</li><li><strong>Vol-adjusted carry:</strong> carry/implied vol (the Sharpe ratio of the carry trade) determines when carry is attractive vs when the risk exceeds the reward</li></ul></div></div><div class=\"ge-formal\">The nominal bilateral exchange rate. Key identity: covered interest parity (CIP) should hold by arbitrage: F/S = (1+r_d)/(1+r_f). CIP violations (non-zero cross-currency basis) indicate dollar funding market stress. UIP (uncovered) is systematically violated - the forward rate bias (carry premium) averages ~2-3% annually for G10 but exhibits negative skewness and excess kurtosis (crash risk).</div>"
      }
    },

  "Inflation (CPI)": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Inflation is a sustained increase in the overall price level of goods and services, which reduces the purchasing power of money over time.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When inflation rises, each unit of currency buys fewer things. If your income doesn't keep up with inflation, you're effectively getting poorer even if your paycheck stays the same.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of money as a measuring stick for value. Inflation means the stick is slowly shrinking. Prices aren't just going up randomly - the value of money itself is going down relative to goods and services.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a basket of everyday items costs $100 this year and $103 next year, the inflation rate is 3%. Central banks try to keep inflation around 2% - enough to encourage spending but not so much that money loses value quickly.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\">Central banks fight high inflation by raising interest rates, which makes borrowing more expensive and slows spending. Deflation (falling prices) sounds good but can trap an economy - people delay purchases expecting lower prices, causing a downward spiral.</div></div>"
      },
      "moderate": {
        "bluf": "Inflation is the sustained rate of increase in the general price level, measured by indices like CPI or PCE. Central banks target ~2% as the sweet spot.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why 2%</div><div class=\"ge-body\">High enough to avoid the zero lower bound (where central banks run out of room to cut rates), low enough to preserve purchasing power. The \"last mile\" of disinflation - getting from 3% to 2% - is proving the hardest part of the current cycle.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Key measures</div><div class=\"ge-body\">Headline CPI includes everything. Core CPI strips out volatile food and energy to reveal the underlying trend. The Fed watches core PCE (not CPI) as its preferred gauge - it uses different weighting and typically runs 30-40bps lower.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Transmission mechanism</div><div class=\"ge-body\">Demand pressure transmits through wages to prices, but supply shocks (energy, supply chains) can drive inflation independently. Shelter/housing is often the stickiest component; goods tend to normalise fastest after supply shocks.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Market impact</div><div class=\"ge-body\">Inflation determines real interest rates, erodes nominal debt burdens, affects wage negotiations, and is the primary variable central banks target. It transmits directly to bond yields, FX, and equity valuations.</div></div>"
      },
      "expert": {
        "bluf": "Inflation is the rate of change of the general price level. The distinction between headline, core, trimmed mean, and supercore measures is critical.",

<script>
// ── MacroSnaps Shell — FROZEN. Do not edit. Edit data.json instead. ──
// Version: 1.0 | Refactored: 2026-03-08

let currentLevel='beginner', activeBubble=null;

// Parse frozen (never-changing) data
const _glossaryRaw = JSON.parse(document.getElementById('glossary-data').textContent);
const _frozen      = JSON.parse(document.getElementById('shell-frozen').textContent);

// ── Reconstruct glossary (renderer expects {term: {complexity, beginner, moderate, expert}}) ──
const glossary = {};
Object.entries(_glossaryRaw).forEach(([term, entry]) => {
  glossary[term] = { complexity: entry.complexity };
  ['beginner','moderate','expert'].forEach(lv => {
    const lev = entry.levels[lv];
    if(!lev) return;
    glossary[term][lv] = lev.full ? { bluf: lev.bluf, full: lev.full } : lev.bluf;
  });
});

// Frozen config references
const metricSources      = _frozen.metricSources;
const metricDisplayLabels = _frozen.metricDisplayLabels || {};
const histAnnualLabels  = _frozen.chartConfig.annualLabels;
let histMonthlyLabels = []; // populated after data.json loads - see generator below
const gdpYears          = _frozen.chartConfig.weatherGridYears;
const footerContent     = _frozen.footer;
const fxSource          = metricSources['FX'] || 'WM/Refinitiv · Bloomberg · National central banks';

// ── Runtime state (populated by fetch) ──
let countries = [];
let cardStories    = {beginner:{}, moderate:{}, expert:{}};
let metricStories = {}; // {countryCode: {metricName: {beginner,moderate,expert}}}
let fxRegime       = {};
let historicalData = {};
let gdpAllCountries={}, cpiAllCountries={}, unempAllCountries={}, budgetAllCountries={}, caAllCountries={};
let newsData       = {beginner:[], moderate:[], expert:[]};
let commoditiesData= {items:[], stories:{}, commentary:{}, weather:'', asOf:'', source:''};
let _countries     = {};
let _globeReady    = false;
let _currentGeoFilter = 'all';

// ── Helper: extract numeric value from a live metric string (e.g. "+2.2%", "-7.5% GDP") ──
function parseLiveVal(s) {
  if (!s) return null;
  const n = parseFloat(s.replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}

// ── Load data.json ──
fetch('data.json')
  .then(r => { if(!r.ok) throw new Error('data.json not found: ' + r.status); return r.json(); })
  .then(data => {
    _countries = data.countries || {};

    // Reconstruct countries array
    countries = Object.values(_countries).map(c => ({
      code: c.code, name: c.name, flag: c.flag,
      lat: c.lat, lon: c.lon, weather: (function(){
        const gdp = parseLiveVal(((c.metrics&&c.metrics.macro&&c.metrics.macro['GDP Growth'])||{}).value);
        if(gdp===null) return c.weather;
        return gdp>=3 ? '☀️' : gdp>=0 ? '☁️' : '⛈️';
      })(),
      metrics: _flattenMetrics(c.metrics)
    }));

    // Rebuild cardStories, fxRegime, historicalData, weatherGrids
    Object.values(_countries).forEach(c => {
      ['beginner','moderate','expert'].forEach(lv => {
        if(c.stories && c.stories[lv]) cardStories[lv][c.code] = c.stories[lv];
      });
      const ms = {};
      ['macro','market'].forEach(sec => {
        Object.entries((c.metrics || {})[sec] || {}).forEach(([mName, mEntry]) => {
          if(mEntry && typeof mEntry === 'object' && mEntry.story) ms[mName] = mEntry.story;
        });
      });
      if(Object.keys(ms).length) metricStories[c.code] = ms;
      if(c.fxRegime && c.fxRegime.label) fxRegime[c.code] = c.fxRegime;
      if(c._frozen_historical)  historicalData[c.code] = c._frozen_historical;
      const wg = c._frozen_weatherGrid || {};
      const lm = (c.metrics && c.metrics.macro) ? c.metrics.macro : {};
      function liveGrid(frozen, metricName) {
        if (!frozen) return null;
        const vals = frozen.values.slice();
        const live = parseLiveVal((lm[metricName] || {}).value);
        if (live !== null) vals[vals.length - 1] = live;
        return vals;
      }
      const gdpV    = liveGrid(wg.gdp,    'GDP Growth');
      const cpiV    = liveGrid(wg.cpi,    'Inflation (CPI)');
      const unempV  = liveGrid(wg.unemp,  'Unemployment');
      const budgetV = liveGrid(wg.budget, 'Budget Deficit');
      const caV     = liveGrid(wg.ca,     'Current Account');
      if(gdpV)    gdpAllCountries[c.code]    = { flag: c.flag, v: gdpV };
      if(cpiV)    cpiAllCountries[c.code]    = { flag: c.flag, v: cpiV };
      if(unempV)  unempAllCountries[c.code]  = { flag: c.flag, v: unempV };
      if(budgetV) budgetAllCountries[c.code] = { flag: c.flag, v: budgetV };
      if(caV)     caAllCountries[c.code]     = { flag: c.flag, v: caV };
    });

    // Global stories
    if(data.globalStories) newsData = data.globalStories;

    // Commodities
    if(data.commodities) {
      const sc = data.commodities;
      commoditiesData = {
        asOf:    sc.asOf    || '',
        source:  sc.source  || _frozen.commoditiesSource,
        weather: sc.weather || '⛈️',
        items:   sc.items   || [],
        stories: sc.stories || {beginner:[], moderate:[], expert:[]},
        commentary: sc.commentary || {beginner:'', moderate:'', expert:''},
        itemExplanations: _frozen.itemExplanations || {}
      };
    }

    console.log('[MacroSnaps] data.json loaded — generated: ' + (data._meta && data._meta.generated));

    // Set header "Updated DD Mon YYYY" from _meta.generated.
    (function() {
      const genStr = data._meta && data._meta.generated;
      if (genStr) {
        const d = new Date(genStr);
        const label = d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
        const el = document.getElementById('headerUpdated');
        if (el) el.textContent = 'Updated ' + label;
      }
    })();

    // Build monthly chart labels dynamically from Jan 2000 to _meta.generated.
    // Anchored at Jan 2000 so the array covers all data going back to 2000.
    // Count grows naturally as months pass - no manual edit ever needed.
    (function() {
      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const genStr = data._meta && data._meta.generated;
      const anchor = genStr ? new Date(genStr) : new Date();
      const endYear = anchor.getFullYear();
      const endMonth = anchor.getMonth(); // 0-indexed
      const startYear = 2000;
      const startMonth = 0; // Jan
      const COUNT = (endYear - startYear) * 12 + (endMonth - startMonth) + 1;
      const labels = [];
      for (let i = 0; i < COUNT; i++) {
        const totalMonths = startYear * 12 + startMonth + i;
        const y = Math.floor(totalMonths / 12);
        const m = totalMonths % 12;
        labels.push(MONTHS[m] + ' ' + String(y).slice(-2));
      }
      histMonthlyLabels = labels;
    })();

    // Kick off globe (lazy - only initialises WebGL when globe is first shown)
    _globeReady = false;

    // Build rankings view (default landing page)
    buildRankingsView(data._meta && data._meta.generated);
  })
  .catch(err => {
    console.error('[MacroSnaps] Failed to load data.json:', err);
    alert('MacroSnaps could not load data.json. Please check the file exists in the same folder.');
  });

// ── Helper: flatten {macro:{k:{value,tier}}, market:{...}} → {k:v, ...} ──
function _flattenMetrics(metrics) {
  const out = { macro: {}, market: {} };
  if(metrics.macro)  Object.entries(metrics.macro).forEach(([k,v])  => out.macro[k]  = typeof v === 'object' ? v.value : v);
  if(metrics.market) Object.entries(metrics.market).forEach(([k,v]) => out.market[k] = typeof v === 'object' ? v.value : v);
  return out;
}

// Chart instance tracker
let activeChart=null;

function hasChartData(metricName, countryCode){
  const d=historicalData[countryCode];
  if(!d) return false;
  const cfg=d[metricName];
  if(!cfg||!cfg.v||!cfg.v.length) return false;
  const isAnnual=cfg.type==='bar';
  const totalLen=(isAnnual?histAnnualLabels:histMonthlyLabels).length;
  const rawVals=cfg.v||[];
  const padded=totalLen>rawVals.length?Array(totalLen-rawVals.length).fill(null).concat(rawVals):rawVals.slice(rawVals.length-totalLen);
  return padded.some(v=>v!==null&&v!==undefined);
}

function renderMetricChart(container, metricName, countryCode, rangeMonths){
  if(activeChart){activeChart.destroy();activeChart=null;}
  const d=historicalData[countryCode];
  if(!d) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }
  const cfg=d[metricName];
  if(!cfg||!cfg.v||!cfg.v.length) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }

  const isAnnual=cfg.type==='bar';
  const allLabels=isAnnual?histAnnualLabels:histMonthlyLabels;
  const rawVals=cfg.v||[];
  // Fixed window: Jan 2000 → current month/year. Right-align data into the full label
  // range, left-padding with nulls so gaps are visible rather than the axis shrinking.
  const totalLen=allLabels.length;
  const padded=totalLen>rawVals.length
    ?Array(totalLen-rawVals.length).fill(null).concat(rawVals)
    :rawVals.slice(rawVals.length-totalLen);
  const n=rangeMonths||totalLen;
  const sliceVals=padded.slice(-n);
  const sliceLabels=allLabels.slice(-n);
  const validVals=sliceVals.filter(v=>v!==null&&v!==undefined);
  if(!validVals.length) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }
  const mn=validVals.length?Math.min(...validVals):0, mx=validVals.length?Math.max(...validVals):0;
  const range=mx-mn;
  const pad=range*0.15||(Math.abs(mx)*0.1)||1;
  const isForecast=sliceLabels.map(l=>l&&l.toString().includes('F'));

  container.innerHTML='<canvas></canvas>';
  const canvas=container.querySelector('canvas');
  canvas.addEventListener('click',e=>e.stopPropagation());
  const ctx=canvas.getContext('2d');

  // Colors
  const cyan='rgba(0,212,255,';

  const green='rgba(0,230,138,';
  const red='rgba(255,61,90,';

  let datasets, scaleMin, scaleMax;

  if(cfg.type==='bar'){
    // Bar chart - cyan positive, red negative; forecast bars are lighter
    datasets=[{
      data:sliceVals,
      backgroundColor:sliceVals.map((v,i)=>{
        if(v===null||v===undefined) return 'transparent';
        const alpha=isForecast[i]?'.25)':'.5)';
        return v>=0?cyan+alpha:red+alpha;
      }),
      borderColor:sliceVals.map((v,i)=>{
        if(v===null||v===undefined) return 'transparent';
        const alpha=isForecast[i]?'.5)':'.8)';
        return v>=0?cyan+alpha:red+alpha;
      }),
      borderWidth:1,
      borderRadius:2
    }];
    scaleMin=mn<0?mn-pad:0;
    scaleMax=mx>0?mx+pad:0;
  } else if(cfg.zeroLine){
    // Yield curve - green above 0, red below 0
    datasets=[{
      data:sliceVals,
      borderWidth:1.5,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.3,
      fill:false,
      segment:{
        borderColor:function(ctx){
          const y0=ctx.p0.parsed.y, y1=ctx.p1.parsed.y;
          if(y0>=0&&y1>=0) return green+'.8)';
          if(y0<0&&y1<0) return red+'.8)';
          return '#888';
        }
      }
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  } else {
    // Standard line chart - cyan with fill
    const grad=ctx.createLinearGradient(0,0,0,120);
    grad.addColorStop(0,cyan+'.18)');
    grad.addColorStop(1,cyan+'.01)');
    datasets=[{
      data:sliceVals,
      borderColor:cyan+'.8)',
      borderWidth:1.5,
      backgroundColor:grad,
      fill:true,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#00d4ff',
      pointHoverBorderColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.35,
      stepped:cfg.stepped||false
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  }

  activeChart=new Chart(ctx,{
    type:cfg.type==='bar'?'bar':'line',
    data:{labels:sliceLabels,datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      events:['mousemove','mouseout','touchstart','touchmove'],
      layout:{padding:{left:2,right:2,top:4,bottom:0}},
      scales:{
        x:{
          display:true,
          grid:{display:false},
          ticks:{
            color:function(context){
              var label=sliceLabels[context.index];
              return label&&label.toString().includes('F')?'#00d4ff':'#888';
            },font:{family:"'Space Mono',monospace",size:8},
            maxRotation:0,autoSkip:true,maxTicksLimit:isAnnual?8:n<=12?6:n<=24?8:10
          },
          border:{display:false}
        },
        y:{
          display:true,
          position:'right',
          grid:{
            color:function(context){
              if(cfg.zeroLine && context.tick.value===0) return 'rgba(255,255,255,.2)';
              return 'rgba(255,255,255,.03)';
            },
            lineWidth:function(context){
              return (cfg.zeroLine && context.tick.value===0)?1.5:1;
            }
          },
          ticks:{
            color:'#888',font:{family:"'Space Mono',monospace",size:8},
            maxTicksLimit:5,
            callback:function(v){
              if(cfg.indexLabel&&v>=1000)return(v/1000).toFixed(v%1000===0?0:1)+'k';
              return v%1===0?v:v.toFixed(1);
            }
          },
          border:{display:false},
          min:scaleMin,
          max:scaleMax
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(8,12,24,.97)',
          borderColor:cfg.zeroLine?'rgba(150,150,150,.4)':'rgba(0,212,255,.4)',
          borderWidth:1,
          titleFont:{family:"'Space Mono',monospace",size:9},
          bodyFont:{family:"'DM Sans',sans-serif",size:11},
          titleColor:'#888',bodyColor:'#fff',
          cornerRadius:4,padding:8,displayColors:false,
          callbacks:{
            label:function(ctx){
              let v=ctx.parsed.y;
              if(cfg.indexLabel)return ' '+v.toLocaleString();
              if(cfg.zeroLine)return ' '+(v>=0?'+':'')+v+'bps';
              return ' '+v;
            }
          }
        }
      },
      interaction:{mode:'index',intersect:false},
      animation:{duration:400,easing:'easeOutCubic'}
    }
  });
}

function isFxMetric(name){ return name.includes('/'); }
function getCountryCode(countryName){ const c=countries.find(co=>co.name===countryName); return c?c.code:null; }

// ── GLOBE ──
function initGlobe(){
  const c=document.getElementById('globeContainer'),w=c.clientWidth,h=c.clientHeight;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,w/h,.1,1000);
  cam.position.z=2.8;
  const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
  ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));c.appendChild(ren.domElement);

  // Globe wireframe
  const gm=new THREE.Mesh(new THREE.SphereGeometry(1,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,wireframe:true,transparent:true,opacity:.13}));
  scene.add(gm);
  // Solid inner
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(.98,48,48),new THREE.MeshBasicMaterial({color:0x05080f,transparent:true,opacity:.95})));
  // Atmosphere glow
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.10,side:THREE.BackSide})));

  // Lat/lon grid
  for(let i=-60;i<=60;i+=30){const r=Math.cos(i*Math.PI/180),y=Math.sin(i*Math.PI/180),p=[];for(let j=0;j<=360;j+=3){const t=j*Math.PI/180;p.push(new THREE.Vector3(r*Math.cos(t),y,r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.18})));}
  for(let i=0;i<360;i+=30){const p=[],t=i*Math.PI/180;for(let j=-90;j<=90;j+=3){const ph=j*Math.PI/180,r=Math.cos(ph);p.push(new THREE.Vector3(r*Math.cos(t),Math.sin(ph),r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.15})));}

  // Country dots + invisible hit targets
  const dg=new THREE.Group();
  const hitTargets=new THREE.Group();
  countries.forEach(co=>{
    const pos=ll(co.lat,co.lon,1.005);
    // Visible dot
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.015,12,12),new THREE.MeshBasicMaterial({color:0x00d4ff}));
    dot.position.copy(pos);dg.add(dot);
    // Pulse ring
    const rn=new THREE.Mesh(new THREE.RingGeometry(.018,.028,24),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.4,side:THREE.DoubleSide}));
    rn.position.copy(pos);rn.lookAt(pos.clone().multiplyScalar(2));rn.userData={pulse:true};dg.add(rn);
    // Invisible larger hit target
    const hit=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({visible:false}));
    hit.position.copy(pos);hit.userData=co;hitTargets.add(hit);
  });

  // Commodities pole dots (North + South pole)
  const poleLats = [90, -90];
  poleLats.forEach(lat => {
    const pos = ll(lat, 0, 1.005);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.018, 12, 12), new THREE.MeshBasicMaterial({color:0xe8a838}));
    dot.position.copy(pos); dg.add(dot);
    const rn = new THREE.Mesh(new THREE.RingGeometry(.022, .035, 24), new THREE.MeshBasicMaterial({color:0xe8a838, transparent:true, opacity:.5, side:THREE.DoubleSide}));
    rn.position.copy(pos); rn.lookAt(pos.clone().multiplyScalar(2)); rn.userData = {pulse:true}; dg.add(rn);
    const hit = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshBasicMaterial({visible:false}));
    hit.position.copy(pos); hit.userData = {commodity:true, lat:lat}; hitTargets.add(hit);
  });

  scene.add(dg);scene.add(hitTargets);

  // Drag vs click detection
  let rY=0,rX=.1,drag=false,pv={x:0,y:0},dragDist=0,camZ=2.8;
  c.addEventListener('mousedown',e=>{drag=true;dragDist=0;pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-pv.x,dy=e.clientY-pv.y;dragDist+=Math.abs(dx)+Math.abs(dy);rY+=dx*.005;rX=Math.max(-1.2,Math.min(1.2,rX+dy*.005));pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>{drag=false;});

  // ── Touch support (mobile) ──
  let touchId=null,lastPinchDist=0;
  c.addEventListener('touchstart',e=>{
    if(e.touches.length===1){
      drag=true;dragDist=0;
      const t=e.touches[0];
      touchId=t.identifier;
      pv={x:t.clientX,y:t.clientY};
    }else if(e.touches.length===2){
      drag=false;
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      lastPinchDist=Math.sqrt(dx*dx+dy*dy);
    }
  },{passive:true});
  c.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&drag){
      const t=e.touches[0];
      const dx=t.clientX-pv.x,dy=t.clientY-pv.y;
      dragDist+=Math.abs(dx)+Math.abs(dy);
      rY+=dx*.005;rX=Math.max(-1.2,Math.min(1.2,rX+dy*.005));
      pv={x:t.clientX,y:t.clientY};
    }else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(lastPinchDist>0){
        const delta=(lastPinchDist-dist)*.01;
        camZ=Math.max(1.8,Math.min(5,camZ+delta));
        cam.position.z=camZ;
      }
      lastPinchDist=dist;
    }
  },{passive:false});
  c.addEventListener('touchend',e=>{
    if(e.touches.length===0){
      if(drag&&dragDist<12){
        // Tap - treat as click for country selection
        const t=e.changedTouches[0];
        const label=document.elementFromPoint(t.clientX,t.clientY);
        const cl=label&&label.closest?label.closest('.country-label'):null;
        const pl=label&&label.closest?label.closest('.pole-label'):null;
        if(pl){
          showCommoditiesCard();
        }else if(cl){
          const co=countries.find(x=>x.code===cl.dataset.code);
          if(co) showCard(co);
        }else{
          const r=c.getBoundingClientRect();
          ms.x=((t.clientX-r.left)/r.width)*2-1;
          ms.y=-((t.clientY-r.top)/r.height)*2+1;
          ray.setFromCamera(ms,cam);
          const hits=ray.intersectObjects(hitTargets.children);
          if(hits.length>0){
            if(hits[0].object.userData.commodity) showCommoditiesCard();
            else if(hits[0].object.userData.code) showCard(hits[0].object.userData);
          }
        }
      }
      drag=false;touchId=null;lastPinchDist=0;
    }else if(e.touches.length===1){
      // Went from pinch back to single finger
      drag=true;dragDist=0;
      const t=e.touches[0];
      pv={x:t.clientX,y:t.clientY};
      lastPinchDist=0;
    }
  },{passive:true});

  // Scroll to zoom
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    camZ=Math.max(1.8,Math.min(5,camZ+e.deltaY*.003));
    cam.position.z=camZ;
  },{passive:false});

  // Click only if not dragged
  const ray=new THREE.Raycaster(),ms=new THREE.Vector2();
  c.addEventListener('click',e=>{
    if(dragDist>5) return; // was a drag, not a click
    // Check if a pole (commodities) label was clicked
    const poleLabel=e.target.closest('.pole-label');
    if(poleLabel){ showCommoditiesCard(); return; }
    // Check if a country label was clicked (event delegation)
    const label=e.target.closest('.country-label');
    if(label){
      const co=countries.find(x=>x.code===label.dataset.code);
      if(co) showCard(co);
      return;
    }
    const r=c.getBoundingClientRect();
    ms.x=((e.clientX-r.left)/r.width)*2-1;
    ms.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ms,cam);
    const hits=ray.intersectObjects(hitTargets.children);
    if(hits.length>0){
      if(hits[0].object.userData.commodity) showCommoditiesCard();
      else if(hits[0].object.userData.code) showCard(hits[0].object.userData);
    }
  });

  // ── Create labels ONCE, reuse every frame ──
  const countryLabels=countries.map(co=>{
    const el=document.createElement('div');el.className='country-label';
    el.dataset.code=co.code;
    el.innerHTML=`<span class="flag">${co.flag}</span>${co.code}`;
    el.style.transform='translate(-50%,0)';
    el.addEventListener('click',e=>{e.stopPropagation();if(dragDist>5)return;showCard(co);});
    c.appendChild(el);
    return {el,co};
  });
  const poleLabels=[90,-90].map(lat=>{
    const el=document.createElement('div');el.className='pole-label';
    el.innerHTML='🛢️ COMM';
    el.style.transform='translate(-50%,0)';
    el.addEventListener('click',e=>{e.stopPropagation();if(dragDist>5)return;showCommoditiesCard();});
    c.appendChild(el);
    return {el,lat};
  });

  let t=0;
  (function anim(){requestAnimationFrame(anim);t+=.01;
    gm.rotation.set(rX,rY,0);dg.rotation.set(rX,rY,0);hitTargets.rotation.set(rX,rY,0);
    scene.children.forEach(ch=>{if(ch.isLine)ch.rotation.set(rX,rY,0);if(ch!==gm&&ch!==dg&&ch!==hitTargets&&ch.geometry&&(ch.material.wireframe||ch.material.side===THREE.BackSide||ch.geometry.type==='SphereGeometry'))ch.rotation.set(rX,rY,0);});
    dg.children.forEach(ch=>{if(ch.userData.pulse){const s=1+.3*Math.sin(t*3+ch.position.x*10);ch.scale.set(s,s,s);ch.material.opacity=.3+.2*Math.sin(t*3+ch.position.x*10);}});
    // Update label positions (labels persist in DOM — no remove/recreate)
    const rc=c.getBoundingClientRect();
    countryLabels.forEach(({el,co})=>{
      const p=ll(co.lat,co.lon,1.005);
      p.applyEuler(new THREE.Euler(rX,rY,0,'XYZ'));
      if(p.z<0.15){el.style.display='none';return;}
      el.style.display='';
      const pr=p.clone().project(cam);
      const x=(pr.x*.5+.5)*rc.width, y=(-pr.y*.5+.5)*rc.height;
      el.style.left=x+'px';el.style.top=(y+16)+'px';
    });
    poleLabels.forEach(({el,lat})=>{
      const p=ll(lat,0,1.005);
      p.applyEuler(new THREE.Euler(rX,rY,0,'XYZ'));
      if(p.z<0.15){el.style.display='none';return;}
      el.style.display='';
      const pr=p.clone().project(cam);
      const x=(pr.x*.5+.5)*rc.width, y=(-pr.y*.5+.5)*rc.height;
      el.style.left=x+'px';el.style.top=(y+16)+'px';
    });
    ren.render(scene,cam);
  })();
  window.addEventListener('resize',()=>{const w=c.clientWidth,h=c.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));});
}
function ll(lat,lon,r){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));}

function gdpWeatherClass(v) {
  if (v === null || v === undefined) return 'cloudy';
  if (v >= 3) return 'sunny';
  if (v >= 0) return 'cloudy';
  return 'stormy';
}

// ── WEATHER TABLE STATE ──
const GDP_NOMINAL_ORDER = ['USA','CHN','DEU','JPN','IND','GBR','FRA','ITA','CAN','BRA','RUS','ZAF'];
let _whSortCol = -1;     // -1 = nominal GDP order; 0=country, 1-7=year cols
let _whSortAsc = false;
let _whMetric  = 'GDP Growth';
let _whAsOfStr = '';
let _whDropOpen = false;

// Short display names for ranked/grid tables
const DISPLAY_NAMES = {'United Kingdom':'UK','United States':'USA'};

// Metrics available in the picker: weather-grid macro metrics + ranked market metrics
const METRIC_CONFIG = {
  'GDP Growth':       { group:'Macro',   hasGrid:true,  data:()=>gdpAllCountries,    wFn:()=>gdpWeather,    unit:'%', sign:true  },
  'Inflation (CPI)':  { group:'Macro',   hasGrid:true,  data:()=>cpiAllCountries,    wFn:()=>cpiWeather,    unit:'%', sign:false },
  'Unemployment':     { group:'Macro',   hasGrid:true,  data:()=>unempAllCountries,  wFn:()=>unempWeather,  unit:'%', sign:false },
  'Budget Deficit':   { group:'Macro',   hasGrid:true,  data:()=>budgetAllCountries, wFn:()=>budgetWeather, unit:'%', sign:true  },
  'Current Account':  { group:'Macro',   hasGrid:true,  data:()=>caAllCountries,     wFn:()=>caWeather,     unit:'%', sign:true  },
  'Policy Rate':      { group:'Macro',   hasGrid:false, unit:'%',   sign:false },
  'Stock Market YTD': { group:'Markets', hasGrid:false, unit:'%',   sign:true  },
  '10Y Bond Yield':   { group:'Markets', hasGrid:false, unit:'%',   sign:false },
  'Yield Curve':      { group:'Markets', hasGrid:false, unit:' bps',sign:true  },
};

// Shared hover tip element (created once, reused)
const _whTip = (function() {
  const el = document.createElement('div');
  el.id = 'wh-hover-tip';
  document.body.appendChild(el);
  return el;
})();

function buildRankingsView(generatedDate) {
  const view = document.getElementById('rankings-view');
  if (!view) return;

  _whAsOfStr = generatedDate
    ? new Date(generatedDate).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})
    : '';

  view.innerHTML = `<div class="rk-news-icons">
    <div class="news-icon hot" data-idx="0"><span class="ni-emoji">🔥</span><span class="ni-label">Today's Story</span></div>
    <div class="news-icon movers" data-idx="1"><span class="ni-emoji">⚡</span><span class="ni-label">Biggest Movers</span></div>
    <div class="news-icon connection" data-idx="2"><span class="ni-emoji">💡</span><span class="ni-label">The Connection</span></div>
  </div><div class="wh-wrap" id="whWrap"></div>`;

  view.querySelectorAll('.news-icon').forEach(el => {
    el.addEventListener('click', () => { closeAll(); showNewsTooltip(+el.dataset.idx); });
  });

  renderMetricTable();

  // Logo click → reset to GDP Growth home state
  const logo = document.querySelector('.logo');
  if (logo && !logo._homeWired) {
    logo._homeWired = true;
    logo.style.cursor = 'pointer';
    logo.addEventListener('click', () => {
      _whMetric = 'GDP Growth';
      _whSortCol = -1;
      switchToRankings();
      renderMetricTable();
    });
  }
}

function renderMetricTable() {
  const wrap = document.getElementById('whWrap');
  if (!wrap) return;

  const cfg = METRIC_CONFIG[_whMetric];

  // ── Title with metric picker button ──
  const titleHTML = `<div class="wh-title">
    <button class="wh-metric-btn" id="whMetricBtn">
      <span id="whMetricLabel">${_whMetric}</span>
      <span class="wh-metric-arrow">▾</span>
    </button>
  </div>`;

  if (cfg && cfg.hasGrid) {
    renderGridTable(wrap, cfg, titleHTML);
  } else {
    renderRankedTable(wrap, cfg, titleHTML);
  }

  // Wire metric picker after render
  const btn = document.getElementById('whMetricBtn');
  if (btn) {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      toggleMetricDropdown(btn);
    });
  }
}

function renderGridTable(wrap, cfg, titleHTML) {
  const colLabels = (histAnnualLabels && histAnnualLabels.length >= 7)
    ? histAnnualLabels.slice(-7)
    : ['2020','2021','2022','2023','2024','2025','2026F'];

  const dataObj = cfg.data();
  const wFn     = cfg.wFn();

  // Build rows with pre-parsed numeric values for sorting
  const rows = countries.map(co => {
    const d    = dataObj[co.code];
    const vals = (d && d.v && d.v.length >= 7) ? d.v.slice(-7) : Array(7).fill(null);
    return {co, vals};
  });

  const sorted = rows.slice().sort((a, b) => {
    if (_whSortCol === -1) {
      const ai = GDP_NOMINAL_ORDER.indexOf(a.co.code);
      const bi = GDP_NOMINAL_ORDER.indexOf(b.co.code);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    }
    if (_whSortCol === 0) {
      const dir = _whSortAsc ? 1 : -1;
      return dir * a.co.name.localeCompare(b.co.name);
    }
    const av = a.vals[_whSortCol - 1], bv = b.vals[_whSortCol - 1];
    if (av === null && bv === null) return 0;
    if (av === null) return 1; if (bv === null) return -1;
    return _whSortAsc ? av - bv : bv - av;
  });

  function arrow(colIdx) {
    if (_whSortCol !== colIdx) return '<span class="wh-sort-arrow">\u2195</span>';
    return `<span class="wh-sort-arrow active">${_whSortAsc ? '\u2191' : '\u2193'}</span>`;
  }

  const thCols = colLabels.map((lbl, i) => {
    const isFc  = String(lbl).includes('F');
    const isOld = i < 2;
    return `<th class="wh-sortable${isFc ? ' wh-fc' : ''}${isOld ? ' wh-col-old' : ''}" data-col="${i+1}">${lbl}${arrow(i+1)}</th>`;
  }).join('');

  const bodyRows = sorted.map(({co, vals}) => {
    const cells = colLabels.map((lbl, i) => {
      const v     = vals[i];
      const w     = wFn(v !== null ? v : 0);
      const cls   = w.cls === 'storm' ? 'stormy' : w.cls;
      const emoji = cls === 'sunny' ? '☀️' : cls === 'stormy' ? '⛈️' : '☁️';
      const isFc  = String(lbl).includes('F');
      const isOld = i < 2;
      const sign  = (cfg.sign && v !== null && v > 0) ? '+' : '';
      const tipVal = v !== null ? `${sign}${v}${cfg.unit}` : '';
      return `<td class="wh-cell${isFc ? ' wh-fc-col' : ''}${isOld ? ' wh-col-old' : ''}" data-val="${tipVal}" data-country="${co.name}"><span class="wh-icon ${cls}">${emoji}</span></td>`;
    }).join('');
    return `<tr data-code="${co.code}"><td class="wh-country-cell"><div class="wh-country-inner"><span class="wh-flag">${co.flag}</span><span class="wh-name">${DISPLAY_NAMES[co.name]||co.name}</span><span class="wh-code">${co.code}</span></div></td>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `${titleHTML}
    <table class="wh-table">
      <thead><tr>
        <th class="wh-country-hd wh-sortable" data-col="0">Countries${arrow(0)}</th>
        ${thCols}
      </tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>`;

  attachTableEvents(wrap);
}


function renderRankedTable(wrap, cfg, titleHTML) {
  const isStockYtd = (_whMetric === 'Stock Market YTD');
  const sortCol    = (isStockYtd && _whSortCol === 2) ? 2 : 1;

  function getLocalVal(co) {
    if (!co.metrics) return null;
    const macro  = co.metrics.macro  || {};
    const market = co.metrics.market || {};
    const MACRO_METRICS = new Set(['GDP Growth','Inflation (CPI)','Unemployment','Budget Deficit','Current Account','Policy Rate']);
    if (MACRO_METRICS.has(_whMetric)) {
      const v = macro[_whMetric];
      return (v !== undefined) ? v : null;
    }
    let v = market[_whMetric];
    if (v === undefined) {
      const k = Object.keys(market).find(k2 => k2 === _whMetric);
      v = k ? market[k] : undefined;
    }
    return (v !== undefined) ? v : null;
  }

  function parseVal(s) {
    if (s === null || s === undefined) return null;
    const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? null : n;
  }

  function fmtPct(num) {
    return num !== null ? (num > 0 ? '+' : '') + num + '%' : null;
  }

  const rows = countries.map(co => {
    if (isStockYtd) {
      const num1 = parseVal(getLocalVal(co));
      const usdRaw = co.metrics && co.metrics.market && co.metrics.market['Stock Market YTD (USD)'];
      const num2 = (usdRaw != null) ? parseVal(usdRaw) : null;
      return {co, num1, num2};
    }
    const raw = getLocalVal(co);
    return {co, raw, num: parseVal(raw)};
  }).filter(r => isStockYtd ? r.num1 != null : (r.raw != null && r.raw !== ''))
    .sort((a, b) => {
      if (_whSortCol === -1) {
        const ai = GDP_NOMINAL_ORDER.indexOf(a.co.code);
        const bi = GDP_NOMINAL_ORDER.indexOf(b.co.code);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      }
      if (sortCol === 0) {
        const dir = _whSortAsc ? 1 : -1;
        return dir * a.co.name.localeCompare(b.co.name);
      }
      const av = isStockYtd ? (sortCol === 2 ? a.num2 : a.num1) : a.num;
      const bv = isStockYtd ? (sortCol === 2 ? b.num2 : b.num1) : b.num;
      if (av === null && bv === null) return 0;
      if (av === null) return 1; if (bv === null) return -1;
      return _whSortAsc ? av - bv : bv - av;
    });

  function arrow(col) {
    if (sortCol !== col) return '<span class="wh-sort-arrow">\u2195</span>';
    return `<span class="wh-sort-arrow active">${_whSortAsc ? '\u2191' : '\u2193'}</span>`;
  }

  const bodyRows = rows.map(({co, raw, num, num1, num2}) => {
    const dispName = DISPLAY_NAMES[co.name] || co.name;
    if (isStockYtd) {
      const cls1  = num1 === null ? '' : num1 > 0 ? 'positive' : num1 < 0 ? 'negative' : '';
      const cls2  = num2 === null ? '' : num2 > 0 ? 'positive' : num2 < 0 ? 'negative' : '';
      const disp1 = fmtPct(num1) || '—';
      const disp2 = fmtPct(num2) || '—';
      return `<tr data-code="${co.code}">
        <td class="wh-country-cell"><div class="wh-country-inner"><span class="wh-flag">${co.flag}</span><span class="wh-name">${dispName}</span><span class="wh-code">${co.code}</span></div></td>
        <td class="wh-rank-val${sortCol===1?' wh-fc':''}"><span class="wh-rank-num ${cls1}">${disp1}</span></td>
        <td class="wh-rank-val${sortCol===2?' wh-fc':''}"><span class="wh-rank-num ${cls2}">${disp2}</span></td>
      </tr>`;
    }
    const sign   = (cfg && cfg.sign && num !== null && num > 0) ? '+' : '';
    const valCls = num === null ? '' : num > 0 ? 'positive' : num < 0 ? 'negative' : '';
    const disp   = num !== null ? `${sign}${num}${cfg.unit || ''}` : '—';
    return `<tr data-code="${co.code}">
      <td class="wh-country-cell"><div class="wh-country-inner"><span class="wh-flag">${co.flag}</span><span class="wh-name">${dispName}</span><span class="wh-code">${co.code}</span></div></td>
      <td class="wh-cell wh-rank-val"><span class="wh-rank-num ${valCls}">${disp}</span></td>
    </tr>`;
  }).join('');

  const thead = isStockYtd
    ? `<th class="wh-country-hd wh-sortable" data-col="0">Countries${arrow(0)}</th>

function attachTableEvents(wrap) {
