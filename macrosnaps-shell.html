    });
  });

  // Row click - open country card
  wrap.querySelectorAll('tr[data-code]').forEach(row => {
    row.addEventListener('click', () => {
      const co = countries.find(c => c.code === row.dataset.code);
      if (co) showCard(co);
    });
  });

  // Cell hover tip
  wrap.querySelectorAll('.wh-cell[data-val]').forEach(cell => {
    cell.addEventListener('mouseenter', e => {
      const val = cell.dataset.val;
      if (!val) return;
      _whTip.textContent = val;
      _whTip.style.display = 'block';
      positionTip(e);
    });
    cell.addEventListener('mousemove', positionTip);
    cell.addEventListener('mouseleave', () => { _whTip.style.display = 'none'; });

    cell.addEventListener('click', e => { e.stopPropagation(); const row = cell.closest('tr[data-code]'); if(row){const co=countries.find(c=>c.code===row.dataset.code);if(co)showCard(co);} });
  });
}

function positionTip(e) {
  const x = e.clientX, y = e.clientY;
  const tw = _whTip.offsetWidth || 60;
  const th = _whTip.offsetHeight || 24;
  let left = x + 12, top = y - th - 8;
  if (left + tw > window.innerWidth - 8) left = x - tw - 12;
  if (top < 8) top = y + 16;
  _whTip.style.left = left + 'px';
  _whTip.style.top  = top + 'px';
}

function toggleMetricDropdown(anchorBtn) {
  const existing = document.getElementById('whMetricDrop');
  if (existing) { existing.remove(); _whDropOpen = false; return; }

  _whDropOpen = true;
  const drop = document.createElement('div');
  drop.id = 'whMetricDrop';
  drop.className = 'wh-metric-dropdown';

  const groups = {};
  Object.entries(METRIC_CONFIG).forEach(([name, cfg]) => {
    if (!groups[cfg.group]) groups[cfg.group] = [];
    groups[cfg.group].push(name);
  });

  let html = '';
  Object.entries(groups).forEach(([grp, names]) => {
    html += `<div class="wh-metric-group">${grp}</div>`;
    names.forEach(name => {
      html += `<div class="wh-metric-item${name === _whMetric ? ' active' : ''}" data-metric="${name}">${name}</div>`;
    });
  });
  drop.innerHTML = html;

  document.body.appendChild(drop);

  // Position below the button
  const r = anchorBtn.getBoundingClientRect();
  let left = r.left;
  const dropW = 200;
  if (left + dropW > window.innerWidth - 8) left = window.innerWidth - dropW - 8;
  drop.style.left = left + 'px';
  drop.style.top  = (r.bottom + 6) + 'px';

  // Item click
  drop.querySelectorAll('.wh-metric-item').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      _whMetric  = item.dataset.metric;
      _whSortCol = -1;
      drop.remove(); _whDropOpen = false;
      renderMetricTable();
    });
  });

  // Click outside closes
  setTimeout(() => {
    document.addEventListener('click', function cl(e) {
      if (!drop.contains(e.target)) { drop.remove(); _whDropOpen = false; document.removeEventListener('click', cl); }
    });
  }, 10);
}

// ── COMMODITIES CARD (card-overlay style, triggered by pole dots) ──
function drawSparkline(canvas, data, color) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0, 0, w, h);
  if (!data || data.length < 2) return;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '30');
  grad.addColorStop(1, color + '00');
  ctx.beginPath();
  ctx.moveTo(0, h);
  data.forEach((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * h * 0.85 - h * 0.05;
    ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * h * 0.85 - h * 0.05;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  const lastX = (data.length - 1) * step;
  const lastY = h - ((data[data.length - 1] - min) / range) * h * 0.85 - h * 0.05;
  ctx.beginPath();
  ctx.arc(lastX, lastY, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function formatCommPrice(price) {
  if (price >= 1000) return price.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
  if (price >= 100) return price.toFixed(0);
  if (price >= 10) return price.toFixed(2);
  return price.toFixed(2);
}

function renderCommodityMonthlyChart(container, item, rangeMonths) {
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  const fh = item._frozen_historical;
  if (!fh || !fh.v || fh.v.length === 0) { container.innerHTML = '<div class="metric-chart-nodata">No historical data</div>'; return; }

  const totalLen = histMonthlyLabels.length;
  const rawVals = fh.v || [];
  const padded = totalLen > rawVals.length
    ? Array(totalLen - rawVals.length).fill(null).concat(rawVals)
    : rawVals.slice(rawVals.length - totalLen);
  const n = rangeMonths || totalLen;
  const sliceVals = padded.slice(-n);
  const sliceLabels = histMonthlyLabels.slice(-n);

  const validVals = sliceVals.filter(v => v !== null && v !== undefined);
  const mn = validVals.length ? Math.min(...validVals) : 0;
  const mx = validVals.length ? Math.max(...validVals) : 0;
  const range = mx - mn;
  const pad = range * 0.15 || (Math.abs(mx) * 0.1) || 1;

  container.innerHTML = '<canvas></canvas>';
  const canvas = container.querySelector('canvas');
  canvas.addEventListener('click', e => e.stopPropagation());
  const ctx = canvas.getContext('2d');

  const catColors = {energy: 'rgba(232,168,56,', metals: 'rgba(0,212,255,', agriculture: 'rgba(0,230,138,'};
  const baseColor = catColors[item.cat] || 'rgba(232,168,56,';

  const grad = ctx.createLinearGradient(0, 0, 0, 120);
  grad.addColorStop(0, baseColor + '.18)');
  grad.addColorStop(1, baseColor + '.01)');

  activeChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: sliceLabels,
      datasets: [{
        data: sliceVals,
        borderColor: baseColor + '.8)',
        backgroundColor: grad,
        borderWidth: 1.5,
        pointRadius: 0,
        pointHitRadius: 8,
        pointHoverRadius: 3,
        pointHoverBackgroundColor: '#fff',
        pointHoverBorderWidth: 1,
        tension: .3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      events: ['mousemove', 'mouseout', 'touchstart', 'touchmove'],
      layout: { padding: { left: 2, right: 2, top: 4, bottom: 0 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(8,12,24,.97)',
          titleFont: { family: "'Space Mono',monospace", size: 10 },
          bodyFont: { family: "'DM Sans',sans-serif", size: 12 },
          borderColor: 'rgba(255,255,255,.1)',
          borderWidth: 1,
          padding: 8,
          callbacks: {
            label: function(ctx) { return formatCommPrice(ctx.parsed.y) + ' ' + item.unit; }
          }
        }
      },
      scales: {
        x: {
          display: true,
          grid: { display: false },
          ticks: {
            font: { family: "'Space Mono',monospace", size: 8 },
            color: '#888',
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: n <= 12 ? 6 : n <= 24 ? 8 : 10
          },
          border: { display: false }
        },
        y: {
          display: true,
          position: 'right',
          min: mn - pad,
          max: mx + pad,
          ticks: { font: { family: "'Space Mono',monospace", size: 8 }, color: '#888', maxTicksLimit: 5 },
          grid: { color: 'rgba(255,255,255,.03)' },
          border: { display: false }
        }
      }
    }
  });
}

// ── CARD-TO-CARD NAVIGATION ──
function getCardOrder() {
  // Countries sorted alphabetically by name, then commodities at the end
  const sorted = countries.slice().sort((a, b) => a.name.localeCompare(b.name));
  // Append a sentinel for commodities
  sorted.push({ _commodity: true, name: 'Commodities' });
  return sorted;
}
function cardNavHTML() {
  return `<div class="card-nav"><button class="card-nav-btn" data-cdir="-1" title="Previous country">◀</button><button class="card-nav-btn" data-cdir="1" title="Next country">▶</button></div>`;
}
function attachCardNav(container, currentIdentifier) {
  const order = getCardOrder();
  const idx = currentIdentifier === '_commodity'
    ? order.findIndex(c => c._commodity)
    : order.findIndex(c => !c._commodity && c.code === currentIdentifier);
  container.querySelectorAll('.card-nav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const dir = parseInt(btn.dataset.cdir);
      const nextIdx = (idx + dir + order.length) % order.length;
      const next = order[nextIdx];
      if (next._commodity) {
        showCommoditiesCard();
      } else {
        showCard(next);
      }
    });
  });
}

// ── CARD ──
const CARD_MARKET_EXCLUDE = new Set(['Stock Market Index', 'FX Rate', 'Stock Market YTD (USD)']);
let activeCardCountry = null;
function assembleCardData(co) {
  const stories = (cardStories[currentLevel] && cardStories[currentLevel][co.code]) || ['Data loading...'];
  const weatherClass = co.weather === '☀️' ? 'sunny' : co.weather === '☁️' ? 'cloudy' : co.weather === '⛈️' ? 'stormy' : '';
  const macro = (co.metrics && co.metrics.macro) || {};
  const market = (co.metrics && co.metrics.market) || {};
  const macroMetrics = Object.entries(macro).map(([k, v]) => ({name: k, val: v, section: 'macro'}));
  const marketMetrics = Object.entries(market).filter(([k]) => !CARD_MARKET_EXCLUDE.has(k)).map(([k, v]) => ({name: k, val: v, section: 'market'}));
  return {
    code: co.code || '', name: co.name || 'Unknown', flag: co.flag || '',
    weather: co.weather || '', weatherClass, stories, macroMetrics, marketMetrics
  };
}

const STRIP_WEATHER_FN = {
  'GDP Growth':      v => gdpWeather(v),
  'Inflation (CPI)': v => cpiWeather(v),
  'Unemployment':    v => unempWeather(v),
  'Budget Deficit':  v => budgetWeather(v),
  'Current Account': v => caWeather(v)
};
const STRIP_DATA_FN = {
  'GDP Growth':      () => gdpAllCountries,
  'Inflation (CPI)': () => cpiAllCountries,
  'Unemployment':    () => unempAllCountries,
  'Budget Deficit':  () => budgetAllCountries,
  'Current Account': () => caAllCountries
};

function metricWeatherStrip(metricName, countryCode) {
  const wFn   = STRIP_WEATHER_FN[metricName];
  const dFn   = STRIP_DATA_FN[metricName];
  if (!wFn || !dFn) return '';
  const dataObj = dFn();
  const entry   = dataObj && dataObj[countryCode];
  if (!entry || !entry.v || entry.v.length < 2) return '';
  const allVals   = entry.v;
  const allLabels = (histAnnualLabels && histAnnualLabels.length) ? histAnnualLabels : [];
  const n      = Math.min(7, allVals.length);
  const vals   = allVals.slice(-n);
  const labels = allLabels.slice(-n);
  const cfg    = METRIC_CONFIG[metricName];
  const unit   = (cfg && cfg.unit) || '';
  const sign   = (cfg && cfg.sign);
  const icons  = vals.map((v, i) => {
    const lbl    = labels[i] || '';
    const isFc   = String(lbl).includes('F');
    const w      = v !== null ? wFn(v) : null;
    const cls    = w ? (w.cls === 'storm' ? 'stormy' : w.cls) : 'cloudy';
    const dispV  = v !== null ? ((sign && v > 0 ? '+' : '') + v + unit) : '—';
    const tip    = lbl ? `${lbl} · ${dispV}` : dispV;
    const emoji  = cls === 'sunny' ? '☀️' : cls === 'stormy' ? '⛈️' : '☁️';
    return `<span class="m-si${isFc ? ' m-si-fc' : ''}" data-tip="${tip}" data-yr="${lbl}" data-val="${dispV}"><span class="wh-icon ${cls}">${emoji}</span></span>`;
  }).join('');
  return `<div class="m-strip" data-strip="1">${icons}</div>`;
}

function renderCard(d, co) {
  let mH = '', mkH = '';
  d.macroMetrics.forEach(m => { const label = metricDisplayLabels[m.name] || m.name; const strip = metricWeatherStrip(m.name, d.code); mH += `<div class="metric" data-m="${m.name}" data-v="${m.val}" data-c="${d.name}" data-s="macro"><div class="m-name">${label}</div><div class="m-val-row"><div class="m-val">${m.val}</div>${strip}</div></div>`; });
  d.marketMetrics.forEach(m => { const label = metricDisplayLabels[m.name] || m.name; mkH += `<div class="metric" data-m="${m.name}" data-v="${m.val}" data-c="${d.name}" data-s="market"><div class="m-name">${label}</div><div class="m-val">${m.val}</div></div>`; });

  const macroSection = d.macroMetrics.length > 0 ? `<div class="sec-head">MACRO FORECASTS (2026)</div><div class="metrics">${mH}</div>` : '';
  const marketSection = d.marketMetrics.length > 0 ? `<div class="sec-head">MARKETS</div><div class="metrics mkt">${mkH}</div>` : '';

  const o = document.createElement('div'); o.className = 'card-overlay';
  o.innerHTML = `<div class="country-card"><div class="card-close" onclick="this.closest('.card-overlay').remove()">✕</div>${levelToggleHTML()}<div class="card-head"><span class="c-flag">${d.flag}</span><span class="c-name">${d.name}</span>${cardNavHTML()}</div><div class="weather-sec"><div class="w-icon ${d.weatherClass}">${d.weather}</div><ul class="c-stories">${d.stories.map(s => `<li>${applyGlossary(s)}</li>`).join('')}</ul></div>${macroSection}${marketSection}</div>`;
  document.body.appendChild(o);
  o.addEventListener('click', e => { if (e.target === o) o.remove(); });
  o.querySelectorAll('.metric').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.m-strip')) return;
      e.stopPropagation();
      showMTT(el.dataset.m, el.dataset.v, el.dataset.c, el.dataset.s);
    });
  });
  // Mobile: tap strip to show year/value overlay
  o.querySelectorAll('.m-strip').forEach(strip => {
    strip.addEventListener('click', e => {
      e.stopPropagation();
      const existing = strip.querySelector('.m-strip-tip');
      if (existing) { existing.remove(); return; }
      const items = [...strip.querySelectorAll('.m-si')].map(si =>
        `<div class="m-strip-tip-item"><span class="m-strip-tip-yr">${si.dataset.yr}</span><span class="m-strip-tip-val">${si.dataset.val}</span></div>`
      ).join('');
      const tip = document.createElement('div');
      tip.className = 'm-strip-tip';
      tip.innerHTML = items;
      strip.style.position = 'relative';
      strip.appendChild(tip);
      setTimeout(() => document.addEventListener('click', function h() { tip.remove(); document.removeEventListener('click', h); }), 0);
    });
  });
  attachCardNav(o, d.code);
  attachLevelToggle(o, () => { o.remove(); showCard(activeCardCountry); });
  attachGlossary(o);
}

function showCard(co) {
  if (!co) return;
  activeCardCountry = co;
  closeAll();
  const d = assembleCardData(co);
  renderCard(d, co);
}

// ── METRIC TOOLTIP ──
let activeMTT = null;
// ── METRIC NAVIGATION HELPER ──
function getMetricList(countryName){
  const co=countries.find(c=>c.name===countryName);
  if(!co || !co.metrics) return [];
  const macro = co.metrics.macro || {};
  const market = co.metrics.market || {};
  const macroKeys=Object.keys(macro).map(k=>({name:k,val:macro[k],sec:'macro'}));
  const mktKeys=Object.keys(market).filter(k=>!CARD_MARKET_EXCLUDE.has(k)).map(k=>({name:k,val:market[k],sec:'market'}));
  return macroKeys.concat(mktKeys);
}

function assembleMTTData(n, v, co, sec) {
  const code = getCountryCode(co);
  const metricList = getMetricList(co);
  const currentIndex = metricList.findIndex(m => m.name === n);

  // Explanation (level-sensitive) - single source of truth from glossary
  const gEntry = glossary[n] || (isFxMetric(n) ? glossary['Exchange Rate'] : null);
  const levelContent = gEntry ? (gEntry[currentLevel] || gEntry.beginner) : null;
  const bluf = levelContent ? getBluf(levelContent) : null;
  const full = levelContent ? getFull(levelContent) : null;

  // Source
  const source = isFxMetric(n) ? fxSource : (metricSources[n] || null);

  // FX regime
  let fxRegimeInfo = null;
  if (isFxMetric(n) && code && fxRegime[code]) {
    const regimeDesc = fxRegime[code][currentLevel] || fxRegime[code].beginner || null;
    if (regimeDesc) {
      fxRegimeInfo = { description: regimeDesc, countryName: co };
    }
  }

  // Historical data
  const histEntry = (code && historicalData[code] && historicalData[code][n]) || null;
  let chart = null;
  if (histEntry) {
    const isAnnual = histEntry.type === 'bar';
    chart = {
      isAnnual,
      title: isAnnual ? n + ' (Annual)' : 'History since 2000',
      code
    };
  }

  const msEntry = (code && metricStories[code]) ? metricStories[code][n] : null;
  const metricStory = msEntry ? (msEntry[currentLevel] || msEntry.beginner || null) : null;

  return {
    metricName: n, value: v, countryName: co, section: sec, code,
    bluf, full, source, fxRegimeInfo, chart,
    metricList, currentIndex, metricStory
  };
}

function renderMTT(d) {
  // Explanation HTML
  let exHTML = d.bluf || '';
  if (d.full) {
    exHTML += `<div class="ge-expand">Read more ›</div><div class="ge-full">${d.full}</div>`;
  }

  // FX regime HTML
  let regimeHTML = '';
  if (d.fxRegimeInfo) {
    regimeHTML = `<div class="tt-section"><div class="tt-label" style="color:#00d4ff">${d.fxRegimeInfo.countryName}'s FX Regime</div><div class="tt-story" style="margin-bottom:0;padding-bottom:0;border-bottom:none">${d.fxRegimeInfo.description}</div></div>`;
  }

  // Chart HTML
  let chartHTML = '';
  if (d.chart && hasChartData(d.metricName, d.chart.code)) {
    if (d.chart.isAnnual) {
      chartHTML = `<div class="metric-chart-wrap">
        <div class="metric-chart-head">
          <div class="metric-chart-title">${d.chart.title}</div>
        </div>
        <div class="metric-chart-canvas" id="mttChart"></div>
      </div>`;
    } else {
      chartHTML = `<div class="metric-chart-wrap">
        <div class="metric-chart-head">
          <div class="metric-chart-title">${d.chart.title}</div>
          <div class="metric-chart-range">
            <button class="mcr-btn" data-r="12">1Y</button>
            <button class="mcr-btn" data-r="24">2Y</button>
            <button class="mcr-btn" data-r="60">5Y</button>
            <button class="mcr-btn active" data-r="0">All</button>
          </div>
        </div>
        <div class="metric-chart-canvas" id="mttChart"></div>
      </div>`;
    }
  }

  // Metric story HTML
  let metricStoryHTML = '';
  if (d.metricStory) {
    metricStoryHTML = `<div class="tt-section tt-metric-story"><div class="tt-story" style="margin-bottom:0;padding-bottom:0;border-bottom:none">${d.metricStory}</div></div>`;
  }

  // Navigation arrows - only if metric list has entries
  const navHTML = d.metricList.length > 0 ? `<div class="tt-nav"><button class="tt-nav-btn" data-dir="up" title="Previous metric">▲</button><button class="tt-nav-btn" data-dir="down" title="Next metric">▼</button></div>` : '';

  const compareHTML = d.section === 'market' ? `<button class="compare-btn" data-metric="${d.metricName}" data-country="${d.countryName}" data-sec="${d.section}"><span class="cb-icon">⇅</span> Compare All Countries</button>` : '';
  const stripHTML = (d.section === 'macro' && d.code) ? metricWeatherStrip(d.metricName, d.code) : '';
  const headerSectionHTML = stripHTML
    ? `<div class="tt-section"><div class="tt-header-row"><div><div class="tt-label">${d.countryName}</div><div class="tt-value">${d.value}</div></div>${stripHTML}</div></div>`
    : `<div class="tt-section"><div class="tt-label">${d.countryName}</div><div class="tt-value">${d.value}</div></div>`;

  const tt = document.createElement('div'); tt.className = 'tooltip';
  const innerContent = applyGlossary(`${navHTML}<div class="tt-close">✕</div>${levelToggleHTML()}<div class="tt-title">${d.metricName}</div>${metricStoryHTML}${chartHTML}${exHTML ? `<div class="tt-story">${exHTML}</div>` : ''}${regimeHTML}${d.source ? `<div class="tt-source">Source: ${d.source}</div>` : ''}${compareHTML}`, d.metricName);
  tt.innerHTML = innerContent;
  tt.querySelector('.tt-title').insertAdjacentHTML('afterend', headerSectionHTML);
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active'); attachGlossary(tt);

  // Close
  tt.querySelector('.tt-close').addEventListener('click', e => { e.stopPropagation(); if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); });

  // Metric navigation
  tt.querySelectorAll('.tt-nav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (d.currentIndex < 0 || d.metricList.length === 0) return;
      const dir = btn.dataset.dir === 'up' ? -1 : 1;
      const nextIdx = (d.currentIndex + dir + d.metricList.length) % d.metricList.length;
      const next = d.metricList[nextIdx];
      if (activeChart) { activeChart.destroy(); activeChart = null; }
      tt.remove();
      showMTT(next.name, next.val, d.countryName, next.sec);
    });
  });

  // Render chart
  if (d.chart && hasChartData(d.metricName, d.chart.code)) {
    const chartContainer = tt.querySelector('#mttChart');
    renderMetricChart(chartContainer, d.metricName, d.chart.code, null);
    if (!d.chart.isAnnual) {
      tt.querySelectorAll('.mcr-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          tt.querySelectorAll('.mcr-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const r = parseInt(btn.dataset.r);
          renderMetricChart(chartContainer, d.metricName, d.chart.code, r);
        });
      });
    }
  }

  // Level toggle
  attachLevelToggle(tt, () => {
    const expanded = []; tt.querySelectorAll('.ge-full').forEach((el, i) => { if (el.classList.contains('open')) expanded.push(i); });
    if (activeChart) { activeChart.destroy(); activeChart = null; }
    tt.remove(); const m = activeMTT; showMTT(m.n, m.v, m.co, m.sec);
    const newTT = document.querySelector('.tooltip');
    if (newTT && expanded.length) { newTT.querySelectorAll('.ge-full').forEach((el, i) => { if (expanded.includes(i)) { el.classList.add('open'); const btn = el.previousElementSibling; if (btn && btn.classList.contains('ge-expand')) btn.textContent = 'Show less ‹'; } }); }
  });

  // Compare button (market metrics only)
  const compareBtn = tt.querySelector('.compare-btn');
  if (compareBtn) compareBtn.addEventListener('click', e => { e.stopPropagation(); if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); showCompare(d.metricName, d.countryName, d.section); });

  // Read more toggles
  tt.querySelectorAll('.ge-expand').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const fullEl = btn.nextElementSibling;
      const isOpen = fullEl.classList.contains('open');
      fullEl.classList.toggle('open');
      btn.textContent = isOpen ? 'Read more ›' : 'Show less ‹';
    });
  });

  // Outside click close
  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showMTT(n, v, co, sec) {
  activeMTT = {n, v, co, sec};
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const d = assembleMTTData(n, v, co, sec);
  renderMTT(d);
}


function gdpWeather(v){
  if(v>=3) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v>=0) return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
  return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
}

function assembleWeatherGrid(metric) {
  const codes = ['USA','CAN','GBR','JPN','DEU','FRA','ITA','CHN','IND'];
  const isGDP = metric === 'gdp';
  const isCPI = metric === 'cpi';
  const isUnemp = metric === 'unemp';
  const isBudget = metric === 'budget';
  const isCA = metric === 'ca';
  const dataSource = isGDP ? gdpAllCountries : isCPI ? cpiAllCountries : isUnemp ? unempAllCountries : isBudget ? budgetAllCountries : caAllCountries;
  const weatherFn = isGDP ? gdpWeather : isCPI ? cpiWeather : isUnemp ? unempWeather : isBudget ? budgetWeather : caWeather;
  const title = isGDP ? 'GDP Growth · Weather Map' : isCPI ? 'Inflation (CPI) · Weather Map' : isUnemp ? 'Unemployment · Weather Map' : isBudget ? 'Budget Deficit · Weather Map' : 'Current Account · Weather Map';
  const subtitle = isGDP ? 'All Countries · 2020-2026F' : isCPI ? 'All Countries · 2020-2026F · Target ~2%' : isUnemp ? 'All Countries · 2020-2026F · Lower is better' : isBudget ? 'All Countries · 2020-2026F · % of GDP' : 'All Countries · 2020-2026F · % of GDP';
  const legend = isGDP
    ? [{icon:'wi-sun', emoji:'☀️', label:'≥3%'}, {icon:'wi-cloud', emoji:'☁️', label:'0-3%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;0%'}]
    : isCPI
    ? [{icon:'wi-sun', emoji:'☀️', label:'1-3%'}, {icon:'wi-cloud', emoji:'☁️', label:'0-1% / 3-5%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;0% / &gt;5%'}]
    : isUnemp
    ? [{icon:'wi-sun', emoji:'☀️', label:'&lt;5%'}, {icon:'wi-cloud', emoji:'☁️', label:'5-8%'}, {icon:'wi-storm', emoji:'☁️', label:'&gt;8%'}]
    : isBudget
    ? [{icon:'wi-sun', emoji:'☀️', label:'&gt;-3%'}, {icon:'wi-cloud', emoji:'☁️', label:'-3% to -5%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;-5%'}]
    : [{icon:'wi-sun', emoji:'☀️', label:'&gt;0%'}, {icon:'wi-cloud', emoji:'☁️', label:'-3% to 0%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;-3%'}];
  const showSign = isGDP || isBudget || isCA;

  const years = gdpYears || [];
  const rows = codes.map(code => {
    const d = dataSource[code];
    if (!d || !d.v || !Array.isArray(d.v)) return null;
    const cells = d.v.map(v => {
      const w = weatherFn(v);
      const sign = (showSign && v > 0) ? '+' : '';
      return {cls: w.cls, icon: w.icon, label: `${sign}${v}%`};
    });
    return {code, flag: d.flag || '', cells};
  }).filter(Boolean);

  return {title, subtitle, legend, years, rows};
}

function renderWeatherGrid(d) {
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();

  if (!d || !d.rows || d.rows.length === 0 || !d.years || d.years.length === 0) {
    const tt = document.createElement('div'); tt.className = 'tooltip';
    tt.style.maxWidth = '520px';
    tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
      <div class="tt-title">${(d && d.title) || 'Weather Map'}</div>

    setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
    return;
  }

  let headerHTML = `<th></th>`;
  d.years.forEach((y, i) => {
    const cls = i === d.years.length - 1 ? ' class="forecast"' : '';
    headerHTML += `<th${cls}>${y}</th>`;
  });

  let bodyHTML = '';
  d.rows.forEach(r => {
    let cells = `<td><div class="wg-country"><span class="wg-flag">${r.flag}</span><span class="wg-code">${r.code}</span></div></td>`;

    });

  let legendHTML = d.legend.map(l => `<div class="wg-legend-item"><span class="wi ${l.icon}" style="font-size:14px;width:18px;height:18px">${l.emoji}</span> ${l.label}</div>`).join('');

  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.style.maxWidth = '520px';
  tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
    <div class="tt-title">${d.title}</div>
    <div style="font-size:10px;color:#999;margin-bottom:8px;font-family:var(--font-display);letter-spacing:1px;text-transform:uppercase">${d.subtitle}</div>
    <div class="wg-table-wrap"><table class="wg-table"><thead><tr>${headerHTML}</tr></thead><tbody>${bodyHTML}</tbody></table></div>
    <div class="wg-legend">${legendHTML}</div>`;
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active');
  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showWeatherGDP() {
  const d = assembleWeatherGrid('gdp');
  renderWeatherGrid(d);
}


function cpiWeather(v){
  // Sunny = near 2% target (1-3%), Cloudy = off target, Stormy = far off (>5% or <0%)
  if(v>=1&&v<=3) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v<0||v>5) return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
  return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
}

function showWeatherCPI() {
  const d = assembleWeatherGrid('cpi');
  renderWeatherGrid(d);
}

function unempWeather(v){
  // Sunny = tight labor market (<5%), Cloudy = elevated (5-8%), Stormy = distress (>8%)
  if(v<5) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v>8) return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
  return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
}

function showWeatherUnemp() {
  const d = assembleWeatherGrid('unemp');
  renderWeatherGrid(d);
}

function budgetWeather(v){
  // Sunny = manageable (>-3%), Cloudy = elevated (-3% to -5%), Stormy = stressed (<-5%)
  if(v>-3) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v<-5) return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
  return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
}

function showWeatherBudget() {
  const d = assembleWeatherGrid('budget');
  renderWeatherGrid(d);
}

function caWeather(v){
  // Sunny = surplus (>0%), Cloudy = mild deficit (-3% to 0%), Stormy = significant deficit (<-3%)
  if(v>0) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v<-3) return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
  return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
}

function showWeatherCA() {
  const d = assembleWeatherGrid('ca');
  renderWeatherGrid(d);
}

// ── COMPARE VIEW ──
function parseNum(s){ const n=parseFloat(String(s).replace(/[^-\d.]/g,'')); return isNaN(n)?null:n; }
function assembleCompareData(metricName, highlightCountry, sec) {
  const isFx = isFxMetric(metricName);
  const rows = [];
  countries.forEach(co => {
    if (!co.metrics) return;
    const pool = sec === 'macro' ? (co.metrics.macro || {}) : (co.metrics.market || {});
    let val = pool[metricName], fxKey = metricName;
    if (val === undefined && sec === 'market') {
      const keys = Object.keys(pool);
      fxKey = keys.find(k => k.includes('/'));
      if (fxKey) val = pool[fxKey];
    }
    if (val !== undefined) {
      const regime = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code][currentLevel] || fxRegime[co.code].beginner : null;
      const regimeLabel = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code].label : null;
      rows.push({code: co.code, name: co.name, flag: co.flag, val, num: parseNum(val), fxKey: fxKey || metricName, regime, regimeLabel});
    }
  });
  rows.sort((a, b) => { if (a.num === null && b.num === null) return 0; if (a.num === null) return 1; if (b.num === null) return -1; return b.num - a.num; });
  const maxAbs = Math.max(...rows.filter(r => r.num !== null).map(r => Math.abs(r.num)), 0.01);
  const showRegimes = rows.some(r => r.regime);
  const hasWeatherBtn = metricName === 'GDP Growth' || metricName === 'Inflation (CPI)' || metricName === 'Unemployment' || metricName === 'Budget Deficit' || metricName === 'Current Account';
  return {metricName, highlightCountry, sec, rows, maxAbs, showRegimes, isFx, hasWeatherBtn};
}

function renderCompare(d) {
  if (!d.rows || d.rows.length === 0) {
    const tt = document.createElement('div'); tt.className = 'tooltip';
    tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
      <div class="tt-title">⇅ ${d.metricName || 'Compare'}</div>
      <div style="color:#999;padding:16px 0;font-size:13px">No country data available for this metric.</div>`;
    document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active');
    setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
    return;
  }

  function regimeClass(label) {
    if (!label) return '';
    const l = label.toLowerCase();
    if (l.includes('peg')) return 'peg';
    if (l.includes('euro')) return 'euro';
    if (l.includes('managed')) return 'managed';
    return 'free';
  }

  let rowsHTML = d.rows.map(r => {
    const isNeg = r.num < 0;
    const hl = r.name === d.highlightCountry ? ' highlight' : '';
    const regimeTag = (d.showRegimes && r.regimeLabel) ? `<span class="cr-regime ${regimeClass(r.regimeLabel)}" data-code="${r.code}">${r.regimeLabel}</span>` : '';
    return `<div class="compare-row${hl}">
      <span class="cr-flag">${r.flag}</span>
      <span class="cr-name">${r.code}</span>
      ${regimeTag}
      <span class="cr-bar-wrap"><span class="cr-bar ${isNeg ? 'negative' : 'positive'}" style="width:0%"></span></span>
      <span class="cr-val">${r.val}</span>
    </div>`;
  }).join('');

  const tt = document.createElement('div'); tt.className = 'tooltip';
  const weatherBtnHTML = d.hasWeatherBtn ? `<button class="weather-btn" id="weatherBtn"><span class="wb-icon"><span class="wi wi-sun" style="font-size:12px;width:14px;height:14px">☀️</span><span class="wi wi-cloud" style="font-size:12px;width:14px;height:14px">☁️</span><span class="wi wi-storm" style="font-size:12px;width:14px;height:14px">☁️</span></span> Over Time</button>` : '';
  tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
    <div class="tt-title">⇅ ${d.showRegimes ? 'Exchange Rates' : d.metricName}</div>
    <div style="font-size:10px;color:#999;margin-bottom:12px;font-family:var(--font-display);letter-spacing:1px;text-transform:uppercase">All Countries · Ranked</div>
    ${weatherBtnHTML}${rowsHTML}`;
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active');

  // Weather button
  const wBtn = tt.querySelector('#weatherBtn');
  if (wBtn) wBtn.addEventListener('click', e => {
    e.stopPropagation(); tt.remove();
    if (d.metricName === 'GDP Growth') showWeatherGDP();
    else if (d.metricName === 'Inflation (CPI)') showWeatherCPI();
    else if (d.metricName === 'Unemployment') showWeatherUnemp();
    else if (d.metricName === 'Budget Deficit') showWeatherBudget();
    else if (d.metricName === 'Current Account') showWeatherCA();
  });

  // Regime tag click
  tt.querySelectorAll('.cr-regime').forEach(tag => {
    tag.addEventListener('click', e => {
      e.stopPropagation(); closeBubble();
      const code = tag.dataset.code;
      const fr = fxRegime[code]; if (!fr) return;
      const desc = fr[currentLevel] || fr.beginner || 'No description available';
      const b = document.createElement('div'); b.className = 'glossary-bubble';
      b.innerHTML = `<div class="gb-close" onclick="event.stopPropagation();closeBubble()">✕</div><div class="gb-term">${fr.label || 'FX Regime'} · ${code}</div><div class="gb-def">${desc}</div>`;
      document.body.appendChild(b);
      const r = tag.getBoundingClientRect();
      let top = r.bottom + 8, left = r.left;
      if (left + 320 > innerWidth) left = innerWidth - 330; if (left < 10) left = 10;
      if (top + 200 > innerHeight) { top = r.top - 8 - 150; b.classList.add('arrow-bottom'); }
      b.style.left = left + 'px'; b.style.top = top + 'px'; activeBubble = b;
      setTimeout(() => { document.addEventListener('click', function cl(ev) { if (activeBubble && !activeBubble.contains(ev.target)) closeBubble(); document.removeEventListener('click', cl); }, {once: true}); }, 10);
    });
  });

  // Animate bars
  requestAnimationFrame(() => {
    tt.querySelectorAll('.cr-bar').forEach((bar, i) => {
      if (i >= d.rows.length || d.rows[i].num === null) return;
      const pct = (Math.abs(d.rows[i].num) / d.maxAbs * 100);
      setTimeout(() => { bar.style.width = pct + '%'; }, i * 40);
    });
  });

  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showCompare(metricName, highlightCountry, sec) {
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const d = assembleCompareData(metricName, highlightCountry, sec);
  renderCompare(d);
}

// ── GLOSSARY ──
// ── COMMODITY INLINE LINKS ──
// Terms processed longest-first to avoid partial-match issues
const COMM_TERMS = [
  {pat:'natural gas', type:'item', name:'Natural Gas'},
  {pat:'commodities', type:'card'},
  {pat:'commodity',   type:'card'},
  {pat:'soybeans',    type:'item', name:'Soybeans'},
  {pat:'soybean',     type:'item', name:'Soybeans'},
  {pat:'copper',      type:'item', name:'Copper'},
  {pat:'silver',      type:'item', name:'Silver'},
  {pat:'wheat',       type:'item', name:'Wheat'},
  {pat:'brent',       type:'item', name:'Brent Crude'},
  {pat:'crude',       type:'card'},
  {pat:'corn',        type:'item', name:'Corn'},
  {pat:'gold',        type:'item', name:'Gold'},
  {pat:'WTI',         type:'item', name:'WTI Crude'},
  {pat:'oil',         type:'card'},
];
function applyCommLinks(h){
  if(!h || typeof h !== 'string') return h || '';
  COMM_TERMS.forEach(({pat, type, name})=>{
    const escaped = pat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp(`(?<![\\w-])\\b(${escaped})\\b(?![^<]*>)`,'i');
    h = h.replace(re, m=>`<span class="comm-term" data-comm-type="${type}"${name?` data-comm-name="${name}"`:''}>${m}</span>`);
  });
  return h;
}
function attachCommLinks(r){
  r.querySelectorAll('.comm-term').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const type = el.dataset.commType;
      const name = el.dataset.commName;
      if(type==='card'){ closeAll(); showCommoditiesCard(); return; }
      if(type==='item' && name && commoditiesData.items){
        const idx = commoditiesData.items.findIndex(it=>it.name===name);
        if(idx>=0){ closeAll(); showCommodityMTT(idx); return; }
      }
      closeAll(); showCommoditiesCard();
    });
  });
}

function applyGlossary(h, skipTerm){
  if(!h || typeof h !== 'string') return h || '';
  h=h.replace(/<a data-term="([^"]+)">([^<]+)<\/a>/g,(_,t,x)=>`<span class="glossary-term" data-term="${t}">${x}</span>`);
  const skipSet=new Set();
  if(skipTerm){const sl=skipTerm.toLowerCase();skipSet.add(sl);skipSet.add(sl.replace(/\s*\(.*\)\s*/g,'').trim());}
  Object.keys(glossary).forEach(t=>{const g=glossary[t];if(!g)return;const c=g.complexity||0;if(currentLevel==='moderate'&&c<2)return;if(currentLevel==='expert'&&c<3)return;if(skipSet.has(t.toLowerCase()))return;h=h.replace(new RegExp(`(?<![\\w-])\\b(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b(?![^<]*>)`,'i'),m=>`<span class="glossary-term" data-term="${t}">${m}</span>`);});
  h=applyCommLinks(h);
  return h;
}
function attachGlossary(r){r.querySelectorAll('.glossary-term').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();showBubble(el);});});attachCommLinks(r);}
// ── BLUF helpers ──
function getBluf(entry){ return (typeof entry==='object' && entry.bluf) ? entry.bluf : entry; }
function getFull(entry){ return (typeof entry==='object' && entry.full) ? entry.full : null; }

let activeBubbleTerm=null, activeBubbleEl=null;

function assembleGlossaryData(term) {
  const g = glossary[term] || null;
  if (!g) return null;
  const entry = g[currentLevel] || g.beginner;
  if (!entry) return null;
  const bluf = getBluf(entry);
  if (!bluf || typeof bluf !== 'string') return null;
  return {
    term,
    glossaryEntry: g,
    bluf,
    full: getFull(entry)
  };
}

function renderBubbleContent(t, g){
  const d = assembleGlossaryData(t);
  const bluf = d ? d.bluf : t;
  const full = d ? d.full : null;
  let html=`<div class="gb-close">✕</div>`;
  html+=`<div class="gb-level">
    <button class="lt-btn${currentLevel==='beginner'?' active':''}" data-lv="beginner">Beginner</button>
    <button class="lt-btn${currentLevel==='moderate'?' active':''}" data-lv="moderate">Moderate</button>
    <button class="lt-btn${currentLevel==='expert'?' active':''}" data-lv="expert">Expert</button>
  </div>`;
  html+=`<div class="gb-term">${t}</div><div class="gb-def">${bluf}</div>`;
  if(full){
    html+=`<div class="ge-expand">Read more ›</div><div class="ge-full">${full}</div>`;
  }
  return {html, hasFull:!!full};
}

function showBubble(el){
  closeBubble();const t=el.dataset.term;
  const d=assembleGlossaryData(t);if(!d)return;
  const g=d.glossaryEntry;
  activeBubbleTerm=t; activeBubbleEl=el;
  const {html, hasFull}=renderBubbleContent(t,g);
  const b=document.createElement('div');b.className='glossary-bubble'+(hasFull?' has-full':'');
  b.innerHTML=html;
  document.body.appendChild(b);
  positionBubble(b, el, hasFull);
  activeBubble=b;
  attachBubbleHandlers(b, t, g, el);
  setTimeout(()=>{document.addEventListener('click',function cl(e){if(activeBubble&&!activeBubble.contains(e.target))closeBubble();document.removeEventListener('click',cl);},{once:true});},10);
}

function positionBubble(b, el, hasFull){
  const r=el.getBoundingClientRect();let top=r.bottom+8,left=r.left;
  const maxW=hasFull?420:320;
  if(left+maxW>innerWidth)left=innerWidth-maxW-10;if(left<10)left=10;
  if(top+200>innerHeight){top=r.top-8-150;b.classList.add('arrow-bottom');}
  b.style.left=left+'px';b.style.top=top+'px';
}

function attachBubbleHandlers(b, t, g, el){
  // Close button
  b.querySelector('.gb-close').addEventListener('click',e=>{e.stopPropagation();closeBubble();});
  // Level toggle
  b.querySelectorAll('.gb-level .lt-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      // Preserve expanded state
      const wasExpanded=!!b.querySelector('.ge-full.open');
      setLevel(btn.dataset.lv);
      // Re-render in place
      const {html, hasFull}=renderBubbleContent(t,g);
      b.className='glossary-bubble'+(hasFull?' has-full':'')+(wasExpanded&&hasFull?' expanded':'');
      b.innerHTML=html;
      // Restore expanded state
      if(wasExpanded&&hasFull){const fullEl=b.querySelector('.ge-full');if(fullEl)fullEl.classList.add('open');const expBtn=b.querySelector('.ge-expand');if(expBtn)expBtn.textContent='Show less ‹';}
      positionBubble(b, el, hasFull);
      attachBubbleHandlers(b, t, g, el);
    });
  });
  // Read more toggle
  const expBtn=b.querySelector('.ge-expand');
  if(expBtn){
    expBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const fullEl=b.querySelector('.ge-full');
      const isOpen=fullEl.classList.contains('open');
      fullEl.classList.toggle('open');
      b.classList.toggle('expanded');
      expBtn.textContent=isOpen?'Read more ›':'Show less ‹';
      const bRect=b.getBoundingClientRect();
      if(bRect.bottom>innerHeight-10){b.style.top=Math.max(10,innerHeight-bRect.height-10)+'px';}
      if(bRect.top<10){b.style.top='10px';}
    });
  }
}
function closeBubble(){if(activeBubble){activeBubble.remove();activeBubble=null;}}
function closeAll(){if(activeChart){activeChart.destroy();activeChart=null;}document.querySelectorAll('.card-overlay,.tooltip').forEach(el=>el.remove());closeBubble();}

document.querySelectorAll('.exp-btn').forEach(btn=>{btn.addEventListener('click',()=>{setLevel(btn.dataset.level);closeAll();});});
