<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060a11;
  --sunny: #e8b84a;
  --sunny-deep: #b8862a;
  --cloudy: #5a6a7a;
  --stormy: #4a2a4e;
  --text: #e8e8e8;
  --text2: #8a94a6;
  --text3: #4a5468;
  --card-bg: #0e1420;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  cursor: default;
}

canvas { display: block; }

/* Top bar */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
  background: linear-gradient(180deg, rgba(6,10,17,0.92) 0%, transparent 100%);
}

.brand {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  text-transform: uppercase;
}

.brand-pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--sunny);
  box-shadow: 0 0 12px rgba(232,184,74,0.6);
  animation: pulse-brand 3s ease-in-out infinite;
}

@keyframes pulse-brand {
  0%, 100% { box-shadow: 0 0 12px rgba(232,184,74,0.6); }
  50% { box-shadow: 0 0 20px rgba(232,184,74,0.9); }
}

.levels {
  display: flex;
  gap: 1px;
  background: rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 2px;
}

.lvl {
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text3);
  background: transparent;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}

.lvl.on {
  color: var(--text);
  background: rgba(255,255,255,0.08);
}

/* Stories ticker */
.ticker {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 32px;
  z-index: 80;
  background: linear-gradient(0deg, rgba(6,10,17,0.92) 0%, transparent 100%);
  font-size: 12px;
  color: var(--text2);
  overflow: hidden;
}

.ticker-item {
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: color 0.2s;
  flex-shrink: 0;
}

.ticker-item:hover { color: var(--text); }

/* Legend */
.legend {
  position: fixed;
  bottom: 52px;
  left: 24px;
  display: flex;
  gap: 14px;
  font-size: 10px;
  color: var(--text3);
  z-index: 80;
  letter-spacing: 0.3px;
  transition: opacity 0.4s;
}

.legend.hide { opacity: 0; pointer-events: none; }

.legend i {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: middle;
}

.legend i.s { background: var(--sunny); box-shadow: 0 0 6px rgba(232,184,74,0.5); }
.legend i.c { background: var(--cloudy); }
.legend i.t { background: var(--stormy); }

/* Country labels floating on globe */
.country-label {
  position: absolute;
  pointer-events: none;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  color: rgba(255,255,255,0.75);
  text-shadow: 0 0 8px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
  white-space: nowrap;
  transition: opacity 0.3s;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 5px;
  transform: translate(-50%, -50%);
}

.country-label .flag {
  font-size: 14px;
}

.country-label.back { opacity: 0; }

/* Card overlay */
.card-wrap {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  transform: translateY(110%);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.card-wrap.open { transform: translateY(0); }

.card {
  background: var(--card-bg);
  border-top: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px 16px 0 0;
  max-height: 36vh;
  overflow-y: auto;
  padding: 0 20px 18px;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
}

.card::-webkit-scrollbar { width: 0; }

.card-drag {
  display: flex;
  justify-content: center;
  padding: 8px 0 4px;
  position: sticky; top: 0;
  background: var(--card-bg);
  z-index: 5;
  cursor: grab;
}

.card-drag span {
  width: 32px; height: 3px;
  border-radius: 2px;
  background: rgba(255,255,255,0.12);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.card-id {
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-id .f { font-size: 20px; }
.card-id .n { font-size: 15px; font-weight: 600; }

.card-wx { font-size: 18px; }

.card-story {
  font-size: 12px;
  line-height: 1.55;
  color: var(--text2);
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.sec-label {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--text3);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.mgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-bottom: 10px;
}

.mtile {
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 8px;
  padding: 7px 8px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.mtile:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.08);
}

.mtile-label {
  font-size: 8.5px;
  color: var(--text3);
  margin-bottom: 3px;
  letter-spacing: 0.2px;
}

.mtile-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
}

.mtile-chg {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  margin-top: 2px;
}

.pos { color: #4ade80; }
.neg { color: #f87171; }
.neu { color: var(--text3); }

/* Scrim behind card */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(6,10,17,0.5);
  z-index: 190;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}

.scrim.on { opacity: 1; pointer-events: auto; }

@media (max-width: 640px) {
  .topbar { padding: 0 14px; }
  .ticker { display: none; }
  .legend { left: 14px; bottom: 14px; }
  .card { padding: 0 14px 14px; max-height: 42vh; }
  .mgrid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<div class="topbar">
  <div class="brand"><span class="brand-pulse"></span>MacroSnaps</div>
  <div class="levels">
    <button class="lvl" data-l="beginner">Beginner</button>
    <button class="lvl on" data-l="moderate">Moderate</button>
    <button class="lvl" data-l="expert">Expert</button>
  </div>
</div>

<div class="ticker">

  <div class="ticker-item">&#9889; Germany enters technical recession</div>

</div>

<div class="legend" id="legend">
  <span><i class="s"></i>Expanding</span>
  <span><i class="c"></i>Mixed</span>
  <span><i class="t"></i>Contracting</span>
</div>

<div class="scrim" id="scrim"></div>

<div class="card-wrap" id="cardWrap">
  <div class="card" id="card">
    <div class="card-drag" id="cardDrag"><span></span></div>
    <div class="card-top">
      <div class="card-id"><span class="f" id="cFlag"></span><span class="n" id="cName"></span></div>
      <span class="card-wx" id="cWx"></span>
    </div>
    <div class="card-story" id="cStory"></div>
    <div class="sec-label">MACRO</div>
    <div class="mgrid" id="cMacro"></div>
    <div class="sec-label">MARKETS</div>
    <div class="mgrid" id="cMarket"></div>
  </div>
</div>

<div id="labels"></div>

// ============ THREE.JS GLOBE ============

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
camera.position.z = 2.8;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x060a11, 1);
document.body.prepend(renderer.domElement);

// Globe group
const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Main sphere - dark ocean
const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
const sphereMat = new THREE.MeshBasicMaterial({
  color: 0x0a0f1a,
  transparent: true,
  opacity: 0.95,
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
globeGroup.add(sphere);

// Atmosphere glow
const atmosGeo = new THREE.SphereGeometry(1.015, 64, 64);
const atmosMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
      gl_FragColor = vec4(0.3, 0.5, 0.8, 1.0) * intensity * 0.4;
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true,
});

globeGroup.add(atmos);

// Wireframe latitude lines
for (let lat = -60; lat <= 60; lat += 30) {
  const phi = (90 - lat) * Math.PI / 180;
  const r = Math.sin(phi) * 1.002;
  const y = Math.cos(phi) * 1.002;
  const ringGeo = new THREE.RingGeometry(r - 0.001, r + 0.001, 80);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.025, side: THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = y;
  ring.rotation.x = Math.PI / 2;
  globeGroup.add(ring);
}

// ============ COUNTRY DOTS (weather-colored) ============
function latLonToVec3(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

const wxColors = {
  sunny: { core: 0xe8b84a, glow: 0xe8b84a, emissive: 1.2, size: 0.04 },
  cloudy: { core: 0x5a6a7a, glow: 0x5a6a7a, emissive: 0.6, size: 0.032 },
  stormy: { core: 0x6a3a5e, glow: 0x4a2a4e, emissive: 0.4, size: 0.035 },
};

const dots = {};
const hitTargets = {};

Object.entries(C).forEach(([code, c]) => {
  const wc = wxColors[c.wx];
  const pos = latLonToVec3(c.lat, c.lon, 1.01);

  // Core dot
  const dotGeo = new THREE.SphereGeometry(wc.size, 16, 16);
  const dotMat = new THREE.MeshBasicMaterial({ color: wc.core });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.copy(pos);
  globeGroup.add(dot);
  dots[code] = dot;

  // Outer glow
  const glowSize = wc.size * (c.wx === 'sunny' ? 3.5 : 2.2);
  const glowGeo = new THREE.SphereGeometry(glowSize, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: wc.glow,
    transparent: true,
    opacity: c.wx === 'sunny' ? 0.18 : (c.wx === 'stormy' ? 0.12 : 0.08),
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(pos);
  globeGroup.add(glow);

  if (c.wx === 'sunny') {
    // Second glow ring for sunny
    const glow2Geo = new THREE.SphereGeometry(glowSize * 1.8, 16, 16);
    const glow2Mat = new THREE.MeshBasicMaterial({
      color: wc.glow, transparent: true, opacity: 0.06,
    });
    const glow2 = new THREE.Mesh(glow2Geo, glow2Mat);
    glow2.position.copy(pos);
    globeGroup.add(glow2);
  }

  // Invisible hit target
  const hitGeo = new THREE.SphereGeometry(0.09, 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hit = new THREE.Mesh(hitGeo, hitMat);
  hit.position.copy(pos);
  hit.userData = { code };
  globeGroup.add(hit);
  hitTargets[code] = hit;
});

// ============ FLOATING LABELS ============
const labelContainer = document.getElementById('labels');

function updateLabels() {
  labelContainer.innerHTML = '';
  Object.entries(C).forEach(([code, c]) => {
    const pos = latLonToVec3(c.lat, c.lon, 1.06);
    const worldPos = pos.clone();
    globeGroup.localToWorld(worldPos);

    // Check if on front side
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    const dotDir = worldPos.clone().sub(camera.position).normalize();
    const dotProduct = camDir.dot(dotDir);
    const isFront = dotProduct > 0.15;

    const projected = worldPos.clone().project(camera);
    const x = (projected.x * 0.5 + 0.5) * W;
    const y = (-projected.y * 0.5 + 0.5) * H;

    const label = document.createElement('div');
    label.className = 'country-label' + (isFront ? '' : ' back');
    label.innerHTML = `<span class="flag">${c.flag}</span>${code}`;
    label.style.left = x + 'px';
    label.style.top = y + 'px';
    labelContainer.appendChild(label);
  });
}

// ============ INTERACTION ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let autoRotate = true;
let targetRotY = 0;
let targetRotX = 0.15;
let momentum = { x: 0, y: 0 };
let cardOpen = false;

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  autoRotate = false;
  prevMouse = { x: e.clientX, y: e.clientY };
  momentum = { x: 0, y: 0 };
});

window.addEventListener('mousemove', e => {
  if (isDragging && !cardOpen) {
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    globeGroup.rotation.y += dx * 0.005;
    globeGroup.rotation.x += dy * 0.005;
    globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x));
    momentum = { x: dx * 0.005, y: dy * 0.005 };
    prevMouse = { x: e.clientX, y: e.clientY };
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging) {
    isDragging = false;
    // If barely moved, treat as click
    const dx = Math.abs(e.clientX - prevMouse.x);
    const dy = Math.abs(e.clientY - prevMouse.y);
    if (dx < 3 && dy < 3) {
      handleClick(e);
    }
    setTimeout(() => { if (!cardOpen) autoRotate = true; }, 3000);
  }
});

renderer.domElement.addEventListener('click', handleClick);

function handleClick(e) {
  if (cardOpen) return;
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const targets = Object.values(hitTargets);
  const hits = raycaster.intersectObjects(targets);
  if (hits.length > 0) {
    const code = hits[0].object.userData.code;
    openCard(code);
  }
}

// Touch
let touchStart = null;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    autoRotate = false;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    prevMouse = { ...touchStart };
  }
});

renderer.domElement.addEventListener('touchmove', e => {
  if (isDragging && e.touches.length === 1 && !cardOpen) {
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    globeGroup.rotation.y += dx * 0.005;
    globeGroup.rotation.x += dy * 0.005;
    globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});

renderer.domElement.addEventListener('touchend', e => {
  if (touchStart) {
    const dx = Math.abs(prevMouse.x - touchStart.x);
    const dy = Math.abs(prevMouse.y - touchStart.y);
    if (dx < 10 && dy < 10) {
      // Tap
      const fakeEvent = { clientX: touchStart.x, clientY: touchStart.y };
      handleClick(fakeEvent);
    }
    touchStart = null;
    isDragging = false;
    setTimeout(() => { if (!cardOpen) autoRotate = true; }, 3000);
  }
});

// ============ CARD LOGIC ============
function openCard(code) {
  const c = C[code];
  if (!c) return;
  cardOpen = true;
  autoRotate = false;

  document.getElementById('cFlag').textContent = c.flag;
  document.getElementById('cName').textContent = c.name;
  document.getElementById('cWx').textContent = c.wxi;
  document.getElementById('cStory').textContent = c.story;

  const renderGrid = (items) => items.map(m =>
    `<div class="mtile">
      <div class="mtile-label">${m.l}</div>
      <div class="mtile-val">${m.v}</div>
      ${m.c ? `<div class="mtile-chg ${m.d}">${m.c}</div>` : ''}
    </div>`
  ).join('');

  document.getElementById('cMacro').innerHTML = renderGrid(c.macro);
  document.getElementById('cMarket').innerHTML = renderGrid(c.market);

  document.getElementById('cardWrap').classList.add('open');
  document.getElementById('scrim').classList.add('on');
  document.getElementById('legend').classList.add('hide');
}

function closeCard() {
  cardOpen = false;
  document.getElementById('cardWrap').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('legend').classList.remove('hide');
  setTimeout(() => { autoRotate = true; }, 1000);
}

document.getElementById('scrim').addEventListener('click', closeCard);
document.getElementById('cardDrag').addEventListener('click', closeCard);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

// Swipe down to close card
let cardTouchY = 0;
document.getElementById('card').addEventListener('touchstart', e => {
  cardTouchY = e.touches[0].clientY;
});
document.getElementById('card').addEventListener('touchmove', e => {
  if (e.touches[0].clientY - cardTouchY > 50) closeCard();
});

// Level toggle
document.querySelectorAll('.lvl').forEach(b => {
  b.addEventListener('click', function() {
    document.querySelectorAll('.lvl').forEach(x => x.classList.remove('on'));
    this.classList.add('on');
  });
});

// ============ STORMY PULSE ============
const stormyCodes = Object.entries(C).filter(([,c]) => c.wx === 'stormy').map(([code]) => code);
let time = 0;

// ============ ANIMATION LOOP ============
function animate() {
  requestAnimationFrame(animate);
  time += 0.01;

  // Auto-rotate
  if (autoRotate) {
    globeGroup.rotation.y += 0.0012;
  } else if (!isDragging && !cardOpen) {
    // Apply momentum with friction
    globeGroup.rotation.y += momentum.x;
    globeGroup.rotation.x += momentum.y;
    globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x));
    momentum.x *= 0.96;
    momentum.y *= 0.96;
  }

  // Stormy pulse
  stormyCodes.forEach(code => {
    const dot = dots[code];
    if (dot) {
      const pulse = 0.8 + Math.sin(time * 1.5) * 0.2;
      dot.material.color.setRGB(
        0.42 * pulse,
        0.23 * pulse,
        0.37 * pulse
      );
    }
  });

  // Sunny shimmer
  Object.entries(C).forEach(([code, c]) => {
    if (c.wx === 'sunny') {
      const dot = dots[code];
      if (dot) {
        const shimmer = 0.9 + Math.sin(time * 2 + code.charCodeAt(0)) * 0.1;
        dot.material.color.setRGB(
          0.91 * shimmer,
          0.72 * shimmer,
          0.29 * shimmer
        );
      }
    }
  });

  renderer.render(scene, camera);
  updateLabels();
}

animate();

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
