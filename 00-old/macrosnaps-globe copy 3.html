<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps - Global Economic Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00d4ff;--hot:#ff3d5a;--gold:#ffd700;--green:#00e68a;
  --font-display:'Space Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
html{background:#000;color:#e8e8e8;font-family:var(--font-body)}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Top Bar ── */
.top-bar{
  display:flex;align-items:center;justify-content:center;
  padding:16px 24px;position:relative;z-index:10;
  border-bottom:1px solid rgba(255,255,255,.14);flex-shrink:0;
}
.logo{
  position:absolute;left:28px;font-family:var(--font-display);
  font-size:14px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;line-height:1.3;
}
.logo span{color:#aaa;font-weight:400}
.logo .sub1{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#888;text-transform:uppercase;font-weight:400;margin-top:1px;
}
.logo .sub2{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#666;text-transform:uppercase;font-weight:400;
}
.exp-group{display:flex;align-items:center;gap:6px}
.exp-btn{
  font-family:var(--font-display);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 20px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  background:transparent;color:#999;cursor:pointer;transition:all .25s;
}
.exp-btn:hover{border-color:var(--cyan);color:#ccc}
.exp-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 16px rgba(0,212,255,.12);
}

/* ── Tagline ── */
.tagline{
  text-align:center;padding:6px 0;
  font-family:var(--font-body);font-size:11px;font-style:italic;
  color:#777;letter-spacing:.3px;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}

/* ── Hero ── */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* ── News Icons ── */
.news-icons{
  display:flex;gap:48px;margin-bottom:20px;z-index:5;position:relative;
}
.news-icon{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:transform .2s;
}
.news-icon:hover{transform:translateY(-3px)}
.news-icon .ni-emoji{font-size:32px;filter:grayscale(.15);transition:filter .2s,transform .2s}
.news-icon:hover .ni-emoji{filter:none;transform:scale(1.15)}
.news-icon .ni-label{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#666;transition:color .25s;white-space:nowrap;
}
.news-icon:hover .ni-label{color:#aaa}
.news-icon.hot:hover .ni-label{color:var(--hot)}
.news-icon.movers:hover .ni-label{color:var(--gold)}
.news-icon.connection:hover .ni-label{color:var(--cyan)}
.news-icon::after{
  content:'';width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.35);transition:background .2s;
}
.news-icon.hot:hover::after{background:var(--hot)}
.news-icon.movers:hover::after{background:var(--gold)}
.news-icon.connection:hover::after{background:var(--cyan)}

/* ── Globe ── */
.globe-wrap{
  position:relative;width:min(65vh,600px);aspect-ratio:1;cursor:grab;z-index:1;
}
.globe-wrap:active{cursor:grabbing}
.globe-wrap canvas{width:100%!important;height:100%!important;display:block}
.globe-wrap::before{
  content:'';position:absolute;top:50%;left:50%;width:80%;height:80%;
  transform:translate(-50%,-50%);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(0,212,255,.18) 0%,rgba(0,212,255,.08) 30%,transparent 65%);
  box-shadow:0 0 100px 50px rgba(0,212,255,.08);
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.globe-hint{
  margin-top:14px;font-family:var(--font-display);font-size:9px;
  letter-spacing:2px;color:#777;text-transform:uppercase;z-index:5;
  animation:hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* ── Country Labels ── */
.country-label{
  position:absolute;padding:3px 8px;border-radius:3px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#ccc;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.16);
  cursor:pointer;transition:all .2s;pointer-events:auto;white-space:nowrap;
  text-transform:uppercase;z-index:5;
}
.country-label:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.25)}
.country-label .flag{font-size:12px;margin-right:3px}

/* ── Tooltip ── */
.tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,15,15,0.98);border:1px solid #00d4ff;border-radius:8px;
  padding:16px;z-index:1000;width:90%;max-width:400px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,0.3);
  animation:ttIn .2s ease-out;
}
.tooltip.active{display:block}
@keyframes ttIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tt-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#888;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.tt-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.tt-nav{
  position:absolute;top:12px;right:48px;display:flex;gap:3px;z-index:10;
}
.tt-nav-btn{
  width:28px;height:28px;
  background:rgba(255,255,255,.06);border:1px solid #333;border-radius:50%;
  color:#666;font-size:14px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.tt-nav-btn:hover{background:rgba(0,212,255,.1);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.tt-title{font-size:16px;font-weight:700;color:#00d4ff;margin-bottom:10px;padding-right:100px}
.tt-story{font-size:12px;color:#ccc;line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
.tt-source{font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#444;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.tt-section{margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid #333}
.tt-section:last-child{border-bottom:none;margin-bottom:0}
.tt-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tt-value{font-size:16px;font-weight:600;color:#fff}
.tt-explanation{font-size:11px;color:#aaa;line-height:1.4;margin-top:6px}
.tt-source{font-size:10px;color:#666;margin-top:6px}

/* ── Card Overlay ── */
.card-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.country-card{
  width:92%;max-width:420px;background:#111;border:2px solid #444;border-radius:12px;
  padding:16px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:cardIn .25s ease-out;margin:auto;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.country-card:hover{border-color:#555}
.card-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#888;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.card-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card-head .c-flag{font-size:32px}
.card-head .c-name{font-size:24px;font-weight:600;color:#fff}
.weather-sec{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.w-icon{font-size:48px;line-height:1;margin-bottom:8px}
.w-icon.sunny{filter:none}
.w-icon.cloudy{filter:brightness(.65) contrast(1.05) saturate(.3)}
.w-icon.stormy{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.c-stories{list-style:none;padding:0;margin:0}
.c-stories li{font-size:13px;color:#bbb;line-height:1.6;padding-left:16px;position:relative;margin-bottom:3px}
.c-stories li::before{content:"•";position:absolute;left:0;color:#00d4ff;font-weight:bold}
.sec-head{margin:14px 0 8px;padding:6px 12px;background:linear-gradient(90deg,rgba(0,212,255,.2),transparent);border-left:3px solid #00d4ff;font-size:12px;color:#00d4ff;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.metrics{display:flex;flex-direction:column;margin-bottom:4px}
.metrics.mkt{background:rgba(255,255,255,.02);border-radius:8px;padding:8px 0}
.metric{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.metric:last-child{border-bottom:none}
.metric:hover{background:rgba(255,255,255,.05)}
.m-name{font-size:12px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.m-val{font-size:20px;font-weight:700;color:#fff}

/* ── Glossary ── */
.glossary-term{color:#8ec8f0;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(142,200,240,.45);text-underline-offset:2px;cursor:help;transition:color .15s;border-radius:2px}
.glossary-term:hover{color:#b8dcf8;text-decoration-color:rgba(142,200,240,.8);background:rgba(142,200,240,.07)}
.glossary-bubble{
  position:fixed;z-index:2000;background:rgba(20,22,28,.98);
  border:1px solid rgba(0,212,255,.45);border-radius:10px;padding:14px 16px 12px;
  max-width:320px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 12px rgba(0,212,255,.12);
  pointer-events:auto;animation:gbIn .15s ease-out;
}
@keyframes gbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.glossary-bubble::before{content:'';position:absolute;top:-6px;left:24px;width:10px;height:10px;background:rgba(20,22,28,.98);border-left:1px solid rgba(0,212,255,.45);border-top:1px solid rgba(0,212,255,.45);transform:rotate(45deg)}
.glossary-bubble.arrow-bottom::before{top:auto;bottom:-6px;border-left:none;border-top:none;border-right:1px solid rgba(0,212,255,.45);border-bottom:1px solid rgba(0,212,255,.45)}
.gb-term{font-size:11px;font-weight:700;color:#00d4ff;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;display:flex;align-items:center;gap:6px;padding-right:28px}
.gb-badge{display:inline-block;font-size:8px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.gb-badge.basic{background:rgba(76,175,80,.2);color:#81c784;border:1px solid rgba(76,175,80,.3)}
.gb-badge.intermediate{background:rgba(255,183,77,.2);color:#ffcc80;border:1px solid rgba(255,183,77,.3)}
.gb-badge.advanced{background:rgba(239,83,80,.2);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}
.gb-def{font-size:12px;color:#ccc;line-height:1.55}
.gb-close{
  position:absolute;top:8px;right:8px;width:22px;height:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:50%;
  color:#666;font-size:13px;line-height:20px;text-align:center;cursor:pointer;transition:all .2s;
}
.gb-close:hover{background:rgba(255,255,255,.12);color:#ccc;border-color:#444}
.gb-level{display:flex;gap:3px;margin-bottom:8px}
.gb-level .lt-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 8px;border:1px solid rgba(255,255,255,.08);border-radius:3px;
  background:transparent;color:#444;cursor:pointer;transition:all .2s;
}
.gb-level .lt-btn:hover{border-color:rgba(0,212,255,.25);color:#888}
.gb-level .lt-btn.active{background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan)}

/* ── BLUF Read More Expansion ── */
.glossary-bubble.has-full{max-width:420px}
.glossary-bubble.has-full.expanded{max-height:70vh;overflow-y:auto}
.glossary-bubble.has-full.expanded::-webkit-scrollbar{width:3px}
.glossary-bubble.has-full.expanded::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.ge-expand{
  display:inline-block;font-family:var(--font-display);font-size:9px;
  letter-spacing:1px;text-transform:uppercase;color:var(--cyan);
  cursor:pointer;margin-top:8px;padding:0;border:none;background:none;
  transition:opacity .2s;opacity:.8;
}
.ge-expand:hover{opacity:1}
.ge-full{
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
  animation:geIn .2s ease-out;
}
.ge-full.open{display:block}
@keyframes geIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ge-section{margin-bottom:10px}
.ge-section:last-child{margin-bottom:0}
.ge-head{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--cyan);margin-bottom:4px;opacity:.8;
}
.ge-body{font-size:12px;color:#aaa;line-height:1.55}
.ge-body ul{margin:4px 0 0;padding:0;list-style:none}
.ge-body li{position:relative;padding-left:12px;margin-bottom:3px}
.ge-body li::before{content:'·';position:absolute;left:2px;color:var(--cyan);font-weight:bold}
.ge-formal{
  font-size:11px;color:#888;font-style:italic;line-height:1.5;
  padding:8px 10px;background:rgba(255,255,255,.02);border-radius:4px;
  border-left:2px solid rgba(0,212,255,.2);
}
/* Metric tooltip BLUF expand */
.tt-story .ge-expand{margin-top:12px;display:block}
.tt-story .ge-full{margin-top:8px;padding-top:8px}

/* ── Metric Chart ── */
.metric-chart-wrap{
  margin:10px 0;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.metric-chart-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.metric-chart-title{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#555;
}
.metric-chart-range{display:flex;gap:2px}
.metric-chart-range .mcr-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border:1px solid rgba(255,255,255,.06);border-radius:2px;
  background:transparent;color:#444;cursor:pointer;transition:all .2s;
}
.metric-chart-range .mcr-btn:hover{border-color:rgba(0,212,255,.2);color:#888}
.metric-chart-range .mcr-btn.active{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.metric-chart-canvas{height:120px;position:relative}
.metric-chart-canvas canvas{width:100%!important;height:100%!important}
.metric-chart-minmax{
  display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#444;
}
.metric-chart-nodata{
  height:80px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#333;text-transform:uppercase;
}

/* ── Inline Level Toggle ── */
.level-toggle{
  display:flex;gap:4px;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.level-toggle .lt-btn{
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#555;cursor:pointer;transition:all .2s;
}
.level-toggle .lt-btn:hover{border-color:rgba(0,212,255,.3);color:#999}
.level-toggle .lt-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
}

/* ── Policy Explainer ── */

/* ── Compare View ── */
.compare-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:10px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#666;cursor:pointer;transition:all .2s;
}
.compare-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.compare-btn .cb-icon{font-size:12px}
.compare-row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;
}
.compare-row:last-child{border-bottom:none}
.compare-row.highlight{background:rgba(0,212,255,.06);border-radius:4px;padding:7px 8px;margin:0 -8px}
.compare-row .cr-flag{font-size:16px;width:24px;text-align:center}
.compare-row .cr-name{font-size:11px;color:#888;width:50px;font-family:var(--font-display);letter-spacing:.5px}
.compare-row .cr-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden;position:relative}
.compare-row .cr-bar{height:100%;border-radius:2px;transition:width .4s ease-out;min-width:2px}
.compare-row .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.3),rgba(0,212,255,.5))}
.compare-row .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.3),rgba(255,61,90,.5))}
.compare-row.highlight .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.5),rgba(0,212,255,.8))}
.compare-row.highlight .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.5),rgba(255,61,90,.8))}
.compare-row .cr-val{font-size:11px;font-weight:600;color:#ccc;width:80px;text-align:right;font-family:var(--font-display);line-height:1.3}
.compare-row.highlight .cr-name{color:var(--cyan)}
.compare-row.highlight .cr-val{color:#fff}

/* Regime tag in compare rows */
.cr-regime{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  color:#888;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:3px;padding:2px 6px;cursor:pointer;transition:all .2s;white-space:nowrap;
  flex-shrink:0;
}

/* ── Weather GDP Grid ── */
.weather-btn{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#666;cursor:pointer;transition:all .2s;
}
.weather-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.weather-btn .wb-icon{display:inline-flex;align-items:center;gap:2px}
.wg-table{width:100%;border-collapse:collapse;margin-top:10px}
.wg-table th{
  font-family:var(--font-display);font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:#555;padding:6px 4px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.wg-table th:first-child{text-align:left;color:#888}
.wg-table th.forecast{color:var(--cyan);font-style:italic}
.wg-table td{padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.wg-table td:first-child{text-align:left}
.wg-table tr:last-child td{border-bottom:none}
.wg-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.wg-cell .wg-val{font-family:var(--font-display);font-size:8px;letter-spacing:.3px}
.wg-cell.sunny .wg-val{color:#e8c840}
.wg-cell.cloudy .wg-val{color:#555}
.wg-cell.storm .wg-val{color:#1a1a1a}
/* Weather icons - emoji based, matching card icons */
.wi{display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;width:24px;height:24px}
.wi-sun{filter:none}
.wi-cloud{filter:brightness(.65) contrast(1.05) saturate(.3)}
.wi-storm{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.wg-country{display:flex;align-items:center;gap:6px}
.wg-country .wg-flag{font-size:14px}
.wg-country .wg-code{font-family:var(--font-display);font-size:9px;letter-spacing:.5px;color:#aaa}
.wg-legend{
  display:flex;gap:12px;margin-top:10px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap;justify-content:center;
}
.wg-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#555}
.cr-regime:hover{border-color:rgba(0,212,255,.4);color:var(--cyan);background:rgba(0,212,255,.06)}
.cr-regime.free{border-color:rgba(0,230,138,.15);color:#5a9}
.cr-regime.managed{border-color:rgba(255,183,77,.15);color:#c96}
.cr-regime.peg{border-color:rgba(255,61,90,.15);color:#c66}
.cr-regime.euro{border-color:rgba(100,140,255,.15);color:#7a9cf0}

/* ── Footer ── */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:12px 24px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 30%);
}
.footer-link{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:#777;cursor:pointer;
  transition:color .2s;text-decoration:none;
}
.footer-link:hover{color:var(--cyan)}
.footer-sep{color:#444;font-size:10px;user-select:none}

/* Footer tooltip overlay */
.footer-tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,15,15,.98);border:1px solid #00d4ff;border-radius:8px;
  padding:20px;z-index:1000;width:90%;max-width:500px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,.3);
  animation:ttIn .2s ease-out;
}
.footer-tooltip.active{display:block}
.footer-tooltip h2{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin-bottom:14px;
}
.footer-tooltip h2::after{
  content:'';display:block;width:30px;height:1px;margin-top:8px;
  background:linear-gradient(90deg,#00d4ff,transparent);
}
.footer-tooltip p{font-size:13px;color:#bbb;line-height:1.7;margin-bottom:12px}
.footer-tooltip p strong{color:#e8e8e8;font-weight:600}
.footer-tooltip .ft-highlight{color:#00d4ff}
.footer-tooltip .ft-sub{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin:20px 0 8px;font-weight:700;
}
.footer-tooltip .ft-legal{font-size:11px;color:#777;line-height:1.6;font-style:italic}
/* Contact form */
.contact-form{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.contact-form input,.contact-form textarea{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);

.contact-form textarea{min-height:100px;resize:vertical}
.contact-form button{

}
.contact-form button:hover{background:rgba(0,212,255,.2);box-shadow:0 0 16px rgba(0,212,255,.15)}

        "bluf": "The price of borrowing money. When you take out a loan, the interest rate is what the lender charges you for the privilege. Central banks set the baseline rate, and every other rate in the economy flows from it.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Interest rates affect everything: mortgages, car loans, credit cards, business investment, government borrowing costs, stock valuations, and currency values. When rates go up, borrowing gets expensive and spending slows. When they come down, borrowing is cheap and spending increases.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of interest rates as the rental fee for money. Just as you pay rent to use someone's apartment, you pay interest to use someone's money. The central bank sets the base rental fee, and everyone else charges a markup depending on how risky the borrower is.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If you borrow $10,000 at 5% interest for one year, you pay back $10,500. That $500 is the cost of using someone else's money. The same principle applies when governments borrow billions to fund public spending.</div></div><div class=\"ge-formal\">The cost of borrowing money or the return on lending it, expressed as an annual percentage of the principal amount.</div>"
      },
      "moderate": {
        "bluf": "The price of money over time. Interest rates transmit monetary policy to the real economy via credit costs, asset valuations, and exchange rates. The entire yield curve - from overnight to 30-year - is a spectrum of interest rates reflecting different horizons and risk premia.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Nominal rates minus inflation expectations give real rates - the true cost of capital. Real rates drive investment decisions, housing affordability, and currency attractiveness. The neutral real rate (r*) is the benchmark: rates above it are restrictive, below it accommodative.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real vs nominal:</strong> a 5% rate with 3% inflation is only 2% in real terms</li><li><strong>Term structure:</strong> different maturities carry different rates - the spread between them signals the economic outlook</li><li><strong>Pass-through:</strong> how quickly policy rate changes reach mortgages and corporate loans varies by country</li></ul></div></div><div class=\"ge-formal\">The annualised cost of borrowing or return on lending, decomposed into: real rate + inflation expectations + risk premium.</div>"
      },
      "expert": {
        "bluf": "The intertemporal price of consumption. The term structure of interest rates encodes market expectations for the policy path, inflation, and risk premia. The Wicksellian natural rate is unobservable but determines whether any given nominal rate is expansionary or contractionary.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Interest rates are the fundamental pricing variable for all financial assets. The Fisher equation (nominal = real + expected inflation) and the expectations hypothesis (long rates = average of expected future short rates + term premium) provide the core frameworks. Deviations from these identities reveal risk premia, liquidity effects, and market segmentation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Natural rate uncertainty:</strong> Laubach-Williams r* estimates have wide confidence intervals - policy operates against an imprecise benchmark</li><li><strong>Transmission lags:</strong> Friedman's \"long and variable lags\" mean rate changes take 12-24 months to fully affect activity</li><li><strong>Financial repression:</strong> persistently negative real rates transfer wealth from savers to borrowers - a stealth fiscal tool</li></ul></div></div><div class=\"ge-formal\">The time value of money. Fisher equation: i = r + pi_e. Term structure: y(n) = (1/n) * sum of E[r(t)] + tp(n). The natural rate r* equates desired saving and investment at full employment.</div>"
      }
    },

  "deflation": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When the overall price level falls over time - the opposite of inflation. While cheaper prices sound good, deflation can trap an economy in a downward spiral: people delay purchases expecting lower prices, businesses earn less, workers get laid off, and spending falls further.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Deflation makes debts heavier in real terms - if you owe $100,000 and prices fall 5%, you still owe the same amount but it is harder to earn the money to pay it back. Japan experienced deflation for nearly two decades, one of the most difficult economic problems any developed country has faced.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's consumer prices were broadly flat or falling from the mid-1990s to 2013. A coffee that cost 300 yen in 1995 might cost 280 yen in 2010. This sounds good, but wages also fell, companies stopped investing, and the economy stagnated for a generation.</div></div><div class=\"ge-formal\">A sustained decline in the general price level, typically measured as negative year-over-year CPI growth.</div>"
      },
      "moderate": {
        "bluf": "A sustained price decline that increases the real burden of debt, depresses investment via rising real rates, and can create a self-reinforcing spiral. Central banks fear deflation more than moderate inflation because the zero lower bound limits how far rates can be cut to fight it.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The Fisher debt-deflation dynamic: falling prices increase real debt value, causing debtors to cut spending, reducing demand, pushing prices lower. This is extremely difficult to break because monetary policy becomes impotent at the zero lower bound.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Core vs headline:</strong> falling energy prices can push headline negative temporarily - core deflation is the real danger</li><li><strong>Expectations:</strong> breakevens falling below 1% is the early warning</li><li><strong>Wages:</strong> sustained nominal wage deflation is the point of no return</li><li><strong>Money velocity:</strong> deflation coincides with collapsing velocity as cash hoarding increases</li></ul></div></div><div class=\"ge-formal\">Sustained negative inflation. Fisher debt-deflation: falling prices -> rising real debt -> deleveraging -> falling demand -> further price declines.</div>"
      },
      "expert": {
        "bluf": "Deflation is the macro pathology central banks are designed to prevent. The Fisher spiral, liquidity trap, and ZLB constraint create a nonlinear trap. Escape requires unconventional policy (QE, YCC, negative rates) or fiscal dominance. Japan is the canonical case study.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Deflation is asymmetrically more dangerous than inflation because the policy toolkit is asymmetric. This is why central banks target 2% (not 0%) - the buffer provides room to cut real rates before hitting the ZLB. China's PPI deflation and near-zero CPI raises questions about a Japan-style trap.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Eggertsson-Woodford:</strong> escape requires managing expectations of future policy - the commitment must be credible</li><li><strong>Japan's escape:</strong> Abenomics (2013) took 10 years to sustainably exit deflation</li><li><strong>China risk:</strong> PPI deflation for 18+ months and CPI near zero echoes Japan's early stages</li></ul></div></div><div class=\"ge-formal\">Sustained negative inflation creating Fisher debt-deflation. At ZLB: real rate = -inflation, so deflation raises real rates, tightening policy when easing is needed. Escape: Svensson's foolproof way or Bernanke's helicopter money.</div>"
      }
    },

  "property crisis": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When the housing or property market crashes, builders and developers cannot pay their debts, banks take losses, and the broader economy suffers. Property crises are among the most damaging economic events because housing is the largest asset most people and banks hold.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Housing is the biggest purchase most people ever make, and property loans are the largest asset on most banks' books. When property values collapse, homeowners lose wealth, banks face losses, construction workers lose jobs, and the ripple effects spread through the entire economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Property booms happen when everyone believes prices can only go up, so they borrow more and more to buy. When prices finally turn, the leverage works in reverse - people owe more than their homes are worth, and developers sitting on empty buildings cannot repay banks.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">China's property crisis (Evergrande, Country Garden) involves developers who borrowed heavily to build apartments that nobody is buying. With property accounting for roughly 30% of China's GDP, the crisis is a major drag on the world's second-largest economy. The US had a similar experience in 2008 when subprime mortgage defaults triggered a global financial crisis.</div></div><div class=\"ge-formal\">A severe decline in property values leading to widespread developer defaults, bank losses, and economic contraction.</div>"
      },
      "moderate": {
        "bluf": "Property crises are the most financially destructive macro events because of the leverage involved. Real estate is the largest collateral class in any banking system - a 20-30% decline in values can wipe out bank equity and trigger a credit crunch that takes years to resolve.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Property cycles are credit cycles. The boom phase features rising collateral values supporting more lending supporting more buying. The bust reverses this: falling values trigger margin calls, forced sales, tighter lending standards, and a negative wealth effect on consumption. The balance sheet repair process typically takes 5-7 years.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Loan-to-value ratios:</strong> higher LTVs at the peak mean faster transmission to bank losses</li><li><strong>Developer leverage:</strong> pre-sale models (China) create liquidity mismatches that accelerate the crisis</li><li><strong>Wealth effect:</strong> housing wealth has a larger marginal propensity to consume than equity wealth</li><li><strong>Bank exposure:</strong> property-related loans as a share of total bank assets determines systemic risk</li></ul></div></div><div class=\"ge-formal\">A systemic decline in real estate valuations leading to developer insolvency, banking sector stress, and credit contraction. Property-driven recessions are roughly 2x deeper and 2x longer than non-property recessions.</div>"
      },
      "expert": {
        "bluf": "Property crises are balance sheet recessions with the longest resolution times. The Koo framework applies: the private sector shifts from profit maximisation to debt minimisation, rendering monetary policy ineffective. The collateral channel (Bernanke-Gertler financial accelerator) amplifies the downturn nonlinearly.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The financial accelerator mechanism makes property crises self-reinforcing: falling collateral values tighten borrowing constraints, forcing asset sales that further depress values. The resolution requires either public sector balance sheet expansion (fiscal stimulus, bank recapitalisation) or a prolonged deleveraging period. China's current crisis tests whether a command economy can manage this transition faster than market economies historically have.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Credit-to-GDP gap:</strong> BIS measure - readings above +10pp have preceded every major property crisis</li><li><strong>Household debt-to-income:</strong> the binding constraint on recovery</li><li><strong>NPL recognition:</strong> delayed recognition prolongs the crisis but smooths the initial shock</li><li><strong>Fiscal space:</strong> the capacity to recapitalise banks determines recovery speed</li></ul></div></div><div class=\"ge-formal\">A systemic property valuation collapse triggering the Bernanke-Gertler financial accelerator: falling collateral -> tighter credit -> forced deleveraging -> further price declines. Resolution requires balance sheet repair - historically 5-10 years in advanced economies.</div>"
      }
    },

  "PCE": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Personal Consumption Expenditures - the Federal Reserve's preferred way to measure inflation in the US. While most people hear about CPI (Consumer Price Index) in the news, the Fed actually makes its interest rate decisions based on PCE because it covers a broader range of spending and adjusts for when people switch to cheaper alternatives.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The Fed's official 2% inflation target is measured in PCE, not CPI. So when you hear \"inflation is at 3%,\" it matters which measure is being used. PCE is typically 0.3-0.4% lower than CPI because of how it accounts for consumer behaviour - when beef gets expensive, people buy chicken, and PCE captures that substitution.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If CPI inflation is 3.5%, PCE inflation might be 3.1%. The Fed would say inflation is 3.1% and would be targeting that number toward 2%. Core PCE (excluding food and energy) is the Fed's most watched single number.</div></div><div class=\"ge-formal\">A measure of US consumer price inflation compiled by the Bureau of Economic Analysis, based on the GDP accounts rather than a fixed consumer basket. The Federal Reserve's preferred inflation gauge.</div>"
      },
      "moderate": {
        "bluf": "Core PCE is the Fed's preferred inflation measure. It differs from CPI in three key ways: it uses Fisher chain-weighting (captures substitution), has broader scope (includes employer-paid healthcare), and uses different weights. PCE typically runs 30-40bp below CPI. The Fed targets 2% core PCE.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">All Fed communications, projections (SEP dots), and the official 2% target reference PCE. When markets price fed funds futures, they are implicitly forecasting PCE. The gap between CPI and PCE is usually stable (~30bp) but can widen during periods of shelter inflation divergence, since rent/OER has a lower weight in PCE (~16%) than CPI (~36%).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Core PCE:</strong> excludes food and energy - the single most important inflation number for the Fed</li><li><strong>Supercore PCE:</strong> core services excluding housing - the \"last mile\" measure that captures wage-driven inflation</li><li><strong>CPI-PCE wedge:</strong> when shelter inflation is high, CPI overstates inflationary pressure relative to what the Fed targets</li><li><strong>Release timing:</strong> PCE comes out ~2 weeks after CPI, so markets estimate PCE from CPI data</li></ul></div></div><div class=\"ge-formal\">Personal Consumption Expenditures price index. Chain-weighted Fisher ideal index (substitution-adjusted). Coverage: all consumer spending including imputed items. Fed target: 2% headline PCE, with core PCE as the operational focus.</div>"
      },
      "expert": {
        "bluf": "Core PCE is the Fed's operationally targeted inflation measure. Its advantages over CPI: Fisher chain-weighting captures substitution (vs CPI's Laspeyres fixed basket), broader scope (imputed financial services, employer healthcare), and lower shelter weight reduces the OER distortion. The PCE-CPI wedge is primarily explained by weight and formula effects.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PCE's chain-weighting addresses the Boskin Commission critique of CPI overstatement. But PCE has its own issues: imputed items (financial services, employer healthcare) are estimated rather than observed prices, adding noise. The Dallas Fed trimmed-mean PCE is increasingly used as a persistence measure, stripping out the tails of the distribution rather than fixed categories.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Supercore decomposition:</strong> core services ex-housing PCE is ~55% of core PCE and the most persistent component - driven by wages</li><li><strong>Market-based PCE:</strong> excludes imputed prices entirely - a cleaner but less comprehensive measure</li><li><strong>Trimmed mean PCE:</strong> Dallas Fed's measure strips the top and bottom 24% of price changes - the best persistence filter available</li><li><strong>Forecast: CPI to PCE mapping:</strong> use CPI category data with PCE weights to nowcast PCE before its release - the standard sell-side practice</li></ul></div></div><div class=\"ge-formal\">Chain-weighted Fisher ideal price index for personal consumption expenditures. PCE = CPI - formula effect (~15bp) - weight effect (~15bp) - scope effect (~5bp). Core PCE is the FOMC's operational target. Trimmed mean PCE (Dallas Fed, 24% trim) is the best real-time persistence measure.</div>"
      }
    },

      "core PCE"
    ],

  "PMI": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Purchasing Managers' Index - a monthly survey that shows whether businesses are expanding or contracting. A reading above 50 means growth; below 50 means contraction. It is one of the earliest signals of where the economy is heading.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PMI data comes out weeks before official GDP numbers, making it the first real clue about how the economy is doing. Purchasing managers at companies know early whether orders are rising or falling, whether they are hiring or cutting, and whether their suppliers are delivering faster or slower. All of this feeds into the PMI number.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">A manufacturing PMI of 52 means the factory sector is expanding. A services PMI of 48 means the services sector is contracting. Markets react strongly to PMI releases - a surprise drop from 52 to 47 would signal a sharp economic slowdown and could move stocks and bonds significantly.</div></div><div class=\"ge-formal\">A diffusion index based on monthly surveys of purchasing managers in manufacturing and/or services, where 50 is the dividing line between expansion and contraction.</div>"
      },
      "moderate": {
        "bluf": "PMI is the most timely and widely followed leading indicator of economic activity. The manufacturing PMI leads GDP by roughly one quarter. The composite PMI (manufacturing + services, weighted by sector share) gives the broadest real-time picture. Sub-indices (new orders, employment, prices paid) carry distinct information for different markets.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PMI is a diffusion index, not a level - it measures breadth of expansion, not magnitude. A reading of 55 does not mean growth is twice as fast as at 52.5. The new orders minus inventories sub-index is the most forward-looking component and the best GDP leading indicator. Prices paid feeds directly into inflation expectations.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Flash vs final:</strong> the flash PMI (early in the month, smaller sample) moves markets; the final release rarely surprises</li><li><strong>Manufacturing vs services:</strong> manufacturing is more cyclical but a smaller share of GDP in developed economies</li><li><strong>New orders/inventories:</strong> this ratio leads the headline PMI by 1-2 months</li><li><strong>Cross-country divergence:</strong> when US PMI is strong but Europe is weak, it signals divergent growth and likely FX moves</li></ul></div></div><div class=\"ge-formal\">A diffusion index: percentage of respondents reporting improvement + 0.5 x percentage reporting no change. Range 0-100; 50 = neutral. S&P Global (formerly IHS Markit) compiles for 40+ countries; ISM compiles the US-specific version.</div>"
      },
      "expert": {
        "bluf": "PMI is a diffusion index with good directional signal but poor magnitude information. The composite PMI-to-GDP mapping is approximately: PMI 50 = ~0% GDP growth, each point above 50 adds ~0.2pp of quarterly annualised GDP. The signal content has degraded post-COVID as survey response rates declined and seasonal adjustment factors struggled with pandemic distortions.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PMIs are the backbone of nowcasting models. The Atlanta Fed GDPNow, for example, weights ISM data heavily in its real-time GDP tracking. But PMIs have limitations: they measure breadth not depth, they are sentiment-based (susceptible to anchoring bias), and the 50-threshold is not symmetrically calibrated (readings of 49 can coincide with positive GDP growth).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ISM vs S&P Global:</strong> ISM (US-only, older methodology) and S&P Global (global, standardised) can diverge - markets react to both</li><li><strong>Supplier delivery times:</strong> this component is inverted (slower deliveries = higher PMI) and dominated the index during supply chain crises, distorting the signal</li><li><strong>Price pressures sub-index:</strong> the best short-term leading indicator for PPI and CPI goods inflation</li><li><strong>EM PMIs:</strong> China Caixin PMI often diverges from official NBS PMI - the gap reveals state vs private sector health</li></ul></div></div><div class=\"ge-formal\">Diffusion index: DI = (P_increase x 1) + (P_unchanged x 0.5) + (P_decrease x 0). GDP mapping: approximately 0.2pp annualised GDP growth per PMI point above 50 (US). Signal-to-noise ratio highest for composite PMI, weakest for single sub-indices.</div>"
      }
    },

  "PPI": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Producer Price Index - measures price changes from the seller's perspective, before goods reach consumers. It tracks what factories, farms, and mines charge for their products. PPI often foreshadows consumer inflation because when producers pay more, they eventually pass those costs to shoppers.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PPI is an early warning signal for consumer inflation. If the price of steel, wheat, or energy rises at the producer level, those higher costs eventually show up in the prices of cars, bread, and electricity bills. Watching PPI helps predict where CPI is heading in the coming months.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If PPI for processed goods rises 8% year-over-year, it suggests manufacturers are facing sharply higher input costs. They will either absorb those costs (squeezing profit margins) or pass them on to consumers (pushing CPI higher). Usually, it is a mix of both.</div></div><div class=\"ge-formal\">A measure of price changes at the wholesale/producer level, tracking the selling prices received by domestic producers for their output. Published monthly by national statistics offices.</div>"
      },
      "moderate": {
        "bluf": "PPI measures prices at the producer level and leads CPI by 1-3 months in the goods pipeline. The key PPI categories that feed into PCE are healthcare services (portfolio management, physician services) and trade services (retail margins) - these PPI components are used directly in constructing PCE.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PPI's importance goes beyond being a CPI leading indicator. Several PPI components feed directly into the PCE calculation (healthcare, financial services, airfares). The PPI for final demand is the cleanest signal; intermediate demand PPI shows pipeline pressures building before they hit finished goods.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Final demand vs intermediate:</strong> intermediate demand PPI leads final demand by 1-2 months</li><li><strong>PPI-CPI pass-through:</strong> varies by category and market power - commodity pass-through is fast, services is slow</li><li><strong>PCE components:</strong> PPI healthcare and financial services directly feed PCE - watch these for PCE nowcasting</li><li><strong>Core PPI:</strong> excluding food, energy, and trade services gives the cleanest underlying trend</li></ul></div></div><div class=\"ge-formal\">Producer Price Index for final demand: measures prices received by domestic producers. Pipeline: crude materials (stage 1) to intermediate demand (stage 2) to final demand (stage 3). Key for PCE nowcasting: PPI healthcare services, portfolio management fees, and airline fares feed directly into the PCE calculation.</div>"
      },
      "expert": {
        "bluf": "PPI for final demand is a necessary input for PCE nowcasting - several PCE components (healthcare, portfolio management, airfares) are sourced from PPI rather than CPI. The PPI-to-PCE mapping is the primary reason markets react to PPI releases, not the producer price signal per se.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">PPI's market-moving content is almost entirely about its PCE implications. The BEA uses PPI data to construct PCE categories where CPI data is unavailable or inferior. The key PPI-to-PCE bridges: portfolio management fees (PPI financial services), physician services (PPI healthcare), and airfares (PPI air transportation). After CPI and PPI are released, analysts can construct a near-complete PCE estimate before the BEA publishes it.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>PPI-PCE bridge categories:</strong> portfolio management (affects PCE financial services), healthcare (affects PCE medical services), airfares (affects PCE transportation)</li><li><strong>Margin pressure:</strong> PPI final demand minus PPI intermediate demand shows whether producers are absorbing or passing through cost pressure</li><li><strong>Global PPI divergence:</strong> China PPI deflation while US PPI is positive signals goods disinflation importing channel</li><li><strong>Revision patterns:</strong> PPI seasonal adjustments are revised heavily - initial readings have significant noise</li></ul></div></div><div class=\"ge-formal\">Producer Price Index for final demand: BLS survey of selling prices received by domestic producers. PPI-to-PCE bridge: approximately 25% of PCE components use PPI source data rather than CPI. Key bridges: portfolio management fees (NAICS 523920), physician services (NAICS 621111), airline fares (NAICS 481111).</div>"
      }
    },

  "QE": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Quantitative Easing - when a central bank creates new money to buy government bonds and other assets. This pushes interest rates down and floods the financial system with cash, encouraging lending and spending when the economy is struggling.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">QE is the emergency tool central banks reach for when cutting interest rates to zero is not enough. By buying huge amounts of bonds, the central bank pushes their prices up and their yields down, making borrowing cheaper across the economy. It also signals that the central bank will do whatever it takes to support growth.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the economy as a car stuck in mud. Cutting rates is pressing the accelerator. QE is getting out and physically pushing. The central bank injects money directly into the financial system by buying assets from banks, giving them cash to lend out.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">After the 2008 financial crisis, the US Federal Reserve bought over $4 trillion in bonds through three rounds of QE. During COVID, it bought another $5 trillion. These purchases kept mortgage rates low and supported stock prices, helping the economy recover faster.</div></div><div class=\"ge-formal\">A monetary policy tool where the central bank purchases long-term securities (government bonds, mortgage-backed securities) to increase the money supply and lower long-term interest rates when the policy rate is already at or near zero.</div>"
      },
      "moderate": {
        "bluf": "Quantitative Easing is large-scale central bank asset purchases designed to ease financial conditions when the policy rate is at or near the zero lower bound. It works through the portfolio balance channel (compressing term premia), the signalling channel (committing to easy policy), and the wealth effect (boosting asset prices).",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">QE compresses term premia by removing duration from the private sector. When the central bank buys $1tn of 10Y bonds, private investors must hold less duration risk, pushing them into riskier assets (corporate bonds, equities) - the portfolio rebalancing channel. This eases broader financial conditions beyond what rate cuts alone can achieve.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Stock vs flow:</strong> debate over whether QE's impact comes from the total stock of holdings or the flow of ongoing purchases</li><li><strong>Diminishing returns:</strong> each successive round of QE has less impact as term premia are already compressed</li><li><strong>Exit risk:</strong> the 2013 \"taper tantrum\" showed markets react violently to even hints of QE reduction</li><li><strong>Balance sheet size:</strong> Fed peaked at $9tn (2022), ECB at ~$9tn, BOJ at ~$5tn</li></ul></div></div><div class=\"ge-formal\">Central bank purchase of long-duration assets funded by reserve creation. Transmission: portfolio balance (duration removal), signalling (forward commitment), and wealth/collateral channels. Estimated impact: $500-600bn in purchases is roughly equivalent to a 25bp rate cut.</div>"
      },
      "expert": {
        "bluf": "QE is reserve-funded duration extraction from the private sector. Its primary channel is term premium compression via duration removal, with secondary effects through signalling and collateral/reserve abundance. Effectiveness is state-dependent - powerful at the ZLB with dysfunctional markets, diminishing in normal conditions.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">QE mechanically increases reserves and reduces duration in the private sector. The Vayanos-Vila preferred habitat model provides the theoretical framework: removing supply of long-duration bonds from price-sensitive investors compresses the term premium. Empirical estimates: Fed QE1 compressed 10Y yields by ~100bp; subsequent rounds had diminishing impact (~15-25bp per $500bn).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Reserve abundance:</strong> QE pushes the system into reserve abundance, making the Fed's floor system (IOER/IORB) the binding rate-setting mechanism</li><li><strong>Fiscal interaction:</strong> QE during fiscal expansion is monetisation in all but name. The consolidated government balance sheet (Treasury + Fed) determines the net duration supplied to markets</li><li><strong>International spillovers:</strong> QE in one jurisdiction drives capital into others via the portfolio balance channel - the \"global financial cycle\"</li><li><strong>Reversal (QT):</strong> the asymmetry between QE and QT effects is debated - QT may have smaller per-dollar impact due to different market conditions</li></ul></div></div><div class=\"ge-formal\">Large-scale asset purchases funded by reserve creation. Duration removal: change in term premium is approximately proportional to change in CB-held duration relative to total market duration. Krishnamurthy-Vissing-Jorgensen decomposition: safety premium + duration risk premium + prepayment risk channels. State-dependent effectiveness: high during financial crises (market repair), lower during structural demand deficiency.</div>"
      }
    },

  "QT": {
    "complexity": 3,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Quantitative Tightening - the opposite of QE. The central bank lets bonds it bought during QE mature without replacing them, or actively sells them. This slowly drains money from the financial system and pushes interest rates higher.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">After years of QE, central banks accumulated trillions in bonds. QT is the process of shrinking those holdings back down. It reduces the amount of cash in the banking system and puts upward pressure on long-term interest rates. Think of it as slowly deflating a balloon that was pumped up during a crisis.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The Fed started QT in 2022, allowing up to $95 billion per month in bonds to mature without reinvesting. This has slowly reduced its balance sheet from $9 trillion toward $7 trillion, draining liquidity from the banking system.</div></div><div class=\"ge-formal\">The process of reducing a central bank's balance sheet by allowing holdings to mature without reinvestment (passive QT) or by actively selling assets (active QT), reversing the effects of quantitative easing.</div>"
      },
      "moderate": {
        "bluf": "Quantitative Tightening reverses QE by reducing the central bank's balance sheet, re-inserting duration into the private sector, and draining reserves. It tightens financial conditions through the term premium channel - estimated at roughly 25bp per $500bn in runoff, though the symmetry with QE is debated.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">QT increases the duration the private sector must absorb, putting upward pressure on term premia. It also drains reserves from the banking system, which can tighten funding conditions. The key question is where \"reserve scarcity\" begins - the Fed learned in 2019 (repo market blowup) that it had tightened too far.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Reserve levels:</strong> when reserves fall below ~$3tn (US), funding stress emerges - the 2019 repo spike was the warning</li><li><strong>RRP facility:</strong> the Fed's reverse repo facility acts as a buffer, draining before bank reserves do</li><li><strong>Treasury issuance mix:</strong> QT coinciding with heavy Treasury issuance doubles the duration supply to the private sector</li><li><strong>Pace vs stock:</strong> the monthly runoff cap ($95bn for the Fed) determines how fast the tightening occurs</li></ul></div></div><div class=\"ge-formal\">Balance sheet reduction through maturity runoff or active sales. Reverses QE's duration extraction: re-inserts term premium into the long end. Estimated tightening equivalence: ~25bp per $500bn reduction, though state-dependent and asymmetric with QE.</div>"
      },
      "expert": {
        "bluf": "QT is the reverse of reserve-funded duration extraction. It re-inserts duration supply into the private sector while draining reserves. The binding constraint is reserve scarcity - the level at which the interbank rate detaches from the floor (IORB) and money market stress emerges. The 2019 repo crisis was the canonical example of QT overshooting.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">QT interacts with Treasury issuance: when QT releases $60bn/month in duration and Treasury issues $200bn/month in net new supply, the private sector absorbs $260bn/month - the combined effect that drove the 2023 term premium repricing. The composition of runoff matters: letting MBS roll off is slower (prepayment-dependent) and less predictable than Treasury runoff.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Reserve demand curve:</strong> reserves are abundant until they are not - the transition is nonlinear and hard to predict. The Fed's Standing Repo Facility (SRF) is the backstop</li><li><strong>ON RRP drainage:</strong> QT first drains the ON RRP facility (money market fund cash), then bank reserves - the sequencing determines when stress appears</li><li><strong>International QT:</strong> ECB and BOJ normalisation adds to global duration supply simultaneously - the combined effect is larger than any single central bank's QT</li><li><strong>Shadow rate equivalent:</strong> Wu-Xia shadow rate framework estimates QT's equivalent policy rate impact at ~25bp per $500bn, but confidence intervals are wide</li></ul></div></div><div class=\"ge-formal\">Balance sheet normalisation via maturity runoff (passive) or asset sales (active). Duration supply to private sector increases as central bank holdings decrease. Reserve scarcity threshold estimated at lowest comfortable level of reserves - approximately $3-3.5tn for the Fed system.</div>"
      }
    },

  "forward guidance": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When a central bank tells the public what it plans to do with interest rates in the future. By giving advance warning, it helps businesses and investors plan ahead and reduces surprises that could destabilise markets.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Markets do not just react to what central banks do today - they react to what they expect central banks to do tomorrow. If the Fed says it plans to keep rates low for the next two years, that immediately lowers long-term borrowing costs even before any actual rate cuts happen. This makes forward guidance a powerful tool in itself.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In 2020, the Fed said it would keep rates \"near zero\" until the economy reached \"maximum employment\" and inflation was \"on track to moderately exceed 2%.\" This commitment helped keep mortgage rates low and supported the recovery, even though it was just words - no money was actually printed.</div></div><div class=\"ge-formal\">Communication by a central bank about the likely future path of monetary policy, designed to influence financial conditions and economic decisions by shaping market expectations.</div>"
      },
      "moderate": {
        "bluf": "Forward guidance is a monetary policy tool that shapes market expectations about the future path of rates. It can be calendar-based (\"until Q3 2024\"), state-contingent (\"until unemployment falls below 6.5%\"), or qualitative (\"for a considerable time\"). The credibility and precision of guidance determines its effectiveness.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Forward guidance works by anchoring the expected path of short-term rates, which determines the entire yield curve. If the market believes the central bank will hold at zero for two years, the 2Y yield stays near zero regardless of current conditions. This is \"Delphic\" guidance (revealing the central bank's forecast) vs \"Odyssean\" guidance (committing to a course of action).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Dot plot:</strong> the Fed's quarterly projection of the policy rate path - the most concrete form of guidance</li><li><strong>Conditionality:</strong> state-contingent guidance (\"data-dependent\") is more credible than calendar-based (which may need to be abandoned)</li><li><strong>Market pricing vs guidance:</strong> when OIS pricing diverges significantly from the dot plot, one of them is wrong</li><li><strong>Credibility cost:</strong> breaking guidance (as the Fed did in 2021 when \"transitory\" inflation forced early tightening) damages future guidance effectiveness</li></ul></div></div><div class=\"ge-formal\">Central bank communication about the intended future policy rate path. Types: Delphic (forecast-based), Odyssean (commitment-based), calendar-based, state-contingent. Transmission: anchors expected short rate path, which determines the yield curve via the expectations hypothesis.</div>"
      },
      "expert": {
        "bluf": "Forward guidance is a commitment device that operates through the expectations hypothesis channel. Odyssean guidance (binding commitment) is more powerful but introduces time-consistency problems. The Woodford (2012) framework shows that optimal guidance at the ZLB involves committing to \"lower for longer\" than a discretionary central bank would choose - effectively promising to overshoot.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The power of forward guidance depends on credibility, which is non-monotonic: too-precise guidance constrains the central bank and becomes costly to break (ECB's \"at least through end of 2019\" guidance was abandoned). Too-vague guidance has no anchoring effect. The optimal design is state-contingent with clear thresholds (Bernanke's Evans Rule: rates at zero until unemployment below 6.5% or inflation above 2.5%).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Forward guidance puzzle:</strong> empirically, guidance has more impact than models predict - possibly because it reveals private information about the central bank's reaction function</li><li><strong>Reversal costs:</strong> the credibility hit from breaking guidance is asymmetric - breaking a dovish commitment (hiking earlier than guided) is less damaging than breaking a hawkish one</li><li><strong>SEP dot plot dispersion:</strong> wide dispersion among FOMC members undermines collective guidance credibility</li><li><strong>ZLB commitment:</strong> Eggertsson-Woodford framework: optimal ZLB policy involves committing to allow above-target inflation after the constraint binds - but this is time-inconsistent</li></ul></div></div><div class=\"ge-formal\">Expectation management via central bank communication. Woodford (2012): guidance at the ZLB should commit to \"lower for longer\" than discretionary optimum. Campbell et al. decomposition: Delphic (information about CB forecast) vs Odyssean (commitment). Effectiveness: approximately 10-15bp on 2Y yield per year of additional ZLB commitment.</div>"
      }
    },

  "inflation targeting": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "A central bank strategy where the bank announces a specific inflation goal - usually 2% per year - and adjusts interest rates to try to hit it. This gives businesses and workers a clear anchor for planning prices and wages.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When people know the central bank is committed to keeping inflation near 2%, they plan accordingly. Businesses set prices expecting 2% inflation. Workers negotiate wages expecting 2%. This expectation becomes self-fulfilling and keeps inflation stable. Without this anchor, inflation expectations can drift, making the central bank's job much harder.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">New Zealand pioneered inflation targeting in 1990. Since then, most major central banks have adopted it. The Fed officially targets 2% (PCE measure). The ECB targets 2%. The Bank of England targets 2% (CPI). When COVID pushed US inflation to 9%, the test was whether the Fed's 2% target was credible enough that expectations would stay anchored.</div></div><div class=\"ge-formal\">A monetary policy framework where the central bank commits to a specific, publicly announced inflation rate target and adjusts its instruments (primarily the policy rate) to achieve it over the medium term.</div>"
      },
      "moderate": {
        "bluf": "Inflation targeting is the dominant central bank framework globally. The 2% target provides an expectations anchor that simplifies monetary transmission. The Fed's 2020 shift to \"average inflation targeting\" (AIT) was a regime change - allowing temporary overshoots to make up for past undershoots, addressing the ZLB constraint.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The credibility of the inflation target is a central bank's most valuable asset. When expectations are anchored, supply shocks (oil prices, supply chains) cause temporary inflation blips without triggering wage-price spirals. When expectations de-anchor, every shock becomes persistent. The 2021-2023 inflation episode tested whether decades of credibility would hold.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Breakeven inflation:</strong> market-implied inflation expectations - the real-time test of target credibility</li><li><strong>Survey expectations:</strong> University of Michigan 5Y expectations and NY Fed SCE - if these drift above 3%, the target is losing credibility</li><li><strong>Symmetric vs asymmetric:</strong> do central banks fight above-target inflation as aggressively as below-target? History suggests not</li><li><strong>AIT in practice:</strong> the Fed's average inflation target was never formally invoked during the 2021-2023 overshoot</li></ul></div></div><div class=\"ge-formal\">A monetary policy regime where the central bank's primary objective is achieving a numerical inflation target (typically 2%) over the medium term (1-3 years). Variations: point target, range target, average inflation targeting (AIT).</div>"
      },
      "expert": {
        "bluf": "Inflation targeting is a constrained discretion framework anchored by a publicly committed numerical target. Its effectiveness depends entirely on expectations anchoring - the Barro-Gordon time inconsistency problem solved via institutional commitment. The post-COVID question: has the effective target drifted to 2.5-3%, even if the official target remains 2%?",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The Woodford New Keynesian framework provides the theoretical foundation: welfare-optimal policy under sticky prices approximates strict inflation targeting. In practice, all central banks exercise \"flexible\" inflation targeting (weighing output alongside inflation), making the Taylor Principle (responding more than one-for-one to inflation) the key credibility constraint.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Credibility test:</strong> 5Y5Y inflation swaps remain near 2.3-2.5% - slightly elevated but not de-anchored. The margin of comfort is thin</li><li><strong>Fiscal dominance risk:</strong> if fiscal deficits become large enough, the central bank may be forced to accommodate inflation to keep debt serviceable</li><li><strong>Price level vs inflation targeting:</strong> PLT would have required the Fed to undershoot after the 2021-2023 overshoot - AIT is ambiguous on this point</li><li><strong>R-star interaction:</strong> if r* has risen, hitting 2% inflation may require structurally higher nominal rates - political palatability becomes the constraint</li></ul></div></div><div class=\"ge-formal\">Constrained discretion monetary framework with publicly committed numerical target. Theoretical basis: Woodford (2003) welfare-optimal policy under Calvo pricing. Time consistency solved via institutional independence and target commitment. Variations: flexible IT (dual mandate), strict IT, average IT, price-level targeting.</div>"
      }
    },

  "deposit rate": {

    "levels": {
      "beginner": {
        "bluf": "The interest rate a central bank pays (or charges) commercial banks for parking money overnight. In the eurozone, the ECB's deposit rate is the key policy rate - it determines the floor for all other interest rates in the economy.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Banks hold reserves at the central bank. The deposit rate is what they earn (or pay, if negative) on those reserves. Since no bank would lend to another at a rate below what the central bank pays, the deposit rate sets the floor for short-term rates across the entire financial system.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The ECB's deposit rate was negative (-0.5%) from 2014 to 2022 - banks were charged to park money, an incentive to lend it out instead. When inflation surged, the ECB raised it to 4.0%, making it attractive for banks to hold reserves and expensive for them to lend.</div></div><div class=\"ge-formal\">The interest rate paid by a central bank on overnight deposits held by commercial banks, typically forming the floor of the interest rate corridor.</div>"
      },
      "moderate": {
        "bluf": "The rate paid on excess reserves, forming the floor of the interest rate corridor. In the ECB's framework, the deposit facility rate is now the primary policy rate because the banking system operates with structural excess liquidity post-QE.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">In a system with excess liquidity, the deposit rate becomes the binding policy rate because banks are net depositors, not net borrowers. The ECB formalised this in 2024. The Fed's equivalent is IORB (Interest on Reserve Balances).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Corridor width:</strong> the gap between lending and deposit rates defines rate volatility</li><li><strong>Excess liquidity:</strong> when reserves are abundant, money market rates trade near the deposit floor</li><li><strong>Tiering:</strong> the ECB exempted some deposits from negative rates to protect bank profitability</li></ul></div></div><div class=\"ge-formal\">The deposit facility rate forming the floor of the central bank's interest rate corridor. In excess liquidity regimes, money market rates converge to the deposit rate.</div>"
      },
      "expert": {
        "bluf": "The deposit facility rate is the effective policy rate in a structural excess liquidity regime. The ECB's March 2024 framework review formalised this by making the DFR the primary rate and narrowing the MRO-DFR corridor to 15bp. The floor system is now the global standard post-QE.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Post-QE excess liquidity pushed money market rates to the deposit floor, making corridor systems obsolete. The ECB, Fed, and BOE all operate de facto floor systems. The deposit rate's transmission to ESTR/SOFR/SONIA is near-perfect despite massive balance sheets.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ESTR-DFR spread:</strong> should be near zero - widening signals money market stress</li><li><strong>Reserve demand curve:</strong> as QT drains reserves, the system may transition back to corridor</li><li><strong>Tiering multiplier:</strong> ECB's formula (6x minimum reserves exempt) balances NII protection with rate transmission</li></ul></div></div><div class=\"ge-formal\">Overnight deposit facility rate forming the corridor floor. ECB post-2024: DFR is primary rate, MRO = DFR + 15bp, MLF = DFR + 40bp. Money market rates converge to DFR when excess liquidity exceeds the critical threshold.</div>"
