  "Exchange Rate": {
    "complexity": 1,
    "category": "fx",
    "levels": {
      "beginner": {
        "bluf": "The exchange rate is how much one currency is worth in terms of another. It determines the price of everything a country imports and exports, and is one of the most visible daily indicators of a country's economic standing in the world.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Exchange rates affect the price of imported goods (a weaker currency makes imports more expensive), the competitiveness of exports (a weaker currency makes your goods cheaper for foreigners to buy), the value of foreign investments, and the cost of foreign travel. For countries that import energy or food, a weak currency can directly raise the cost of living.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of currencies as shares in a country. When investors are confident about a country's economy, they buy its currency (pushing it up). When they are worried, they sell (pushing it down). Interest rates, growth, inflation, and political stability all affect how attractive a currency is to hold.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If USD/JPY is 155, it means one US dollar buys 155 Japanese yen. If this moves to 160, the yen has weakened (you get more yen per dollar). If it moves to 145, the yen has strengthened. A weaker yen makes Japanese exports cheaper for American buyers but makes imported oil more expensive for Japan.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Interest rate differentials are the primary short-term driver - money flows to currencies with higher rates</li><li>Large, rapid moves (10%+ in weeks) can destabilise an economy and often prompt central bank intervention</li><li>The US dollar is the world's reserve currency - its strength or weakness affects every other country</li><li>Some countries fix or manage their exchange rates rather than letting markets decide</li></ul></div></div><div class=\"ge-formal\">The price of one currency expressed in units of another. Quoted either directly (domestic per unit of foreign) or indirectly (foreign per unit of domestic). FX markets are the largest in the world, with over $7 trillion traded daily.</div>"
      },
      "moderate": {
        "bluf": "Exchange rates are driven by interest rate differentials, growth differentials, current account flows, and risk appetite. In the short run, rate expectations dominate (via the carry channel). In the long run, purchasing power parity (PPP) and external balances provide an anchor - but convergence is slow and unreliable.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">FX is the asset class that connects everything: it transmits monetary policy across borders, adjusts external imbalances, and channels capital flows. For equity investors, FX can be half the return when investing internationally. For central banks in open economies, the exchange rate is a key transmission mechanism - a 10% depreciation is roughly equivalent to a 50bp rate cut in terms of financial conditions impact.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Short-term FX is driven by rate expectations (uncovered interest rate parity: high-rate currencies should depreciate to equalise returns, but in practice they appreciate - the carry trade anomaly). Medium-term, current account flows matter: persistent deficits create selling pressure. Long-term, PPP provides a gravitational pull - currencies that are 30%+ overvalued on PPP tend to weaken eventually, but \"eventually\" can be years.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">USD/JPY moved from 115 to 155 between 2022-2024, driven almost entirely by the rate differential: the Fed hiked to 5.5% while the BOJ held at -0.1%. The 550bp rate gap made yen carry trades enormously profitable - borrow yen, invest in dollars. When the BOJ finally hiked in mid-2024, the unwind was violent: USD/JPY fell 15 yen in three weeks.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real effective exchange rate (REER):</strong> trade-weighted and inflation-adjusted - the best measure of competitiveness</li><li><strong>Rate differentials:</strong> 2Y swap rate differentials are the strongest short-term FX predictor</li><li><strong>Positioning:</strong> CFTC Commitment of Traders data shows speculative FX positioning - crowded positions unwind sharply</li><li><strong>Central bank intervention:</strong> BOJ intervention at USD/JPY 160; PBOC manages CNY daily fix - intervention limits are market-moving information</li></ul></div></div><div class=\"ge-formal\">The bilateral exchange rate between two currencies, determined by supply and demand in the foreign exchange market. Key frameworks: uncovered interest parity (UIP), purchasing power parity (PPP), and the balance of payments approach. Empirically, exchange rate models perform poorly vs a random walk at short horizons (Meese-Rogoff puzzle).</div>"
      },
      "expert": {
        "bluf": "FX is the residual asset class - it clears all cross-border capital account and current account flows. The carry trade (forward rate bias) violates UIP systematically, generating positive returns punctuated by sharp reversals during risk-off events. Dollar cycle dynamics (driven by relative monetary policy, risk appetite, and reserve diversification) dominate the global macro landscape.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The dollar cycle is the single most important macro variable globally. Dollar strength tightens global financial conditions (via dollar-denominated debt servicing costs), compresses EM growth, and drains global liquidity. Dollar weakness does the reverse. The DXY is not just a price - it is a global financial conditions index. The Milkshake Theory (Brent Johnson): structural demand for dollars (reserve status, eurodollar system, dollar-denominated liabilities) creates persistent dollar strength that eventually destabilises the system.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">FX models are famously bad (Meese-Rogoff). In practice, the three factors that work: (1) relative rate expectations (2Y OIS differentials), (2) terms of trade shocks (commodity prices for resource currencies), and (3) positioning extremes (crowded carry trades unwind violently). PPP is a 10-year anchor with ~5-year half-life of deviations. Most FX alpha comes from timing the carry trade regime (risk-on vs risk-off) rather than predicting equilibrium rates.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The yen carry trade unwind of August 2024 demonstrated the nonlinearity of FX positioning. An estimated $1tn in yen-funded carry positions unwound in days when the BOJ hiked and the Fed signalled cuts simultaneously - compressing the rate differential from both sides. USD/JPY moved 15% in three weeks, the Nikkei fell 12% in a day, and VIX spiked to 65. The carry trade is a slow escalator up and a fast elevator down.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Cross-currency basis:</strong> the deviation from covered interest parity reveals dollar funding stress. Persistent negative basis = structural dollar shortage</li><li><strong>FX reserve composition (IMF COFER):</strong> gradual diversification away from USD (~59% of reserves, down from 70%) is a slow structural headwind for the dollar</li><li><strong>Real rate differentials:</strong> nominal rate differentials adjusted for inflation expectations - the true carry adjusted for purchasing power erosion</li><li><strong>Vol-adjusted carry:</strong> carry/implied vol (the Sharpe ratio of the carry trade) determines when carry is attractive vs when the risk exceeds the reward</li></ul></div></div><div class=\"ge-formal\">The nominal bilateral exchange rate. Key identity: covered interest parity (CIP) should hold by arbitrage: F/S = (1+r_d)/(1+r_f). CIP violations (non-zero cross-currency basis) indicate dollar funding market stress. UIP (uncovered) is systematically violated - the forward rate bias (carry premium) averages ~2-3% annually for G10 but exhibits negative skewness and excess kurtosis (crash risk).</div>"
      }
    },

  "FX Vol": {
    "complexity": 2,
    "category": "fx",
    "levels": {
      "beginner": {
        "bluf": "FX volatility measures how much a currency's exchange rate swings day to day. Higher FX volatility means more uncertainty about what a currency will be worth tomorrow, making it harder for businesses to plan and more expensive to hedge international transactions.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Businesses that import or export goods need to convert currencies. If a currency is volatile, the price they pay or receive can change dramatically between when they agree a deal and when they settle it. High FX vol increases the cost of doing international business and can deter foreign investment - investors do not like uncertainty about what their returns will be worth when converted back to their home currency.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Imagine planning a holiday abroad. If the exchange rate is stable, you know roughly what things will cost. If it is volatile, the same hotel room might cost you 20% more or less by the time you travel. Businesses face this uncertainty constantly, multiplied across millions of transactions. FX vol is the measure of this uncertainty.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If EUR/USD implied vol is 8%, the market expects the euro-dollar rate to move roughly 8% over the next year. During calm periods, major currency vol is 5-8%. During crises, it can spike to 15-25%. Emerging market currencies are naturally more volatile - Turkish lira vol has exceeded 30% during its currency crises.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>G10 FX vol below 7%: calm - central bank policies are predictable, carry trades are profitable</li><li>G10 FX vol above 12%: stressed - usually coincides with monetary policy surprises or geopolitical shocks</li><li>EM FX vol tends to be 2-3x G10 levels and spikes more violently</li><li>When FX vol rises across all currencies simultaneously, it signals a global risk-off event</li></ul></div></div><div class=\"ge-formal\">The implied volatility of exchange rate options, typically quoted for 1-month or 3-month at-the-money options, expressed as an annualised percentage.</div>"
      },
      "moderate": {
        "bluf": "FX implied volatility prices the expected magnitude of currency moves. It drives hedging costs, carry trade profitability (via the carry-to-vol ratio), and acts as a risk appetite indicator. Low FX vol compresses hedging costs and encourages leveraged carry - sowing the seeds of the next vol spike.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">FX vol determines the cost of currency hedging for all cross-border investors and corporates. For a US investor in Japanese equities, the cost of hedging JPY exposure is directly proportional to USD/JPY implied vol. Low vol also makes carry trades more attractive (higher Sharpe ratio), increasing speculative positioning that amplifies the eventual unwind.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">FX vol exhibits two regimes: a low-vol regime where central banks are predictable and carry accrues steadily, and a high-vol regime where policy surprises or risk-off events trigger sharp repositioning. The transition between regimes is asymmetric - vol rises quickly (in days) and declines slowly (over weeks to months). The VIX equivalent for FX is the CVIX (Deutsche Bank) or the JPMorgan G7 Vol Index.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">EUR/USD 1-month implied vol was ~6% for most of early 2024 - low by historical standards. When the French snap election was called in June, it spiked to 9% as markets priced political uncertainty. After the election resolved, it drifted back. Political events are the most common trigger for FX vol spikes in developed markets.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Risk reversal (25-delta):</strong> the skew of FX options - measures directional fear (e.g. demand for USD puts vs calls)</li><li><strong>Implied-realised gap:</strong> when implied vol far exceeds realised, options are expensive and vol sellers step in</li><li><strong>Event pricing:</strong> FX vol tenors that straddle known events (elections, central bank meetings) embed event premiums</li><li><strong>Correlation:</strong> rising FX vol correlation across pairs signals systematic risk-off, not idiosyncratic moves</li></ul></div></div><div class=\"ge-formal\">The implied volatility of at-the-money FX options, typically 1-month or 3-month tenor, annualised. FX vol surfaces also quote 25-delta and 10-delta risk reversals (skew) and butterflies (kurtosis), providing a full implied distribution of expected exchange rate moves.</div>"
      },
      "expert": {
        "bluf": "FX implied vol is the market-clearing price for currency optionality. The vol surface (delta x tenor) encodes the risk-neutral distribution of expected exchange rate paths. The carry-to-vol ratio determines the Sharpe ratio of the carry trade, and vol regime transitions are the primary driver of carry trade P&L dispersion.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">FX vol is the key input into every cross-border portfolio decision. For leveraged carry traders, the vol regime determines position sizing (risk parity scales inversely to vol). For corporates, the hedging cost (option premium) is a direct function of implied vol. For sovereign reserve managers, the vol of their reserve currency basket affects the real diversification benefit of holding multiple currencies.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The FX vol smile reveals market expectations beyond the central case. A steep smile (wings well above ATM) means the market expects fat tails - large moves are priced as more likely than a normal distribution would predict. A steep risk reversal (puts vs calls) means the market sees asymmetric risk in one direction. For the yen, persistent downside risk reversal meant the market consistently priced large yen depreciation as more likely than large appreciation - until the carry trade unwind proved the opposite tail was the real risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Pre-August 2024, USD/JPY 3-month implied vol was ~9% with a risk reversal favouring USD calls (yen weakness). The carry trade was earning ~5% annualised with ~9% vol - a Sharpe ratio of ~0.55. After the BOJ hike triggered the unwind, vol spiked to 20%+ and the risk reversal flipped to favour USD puts. The carry-to-vol ratio collapsed, making the trade unattractive and preventing repositioning. This is the reflexive dynamic: vol spikes kill carry, which forces position liquidation, which increases vol further.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Cross-currency basis vol:</strong> the volatility of the covered interest parity (CIP) deviation - spikes signal dollar funding stress</li><li><strong>Gamma vs vega:</strong> short-dated gamma (exposure to realised moves) vs long-dated vega (exposure to implied vol level) have different risk profiles and different drivers</li><li><strong>Dealer positioning:</strong> bank risk reports show aggregate dealer gamma and vega exposure - when dealers are short gamma, their hedging amplifies moves</li><li><strong>EM-DM vol divergence:</strong> when EM FX vol spikes but G10 stays calm, risk is contained. When both spike, it is a global liquidity event</li></ul></div></div><div class=\"ge-formal\">ATM implied volatility from the FX options market, annualised. The full vol surface is parameterised by: ATM vol (level), 25Δ risk reversal (skew), 25Δ butterfly (kurtosis), across tenors from overnight to 1 year. Carry-to-vol ratio = (interest rate differential) / (implied vol) - the Sharpe ratio of the unhedged carry trade. Regime-dependent: mean ~0.5 in low-vol, negative in high-vol.</div>"
      }
    },

      "FX volatility",

  "Inflation (CPI)": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Inflation is a sustained increase in the overall price level of goods and services, which reduces the purchasing power of money over time.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When inflation rises, each unit of currency buys fewer things. If your income doesn't keep up with inflation, you're effectively getting poorer even if your paycheck stays the same.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of money as a measuring stick for value. Inflation means the stick is slowly shrinking. Prices aren't just going up randomly - the value of money itself is going down relative to goods and services.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a basket of everyday items costs $100 this year and $103 next year, the inflation rate is 3%. Central banks try to keep inflation around 2% - enough to encourage spending but not so much that money loses value quickly.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\">Central banks fight high inflation by raising interest rates, which makes borrowing more expensive and slows spending. Deflation (falling prices) sounds good but can trap an economy - people delay purchases expecting lower prices, causing a downward spiral.</div></div>"
      },
      "moderate": {
        "bluf": "Inflation is the sustained rate of increase in the general price level, measured by indices like CPI or PCE. Central banks target ~2% as the sweet spot.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why 2%</div><div class=\"ge-body\">High enough to avoid the zero lower bound (where central banks run out of room to cut rates), low enough to preserve purchasing power. The \"last mile\" of disinflation - getting from 3% to 2% - is proving the hardest part of the current cycle.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Key measures</div><div class=\"ge-body\">Headline CPI includes everything. Core CPI strips out volatile food and energy to reveal the underlying trend. The Fed watches core PCE (not CPI) as its preferred gauge - it uses different weighting and typically runs 30-40bps lower.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Transmission mechanism</div><div class=\"ge-body\">Demand pressure transmits through wages to prices, but supply shocks (energy, supply chains) can drive inflation independently. Shelter/housing is often the stickiest component; goods tend to normalise fastest after supply shocks.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Market impact</div><div class=\"ge-body\">Inflation determines real interest rates, erodes nominal debt burdens, affects wage negotiations, and is the primary variable central banks target. It transmits directly to bond yields, FX, and equity valuations.</div></div>"
      },
      "expert": {
        "bluf": "Inflation is the rate of change of the general price level. The distinction between headline, core, trimmed mean, and supercore measures is critical.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Persistence measures</div><div class=\"ge-body\">Core services ex-housing (\"supercore\") is the Fed's current obsession as the last-mile measure. Trimmed mean (Dallas Fed, RBA) is more robust to outliers than exclusion-based core. Median CPI (Cleveland Fed) is a complementary persistence signal.</div></div><div class=\"ge-section\"><div class=\"ge-head\">CPI vs PCE</div><div class=\"ge-body\">PCE uses Fisher weighting (substitution-adjusted), broader scope (includes employer-paid healthcare), and typically runs 30-40bps below CPI. The wedge matters for policy interpretation - the Fed targets PCE, markets watch CPI.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Measurement bias</div><div class=\"ge-body\">Boskin Commission estimated CPI overstates inflation by ~0.5-1pp (substitution, quality adjustment, new goods effects). Shelter lag: OER/rent of shelter lags market rents by 12-18 months, distorting turning points.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Expectations anchoring</div><div class=\"ge-body\">Assessed via breakevens (TIPS-implied), survey-based (Michigan, SPF), and model-based (FRB/US). De-anchoring risk is asymmetric and self-fulfilling. The Phillips Curve slope has flattened but remains nonlinear - steepening materially below 4% unemployment.</div></div>"
      }
    },

<script>

let currentLevel='beginner', activeBubble=null;

// ── DATA BOOTSTRAP ──
// Parse JSON data blocks into the variables the renderer expects
const _countries = JSON.parse(document.getElementById('countries-data').textContent);
const _glossary = JSON.parse(document.getElementById('glossary-data').textContent);
const _appConfig = JSON.parse(document.getElementById('app-config').textContent);

// ── Reconstruct countries array (renderer expects array of objects) ──
const countries = Object.values(_countries).map(c => ({
  code: c.code, name: c.name, flag: c.flag, lat: c.lat, lon: c.lon,
  weather: c.weather, metrics: c.metrics
}));

// ── Reconstruct cardStories {level: {code: [bullets]}} ──
const cardStories = {beginner:{}, moderate:{}, expert:{}};
Object.values(_countries).forEach(c => {
  ['beginner','moderate','expert'].forEach(lv => {
    if(c.stories && c.stories[lv]) cardStories[lv][c.code] = c.stories[lv];
  });
});

// ── Reconstruct glossary (renderer expects {term: {complexity, beginner, moderate, expert}}) ──
const glossary = {};
Object.entries(_glossary).forEach(([term, entry]) => {
  glossary[term] = { complexity: entry.complexity };
  ['beginner','moderate','expert'].forEach(lv => {
    const lev = entry.levels[lv];
    if(!lev) return;
    // If it has full content, keep as {bluf, full} object; otherwise just the string
    glossary[term][lv] = lev.full ? { bluf: lev.bluf, full: lev.full } : lev.bluf;
  });
});

// ── Reconstruct fxRegime {code: {label, beginner, moderate, expert}} ──
const fxRegime = {};
Object.values(_countries).forEach(c => {
  if(c.fxRegime) fxRegime[c.code] = c.fxRegime;
});

// ── Reconstruct historicalData {code: {metric: {...}}} ──
const historicalData = {};
Object.values(_countries).forEach(c => {
  if(c.historical) historicalData[c.code] = c.historical;
});

// ── Reconstruct weather grid data ──
const gdpAllCountries = {};
const cpiAllCountries = {};
Object.values(_countries).forEach(c => {
  if(c.weatherGrid.gdp) gdpAllCountries[c.code] = { flag: c.flag, v: c.weatherGrid.gdp.values };
  if(c.weatherGrid.cpi) cpiAllCountries[c.code] = { flag: c.flag, v: c.weatherGrid.cpi.values };
});

// ── Direct mappings ──
const newsData = _appConfig.globalStories;
const metricSources = _appConfig.metricSources;
const histAnnualLabels = _appConfig.chartConfig.annualLabels;
const histMonthlyLabels = _appConfig.chartConfig.monthlyLabels;
const gdpYears = _appConfig.chartConfig.weatherGridYears;
const footerContent = _appConfig.footer;
const fxSource = metricSources['FX'] || 'WM/Refinitiv · Bloomberg · National central banks';

// ── Expose consolidated data for future use ──

// Chart instance tracker
let activeChart=null;

function renderMetricChart(container, metricName, countryCode, rangeMonths){
  if(activeChart){activeChart.destroy();activeChart=null;}
  const d=historicalData[countryCode];
  if(!d) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }
  const cfg=d[metricName];
  if(!cfg) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }

  const isAnnual=!!cfg.annual;
  const allLabels=isAnnual?histAnnualLabels:histMonthlyLabels;
  const allVals=cfg.v;
  const n=rangeMonths&&!isAnnual?rangeMonths:allVals.length;
  const sliceVals=allVals.slice(-n);
  const sliceLabels=allLabels.slice(-n);
  const mn=Math.min(...sliceVals), mx=Math.max(...sliceVals);
  const range=mx-mn;
  const pad=range*0.15||(Math.abs(mx)*0.1)||1;

  container.innerHTML='<canvas></canvas>';
  const canvas=container.querySelector('canvas');
  canvas.addEventListener('click',e=>e.stopPropagation());
  const ctx=canvas.getContext('2d');

  // Colors
  const cyan='rgba(0,212,255,';
  const green='rgba(0,230,138,';
  const red='rgba(255,61,90,';

  let datasets, scaleMin, scaleMax;

  if(cfg.type==='bar'){
    // Bar chart - cyan positive, red negative
    datasets=[{
      data:sliceVals,
      backgroundColor:sliceVals.map(v=>v>=0?cyan+'.5)':red+'.5)'),
      borderColor:sliceVals.map(v=>v>=0?cyan+'.8)':red+'.8)'),
      borderWidth:1,
      borderRadius:2
    }];
    scaleMin=mn<0?mn-pad:0;
    scaleMax=mx>0?mx+pad:0;
  } else if(cfg.zeroLine){
    // Yield curve - green above 0, red below 0
    datasets=[{
      data:sliceVals,
      borderWidth:1.5,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.3,
      fill:false,
      segment:{
        borderColor:function(ctx){
          const y0=ctx.p0.parsed.y, y1=ctx.p1.parsed.y;
          if(y0>=0&&y1>=0) return green+'.8)';
          if(y0<0&&y1<0) return red+'.8)';
          return '#888';
        }
      }
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  } else {
    // Standard line chart - cyan with fill
    const grad=ctx.createLinearGradient(0,0,0,120);
    grad.addColorStop(0,cyan+'.18)');
    grad.addColorStop(1,cyan+'.01)');
    datasets=[{
      data:sliceVals,
      borderColor:cyan+'.8)',
      borderWidth:1.5,
      backgroundColor:grad,
      fill:true,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#00d4ff',
      pointHoverBorderColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.35,
      stepped:cfg.stepped||false
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  }

  activeChart=new Chart(ctx,{
    type:cfg.type==='bar'?'bar':'line',
    data:{labels:sliceLabels,datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      events:['mousemove','mouseout','touchstart','touchmove'],
      layout:{padding:{left:2,right:2,top:4,bottom:0}},
      scales:{
        x:{
          display:true,
          grid:{display:false},
          ticks:{
            color:'#333',font:{family:"'Space Mono',monospace",size:8},
            maxRotation:0,autoSkip:true,maxTicksLimit:isAnnual?6:n<=12?6:n<=24?8:10
          },
          border:{display:false}
        },
        y:{
          display:true,
          position:'right',
          grid:{
            color:function(context){
              if(cfg.zeroLine && context.tick.value===0) return 'rgba(255,255,255,.2)';
              return 'rgba(255,255,255,.03)';
            },
            lineWidth:function(context){
              return (cfg.zeroLine && context.tick.value===0)?1.5:1;
            }
          },
          ticks:{
            color:'#444',font:{family:"'Space Mono',monospace",size:8},
            maxTicksLimit:5,
            callback:function(v){
              if(cfg.indexLabel&&v>=1000)return(v/1000).toFixed(v%1000===0?0:1)+'k';
              return v%1===0?v:v.toFixed(1);
            }
          },
          border:{display:false},
          min:scaleMin,
          max:scaleMax
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(15,15,20,.95)',
          borderColor:cfg.zeroLine?'rgba(150,150,150,.4)':'rgba(0,212,255,.4)',
          borderWidth:1,
          titleFont:{family:"'Space Mono',monospace",size:9},
          bodyFont:{family:"'DM Sans',sans-serif",size:11},
          titleColor:'#888',bodyColor:'#fff',
          cornerRadius:4,padding:8,displayColors:false,
          callbacks:{
            label:function(ctx){
              let v=ctx.parsed.y;
              if(cfg.indexLabel)return ' '+v.toLocaleString();
              if(cfg.zeroLine)return ' '+(v>=0?'+':'')+v+'bps';
              return ' '+v;
            }
          }
        }
      },
      interaction:{mode:'index',intersect:false},
      animation:{duration:400,easing:'easeOutCubic'}
    }
  });
}

function isFxMetric(name){ return name.includes('/'); }
function getCountryCode(countryName){ const c=countries.find(co=>co.name===countryName); return c?c.code:null; }

// ── GLOBE ──
function initGlobe(){
  const c=document.getElementById('globeContainer'),w=c.clientWidth,h=c.clientHeight;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,w/h,.1,1000);
  cam.position.z=2.8;
  const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
  ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));c.appendChild(ren.domElement);

  // Globe wireframe
  const gm=new THREE.Mesh(new THREE.SphereGeometry(1,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,wireframe:true,transparent:true,opacity:.13}));
  scene.add(gm);
  // Solid inner
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(.98,48,48),new THREE.MeshBasicMaterial({color:0x060612,transparent:true,opacity:.95})));
  // Atmosphere glow
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.10,side:THREE.BackSide})));

  // Lat/lon grid
  for(let i=-60;i<=60;i+=30){const r=Math.cos(i*Math.PI/180),y=Math.sin(i*Math.PI/180),p=[];for(let j=0;j<=360;j+=3){const t=j*Math.PI/180;p.push(new THREE.Vector3(r*Math.cos(t),y,r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.18})));}
  for(let i=0;i<360;i+=30){const p=[],t=i*Math.PI/180;for(let j=-90;j<=90;j+=3){const ph=j*Math.PI/180,r=Math.cos(ph);p.push(new THREE.Vector3(r*Math.cos(t),Math.sin(ph),r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.15})));}

  // Country dots + invisible hit targets
  const dg=new THREE.Group();
  const hitTargets=new THREE.Group();
  countries.forEach(co=>{
    const pos=ll(co.lat,co.lon,1.005);
    // Visible dot
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.015,12,12),new THREE.MeshBasicMaterial({color:0x00d4ff}));
    dot.position.copy(pos);dg.add(dot);
    // Pulse ring
    const rn=new THREE.Mesh(new THREE.RingGeometry(.018,.028,24),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.4,side:THREE.DoubleSide}));
    rn.position.copy(pos);rn.lookAt(pos.clone().multiplyScalar(2));rn.userData={pulse:true};dg.add(rn);
    // Invisible larger hit target
    const hit=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({visible:false}));
    hit.position.copy(pos);hit.userData=co;hitTargets.add(hit);
  });
  scene.add(dg);scene.add(hitTargets);

  // Drag vs click detection
  let rY=0,rX=.1,drag=false,pv={x:0,y:0},dragDist=0,camZ=2.8;
  c.addEventListener('mousedown',e=>{drag=true;dragDist=0;pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-pv.x,dy=e.clientY-pv.y;dragDist+=Math.abs(dx)+Math.abs(dy);rY+=dx*.005;rX=Math.max(-1.2,Math.min(1.2,rX+dy*.005));pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>{drag=false;});

  // Scroll to zoom
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    camZ=Math.max(1.8,Math.min(5,camZ+e.deltaY*.003));
    cam.position.z=camZ;
  },{passive:false});

  // Click only if not dragged
  const ray=new THREE.Raycaster(),ms=new THREE.Vector2();
  c.addEventListener('click',e=>{
    if(dragDist>5) return; // was a drag, not a click
    // Check if a country label was clicked (event delegation)
    const label=e.target.closest('.country-label');
    if(label){
      const co=countries.find(x=>x.code===label.dataset.code);
      if(co) showCard(co);
      return;
    }
    const r=c.getBoundingClientRect();
    ms.x=((e.clientX-r.left)/r.width)*2-1;
    ms.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ms,cam);
    const hits=ray.intersectObjects(hitTargets.children);
    if(hits.length>0 && hits[0].object.userData.code){
      showCard(hits[0].object.userData);
    }
  });

  let t=0;
  (function anim(){requestAnimationFrame(anim);t+=.01;
    gm.rotation.set(rX,rY,0);dg.rotation.set(rX,rY,0);hitTargets.rotation.set(rX,rY,0);
    scene.children.forEach(ch=>{if(ch.isLine)ch.rotation.set(rX,rY,0);if(ch!==gm&&ch!==dg&&ch!==hitTargets&&ch.geometry&&(ch.material.wireframe||ch.material.side===THREE.BackSide||ch.geometry.type==='SphereGeometry'))ch.rotation.set(rX,rY,0);});
    dg.children.forEach(ch=>{if(ch.userData.pulse){const s=1+.3*Math.sin(t*3+ch.position.x*10);ch.scale.set(s,s,s);ch.material.opacity=.3+.2*Math.sin(t*3+ch.position.x*10);}});
    // Labels - project from exact dot position, offset in screen space
    document.querySelectorAll('.country-label').forEach(el=>el.remove());
    countries.forEach(co=>{
      const p=ll(co.lat,co.lon,1.005);
      p.applyEuler(new THREE.Euler(rX,rY,0,'YXZ'));
      if(p.z<0.15) return;
      const pr=p.clone().project(cam),rc=c.getBoundingClientRect();
      const x=(pr.x*.5+.5)*rc.width, y=(-pr.y*.5+.5)*rc.height;
      const el=document.createElement('div');el.className='country-label';
      el.dataset.code=co.code;
      el.innerHTML=`<span class="flag">${co.flag}</span>${co.code}`;
      el.style.cssText=`left:${x}px;top:${y+16}px;transform:translate(-50%,0)`;
      c.appendChild(el);
    });
    ren.render(scene,cam);
  })();
  window.addEventListener('resize',()=>{const w=c.clientWidth,h=c.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);});
}
function ll(lat,lon,r){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));}

function assembleNewsData(idx) {
  const stories = newsData[currentLevel] || newsData.beginner || [];

  if (!story) return null;
  return {icon: story.icon || '', label: story.label || 'Story', body: story.body || '', idx};

function renderNews(d) {
  if (!d) return;
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.innerHTML = applyGlossary(`<div class="tt-close" onclick="this.parentElement.remove()">✕</div>${levelToggleHTML()}<div class="tt-title">${d.icon} ${d.label}</div><div class="tt-story">${d.body}</div>`);

  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showNewsTooltip(idx) {

// ── CARD ──
let activeCardCountry = null;
function assembleCardData(co) {
  const stories = (cardStories[currentLevel] && cardStories[currentLevel][co.code]) || ['Data loading...'];
  const weatherClass = co.weather === '☀️' ? 'sunny' : co.weather === '☁️' ? 'cloudy' : co.weather === '⛈️' ? 'stormy' : '';
  const macro = (co.metrics && co.metrics.macro) || {};
  const market = (co.metrics && co.metrics.market) || {};

function getMetricList(countryName){
  const co=countries.find(c=>c.name===countryName);
  if(!co || !co.metrics) return [];
  const macro = co.metrics.macro || {};
  const market = co.metrics.market || {};
  const macroKeys=Object.keys(macro).map(k=>({name:k,val:macro[k],sec:'macro'}));
  const mktKeys=Object.keys(market).map(k=>({name:k,val:market[k],sec:'market'}));
  return macroKeys.concat(mktKeys);
}

function assembleMTTData(n, v, co, sec) {
  const code = getCountryCode(co);
  const metricList = getMetricList(co);
  const currentIndex = metricList.findIndex(m => m.name === n);

  // Explanation (level-sensitive) - single source of truth from glossary
  const gEntry = glossary[n] || (isFxMetric(n) ? glossary['Exchange Rate'] : null);
  const levelContent = gEntry ? (gEntry[currentLevel] || gEntry.beginner) : null;
  const bluf = levelContent ? getBluf(levelContent) : null;
  const full = levelContent ? getFull(levelContent) : null;

  // Source
  const source = isFxMetric(n) ? fxSource : (metricSources[n] || null);

  // FX regime
  let fxRegimeInfo = null;
  if (isFxMetric(n) && code && fxRegime[code]) {
    const regimeDesc = fxRegime[code][currentLevel] || fxRegime[code].beginner || null;
    if (regimeDesc) {
      fxRegimeInfo = { description: regimeDesc, countryName: co };
    }
  }

  // Historical data
  const histEntry = (code && historicalData[code] && historicalData[code][n]) || null;
  let chart = null;
  if (histEntry) {
    const isAnnual = !!histEntry.annual;
    chart = {
      isAnnual,
      title: histEntry.indexLabel || (isAnnual ? n + ' (Annual)' : '5-Year History'),
      code
    };
  }

  return {
    metricName: n, value: v, countryName: co, section: sec, code,
    bluf, full, source, fxRegimeInfo, chart,
    metricList, currentIndex
  };
}

function assembleWeatherGrid(metric) {

    : [{icon:'wi-sun', emoji:'☀️', label:'1-3%'}, {icon:'wi-cloud', emoji:'☁️', label:'0-1% / 3-5%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;0% / &gt;5%'}];

function parseNum(s){ const n=parseFloat(String(s).replace(/[^-\d.]/g,'')); return isNaN(n)?null:n; }
function assembleCompareData(metricName, highlightCountry, sec) {
  const isFx = isFxMetric(metricName);
  const rows = [];
  countries.forEach(co => {
    if (!co.metrics) return;
    const pool = sec === 'macro' ? (co.metrics.macro || {}) : (co.metrics.market || {});
    let val = pool[metricName], fxKey = metricName;
    if (val === undefined && sec === 'market') {
      const keys = Object.keys(pool);
      fxKey = keys.find(k => k.includes('/'));
      if (fxKey) val = pool[fxKey];
    }
    if (val !== undefined) {
      const regime = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code][currentLevel] || fxRegime[co.code].beginner : null;
      const regimeLabel = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code].label : null;
      rows.push({code: co.code, name: co.name, flag: co.flag, val, num: parseNum(val), fxKey: fxKey || metricName, regime, regimeLabel});
    }
  });
  rows.sort((a, b) => { if (a.num === null && b.num === null) return 0; if (a.num === null) return 1; if (b.num === null) return -1; return b.num - a.num; });
  const maxAbs = Math.max(...rows.filter(r => r.num !== null).map(r => Math.abs(r.num)), 0.01);
  const showRegimes = rows.some(r => r.regime);
  const hasWeatherBtn = metricName === 'GDP Growth' || metricName === 'Inflation (CPI)';
  return {metricName, highlightCountry, sec, rows, maxAbs, showRegimes, isFx, hasWeatherBtn};
}

// ── GLOSSARY ──
function applyGlossary(h, skipTerm){
  if(!h || typeof h !== 'string') return h || '';
  h=h.replace(/<a data-term="([^"]+)">([^<]+)<\/a>/g,(_,t,x)=>`<span class="glossary-term" data-term="${t}">${x}</span>`);
  const skipSet=new Set();
  if(skipTerm){const sl=skipTerm.toLowerCase();skipSet.add(sl);skipSet.add(sl.replace(/\s*\(.*\)\s*/g,'').trim());}
  Object.keys(glossary).forEach(t=>{const g=glossary[t];if(!g)return;const c=g.complexity||0;if(currentLevel==='moderate'&&c<2)return;if(currentLevel==='expert'&&c<3)return;if(skipSet.has(t.toLowerCase()))return;h=h.replace(new RegExp(`(?<![\\w-])\\b(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b(?![^<]*>)`,'i'),m=>`<span class="glossary-term" data-term="${t}">${m}</span>`);});return h;
}
function attachGlossary(r){r.querySelectorAll('.glossary-term').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();showBubble(el);});});}
// ── BLUF helpers ──
function getBluf(entry){ return (typeof entry==='object' && entry.bluf) ? entry.bluf : entry; }
function getFull(entry){ return (typeof entry==='object' && entry.full) ? entry.full : null; }

let activeBubbleTerm=null, activeBubbleEl=null;

function assembleGlossaryData(term) {
  const g = glossary[term] || null;
  if (!g) return null;
  const entry = g[currentLevel] || g.beginner;
  if (!entry) return null;
  const bluf = getBluf(entry);
  if (!bluf || typeof bluf !== 'string') return null;
  return {
    term,
    glossaryEntry: g,
    bluf,
    full: getFull(entry)
  };
}

function renderBubbleContent(t, g){
  const d = assembleGlossaryData(t);
  const bluf = d ? d.bluf : t;
  const full = d ? d.full : null;
  let html=`<div class="gb-close">✕</div>`;
  html+=`<div class="gb-level">
    <button class="lt-btn${currentLevel==='beginner'?' active':''}" data-lv="beginner">Beginner</button>
    <button class="lt-btn${currentLevel==='moderate'?' active':''}" data-lv="moderate">Moderate</button>
    <button class="lt-btn${currentLevel==='expert'?' active':''}" data-lv="expert">Expert</button>
  </div>`;
  html+=`<div class="gb-term">${t}</div><div class="gb-def">${bluf}</div>`;
  if(full){
    html+=`<div class="ge-expand">Read more ›</div><div class="ge-full">${full}</div>`;
  }
  return {html, hasFull:!!full};
}

function showBubble(el){
  closeBubble();const t=el.dataset.term;
  const d=assembleGlossaryData(t);if(!d)return;
  const g=d.glossaryEntry;
  activeBubbleTerm=t; activeBubbleEl=el;
  const {html, hasFull}=renderBubbleContent(t,g);
  const b=document.createElement('div');b.className='glossary-bubble'+(hasFull?' has-full':'');
  b.innerHTML=html;
  document.body.appendChild(b);
  positionBubble(b, el, hasFull);
  activeBubble=b;
  attachBubbleHandlers(b, t, g, el);
  setTimeout(()=>{document.addEventListener('click',function cl(e){if(activeBubble&&!activeBubble.contains(e.target))closeBubble();document.removeEventListener('click',cl);},{once:true});},10);
}

function positionBubble(b, el, hasFull){
  const r=el.getBoundingClientRect();let top=r.bottom+8,left=r.left;
  const maxW=hasFull?420:320;
  if(left+maxW>innerWidth)left=innerWidth-maxW-10;if(left<10)left=10;
  if(top+200>innerHeight){top=r.top-8-150;b.classList.add('arrow-bottom');}
  b.style.left=left+'px';b.style.top=top+'px';
}

function attachBubbleHandlers(b, t, g, el){
  // Close button
  b.querySelector('.gb-close').addEventListener('click',e=>{e.stopPropagation();closeBubble();});
  // Level toggle
  b.querySelectorAll('.gb-level .lt-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      // Preserve expanded state
      const wasExpanded=!!b.querySelector('.ge-full.open');
      setLevel(btn.dataset.lv);
      // Re-render in place
      const {html, hasFull}=renderBubbleContent(t,g);
      b.className='glossary-bubble'+(hasFull?' has-full':'')+(wasExpanded&&hasFull?' expanded':'');
      b.innerHTML=html;
      // Restore expanded state
      if(wasExpanded&&hasFull){const fullEl=b.querySelector('.ge-full');if(fullEl)fullEl.classList.add('open');const expBtn=b.querySelector('.ge-expand');if(expBtn)expBtn.textContent='Show less ‹';}
      positionBubble(b, el, hasFull);
      attachBubbleHandlers(b, t, g, el);
    });
  });
  // Read more toggle
  const expBtn=b.querySelector('.ge-expand');
  if(expBtn){
    expBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const fullEl=b.querySelector('.ge-full');
      const isOpen=fullEl.classList.contains('open');
      fullEl.classList.toggle('open');
      b.classList.toggle('expanded');
      expBtn.textContent=isOpen?'Read more ›':'Show less ‹';
      const bRect=b.getBoundingClientRect();
      if(bRect.bottom>innerHeight-10){b.style.top=Math.max(10,innerHeight-bRect.height-10)+'px';}
      if(bRect.top<10){b.style.top='10px';}
    });
  }
}
function closeBubble(){if(activeBubble){activeBubble.remove();activeBubble=null;}}
function closeAll(){if(activeChart){activeChart.destroy();activeChart=null;}document.querySelectorAll('.card-overlay,.tooltip').forEach(el=>el.remove());closeBubble();}

// ── EXPERTISE ──
document.querySelectorAll('.exp-btn').forEach(btn=>{btn.addEventListener('click',()=>{setLevel(btn.dataset.level);closeAll();});});

document.addEventListener('DOMContentLoaded',initGlobe);


document.querySelectorAll('.footer-link').forEach(el => {
  el.addEventListener('click', () => {
    closeAll();
    const key = el.dataset.ft;
    const tt = document.createElement('div');
    tt.className = 'footer-tooltip';
    tt.innerHTML = `<div class="tt-close" onclick="this.parentElement.remove()">✕</div>` + footerContent[key];
    document.body.appendChild(tt);
    tt.offsetHeight;
    tt.classList.add('active');
    setTimeout(() => {
      document.addEventListener('click', function cl(e) {
        if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); }
      });
    }, 100);
  });
});

</script>
