  "Unemployment": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The unemployment rate measures what percentage of people who want to work cannot find a job. It is one of the clearest signals of whether an economy is providing enough opportunity for its citizens.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Unemployment directly affects living standards, consumer spending, government finances, and social stability. High unemployment means wasted potential - people who could be contributing to the economy are sitting idle. It also means lower tax revenue and higher welfare spending for governments.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the economy as a team. The unemployment rate tells you how many players are on the bench who want to be in the game. Some bench-sitting is normal (people between jobs), but too much means the team is underperforming.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">An unemployment rate of 4% means that out of every 100 people looking for work, 4 cannot find a job. In the US, anything below 4% is considered very tight - employers struggle to find workers, and wages tend to rise faster.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Below 4% in the US or UK signals a tight labour market - good for workers, potentially inflationary</li><li>Above 7-8% signals real distress - demand is too weak to employ everyone</li><li>Youth unemployment is often 2-3x the headline rate and can signal deeper structural problems</li><li>The rate can fall for bad reasons - people stop looking for work and drop out of the count</li></ul></div></div><div class=\"ge-formal\">The percentage of the labour force (those employed plus those actively seeking work) that is unemployed.</div>"
      },
      "moderate": {
        "bluf": "Unemployment is a lagging indicator that reflects labour market slack. Central banks watch it alongside wages and participation to gauge how much capacity remains before inflation accelerates - the Phillips Curve trade-off.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The unemployment rate is half of the Fed's dual mandate (alongside price stability). It drives consumer spending (70% of US GDP), wage growth dynamics, and determines how much room central banks have to keep rates elevated. A rising unemployment rate is the most reliable recession signal and the trigger for rate cuts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Unemployment is a lagging indicator - it rises after a recession has already begun and falls after recovery is underway. But the rate of change matters more than the level. The Sahm Rule: if the 3-month moving average of unemployment rises 0.5pp above its 12-month low, the economy is already in recession 100% of the time historically.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US unemployment hit 3.4% in early 2023 - a 53-year low. This ultra-tight market fuelled 5%+ wage growth, which fed into services inflation. The Fed needed unemployment to rise toward 4-4.5% to ease wage pressure. The question was whether this could happen without a recession (soft landing) or not (hard landing).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>U-3 vs U-6:</strong> U-3 is the headline rate; U-6 includes discouraged workers and part-time for economic reasons - a broader measure of slack</li><li><strong>Participation rate:</strong> a falling unemployment rate with falling participation is not a healthy signal</li><li><strong>JOLTS:</strong> job openings and quits rate show labour demand and worker confidence</li><li><strong>Sahm Rule:</strong> 0.5pp rise from the trough in 3-month average triggers recession signal</li></ul></div></div><div class=\"ge-formal\">The U-3 unemployment rate: the number of unemployed persons actively seeking work, divided by the civilian labour force, expressed as a percentage.</div>"
      },
      "expert": {
        "bluf": "The unemployment rate is a lagging, survey-based measure of labour slack. NAIRU estimation, the Beveridge Curve, and the distinction between U-3 and broader measures (U-6, prime-age EPOP) are essential for assessing true tightness.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The gap between actual unemployment and NAIRU (the non-accelerating inflation rate of unemployment) is the labour market's contribution to inflation dynamics. Post-COVID, NAIRU estimates have been unreliable - the Beveridge Curve shifted outward (more vacancies per unit of unemployment), suggesting matching efficiency declined, then partially recovered.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The unemployment rate is a noisy signal of slack. The household survey (which generates unemployment) and the establishment survey (which generates payrolls) frequently diverge. Prime-age employment-to-population ratio (25-54 EPOP) is a cleaner measure of labour utilisation because it is unaffected by participation definition issues and demographic shifts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Post-COVID labour market: US unemployment fell from 14.7% (April 2020) to 3.4% (January 2023) - the fastest decline on record. But participation remained 1pp below pre-COVID levels, and the Beveridge Curve showed structurally higher vacancies per unemployed worker. This meant the headline rate understated actual tightness relative to historical norms.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Sahm Rule:</strong> 0.5pp rise in 3-month average from 12-month trough - perfect recession predictor historically</li><li><strong>JOLTS quits rate:</strong> the best real-time indicator of worker bargaining power and wage pressure</li><li><strong>Beveridge Curve:</strong> the vacancy-unemployment relationship reveals matching efficiency changes</li><li><strong>Birth-death model:</strong> BLS business birth-death adjustment adds phantom jobs in downturns - trust benchmark revisions</li></ul></div></div><div class=\"ge-formal\">The ratio of unemployed persons (defined as jobless, available for work, and actively seeking employment in the prior 4 weeks) to the civilian labour force. Subject to household survey sampling noise of approximately +/-100k per month.</div>"
      }
    },

  "Budget Deficit": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The budget deficit measures how much more a government spends than it earns in a given year. A deficit means the government is borrowing to cover the gap, adding to national debt.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Deficits determine how much a government needs to borrow. Persistent large deficits mean growing national debt, which eventually means higher interest payments, higher taxes, or reduced public services. Markets watch deficits closely because they affect bond supply, interest rates, and confidence in a country's finances.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it like a household budget. If you earn $4,000 a month but spend $5,000, you have a $1,000 deficit. You cover it with a credit card (borrowing). One month is fine - but if you do it every month for years, the interest payments start eating into your spending. Governments work the same way, just with more zeros.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">A budget deficit of -6% of GDP means the government spent 6% more than the entire economy's annual output in extra borrowing. The US deficit has averaged around -5% to -7% of GDP in recent years - historically high for a peacetime economy not in recession.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Deficits below -3% of GDP are generally considered manageable for developed economies</li><li>Deficits above -6% outside of recessions signal structural overspending</li><li>Deficits matter more when interest rates are high - borrowing costs compound</li><li>A surplus (positive number) is rare and means the government is paying down debt</li></ul></div></div><div class=\"ge-formal\">Government revenue minus government expenditure, expressed as a percentage of GDP. A negative number indicates a deficit (spending exceeds revenue).</div>"
      },
      "moderate": {
        "bluf": "The fiscal deficit as a percentage of GDP measures structural and cyclical government borrowing needs. It drives bond supply, affects term premia, and determines the trajectory of debt-to-GDP - the key solvency metric.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The deficit is the flow that drives the debt stock. Large deficits increase bond issuance, which can push up term premia and crowd out private investment. The sustainability question hinges on whether nominal GDP growth exceeds the effective interest rate on debt (the r-g framework). When deficits are large and r > g, debt-to-GDP spirals upward.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Deficits are not inherently bad - during recessions, automatic stabilisers (falling tax revenue, rising welfare spending) widen the deficit to cushion the economy. The concern is structural deficits - persistent borrowing even when the economy is at full employment. That signals a political inability to match spending with revenue.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US ran a ~6.5% deficit in 2024 despite sub-4% unemployment - unprecedented in peacetime at full employment. This deficit was driven by interest payments (~3.5% of GDP), defence, and entitlements. Bond market concerns about supply pushed the 10Y yield above 4.5%, effectively tightening financial conditions from the fiscal side.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Primary deficit:</strong> deficit excluding interest payments - shows the discretionary fiscal stance</li><li><strong>Cyclically adjusted:</strong> structural deficit removes automatic stabilisers - the true policy choice</li><li><strong>Interest expense ratio:</strong> interest payments as % of revenue - above 15% starts constraining fiscal flexibility</li><li><strong>Bond auction demand:</strong> weak bid-to-cover ratios signal market fatigue with supply</li></ul></div></div><div class=\"ge-formal\">General government net lending/borrowing as a percentage of GDP. Negative values indicate a deficit. The structural (cyclically adjusted) deficit strips out automatic stabiliser effects.</div>"
      },
      "expert": {
        "bluf": "The fiscal deficit is the flow variable driving debt dynamics. The key identity: change in debt-to-GDP = (r-g) x existing debt ratio + primary deficit. At current DM debt levels, the r-g sign determines whether consolidation is arithmetically necessary.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Fiscal dominance risk has re-emerged. When debt-to-GDP exceeds ~100%, the deficit-interest payment feedback loop becomes self-reinforcing if r > g. The US is running 6%+ deficits at full employment with net interest approaching 4% of GDP. This is the bond market's central concern and the driver of term premium repricing since 2023.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The debt dynamics equation is unforgiving: d(debt/GDP)/dt = (r-g)(debt/GDP) - primary surplus. When debt/GDP is 120% (US) and r-g is +1%, you need a 1.2% primary surplus just to stabilise - before any new spending. The US currently runs a ~3% primary deficit. The math requires either much faster growth, much lower rates, or fiscal consolidation that no political coalition will deliver.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Italy (debt/GDP ~140%) survived the 2010s because ECB policy kept r far below g. With ECB tightening, Italian BTP spreads widened to 250bp as markets priced the return of debt sustainability risk. The Transmission Protection Instrument (TPI) was explicitly created to prevent deficit concerns from fragmenting the euro area - fiscal backstopped by monetary.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>r-g differential:</strong> the single most important variable for debt sustainability - tracks via 10Y yield minus nominal GDP growth</li><li><strong>Fiscal impulse:</strong> change in cyclically adjusted primary balance - positive = fiscal drag, negative = fiscal stimulus</li><li><strong>Duration of issuance:</strong> Treasury shifting to more bills (short-term) vs bonds signals concern about long-end demand</li><li><strong>CBO baseline vs reality:</strong> US deficit projections assume expiring tax cuts and spending restraint that never materialise</li></ul></div></div><div class=\"ge-formal\">General government net lending/borrowing as % of GDP. Debt dynamics identity: Δ(D/Y) = (r - g)(D/Y) - pb, where r = effective interest rate, g = nominal GDP growth, D/Y = debt ratio, pb = primary balance.</div>"
      }
    },

  "Current Account": {
    "complexity": 1,

    "levels": {
      "beginner": {
        "bluf": "The current account measures whether a country earns more from the rest of the world than it spends. It tracks trade in goods and services, plus income flows like investment returns and remittances.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">A current account deficit means a country is spending more abroad than it earns - it needs foreign money to fill the gap. This makes it dependent on foreign investors being willing to lend. A surplus means the country is a net saver, lending money to the rest of the world.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Imagine your household's relationship with the outside world. You earn money (exports, investment income) and you spend money (imports, money sent abroad). If you spend more than you earn, you borrow the difference from abroad. The current account is this balance for an entire country.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">A current account of -3% of GDP means the country spent 3% more on foreign goods, services, and transfers than it earned. The US runs a persistent deficit (it imports more than it exports). Germany and Japan run surpluses (they export more than they import). China's surplus means it accumulates foreign reserves.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Deficits beyond -4% of GDP make a currency vulnerable - they need constant foreign financing</li><li>Surpluses above +5% invite trade tensions and accusations of currency manipulation</li><li>Oil price swings dramatically affect current accounts of energy importers and exporters</li><li>The current account must always mirror the financial account - deficits are funded by capital inflows</li></ul></div></div><div class=\"ge-formal\">The sum of a country's trade balance (goods and services), net primary income (investment returns), and net secondary income (transfers and remittances), expressed as a percentage of GDP.</div>"
      },
      "moderate": {
        "bluf": "The current account balance reflects a country's net external position - the sum of trade, income, and transfer flows. Persistent deficits require capital account financing and create FX vulnerability; surpluses accumulate net foreign assets.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The current account is the external constraint. A deficit country needs foreign capital inflows to finance the gap - if those flows reverse, the currency collapses (classic balance of payments crisis). For markets, widening deficits put pressure on the exchange rate and increase sovereign risk. The twin deficits hypothesis links fiscal and current account deficits through national savings.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The current account identity: CA = S - I (savings minus investment). A deficit means the country invests more than it saves - not necessarily bad if the investment is productive. The US deficit reflects both high investment and low savings. Germany's surplus reflects high savings and weak domestic investment - a different problem.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The UK ran a current account deficit of ~4% of GDP in 2022. When the Truss mini-budget spooked markets, foreign investors briefly questioned whether they wanted to keep financing that deficit. Sterling fell 10% in days. This is the current account vulnerability channel in action - deficits are fine until the capital flows that finance them aren't.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Financing composition:</strong> FDI-financed deficits are stable; portfolio-flow-financed deficits are fragile</li><li><strong>NIIP:</strong> net international investment position - cumulative current account balance over time</li><li><strong>Terms of trade:</strong> commodity price shifts can swing the current account 2-3% of GDP for resource economies</li><li><strong>Real exchange rate:</strong> persistent overvaluation worsens the current account - the correction is usually sharp</li></ul></div></div><div class=\"ge-formal\">The current account balance as a percentage of GDP. Composed of: trade balance + net primary income (investment returns) + net secondary income (transfers). By accounting identity: current account + capital account + financial account = 0.</div>"
      },
      "expert": {
        "bluf": "The current account is the mirror image of the financial account. The savings-investment balance (S-I = CA) determines external financing needs. For EM, the current account is the binding constraint; for DM with reserve currencies, the constraint is softer but not absent, as GBP in 2022 demonstrated.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The current account determines the rate of change of the net international investment position (NIIP). The US NIIP is -$20tn (~-70% of GDP) - the world's largest debtor position - yet it earns positive net investment income because US foreign assets earn higher returns than US liabilities pay (the exorbitant privilege). This privilege persists only as long as dollar reserve status holds.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The intertemporal current account approach: today's deficit is a claim on future surpluses. If the deficit finances productive investment, it is self-correcting. If it finances consumption (the US pattern), it requires either future fiscal adjustment or perpetual willingness of foreigners to hold your debt. The Feldstein-Horioka puzzle showed savings and investment are more correlated within countries than theory predicts - capital is less mobile than assumed.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's persistent current account surplus (~3-4% of GDP) finances its own government debt domestically - a key reason JGB yields stayed low despite 250% debt-to-GDP. Contrast with Turkey: persistent CA deficits (~-5%) financed by hot money meant that any loss of confidence triggered a currency crisis (lira lost 80%+ from 2018-2023).</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Basic balance:</strong> current account + net FDI - the stable financing component. If negative, the country relies on flighty portfolio flows</li><li><strong>Valuation effects:</strong> NIIP changes from asset price movements can dwarf the current account flow</li><li><strong>Reserve adequacy:</strong> Guidotti rule - reserves should cover 12 months of short-term external debt. Below this, crisis risk rises sharply</li><li><strong>Global imbalances:</strong> large surplus countries (China, Germany) are exporting demand deficiency - trade tensions are the political manifestation</li></ul></div></div><div class=\"ge-formal\">The current account balance as % of GDP. Identity: CA = S - I = -(KA + FA). The intertemporal budget constraint requires the present value of future current accounts to sum to the initial NIIP - deficits today must be offset by surpluses eventually.</div>"
      }
    },

  "Policy Rate": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The policy rate is the interest rate set by a country's central bank. It is the most powerful tool for controlling inflation and influencing economic growth, because it affects the cost of borrowing for everyone.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When the central bank raises the policy rate, borrowing becomes more expensive - mortgages, car loans, business loans all cost more. This slows spending and cools inflation. When it cuts, borrowing gets cheaper, which encourages spending and investment. Every other interest rate in the economy is influenced by this single number.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the policy rate as the economy's thermostat. If the economy is overheating (too much inflation), the central bank turns the temperature down by raising rates. If the economy is too cold (recession, rising unemployment), it turns the temperature up by cutting rates. The effects take 12-18 months to fully work through.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US Federal Reserve raised its policy rate (the fed funds rate) from near 0% to 5.25-5.50% between 2022 and 2023 - the fastest hiking cycle in 40 years - to fight inflation that had hit 9%. Mortgage rates doubled to 7%+, slowing the housing market and gradually bringing inflation back down.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>In developed economies, rates between 2-3% are considered neutral - neither stimulating nor restraining</li><li>Rates above neutral are restrictive - designed to slow the economy and fight inflation</li><li>Rates near zero limit what central banks can do in a crisis (the \"zero lower bound\")</li><li>Different central banks have different mandates - the Fed targets both inflation and employment, while the ECB focuses primarily on inflation</li></ul></div></div><div class=\"ge-formal\">The short-term interest rate set by a central bank as the primary instrument of monetary policy. Examples: Federal Funds Rate (US), Bank Rate (UK), Main Refinancing Rate (ECB), Overnight Call Rate (Japan).</div>"
      },
      "moderate": {
        "bluf": "The policy rate is the central bank's primary tool for managing the output gap and inflation. It anchors the short end of the yield curve and transmits to the real economy via credit conditions, asset prices, and the exchange rate channel.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The policy rate is the fulcrum of monetary policy transmission. It sets the risk-free rate, which determines mortgage rates, corporate borrowing costs, equity discount rates, and currency attractiveness. The gap between the policy rate and the neutral rate (r*) defines the monetary policy stance - restrictive, neutral, or accommodative.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Monetary policy operates with long and variable lags (Friedman). A rate hike today affects housing in 6 months, consumption in 12 months, and inflation in 18 months. This means central banks are always flying partially blind - setting policy based on forecasts of where inflation will be, not where it is. Forward guidance tries to reduce this uncertainty by telegraphing the path ahead.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The ECB held rates at negative levels (-0.5%) until July 2022, then hiked 450bp in 14 months. The delay (hiking later than the Fed) weakened the euro to parity with the dollar and imported additional inflation through higher energy prices denominated in dollars. The sequencing of rate cycles across central banks drives FX markets.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Dot plot / rate path:</strong> the Fed's projected rate path signals intentions - markets trade the gap between dot plot and market pricing</li><li><strong>Real policy rate:</strong> nominal rate minus inflation - the true measure of how tight policy is. Above 2% real is meaningfully restrictive</li><li><strong>Terminal rate:</strong> the peak rate expected this cycle - the key variable for bond and equity pricing</li><li><strong>r* (neutral rate):</strong> the equilibrium rate that neither stimulates nor restricts - estimated, not observed, and subject to debate</li></ul></div></div><div class=\"ge-formal\">The short-term nominal interest rate set by the central bank. The Taylor Rule approximation: policy rate = r* + inflation + 0.5(inflation gap) + 0.5(output gap). In practice, central banks exercise discretion around this formula.</div>"
      },
      "expert": {
        "bluf": "The policy rate is the operational target of monetary policy, anchoring the overnight rate. The key debate is the level and stability of r* - the neutral real rate - which determines whether any given policy rate is restrictive or accommodative. Post-COVID r* estimates have drifted higher, repricing the entire curve.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The policy rate defines the stance of monetary policy only relative to r*. If r* has risen from ~0.5% to ~1.5% (as Laubach-Williams and other models suggest post-COVID), then a 5% fed funds rate with 3% inflation is only mildly restrictive (real rate 2% vs r* 1.5%) - not the severe tightening it appears in nominal terms. This r* uncertainty is the single biggest source of policy risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The transmission mechanism has evolved. QE/QT means the policy rate is not the only lever - the balance sheet affects term premia independently. Financial conditions indices (Goldman FCI, Chicago NFCI) capture the combined effect of rates, spreads, equity prices, and the dollar. The Fed increasingly watches financial conditions rather than the policy rate in isolation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">BOJ under Ueda ended yield curve control and moved the policy rate from -0.1% to 0.25% - the first hike in 17 years. Despite the small absolute move, the signal effect was massive: it repriced the entire JGB curve, triggered yen carry trade unwinds, and demonstrated that even the most dovish central bank has limits. The yen moved 15% on the policy shift.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>OIS pricing:</strong> overnight index swap curves show the market-implied policy path - trade the gap between this and your own view</li><li><strong>Quantitative tightening:</strong> balance sheet runoff is equivalent to ~25bp per $500bn in reduced holdings - the shadow rate hike</li><li><strong>Financial conditions:</strong> if equity rallies and spreads compress, they offset rate hikes - the Fed may need to hike more</li><li><strong>Central bank reaction function:</strong> is the bar for cutting symmetrical with the bar for hiking? Typically no - cuts are reactive (to data), hikes are pre-emptive (to forecasts)</li></ul></div></div><div class=\"ge-formal\">The overnight nominal interest rate target. Taylor Rule: i = r* + π + α(π - π*) + β(y - y*). In practice, the effective stance is better measured by the real policy rate (i - πe) relative to the Laubach-Williams r* estimate, or by broad financial conditions indices.</div>"
      }
    },

  "Stock Market YTD": {
    "complexity": 1,
    "category": "equity",
    "levels": {
      "beginner": {
        "bluf": "Stock Market YTD shows how much a country's main stock market index has gone up or down since the start of the year. It is the most visible daily scoreboard for investor confidence in a country's economy and companies.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The stock market reflects what investors collectively think about a country's economic future. Rising markets signal optimism about corporate profits, growth, and stability. Falling markets signal worry. While the stock market is not the economy, it affects wealth, consumer confidence, retirement savings, and business investment.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">A stock index tracks a basket of a country's biggest companies. The YTD return tells you whether those companies are collectively worth more or less than on January 1st. It is a forward-looking measure - markets price in expectations about the future, not just what is happening now.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the S&P 500 is up +12% YTD, it means the 500 largest US companies are collectively worth 12% more than at the start of the year. If the Nikkei 225 is down -5% YTD, Japanese large-caps have lost 5% of their value since January 1st.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>YTD returns can be misleading if a market crashed in December - always look at the starting point</li><li>A rising market with falling breadth (only a few stocks driving the gain) is fragile</li><li>Compare local-currency returns with dollar-denominated returns - a 15% gain in yen can be flat in dollars if the yen weakened 15%</li><li>Stock markets typically lead the real economy by 6-9 months</li></ul></div></div><div class=\"ge-formal\">The percentage change in a country's benchmark equity index from the last trading day of the prior year to the current date, measured in local currency.</div>"
      },
      "moderate": {
        "bluf": "The equity benchmark YTD return captures market expectations for earnings growth, discount rates, and risk appetite. It is a composite signal - driven by EPS growth, multiple expansion/contraction, and sector rotation - not a single economic variable.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Equity returns decompose into earnings growth + multiple change + dividend yield. In a rate-hiking cycle, multiples compress even if earnings grow - the discount rate rises. In an easing cycle, multiples expand. Understanding which component is driving YTD returns tells you whether the move is sustainable. Multiple-driven rallies are fragile; earnings-driven rallies have legs.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The stock market is a discounted cash flow machine. It prices the present value of all future corporate earnings. When rates rise, the discount rate increases, and future earnings are worth less today - even if the earnings themselves are unchanged. This is why stocks can fall despite a strong economy: the discount rate effect overwhelms the earnings effect.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In 2022, the S&P 500 fell 19% despite earnings growing ~5%. The entire decline was multiple compression - the forward P/E fell from 21x to 17x as the Fed hiked 425bp. In 2023, the index gained 24% on multiple expansion back to 20x, concentrated in 7 mega-cap tech stocks (the Magnificent 7). Breadth was historically narrow.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>EPS revisions:</strong> the direction of analyst earnings revisions is a better forward indicator than the price level</li><li><strong>Breadth:</strong> advance-decline ratios and equal-weight vs cap-weight performance measure participation</li><li><strong>Currency-adjusted:</strong> for international comparisons, convert to a common currency - local returns can be misleading</li><li><strong>Sector composition:</strong> the S&P 500 is ~30% tech; the FTSE 100 is heavy energy and financials - they respond to different macro drivers</li></ul></div></div><div class=\"ge-formal\">Year-to-date total return of the benchmark equity index in local currency. Decomposition: YTD return ≈ EPS growth + ΔP/E multiple + dividend yield.</div>"
      },
      "expert": {
        "bluf": "The benchmark equity return is a composite of earnings revisions, multiple re-rating (driven by the equity risk premium and rate expectations), and positioning/flow dynamics. Index-level returns mask sector dispersion and concentration risk - breadth divergences are the leading fragility signal.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Equity markets are the most liquid expression of growth expectations. But index returns are increasingly dominated by concentration - the top 10 S&P 500 stocks represent ~35% of market cap. This makes the index a poor proxy for the broad economy. For macro analysis, equal-weighted indices, small-cap performance, and cyclical vs defensive ratios are more informative than the headline number.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The equity risk premium (ERP) - the excess return demanded over risk-free bonds - is the key unobservable. When the ERP compresses (risk appetite rises), multiples expand mechanically. Current ERP estimates (~3-4% for US) are below historical averages (~5%), implying markets are priced for a benign macro outcome. Any negative surprise reprices the ERP violently.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's Nikkei 225 broke its 1989 all-time high in 2024 after 34 years. The drivers were not primarily earnings but structural: Tokyo Stock Exchange governance reforms (pushing companies above 1x book value), yen weakness boosting exporters, and Buffett's endorsement catalysing global inflows. The Japan trade was a regime change in corporate governance, not an earnings cycle.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ERP vs bond yields:</strong> when the earnings yield (1/PE) approaches the 10Y yield, the TINA (There Is No Alternative) argument for equities evaporates</li><li><strong>Gamma positioning:</strong> options dealer hedging amplifies moves in both directions - monitor gamma exposure levels at key strikes</li><li><strong>Buyback vs issuance:</strong> net corporate equity supply is the largest source of equity demand - when buybacks slow, a key support disappears</li><li><strong>Cross-asset signals:</strong> equity-credit divergence (equities rallying while spreads widen) typically resolves in favour of credit being right</li></ul></div></div><div class=\"ge-formal\">Benchmark index YTD return in local currency. For cross-country comparison: USD-adjusted return = local return + FX return. Index construction (cap-weighted vs price-weighted vs equal-weighted) materially affects interpretation. Free-float market cap weighting is the global standard (MSCI methodology).</div>"
      }
    },

  "Equity Vol": {
    "complexity": 2,
    "category": "equity",
    "levels": {
      "beginner": {
        "bluf": "Equity volatility measures how wildly a stock market is swinging day to day. Higher volatility means bigger daily moves (both up and down) and more uncertainty. It is often called the market's \"fear gauge.\"",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When volatility is low, investors are calm and confident. When it spikes, it means something unexpected has happened or markets are nervous about what is coming. High volatility makes it harder for businesses to plan, for investors to make decisions, and for ordinary people with retirement accounts to sleep well at night.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Imagine the sea. Low volatility is calm water - smooth sailing. High volatility is a storm - big waves, hard to navigate. The stock market works the same way. In calm periods, stocks move 0.5-1% per day. In volatile periods, they can move 3-5% per day. The VIX index measures how much storm the market expects over the next 30 days.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The VIX (US stock market volatility index) typically sits around 15-20. During the COVID crash in March 2020, it spiked to 82 - markets were in full panic. A VIX reading above 30 generally means serious fear. Below 15 signals complacency.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>VIX below 15: calm markets, possibly complacent - surprises hit harder from low-vol environments</li><li>VIX 20-30: elevated but functional - markets are pricing in some uncertainty</li><li>VIX above 30: fear regime - often coincides with rapid sell-offs</li><li>Volatility tends to spike suddenly (panic is fast) and decline slowly (confidence rebuilds gradually)</li></ul></div></div><div class=\"ge-formal\">The implied volatility of a country's benchmark equity index, derived from options prices, expressed as an annualised percentage. Higher values indicate greater expected price swings.</div>"
      },
      "moderate": {
        "bluf": "Equity implied volatility, typically measured by the VIX or national equivalents, reflects options market pricing of expected future index moves. It is a mean-reverting risk premium - it overshoots in stress and undershoots in complacency, creating systematic trading opportunities.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Implied vol is the price of portfolio insurance. It maps directly to options premiums and sets the cost of hedging. Systematically, implied vol exceeds realised vol (the volatility risk premium) - selling vol is profitable on average but catastrophically wrong in tail events. The vol regime (low, medium, high) determines how much leverage the system can support via risk parity and Vol Targeting strategies.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Volatility clusters - high-vol days follow high-vol days (GARCH effect). This means vol regime shifts are more important than point readings. The transition from low to high vol is typically violent (the \"vol event\") because it forces systematic deleveraging: risk parity funds, CTAs, and dealers all reduce exposure simultaneously, amplifying the move.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">August 2024: BOJ hiked rates, yen surged, and the Nikkei fell 12% in a day. VIX spiked from 16 to 65 intraday as yen carry trade unwinds cascaded across asset classes. The vol spike was driven not by equity fundamentals but by forced deleveraging - a textbook vol regime transition.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>VIX term structure:</strong> backwardation (front > back) signals acute stress; contango (front < back) is normal</li><li><strong>Realised vs implied:</strong> when implied vol is well above realised, the market is overpaying for protection</li><li><strong>VVIX:</strong> the volatility of the VIX - extreme readings signal potential for chaotic moves</li><li><strong>Skew:</strong> put-call implied vol differential measures tail risk demand - steep skew means investors are paying up for crash protection</li></ul></div></div><div class=\"ge-formal\">30-day implied volatility of the benchmark equity index, derived from at-the-money options prices using the Black-Scholes framework (or model-free VIX methodology). Expressed as annualised standard deviation of returns.</div>"
      },
      "expert": {
        "bluf": "Equity implied vol is the market-clearing price for gamma and convexity. The vol surface (strike x tenor) encodes the full distribution of expected returns. Key dynamics: the volatility risk premium (VRP), dealer gamma positioning, and the reflexive feedback between vol-targeting flows and realised volatility.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The vol regime determines the carrying capacity of leverage in the system. Sub-15 VIX enables risk parity to lever 3-4x, systematic vol selling to expand, and dealer gamma to be long (stabilising). The transition to 30+ VIX forces all of this into reverse simultaneously - creating the nonlinear crash dynamics that make vol spikes self-reinforcing. The 2018 volmageddon (XIV blow-up) demonstrated that short-vol strategies are systemically destabilising.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The vol surface is a probability distribution. ATM vol is the centre; skew is the left tail; term structure is the time dimension. Persistent negative skew in equity options (puts cost more than calls) reflects structural demand for downside protection from pension funds and structured product hedging. This structural demand means put sellers (dealers, systematic funds) are the marginal price setters for tail risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The VIX spike to 65 in August 2024 was amplified by 0DTE (zero-days-to-expiry) options gamma. Dealers who were short gamma from 0DTE calls found themselves needing to sell futures as the market fell, accelerating the decline. The intraday VIX spike was ~4x the move justified by the equity sell-off alone - the excess was gamma feedback. VIX normalised within a week as the mechanical flows reversed.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Dealer gamma exposure (GEX):</strong> positive gamma = dealers dampen moves; negative gamma = dealers amplify moves. The flip point is the critical level</li><li><strong>VRP (volatility risk premium):</strong> implied minus realised - systematically positive, mean ~3-4 vol points, but inverts in crises</li><li><strong>Variance swap vs VIX:</strong> variance swaps pay realised variance, VIX is an expectation - the basis trade between them is a core vol strategy</li><li><strong>Cross-asset vol correlation:</strong> when equity, rates, and FX vol spike simultaneously, it signals a funding/liquidity crisis, not a sector event</li></ul></div></div><div class=\"ge-formal\">Model-free implied volatility computed from a strip of OTM options prices (VIX methodology: σ² = (2/T)Σ(ΔK/K²)e^(rT)Q(K)). The vol surface encodes the risk-neutral probability distribution. Realised vol is computed as the annualised standard deviation of log returns over the lookback window.</div>"
      }
    },

  "10Y Bond Yield": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The 10-year bond yield is the annual return investors earn for lending money to a government for 10 years. It is the most important interest rate in any economy - the benchmark that influences mortgage rates, corporate borrowing costs, and stock valuations.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When governments need money, they issue bonds. The 10-year bond is the most watched because it balances short-term policy (which affects 2-year rates) with long-term economic expectations. Mortgage rates, corporate bonds, and pension fund returns all reference the 10-year yield. When it rises, borrowing gets more expensive across the entire economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it as the economy's long-term interest rate. If you lend the government money for 10 years, the yield is your compensation for inflation risk, the chance the government might struggle to repay, and the opportunity cost of locking up your money. Higher yields mean investors need more compensation - they see more risk or expect more inflation ahead.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the US 10Y yield is 4.5%, it means you earn 4.5% per year for lending to the US government for a decade. In 2020, this yield was below 1% - investors were willing to accept almost nothing because they were scared about the economy. By 2023, it rose above 5% as inflation and government borrowing surged.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Rising yields mean tighter financial conditions - harder and more expensive for everyone to borrow</li><li>Falling yields signal a flight to safety or expectations of rate cuts and weaker growth</li><li>The gap between 10Y yields across countries reflects relative growth and inflation expectations</li><li>Bond prices move inversely to yields - when yields rise, bond holders lose money</li></ul></div></div><div class=\"ge-formal\">The yield-to-maturity on a government's 10-year benchmark bond, expressed as an annualised percentage. It represents the market-determined risk-free rate for that currency at a 10-year horizon.</div>"
      },
      "moderate": {
        "bluf": "The 10Y sovereign yield is the risk-free rate for a currency at a medium-term horizon. It decomposes into expected short rates (monetary policy path), an inflation premium, and a term premium that compensates for duration risk and supply/demand dynamics.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The 10Y yield is the anchor for all long-duration asset pricing. Corporate bond yields = 10Y government yield + credit spread. Mortgage rates = 10Y + spread. Equity valuations use the 10Y as the discount rate baseline. A 100bp move in the 10Y reprices every long-duration asset in the economy - it is the single most consequential market price.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Decompose the 10Y yield: rate expectations (average of expected fed funds over 10 years) + term premium (compensation for holding duration). Rate expectations are driven by the monetary policy outlook. Term premium is driven by supply (government deficits), demand (central bank QE/QT, pension funds, foreign central banks), and inflation uncertainty.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The 10Y UST yield rose from 3.8% to 5.0% between July-October 2023. Only ~50bp was explained by higher rate expectations - the rest was term premium expansion driven by Treasury announcing larger-than-expected issuance to fund the deficit. This distinction matters: rate expectation moves affect the whole curve; term premium moves are concentrated in the long end.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real yield (TIPS):</strong> 10Y yield minus inflation breakeven - the true cost of capital. Above 2% real is historically tight</li><li><strong>Term premium:</strong> ACM or Kim-Wright models - when it turns positive, long bonds are genuinely compensating for risk</li><li><strong>Foreign holdings:</strong> Japan and China hold ~$2tn in Treasuries - any diversification shift affects demand structurally</li><li><strong>Auction metrics:</strong> bid-to-cover, primary dealer takedown, and tail (vs when-issued) signal real-time demand</li></ul></div></div><div class=\"ge-formal\">The yield-to-maturity on the benchmark 10-year sovereign bond. Decomposition: 10Y yield = expected average short rate over 10Y + term premium. The term premium compensates for interest rate risk, inflation uncertainty, and supply/demand imbalances.</div>"
      },
      "expert": {
        "bluf": "The 10Y yield is the sum of the expected policy path and the term premium. Post-QE, the term premium has been the dominant driver of 10Y moves, with supply dynamics (fiscal deficits, QT, foreign reserve management) replacing rate expectations as the marginal price setter at the long end.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The 10Y yield determines the discount rate for all long-duration assets and the cost of capital for the real economy. The decomposition into rate expectations and term premium is essential: rate expectations are observable (via OIS), but term premium is model-dependent (ACM, Kim-Wright, term structure models all give different answers). The current regime: with QT reducing Fed holdings by ~$60bn/month and fiscal deficits requiring $2tn+ annual issuance, the marginal buyer of duration is no longer the central bank but the private sector - which demands compensation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The 10Y yield is an equilibrium price set by the intersection of duration supply (Treasury issuance, agency MBS) and duration demand (pensions, insurance, banks, foreign CBs). QE suppressed term premium by removing duration supply. QT and fiscal deficits are increasing duration supply while the traditional buyers (Japan, China) are reducing purchases. The market must find a clearing price - that price is a higher term premium.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's 10Y JGB yield was pinned at 0% by yield curve control (2016-2024). When the BOJ widened the band and then abandoned YCC, the JGB 10Y moved to ~1%. The Japanese life insurance sector began reallocating from foreign bonds back to JGBs - reducing demand for USTs and Bunds at the margin. BOJ policy normalisation is a global term premium event, not just a Japanese one.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ACM term premium:</strong> the Adrian-Crump-Moench model is the Fed's reference - positive term premium is the new normal</li><li><strong>Duration supply calendar:</strong> Treasury quarterly refunding announcements (QRA) set the near-term supply trajectory - February and August QRAs are market-moving events</li><li><strong>Basis trades:</strong> hedge fund Treasury basis trades (long cash, short futures) are now ~$1tn - a leveraged bet on term premium that creates fragility</li><li><strong>10Y-3M spread:</strong> the most reliable recession predictor when inverted. But: false signals are more likely when term premium drives the inversion rather than rate expectations</li></ul></div></div><div class=\"ge-formal\">Yield-to-maturity on the on-the-run 10Y sovereign benchmark. Decomposition: y(10) = (1/10)Σ E[r(t)] + tp(10), where tp is the term premium. Model-dependent estimates (ACM, KW, DKW) can diverge by 50-100bp. Duration: ~8.5 years for a 4% coupon 10Y, meaning a 100bp yield rise produces an ~8.5% price decline.</div>"
      }
    },

  "Yield Curve": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The yield curve shows the difference between short-term and long-term government bond yields. Its shape is one of the most reliable predictors of recessions - when long-term rates fall below short-term rates (an \"inversion\"), a recession has followed almost every time in history.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Normally, you earn more for lending money for longer periods (long-term yields are higher than short-term). When this flips and short-term rates pay more than long-term, it signals that investors expect economic trouble ahead - they think the central bank will have to cut rates in the future to rescue a weakening economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the yield curve as the bond market's weather forecast. A normal upward-sloping curve says \"sunshine ahead.\" A flat curve says \"clouds forming.\" An inverted curve says \"storm warning.\" Bond markets have predicted recessions more accurately than most economists.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">We show the yield curve as the gap between the 10-year and 2-year government bond yields. A positive number (say +1.5%) means the curve is normal - long rates are higher. A negative number (say -0.8%) means the curve is inverted - short rates are higher. The US yield curve inverted in 2022-2023, its longest inversion in over 40 years.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Positive spread (above 0): normal - no recession signal</li><li>Flat (near 0): transition zone - the market is uncertain about the outlook</li><li>Negative spread (below 0): inverted - historically a recession follows within 6-18 months</li><li>When an inverted curve starts steepening back to normal, the recession is often imminent - this is the \"bull steepener\" that precedes rate cuts</li></ul></div></div><div class=\"ge-formal\">The spread between the 10-year and 2-year government bond yields, expressed in percentage points. A positive spread indicates a normal (upward-sloping) yield curve; a negative spread indicates an inverted curve.</div>"
      },
      "moderate": {
        "bluf": "The 10Y-2Y yield curve slope reflects the term premium and market expectations for the rate cycle. Inversion has preceded every US recession since 1970, but the signal's timing is variable (6-24 months) and the mechanism matters - rate-expectation-driven inversions are more reliable than term-premium-driven ones.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The yield curve slope is the bond market's summary of the economic outlook. A steep curve means easy money and growth expectations. A flat or inverted curve means tight money and expectations that central banks will need to ease in the future. For banks, the yield curve directly affects profitability - they borrow short and lend long, so a steep curve is profitable and an inverted curve squeezes margins.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The 2Y yield reflects where markets expect the policy rate to average over the next two years. The 10Y yield reflects the longer-term equilibrium. When the 2Y exceeds the 10Y, markets are saying: \"Rates are high now, but will need to come down significantly\" - which implies something bad is coming that forces cuts.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US 2s10s curve inverted to -108bp in July 2023 - the deepest inversion since 1981. This reflected a Fed at 5.5% (pulling up the 2Y) while markets expected an eventual return to ~3% (holding down the 10Y). The curve began steepening in late 2024 as the Fed started cutting - the classic late-cycle pattern.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>2s10s vs 3m10s:</strong> the 3-month/10-year spread has a marginally better recession prediction record than 2s10s</li><li><strong>Bull steepener:</strong> the curve steepening because front-end yields fall (rate cuts) - this is the recession-imminent signal</li><li><strong>Bear steepener:</strong> the curve steepening because long-end yields rise (term premium) - signals fiscal concerns, not recession</li><li><strong>Bank profitability:</strong> the curve slope directly maps to net interest margin for banks - watch bank stocks diverge from the curve as an early signal</li></ul></div></div><div class=\"ge-formal\">The 10Y-2Y spread on sovereign bonds, in percentage points. Decomposition: slope = (10Y rate expectations + 10Y term premium) - (2Y rate expectations + 2Y term premium). The rate expectations component carries the recession signal; the term premium component carries the supply/fiscal signal.</div>"
      },
      "expert": {
        "bluf": "The 2s10s slope is the market's summary statistic for the policy cycle. The predictive power for recessions comes from the rate expectations component, not the term premium component. The 2022-2024 inversion was historically deep but the recession signal was muddied by an unusually positive term premium repricing at the long end.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The curve slope encodes two distinct signals: (1) the rate expectations channel - an inverted curve means markets expect rate cuts, implying an expected downturn; (2) the term premium channel - a steep curve can reflect fiscal supply concerns rather than growth optimism. Decomposing these is essential. The near-term forward spread (6-quarter-ahead forward minus 3-month T-bill) has the cleanest recession signal because it strips out most of the term premium noise.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The yield curve is a forward rate curve in disguise. The 10Y yield is the geometric average of expected 1Y rates over the next decade plus a term premium. Inversion means the market expects the 1Y rate to decline substantially over the coming years - and in a hiking cycle, the only reason rates decline substantially is recession. The timing lag (6-24 months from inversion to recession) reflects the variable lag of monetary policy transmission.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The 2022-2024 inversion was unique: the deepest since 1981 but accompanied by a positive term premium expansion at the long end (driven by fiscal deficits and QT). This meant the rate-expectations-implied inversion was even deeper than the observed curve suggested. The Bauer-Mertens near-term forward spread gave a cleaner signal but also triggered a false positive as the soft landing materialised.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Near-term forward spread:</strong> Engstrom-Sharpe's measure (18-month forward minus 3-month yield) - the Fed's preferred recession indicator</li><li><strong>Breakeven curve:</strong> the slope of TIPS breakevens reveals whether inflation expectations are driving the nominal curve</li><li><strong>Swap spreads:</strong> negative swap spreads at the long end signal Treasury supply saturation and balance sheet constraints</li><li><strong>Conditional probability:</strong> probit models using the curve slope give ~70% recession probability 12 months after sustained inversion - useful but not deterministic</li></ul></div></div><div class=\"ge-formal\">The 10Y-2Y sovereign yield spread. Formally: slope = y(10) - y(2) = [Σ₁₋₁₀ E(r) + tp(10)] - [Σ₁₋₂ E(r) + tp(2)]. The rate expectations differential dominates the recession signal. The near-term forward spread (f(t+6) - y(3m)) has a superior signal-to-noise ratio for recession prediction.</div>"
      }
    },

  "Corp Spread": {
    "complexity": 2,
    "category": "credit",
    "levels": {
      "beginner": {
        "bluf": "The corporate spread is the extra interest rate companies must pay to borrow, compared to the government. It measures how risky the market thinks corporate borrowers are - wider spreads mean more fear about companies defaulting on their debts.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Companies borrow by issuing bonds. They always pay a higher rate than the government because there is a chance they could go bankrupt and not pay back their debt. The corporate spread measures this risk premium. When the economy looks shaky, investors demand a bigger premium - spreads widen. When confidence is high, spreads narrow.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it like a credit score for the corporate sector. Just as a person with a lower credit score pays a higher interest rate on a mortgage, companies in a troubled economy pay more to borrow. The spread is the market's real-time assessment of corporate health - it moves faster than credit ratings do.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the US government 10-year bond yields 4.5% and an investment-grade corporate bond yields 5.5%, the corporate spread is 1.0% (100 basis points). During the 2008 crisis, investment-grade spreads blew out to over 600 basis points as investors feared a wave of bankruptcies.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Investment-grade spreads below 100bp signal strong confidence in the corporate sector</li><li>Spreads above 200bp for investment-grade signal real stress</li><li>High-yield (\"junk bond\") spreads are more sensitive - they can move from 300bp to 1000bp in a crisis</li><li>When spreads widen while stock markets are still rising, credit is often right and equities are wrong</li></ul></div></div><div class=\"ge-formal\">The yield premium (in basis points) that investment-grade corporate bonds pay above the equivalent-maturity government bond yield, reflecting credit risk, liquidity risk, and market risk appetite.</div>"
      },
      "moderate": {
        "bluf": "Investment-grade corporate spreads reflect the credit risk premium, liquidity conditions, and risk appetite. They are a leading indicator of financial stress - typically widening before equities sell off - and a key input into corporate financing costs and M&A activity.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Corporate spreads determine the actual cost of capital for companies. Even if the 10Y yield is stable, widening spreads tighten corporate financial conditions. Spreads also reflect systemic risk: during crises, the correlation between credit and equities approaches 1.0, meaning spread widening amplifies equity sell-offs. Credit markets are generally considered smarter than equity markets at pricing tail risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Spreads decompose into: expected default loss + credit risk premium + liquidity premium. In normal markets, actual defaults are well below what spreads imply - the excess is the credit risk premium that investors earn for bearing uncertainty. During crises, expected defaults spike and liquidity evaporates, so spreads blow out far beyond what actual defaults would justify.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US IG spreads sat at ~90bp in early 2024 - near historically tight levels. This reflected strong corporate fundamentals (high coverage ratios, low leverage) and abundant liquidity. But tight spreads also mean there is little room for further compression and significant downside if conditions deteriorate - asymmetric risk.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>IG vs HY divergence:</strong> when high-yield widens but IG stays tight, risk is concentrated in weaker credits</li><li><strong>Primary market access:</strong> when new issuance dries up, companies cannot refinance - the real crisis mechanism</li><li><strong>CCC spreads:</strong> the weakest tier of high-yield - the canary in the coal mine for default cycles</li><li><strong>Spread per unit of duration:</strong> longer-dated credit with tight spreads offers the worst risk/return</li></ul></div></div><div class=\"ge-formal\">The option-adjusted spread (OAS) of investment-grade corporate bonds over the equivalent sovereign yield curve. Expressed in basis points. Accounts for embedded optionality (callable bonds) and represents the pure credit + liquidity premium.</div>"
      },
      "expert": {
        "bluf": "IG corporate spreads are the market's clearing price for credit risk, decomposable into expected loss, credit risk premium, and liquidity premium. At current compressed levels (~90bp), the credit risk premium is near zero - investors are being paid almost entirely for expected loss with minimal compensation for uncertainty. Asymmetry is extreme.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Credit spreads are the primary transmission mechanism from financial markets to the real economy. A 100bp move in IG spreads changes corporate borrowing costs for every company that accesses the bond market. The BBB cliff (the concentration of near-junk rated IG bonds) means spread widening can trigger downgrades, forced selling by mandate-constrained funds, and a self-reinforcing credit crunch.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The credit risk premium (spread minus expected loss) is compensation for bearing default uncertainty and illiquidity. Merton model framework: credit spreads should reflect the distance-to-default (equity vol, leverage, asset value). In practice, spreads are also driven by flows: CLO formation drives HY demand, insurance company buying drives IG demand, and ETF rebalancing creates mechanical spread compression. These technical factors can decouple spreads from fundamentals for extended periods.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">March 2020: IG spreads hit 375bp despite investment-grade default rates never exceeding 0.5%. The spread reflected pure liquidity panic - dealers could not warehouse risk, ETF NAV discounts hit 5%+, and the Fed had to intervene with the corporate credit facility (buying IG and even fallen-angel HY ETFs). The lesson: credit market structure - not fundamental credit risk - can drive spread moves in crises.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>BBB concentration:</strong> ~50% of the IG index is BBB - a downgrade wave would flood the HY market with forced selling</li><li><strong>Dealer inventory:</strong> post-Volcker Rule, dealer balance sheets are constrained - they cannot absorb selling pressure, amplifying spread moves</li><li><strong>Excess bond premium (EBP):</strong> Gilchrist-Zakrajsek measure strips out expected defaults - the pure risk appetite/financial conditions signal</li><li><strong>Private credit migration:</strong> $1.5tn+ in private credit is unpriced by markets - a shadow credit market whose stress would not show up in spread indices until contagion occurs</li></ul></div></div><div class=\"ge-formal\">Option-adjusted spread (OAS) of the investment-grade corporate bond index over the sovereign curve. Decomposition: OAS = expected loss + credit risk premium + liquidity premium. The excess bond premium (EBP = OAS - expected loss) is the clean financial conditions signal. Merton model: spread = f(leverage, asset vol, risk-free rate, maturity).</div>"
      }
    },

  "Sov CDS": {
    "complexity": 2,
    "category": "credit",
    "levels": {
      "beginner": {
        "bluf": "A sovereign CDS (Credit Default Swap) spread is the cost of insurance against a government failing to pay its debts. It is the market's real-time verdict on how likely a country is to default - higher spreads mean more risk.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Governments are generally the safest borrowers in any country - if the government cannot pay its debts, everything else is in trouble. The sovereign CDS spread tells you how much investors would pay to protect themselves against this worst-case scenario. For most developed countries, the spread is very low (government default is extremely unlikely). For countries with weaker finances, it can be high.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of it like home insurance premiums. A house in a safe area with solid foundations costs very little to insure. A house in a flood zone with structural problems costs a lot more. Sovereign CDS works the same way - countries with strong finances and stable institutions have low spreads; countries with high debt, political instability, or weak growth have higher spreads.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Germany's sovereign CDS spread might be 15 basis points (very safe), while Italy's might be 100 basis points (more risk due to high debt). During the European debt crisis (2011-2012), Greece's CDS spread exceeded 30,000 basis points before it actually defaulted - the market was pricing near certainty of default.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Below 50bp: low risk - the market considers default extremely unlikely</li><li>100-200bp: moderate risk - some concern about fiscal sustainability</li><li>Above 300bp: elevated risk - serious questions about the country's ability to manage its debt</li><li>Sudden spikes in CDS often foreshadow broader market stress or political crises</li></ul></div></div><div class=\"ge-formal\">The annual premium (in basis points) paid to buy protection against a sovereign default via a credit default swap contract, typically referencing the 5-year maturity.</div>"
      },
      "moderate": {
        "bluf": "Sovereign CDS spreads price the market-implied probability of government default. They strip out interest rate risk (unlike bond spreads) and provide a pure measure of credit perception. They are the fastest-moving indicator of sovereign stress and contagion risk.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Sovereign CDS spreads are the cleanest measure of sovereign credit risk because they isolate default probability from interest rate and liquidity effects. They move faster than bond markets during stress because CDS are unfunded (no capital outlay) and can be shorted easily. For countries with less liquid bond markets, CDS is often the more reliable risk indicator.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">A CDS spread can be roughly converted to a default probability: a 100bp spread on a 5Y CDS, assuming 40% recovery, implies roughly a 1.7% annual default probability or ~8% cumulative 5-year probability. This is a useful mental model, though the actual CDS premium includes a risk premium above the pure actuarial probability.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">During the 2011 euro crisis, Italian CDS widened from 150bp to 590bp in 4 months as markets questioned euro membership. The ECB's \"whatever it takes\" intervention compressed spreads 300bp in weeks - demonstrating that for eurozone sovereigns, the central bank backstop is the dominant variable. Without it, Italian spreads would structurally trade wider.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>CDS-bond basis:</strong> the gap between CDS spread and bond spread - when CDS is significantly wider, it signals hedging demand or short positioning</li><li><strong>Cross-country contagion:</strong> correlation of CDS moves across countries signals systemic vs idiosyncratic risk</li><li><strong>Upfront pricing:</strong> when CDS trades upfront rather than running spread, the market considers near-term default possible</li><li><strong>CDS vs local yields:</strong> for countries that print their own currency, CDS also prices inflation/devaluation risk, not just hard default</li></ul></div></div><div class=\"ge-formal\">The 5-year sovereign CDS premium in basis points. Approximate implied default probability: p ≈ spread / (1 - recovery rate), with standard recovery assumption of 40% for sovereign CDS (25% for some EM credits).</div>"
      },
      "expert": {
        "bluf": "Sovereign CDS prices the risk-neutral default probability conditional on recovery assumptions. For G7 issuers, CDS levels reflect redenomination risk and fiscal trajectory more than literal default probability. The CDS-bond basis and cross-currency basis together reveal the true all-in cost of sovereign risk hedging.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">For developed market sovereigns that issue in their own currency, \"default\" is effectively a policy choice (they can always print). Sovereign CDS for these issuers prices a combination of: redenomination risk (for eurozone members), restructuring probability, political willingness to pay, and the tail risk of institutional breakdown. The 2012 Greek restructuring was a credit event; Argentina's serial defaults are credit events. The US debt ceiling drama is priced via CDS even though actual default is near-zero probability.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">The sovereign CDS market is thin for most names - the notional outstanding is a fraction of the bond market. This means CDS spreads can be driven by positioning (a few large hedge funds buying protection) rather than fundamental repricing. The CDS-bond basis (negative when CDS < bond spread, positive when CDS > bond spread) reveals whether the signal is coming from the cash market or the derivatives market.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US CDS spiked to 175bp during the 2023 debt ceiling standoff - a massive move for the world's reserve currency issuer. This was pure political risk pricing: the market assigned a non-trivial probability to a technical default (missed payment) even though eventual payment was near certain. The asymmetry - tiny probability of an enormous event - makes sovereign CDS gamma extremely convex during political crises.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>ISDA definitions:</strong> what constitutes a credit event is legally precise - failure to pay, restructuring, and repudiation are the three sovereign triggers. Definitions changed post-2014 to include redenomination</li><li><strong>Recovery rate assumptions:</strong> standard 40% recovery is a convention, not a fundamental - actual sovereign recoveries vary enormously (Greece: ~47%, Argentina: ~25%)</li><li><strong>Quanto CDS:</strong> the difference between USD-denominated and EUR-denominated CDS on eurozone sovereigns prices redenomination (exit to new currency) specifically</li><li><strong>Net notional:</strong> DTCC data shows net CDS positions outstanding - a shrinking market means less liquidity and more gap risk</li></ul></div></div><div class=\"ge-formal\">The 5Y sovereign CDS spread in basis points. Risk-neutral default probability: PD = 1 - e^(-s*T/(1-R)), where s = spread, T = maturity, R = recovery. For EUR sovereigns, quanto CDS differential (EUR vs USD denomination) isolates redenomination risk. The CDS-bond basis = CDS spread - asset swap spread (ASW) on the benchmark bond.</div>"
      }
    },
