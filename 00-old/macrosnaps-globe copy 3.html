      "beginner": {
        "bluf": "When a central banker favours lower interest rates and more support for the economy, even if it means tolerating higher inflation. The opposite is \"hawkish\" - favouring higher rates to fight inflation. Markets move on every hint of whether a central bank is leaning dovish or hawkish.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Central bank communication is a policy tool. When a central bank sounds dovish, markets expect rate cuts: bond prices rise, stocks often rally, the currency weakens. A single word change in a statement can move billions.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If the Fed chair says \"we see downside risks to employment\" - that is dovish (rate cuts coming). If instead the chair says \"inflation remains too high\" - that is hawkish (rates staying high or going higher).</div></div><div class=\"ge-formal\">A monetary policy stance favouring lower interest rates, more accommodation, and greater emphasis on employment relative to inflation control.</div>"
      },
      "moderate": {
        "bluf": "A policy bias toward accommodation - lower rates, more liquidity, tolerance for inflation overshoot. Dovish communication shifts rate expectations lower, easing financial conditions before any actual change. The dovish/hawkish spectrum is the primary lens for interpreting central bank rhetoric.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Market reaction to central bank meetings is driven by whether the statement is more dovish or hawkish than expected. A rate hold can be dovish (if a hike was expected) or hawkish (if a cut was expected). The delta relative to expectations matters, not the absolute level.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Dot plot shifts:</strong> median projection moving down is dovish</li><li><strong>Dissents:</strong> dovish dissents foreshadow the next move</li><li><strong>Language changes:</strong> \"some\" to \"many\", \"could\" to \"will\" - small words carry large signal</li><li><strong>Reaction function:</strong> dovish = higher weight on employment in the dual mandate</li></ul></div></div><div class=\"ge-formal\">A policy bias toward accommodation. In Taylor Rule terms: higher weight on the output gap relative to the inflation gap. Opposite: hawkish.</div>"
      },
      "expert": {
        "bluf": "Dovish describes a revealed preference for accommodation - a higher weight on the output gap in the reaction function. In practice, dovish/hawkish is relative to market pricing: a 25bp cut is hawkish if 50bp was priced. The key is the delta between the central bank's communicated path and OIS-implied path.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Communication has become a primary policy tool (Woodford's \"management of expectations\"). A dovish statement shifting OIS by 20bp is equivalent to an actual cut in financial conditions terms. NLP models now systematically quantify hawk-dove scores across central bank communications.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Intertemporal bias:</strong> hawkish today but signalling future dovishness flattens the curve</li><li><strong>Institutional bias:</strong> BOJ structurally dovish; ECB (Bundesbank tradition) structurally hawkish</li><li><strong>Credibility cost:</strong> excessive dovishness can de-anchor expectations - credibility is depletable</li></ul></div></div><div class=\"ge-formal\">A reaction function with higher weight on output stabilisation. Measured as deviation of communicated rate path below OIS-implied path. NLP hawk-dove indices (Istrefi 2019) quantify the stance across committee members.</div>"
      }
    },

  "monetary tightening": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When a central bank raises interest rates or takes other steps to make borrowing more expensive and slow down an overheating economy. The goal is to cool inflation by reducing spending and investment.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When inflation rises too high, the central bank needs to cool the economy. Higher interest rates make mortgages, car loans, and business loans more expensive. People borrow less, spend less, and eventually prices stop rising so fast. The risk is overdoing it and causing a recession - the economy slows too much and people lose jobs.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Between 2022 and 2023, the Fed raised rates from 0% to 5.5% - the most aggressive tightening in 40 years - to fight inflation that had hit 9%. Mortgage rates doubled, the housing market cooled, and inflation gradually fell. The question was whether they could bring inflation down without causing mass unemployment - a \"soft landing.\"</div></div><div class=\"ge-formal\">A shift in monetary policy toward higher interest rates and/or reduced central bank balance sheets to slow economic activity, cool demand, and bring inflation back toward the target.</div>"
      },
      "moderate": {
        "bluf": "Monetary tightening raises the policy rate above the neutral rate and may include QT. The 2022-2023 cycle was the fastest in decades - 525bp in 16 months - testing how much tightening the economy could absorb without breaking. The full impact arrives well after the last hike due to transmission lags.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Tightening works by raising the cost of capital, which slows credit growth, reduces investment, cools the housing market, and strengthens the currency (making imports cheaper). The pain is front-loaded (rate-sensitive sectors like housing respond first) while the benefits (lower inflation) come with a lag. This creates political pressure to stop tightening before the job is done.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real policy rate:</strong> tightening only bites when the real rate (nominal minus inflation expectations) turns positive and exceeds r*</li><li><strong>Credit impulse:</strong> the rate of change of credit growth - if this turns sharply negative, tightening is working (perhaps too well)</li><li><strong>Something breaks:</strong> tightening cycles typically end when financial stress emerges (SVB 2023, UK pensions 2022, EM crises 2018)</li><li><strong>Overtightening risk:</strong> with 12-18 month lags, the last rate hike may push the economy into recession months later</li></ul></div></div><div class=\"ge-formal\">An increase in the policy rate above the neutral rate and/or balance sheet reduction to tighten financial conditions and reduce inflation. Transmission lag: 12-18 months to peak impact on activity, 18-24 months on inflation.</div>"
      },
      "expert": {
        "bluf": "Monetary tightening raises the policy rate above r* to open a negative output gap and push inflation back to target via the Phillips Curve. The nonlinearity of tightening is the key risk: financial fragilities exposed by higher rates create discontinuous events that accelerate the downturn beyond what the output gap channel alone would produce.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Tightening cycles are inherently asymmetric: the transmission to financial conditions is immediate (asset prices reprice in days), but the real economy responds with variable lags by sector and cycle. The historical pattern is that central banks tighten until something breaks - the break event is what actually ends the cycle. The Minsky framework: stability breeds instability, and the leverage accumulated during the prior easing cycle determines the fragility that tightening reveals.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Term premium response:</strong> if tightening raises the term premium (via QT + reduced credibility), the long end amplifies the policy rate impact</li><li><strong>Threshold effects:</strong> many borrowers have fixed-rate debt that reprices at specific thresholds - the \"refinancing wall\" creates cliff-edge dynamics</li><li><strong>Cross-border transmission:</strong> Fed tightening exports tightening globally via dollar strength, forcing EM central banks to hike defensively</li><li><strong>Financial conditions overshoot:</strong> credit spreads, equity valuations, and FX can overshoot the policy intent, creating unintended tightening</li></ul></div></div><div class=\"ge-formal\">Policy rate increase above r* to generate a negative output gap. The sacrifice ratio (cumulative output loss per 1pp inflation reduction) is the efficiency metric - historically 2-3 for the US. Nonlinear risks: financial stability events accelerate the transmission beyond the smooth Phillips Curve channel.</div>"
      }
    },

  "monetary easing": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When a central bank cuts interest rates or takes other steps to make borrowing cheaper and stimulate a weak economy. The goal is to encourage businesses to invest, consumers to spend, and the economy to grow faster.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">When the economy slows down and unemployment rises, the central bank eases monetary policy to provide a boost. Lower interest rates mean cheaper mortgages, cheaper business loans, and less incentive to save (since savings earn less). All of this encourages spending and investment, which creates jobs and growth.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In 2020, the Fed slashed rates from 1.5% to 0% in two weeks and launched massive QE to fight the COVID recession. This made mortgages cheaper, supported stock prices, and helped the economy recover. The risk: too much easing can fuel inflation, which is exactly what happened by 2022.</div></div><div class=\"ge-formal\">A shift in monetary policy toward lower interest rates and/or expanded central bank balance sheets to stimulate economic activity, reduce unemployment, and support credit growth.</div>"
      },
      "moderate": {
        "bluf": "Monetary easing encompasses rate cuts, forward guidance, QE, and other tools that loosen financial conditions. It transmits through multiple channels: lower borrowing costs, higher asset prices (wealth effect), weaker currency (competitiveness), and reduced term premia. The lag between easing and real economy impact is typically 12-18 months.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The easing transmission mechanism: rate cuts lower the front end, forward guidance shapes expectations, QE compresses the long end, and the resulting easier financial conditions flow through to credit availability, asset prices, and the exchange rate. The Goldman Sachs Financial Conditions Index (FCI) captures the combined effect across all channels.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real vs nominal easing:</strong> a 50bp cut when inflation is falling may not ease real conditions at all</li><li><strong>Market pre-pricing:</strong> if markets have already priced in cuts, the actual announcement has little incremental impact</li><li><strong>Credit transmission:</strong> easing only works if banks pass rate cuts through to lending rates - in credit crunches, they may not</li></ul></div></div><div class=\"ge-formal\">A reduction in the monetary policy stance through rate cuts, balance sheet expansion, or forward guidance aimed at loosening financial conditions and stimulating demand. Transmission channels: interest rate, credit, asset price, exchange rate, and expectations.</div>"
      },
      "expert": {
        "bluf": "Monetary easing is a reduction in the policy stance below the neutral rate to stimulate output above potential. At the ZLB, conventional easing is exhausted and unconventional tools (QE, YCC, NIRP, forward guidance) become the operative instruments. The effectiveness of easing is state-dependent and constrained by the reversal rate.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The key constraint on easing is the \"reversal rate\" (Brunnermeier-Koby): below a certain rate, further cuts become contractionary because they destroy bank profitability and impair credit intermediation. This was the practical limit for ECB and BOJ negative rate experiments. The other constraint is the fiscal-monetary interaction: easing during fiscal expansion can overstimulate and de-anchor inflation expectations.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Financial conditions passthrough:</strong> if equity markets rally on easing expectations, financial conditions loosen before any rate cut - the \"announcement effect\"</li><li><strong>Currency channel:</strong> in small open economies, the FX depreciation from easing may be the dominant transmission channel - but it is zero-sum globally</li><li><strong>Liquidity trap:</strong> when rates are at zero and demand for money is infinitely elastic, additional monetary base expansion has no effect</li></ul></div></div><div class=\"ge-formal\">A reduction in the policy rate below the neutral rate (r less than r*) or expansion of the balance sheet to ease financial conditions. Effectiveness bounded by: the ZLB/ELB, the reversal rate, liquidity trap conditions, and the fiscal-monetary policy mix.</div>"
      }
    },

  "automatic stabilisers": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Parts of the government budget that automatically help cushion the economy without politicians needing to do anything. When the economy weakens, tax revenue falls and welfare spending rises, pumping money in. The reverse happens during booms.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Automatic stabilisers are the economy's built-in shock absorbers. They work faster than any new policy because they are already in place. During a recession, unemployed workers receive benefits (maintaining spending) and people earn less (paying less tax, keeping more money).</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">During COVID, even before governments passed stimulus packages, tax revenue dropped automatically and unemployment benefits rose. In the US, these stabilisers amounted to roughly 2-3% of GDP in 2020 - a massive cushion that kicked in with zero legislative action.</div></div><div class=\"ge-formal\">Government revenue and spending mechanisms that automatically adjust counter-cyclically without new legislation, including progressive taxation and unemployment insurance.</div>"
      },
      "moderate": {
        "bluf": "Fiscal mechanisms that counter-cyclically adjust spending and revenue without legislative action. European economies have larger stabilisers (~40-50% of a GDP shock offset) than the US (~25-30%) due to more progressive taxation and generous welfare systems.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Automatic stabilisers are the first line of fiscal defence. They widen the deficit in recessions and narrow it in expansions without political delay. The cyclically adjusted budget balance (CAPB) strips out stabiliser effects to reveal the discretionary policy stance.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Stabiliser size:</strong> Nordic countries offset ~50% of GDP shocks vs ~25% in the US</li><li><strong>Deficit decomposition:</strong> a rising deficit during recession may be entirely stabiliser-driven - not bad policy</li><li><strong>Discretionary vs automatic:</strong> stimulus packages are discretionary; stabilisers are automatic</li></ul></div></div><div class=\"ge-formal\">Counter-cyclical fiscal mechanisms embedded in tax and transfer systems. Stabilisation coefficient: 0.25-0.50 for OECD economies.</div>"
      },
      "expert": {
        "bluf": "Automatic stabilisers are the endogenous fiscal response to the cycle, typically offsetting 25-50% of output shocks. The CAPB nets them out to isolate discretionary fiscal impulse, though output gap estimation uncertainty makes this decomposition imprecise.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">In the eurozone, where monetary policy is centralised and fiscal rules constrain discretionary spending, automatic stabilisers bear a disproportionate burden of cyclical adjustment. The Stability and Growth Pact targets the structural balance rather than the headline deficit, implicitly relying on stabilisers.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Output gap uncertainty:</strong> stabiliser estimates depend on output gap measurement, which is revised substantially</li><li><strong>Revenue elasticity:</strong> responsiveness of tax revenue to GDP - typically 1.0-1.2 for total revenue</li><li><strong>Fiscal drag:</strong> in expansions, stabilisers automatically tighten by pulling in more tax revenue</li></ul></div></div><div class=\"ge-formal\">Endogenous fiscal response: delta(deficit) = -alpha * delta(output gap), where alpha is the stabilisation coefficient (~0.25-0.50). Revenue elasticity ~1.0-1.2; spending elasticity driven by unemployment insurance generosity.</div>"
      }
    },

  "breakeven inflation": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The inflation rate that the bond market expects over a given period. Calculated from the gap between regular government bonds and inflation-protected bonds. If actual inflation turns out higher than the breakeven, inflation-protected bonds win; if lower, regular bonds win.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Breakeven inflation tells you what thousands of bond investors collectively think inflation will be. This matters because expectations about future inflation influence actual inflation - if businesses expect 5%, they raise prices 5%. Central banks watch breakevens to gauge whether expectations are \"anchored\" near their 2% target.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a regular 10-year Treasury yields 4.5% and a 10-year TIPS (inflation-protected) yields 2.0%, the breakeven is 2.5%. The market expects 2.5% average inflation over the next decade.</div></div><div class=\"ge-formal\">The difference between nominal and inflation-linked bond yields of the same maturity, representing market-implied average inflation over that period.</div>"
      },
      "moderate": {
        "bluf": "Market-implied inflation derived from nominal minus real (TIPS) yields. Breakevens embed both expectations and an inflation risk premium, so they are a biased estimate of pure expectations. The 5Y5Y forward breakeven is the Fed's preferred gauge of long-term anchoring.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The 5Y5Y forward strips out near-term noise to reveal whether long-term expectations remain anchored near 2%. De-anchoring would force much more aggressive tightening.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>5Y5Y forward:</strong> the Fed's key gauge - should hover near 2.0-2.3%</li><li><strong>TIPS liquidity:</strong> breakevens can be distorted by liquidity premia, especially during stress</li><li><strong>Survey cross-check:</strong> Michigan consumer expectations and SPF forecasts provide independent verification</li><li><strong>Breakeven curve:</strong> steep = expectations of persistent inflation</li></ul></div></div><div class=\"ge-formal\">Breakeven = nominal yield - TIPS real yield. Decomposition: breakeven = expected inflation + inflation risk premium. The 5Y5Y forward isolates long-term expectations.</div>"
      },
      "expert": {
        "bluf": "Breakeven inflation = expected inflation + inflation risk premium (IRP). The IRP is time-varying (20-50bp), making breakevens biased. Kim-Wright decomposition and Cleveland Fed model separate these components. TIPS indexation lag and liquidity premia add further noise.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The IRP has been historically positive but turned negative during QE when central bank TIPS purchases distorted the market. Current estimates (~30-50bp) suggest breakevens overstate true expectations by that amount.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Kim-Wright decomposition:</strong> the Fed's reference model separating expectations from IRP</li><li><strong>TIPS liquidity premium:</strong> during stress, can spike 50-100bp, collapsing breakevens even as expectations rise</li><li><strong>Inflation caps/floors:</strong> the derivatives market prices the probability distribution directly</li><li><strong>CPI-PCE wedge:</strong> TIPS index to CPI but the Fed targets PCE - ~30bp systematic gap</li></ul></div></div><div class=\"ge-formal\">Breakeven = E[pi] + IRP + liquidity adjustment. TIPS indexed to CPI with 3-month lag. 5Y5Y forward: [(1+BE10)^10 / (1+BE5)^5]^(1/5) - 1.</div>"
      }
    },

    ],

  "recession": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When an economy shrinks - people lose jobs, businesses close, and spending falls. The informal rule is two consecutive quarters of negative GDP growth, though officially it is determined by a broader set of indicators including employment, income, and production.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Recessions affect everyone. Unemployment rises, wages stagnate, house prices can fall, and businesses go bankrupt. Governments respond by spending more (stimulus) and central banks cut interest rates. How deep and long a recession lasts depends on what caused it and how quickly policymakers respond.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The COVID recession (2020) was the sharpest in modern history - GDP fell 30%+ annualised in one quarter - but also the shortest, lasting just two months. The 2008 financial crisis recession lasted 18 months and took years to fully recover from. The cause matters: financial crises cause longer, deeper recessions than normal business cycle downturns.</div></div><div class=\"ge-formal\">A significant, broad-based, and sustained decline in economic activity. In the US, officially declared by the NBER Business Cycle Dating Committee based on depth, diffusion, and duration of the decline across multiple indicators.</div>"
      },
      "moderate": {
        "bluf": "A recession is a significant decline in economic activity spread across the economy lasting more than a few months. The NBER definition (US) looks at employment, income, production, and sales - not just GDP. The yield curve inversion is the most reliable leading indicator, with a 6-18 month lead time.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Recessions trigger a cascade: falling demand leads to layoffs, which reduces income, which reduces demand further (the multiplier effect in reverse). Financial recessions (caused by credit crises) are typically twice as deep and twice as long as non-financial recessions. Policy response speed is critical - the 2020 recession was short precisely because fiscal and monetary response was unprecedented in speed and scale.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Yield curve:</strong> 3m10s inversion has preceded every US recession since 1970 with a 6-18 month lead</li><li><strong>Sahm Rule:</strong> 0.5pp rise in 3-month average unemployment from 12-month trough - 100% hit rate historically</li><li><strong>Initial jobless claims:</strong> sustained rise above 300k signals labour market deterioration</li><li><strong>Leading Economic Index:</strong> Conference Board LEI declining for 6+ months is a classic recession warning</li></ul></div></div><div class=\"ge-formal\">A significant decline in economic activity spread across the economy, lasting more than a few months, normally visible in real GDP, real income, employment, industrial production, and wholesale-retail sales (NBER definition).</div>"
      },
      "expert": {
        "bluf": "Recessions are nonlinear regime shifts, not simply the downward phase of a linear business cycle. The Markov-switching framework (Hamilton 1989) captures the asymmetry: contractions are sharp and short, expansions are gradual and long. Financial recessions exhibit hysteresis - permanent output loss relative to pre-crisis trend.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The distinction between demand-driven and financial recessions is crucial for policy response and market implications. Demand recessions respond to conventional monetary easing. Financial recessions involve balance sheet repair (Koo's balance sheet recession framework) and require fiscal policy because the monetary transmission mechanism is impaired - banks do not lend even at zero rates.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Recession probability models:</strong> probit models using yield curve slope give ~70% probability 12 months after sustained inversion. Adding credit conditions and claims data improves fit</li><li><strong>Nonlinearity:</strong> recessions involve positive feedback loops (layoffs reduce demand, reducing revenue, causing more layoffs) that make the downturn self-reinforcing beyond what linear models predict</li><li><strong>Hysteresis:</strong> Blanchard-Summers (1986): deep recessions permanently reduce potential output through skill atrophy, capital scrapping, and discouraged workers</li><li><strong>Policy buffer:</strong> the available rate-cutting room (currently ~500bp in the US) and fiscal space determine how effectively the next recession can be fought</li></ul></div></div><div class=\"ge-formal\">A regime shift in economic activity characterised by nonlinear dynamics (Hamilton Markov-switching). Financial recessions: deeper (peak-to-trough GDP ~5% vs ~2%), longer (18 months vs 11 months), and exhibit hysteresis (permanent 5-10% output loss relative to pre-crisis trend). Reinhart-Rogoff database: financial crises preceded by credit booms are the most damaging.</div>"
      }

  "disinflation": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "When inflation slows down but remains positive - prices are still rising, just not as fast. Disinflation is not deflation. If inflation falls from 8% to 3%, that is disinflation: things still get more expensive, but the pace has slowed.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Disinflation is what central banks aim for when they raise rates to fight high inflation. They want to bring it down to ~2% without crashing the economy. The disinflation process determines when central banks can stop hiking and start cutting - which drives bonds, stocks, and currencies.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US inflation peaked at 9.1% in June 2022 and fell to about 3% by mid-2024. Prices were still going up - just more slowly. The last stretch from 3% to 2% proved the hardest, driven by sticky services inflation.</div></div><div class=\"ge-formal\">A decline in the rate of inflation - prices continue to rise but at a decreasing rate.</div>"
      },
      "moderate": {
        "bluf": "A falling inflation rate that remains positive. Goods disinflation is typically fast (supply-chain normalisation), while services disinflation is slow and sticky (driven by wages). The \"last mile\" from 3% to 2% is the most difficult.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The speed and composition of disinflation determine the monetary policy path. Rapid, broad-based disinflation allows early rate cuts. Slow, narrow disinflation (goods only, services stuck) forces rates to stay higher for longer.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Goods vs services:</strong> goods disinflation is largely done; services inflation is the battleground</li><li><strong>Supercore:</strong> core services ex-housing needs to fall to ~3% annualised</li><li><strong>Base effects:</strong> large price increases rolling off create mechanical disinflation that flatters the trend</li><li><strong>Wage persistence:</strong> with wages growing 4-5%, sustained 2% inflation is arithmetically difficult without productivity gains</li></ul></div></div><div class=\"ge-formal\">A declining inflation rate (delta-pi < 0 while pi > 0). The sacrifice ratio measures cumulative output cost per percentage point of disinflation - typically 1.5-3.0.</div>"
      },
      "expert": {
        "bluf": "Disinflation is the policy objective post-inflation shock. The sacrifice ratio and speed of expectations re-anchoring determine soft-landing odds. The nonlinearity - fast at first (supply normalisation), then slow (demand-driven services) - creates a timing trap for rate setters.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The sacrifice ratio this cycle appears low (~0.5) because much disinflation came from supply healing rather than demand destruction - an unusually favourable outcome.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Sacrifice ratio:</strong> cumulative unemployment rise per pp of disinflation - historically 1.5-3.0, lower this cycle</li><li><strong>Immaculate disinflation:</strong> inflation returning to target without recession - supported so far but historically rare</li><li><strong>Persistence measures:</strong> trimmed mean, median CPI, and the Multivariate Core Trend reveal momentum better than headline</li></ul></div></div><div class=\"ge-formal\">Declining inflation rate. Sacrifice ratio = cumulative output gap / cumulative disinflation. Speed depends on expectations anchoring, supply elasticity, and labour market cooling required.</div>"
      }
    },

  "output gap": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The difference between what an economy is actually producing and what it could produce at full capacity. A positive gap means the economy is running hot (overheating, inflationary). A negative gap means there is slack (underperforming, room to grow).",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The output gap tells you whether the economy needs stimulating or cooling. When there is a big negative gap (lots of unused capacity), cutting interest rates makes sense. When the gap is positive (economy running above capacity), inflation is likely rising and rates need to go up.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">During the COVID recession, the US output gap was deeply negative - factories were idle, workers were furloughed. By 2022, massive stimulus had pushed it positive - demand exceeded supply, fuelling inflation. Central banks hiked rates to close the gap from above.</div></div><div class=\"ge-formal\">The difference between actual GDP and potential GDP, expressed as a percentage of potential GDP. Positive = overheating; negative = slack.</div>"
      },
      "moderate": {
        "bluf": "The output gap measures the difference between actual and potential GDP. It is the key input into the Phillips Curve (mapping slack to inflation) and the Taylor Rule (mapping the gap to the appropriate policy rate). The gap is unobservable and estimated with considerable uncertainty.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The output gap drives the inflation outlook via the Phillips Curve: a positive gap creates excess demand, bidding up wages and prices. Central banks estimate the gap to calibrate policy - the Taylor Rule prescribes rate = r* + inflation + 0.5(inflation gap) + 0.5(output gap). The problem: potential GDP is unobservable and estimates vary widely, so the output gap is measured with a large error band.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Estimation uncertainty:</strong> CBO, IMF, and Fed estimates can differ by 1-2pp - a meaningful policy difference</li><li><strong>Real-time vs revised:</strong> initial output gap estimates are frequently revised, meaning policy was set on wrong data</li><li><strong>Supply-side shocks:</strong> COVID shifted potential GDP itself, making the gap harder to estimate</li></ul></div></div><div class=\"ge-formal\">Output gap = (Y - Y*) / Y*, where Y is actual GDP and Y* is potential GDP. Estimated via production function approach, HP filter, or multivariate models. Feeds into the Phillips Curve: inflation = expected inflation + slope x output gap + supply shocks.</div>"
      },
      "expert": {
        "bluf": "The output gap is the unobservable driver of the Phillips Curve. Its estimation is model-dependent and subject to large real-time errors (Orphanides problem). The post-COVID debate centres on whether potential GDP shifted permanently downward (hysteresis) or recovered, with massive implications for the neutral policy stance.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The output gap is the core state variable in the New Keynesian framework - it determines the inflation-output trade-off and the optimal policy rate. But its real-time measurement is poor: Orphanides (2001) showed that real-time output gap estimates explain almost none of the variance of revised estimates. This means policy is systematically calibrated to the wrong gap.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Hysteresis:</strong> deep recessions may permanently reduce potential GDP (scarring) - if so, the gap closes from the supply side without inflationary pressure</li><li><strong>Labour market proxy:</strong> unemployment gap (u - u*) is a more directly observable proxy for the output gap</li><li><strong>Multivariate filters:</strong> combining GDP, unemployment, and inflation data simultaneously gives more robust gap estimates than univariate methods</li><li><strong>End-point bias:</strong> HP filter and similar methods are unreliable at the end of the sample - exactly when you need the estimate most</li></ul></div></div><div class=\"ge-formal\">Output gap = (Y - Y*) / Y*. Estimation methods: production function (TFP + capital + labour), statistical filters (HP, Beveridge-Nelson, band-pass), and multivariate models (Kalman filter). Real-time reliability is poor: RMSE of real-time estimates is approximately the same magnitude as the gap itself.</div>"
      }
    },

  "potential GDP": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The maximum amount an economy can produce sustainably without causing excessive inflation. Think of it as the economy's speed limit - if you drive faster than the limit, the engine overheats (inflation rises). If you drive well below it, you are wasting capacity.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Potential GDP determines how fast an economy can grow without creating problems. If potential growth is 2%, then 3% growth will eventually cause inflation because demand exceeds what the economy can supply. If actual growth is only 1%, there is wasted capacity - unemployed workers and idle factories. Central banks try to keep actual GDP close to potential.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US economy's potential GDP growth is estimated at about 1.8-2.0% per year. China's is around 4-5%. The difference reflects demographics (working-age population growth), capital investment, and productivity improvements. An ageing country like Japan has potential growth near 0.5-1%.</div></div><div class=\"ge-formal\">The level of GDP an economy can sustain at full employment of resources without generating accelerating inflation, determined by the size and quality of the labour force, capital stock, and total factor productivity.</div>"
      },
      "moderate": {
        "bluf": "Potential GDP is the supply-side speed limit of the economy, determined by labour force growth, capital deepening, and total factor productivity (TFP). It is unobservable and must be estimated. The gap between actual and potential GDP (the output gap) drives inflation dynamics and determines appropriate monetary policy stance.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Potential GDP growth determines the sustainable growth rate and is the denominator in debt sustainability (g in the r-g framework). Secular stagnation concerns centre on whether potential growth has structurally declined across developed markets due to demographics (ageing), slowing productivity, and reduced capital investment.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Demographics:</strong> working-age population growth is the most predictable component - Japan and Europe face structural headwinds</li><li><strong>TFP:</strong> total factor productivity is the residual after accounting for labour and capital - the \"measure of our ignorance\" (Solow)</li><li><strong>AI impact:</strong> the bull case for potential GDP growth is that AI raises TFP significantly - the bear case is that the gains accrue to capital, not broadly</li><li><strong>Hysteresis:</strong> deep recessions may permanently reduce potential GDP through skill atrophy and capital scrapping</li></ul></div></div><div class=\"ge-formal\">Production function approach: Y* = A x F(K, L), where A = total factor productivity, K = capital stock, L = potential labour input (working-age population x trend participation x trend hours). CBO estimates US potential growth at ~1.8% (2024): ~0.5pp from labour, ~0.7pp from capital, ~0.6pp from TFP.</div>"
      },
      "expert": {
        "bluf": "Potential GDP is the centrepiece of the supply-side framework: Y* = TFP x F(K*, L*). Its estimation is plagued by end-point bias (HP filter), model uncertainty (production function vs statistical filter), and structural break risk (COVID, AI). The r-g framework for debt sustainability makes potential growth estimation a first-order fiscal question.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Potential GDP determines the neutral rate (via the natural rate of interest), the sustainable fiscal deficit, and the equilibrium unemployment rate. All three are unobservable. The interconnection means estimation errors compound: if potential GDP is overestimated, the output gap is underestimated, policy is too loose, and inflation surprises to the upside - arguably the 2021 setup.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>TFP measurement:</strong> TFP is a residual, not a primitive - it captures measurement error, reallocation, and true technological change indistinguishably</li><li><strong>Demographic cliff:</strong> China's working-age population peaked in 2012; Europe's peaked ~2010. Immigration is the only short-term offset for DM</li><li><strong>AI and TFP:</strong> Brynjolfsson's productivity J-curve: new technologies take years to show up in TFP as complementary investments and organisational changes are needed</li><li><strong>Supply-side reform:</strong> structural reforms (labour market, product market, trade) can raise potential GDP - but the effects take 5-10 years to materialise</li></ul></div></div><div class=\"ge-formal\">Y* = TFP x F(K*, L*). CBO methodology: Solow production function with Cobb-Douglas form, alpha=0.3. Potential labour: CPS demographics x age-sex-specific participation trends x NAIRU. Capital: perpetual inventory with investment forecast. TFP: Kalman filter trend. Uncertainty: 95% CI on the output gap is approximately +/-2pp - wider than the gap itself in many years.</div>"
      }
    },

  "real GDP": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The total value of everything a country produces - all goods and services - adjusted for inflation. The 'real' part means we strip out price increases so we can see whether the economy actually produced more stuff, not just charged more for the same amount.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Real GDP is the standard measure of an economy's size and health. It tells you whether a country is producing more goods, building more things, and delivering more services than before. Without adjusting for inflation, you might think the economy grew when really prices just went up.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Imagine a baker who made 100 loaves last year at $2 each ($200 revenue) and 100 loaves this year at $3 each ($300 revenue). Nominal GDP says the baker's output grew 50%. Real GDP says it grew 0% - same number of loaves. Real GDP tells the truth about actual production.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US nominal GDP in 2024 was about $28 trillion. After stripping out inflation, real GDP was about $22 trillion (in 2017 dollars). The difference is the cumulative effect of price increases since 2017.</div></div><div class=\"ge-formal\">Gross Domestic Product adjusted for inflation, measuring the total value of goods and services produced within a country, expressed in constant prices of a base year.</div>"
      },
      "moderate": {
        "bluf": "GDP deflated by a price index to measure volume change, not price change. Chain-weighted methodology avoids substitution bias. Real GDP growth is the headline measure of economic performance, but nominal GDP matters more for debt sustainability and corporate revenue.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Real GDP is the denominator in debt-to-GDP, the driver of tax revenue, and the benchmark against which potential output is measured. The gap between actual and potential real GDP (the output gap) is the key input into inflation forecasting and monetary policy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Nominal vs real:</strong> for debt sustainability and corporate revenue, nominal GDP (real + inflation) is what actually matters</li><li><strong>Chain weighting:</strong> modern GDP uses annually updated weights - components do not sum to the total</li><li><strong>Revisions:</strong> initial GDP estimates are revised significantly - the first print is an educated guess</li></ul></div></div><div class=\"ge-formal\">GDP measured in constant prices using chain-weighted deflation. Expenditure decomposition: C + I + G + (X - M), each deflated by component-specific price indices.</div>"
      },
      "expert": {
        "bluf": "Real GDP is the chain-weighted volume measure of aggregate output. It is an imperfect welfare proxy (excludes non-market activity, leisure, environmental costs) and an imperfect cycle indicator (GDI divergences, residual seasonality, benchmark revisions). GDP plus (adjusted for terms of trade) is a better welfare measure for commodity economies.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The GDP-GDI gap (gross domestic income should theoretically equal GDP) averages 0.5pp in any quarter and can exceed 2pp - averaging the two gives a more accurate picture. Residual seasonality in Q1 US GDP creates a persistent downward bias. Benchmark revisions can fundamentally change the narrative - the 2008 recession was initially -0.5% and later revised to -2.5%.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>GDP-GDI average:</strong> the best single measure of current output growth</li><li><strong>Benchmark revisions:</strong> annual comprehensive revisions can change the narrative entirely</li><li><strong>Real GDI:</strong> better at capturing the income side that drives spending</li></ul></div></div><div class=\"ge-formal\">Chain-weighted real GDP: geometric mean of Laspeyres and Paasche volume indices applied sequentially. Expenditure-income statistical discrepancy averages ~0.5pp quarterly.</div>"
      }
    },

  "Phillips curve": {
    "complexity": 3,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The idea that there is a trade-off between unemployment and inflation. When lots of people have jobs (low unemployment), wages and prices tend to rise faster. When many people are out of work (high unemployment), inflation tends to fall. Central banks use this relationship to calibrate interest rates.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The Phillips Curve is the foundation of how central banks think about the economy. If unemployment is very low, they expect inflation to rise and may raise interest rates to cool things down. If unemployment is high, they expect inflation to fall and may cut rates to stimulate growth. The trade-off is not perfect, but it shapes every monetary policy decision.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In 2022-2023, US unemployment was below 4% while inflation was above 6%. The Phillips Curve said: with unemployment this low, inflation will stay stubbornly high unless the labour market loosens. This was a key reason the Fed kept rates elevated - it needed unemployment to rise to bring inflation down.</div></div><div class=\"ge-formal\">The empirical relationship between the rate of unemployment and the rate of change of wages or prices, suggesting a trade-off between labour market tightness and inflation.</div>"
      },
      "moderate": {
        "bluf": "The Phillips Curve links the unemployment gap (u - NAIRU) to inflation dynamics. The modern expectations-augmented version: inflation = expected inflation + slope x (NAIRU - u) + supply shocks. The curve has flattened significantly since the 1990s, meaning large changes in unemployment produce smaller changes in inflation than historically.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">A flat Phillips Curve means the central bank needs to create a lot of unemployment to reduce inflation by a small amount - a high sacrifice ratio. This was the fear in 2022: if the curve is flat, bringing inflation from 6% to 2% might require unemployment of 6-7%. The soft landing achieved by 2024 suggested the curve may be steeper than estimated, or that supply-side normalisation did the work.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Slope estimate:</strong> the slope has declined from ~0.5 in the 1970s to ~0.1-0.2 - meaning unemployment changes have less inflation impact</li><li><strong>Expectations anchoring:</strong> well-anchored expectations flatten the curve and make supply shocks temporary</li><li><strong>Nonlinearity:</strong> the curve may be convex - flat when the economy is near potential but steep when very tight (below 4% unemployment)</li><li><strong>Supply vs demand:</strong> the Phillips Curve only captures demand-side inflation dynamics - supply shocks shift the entire curve</li></ul></div></div><div class=\"ge-formal\">Expectations-augmented Phillips Curve: inflation = expected inflation + slope x (u* - u) + supply shocks. The slope (sensitivity of inflation to the unemployment gap) has declined from ~0.5 (1970s) to ~0.1-0.2 (2010s). Anchored expectations imply a flatter curve and lower sacrifice ratio.</div>"
      },
      "expert": {
        "bluf": "The Phillips Curve is the core structural relationship in the New Keynesian model, linking real activity to inflation dynamics. The post-2020 experience revived the debate: the curve may be nonlinear (flat at moderate slack, steep when tight), state-dependent (slope varies with expectations anchoring), and subject to hysteresis in NAIRU itself.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The Phillips Curve determines the sacrifice ratio - how much output must be given up per percentage point of disinflation. Hazell et al. (2022) estimated the modern slope at 0.006 using cross-state data - essentially flat. But the 2021-2024 episode suggested nonlinearity: the curve was steep below 4% unemployment, consistent with the Benigno-Eggertsson (2023) model where the curve has a kink at full employment.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Nonlinear estimation:</strong> threshold models allowing different slopes above and below NAIRU fit the data significantly better than linear models</li><li><strong>Expectations regime:</strong> Reis (2021) argues the curve is steep when expectations are de-anchored and flat when anchored - the slope itself is endogenous to policy credibility</li><li><strong>Wage Phillips Curve:</strong> the wage-unemployment relationship may be more stable than the price-unemployment one, with variable pass-through from wages to prices</li><li><strong>Multi-sector models:</strong> Rubbo (2023) shows that sector-level Phillips Curves can aggregate to a flat economy-wide curve even when each sector has a steep one - composition effects matter</li></ul></div></div><div class=\"ge-formal\">New Keynesian Phillips Curve: inflation_t = beta x E[inflation_t+1] + kappa x mc_t + shock. Reduced form: inflation = anchored expectation + slope x (u* - u). Empirical slope: ~0.1-0.2 (linear), but potentially 0.3-0.5 in the steep region below u* (nonlinear specification). The Bernanke-Blanchard (2023) decomposition separates labour market tightness, supply shocks, and catch-up inflation channels.</div>"
      }
    },

  "wage-price spiral": {
    "complexity": 2,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "A dangerous cycle where workers demand higher wages because prices are rising, which forces businesses to raise prices further to cover their higher labour costs, which then triggers more wage demands. This feedback loop can make inflation self-reinforcing and very difficult to stop.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">A wage-price spiral is what central banks fear most. Normal inflation is manageable - prices go up, the central bank raises rates, inflation comes back down. But once wages and prices start chasing each other upward, the cycle becomes self-sustaining. Breaking it requires aggressive rate hikes that typically cause a recession, as Paul Volcker demonstrated in the early 1980s.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">In the 1970s, strong unions negotiated automatic cost-of-living wage increases. When oil prices spiked, inflation rose, wages rose to match, businesses raised prices to cover wages, and the cycle repeated. It took interest rates above 20% and a deep recession to finally break the spiral in 1981-82.</div></div><div class=\"ge-formal\">A self-reinforcing feedback loop where rising prices lead to higher wage demands, which raise production costs, which lead to further price increases.</div>"
      },
      "moderate": {
        "bluf": "A wage-price spiral occurs when inflation expectations de-anchor and workers successfully demand wage increases that exceed productivity growth, creating a feedback loop between unit labour costs and prices. The 2021-2023 episode was the key test: wages grew 5%+ but the spiral did not embed because expectations stayed anchored and corporate margins absorbed some cost pressure.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The spiral risk depends on three conditions: tight labour markets (workers have bargaining power), backward-looking wage indexation (wages automatically adjust to past inflation), and de-anchored expectations (workers and firms expect inflation to persist). In 2022-2023, condition 1 was present but conditions 2 and 3 were not fully triggered - a key reason the soft landing was possible.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Unit labour costs:</strong> wages minus productivity growth - the true cost pressure on firms. If ULC growth exceeds the inflation target, a spiral is forming</li><li><strong>Wage catchup vs spiral:</strong> one-off wage adjustments to compensate for past inflation (catchup) are different from ongoing wage-price feedback (spiral)</li><li><strong>Corporate margins:</strong> firms absorbing cost increases via margin compression breaks the transmission from wages to prices</li><li><strong>Indexation prevalence:</strong> how many contracts include automatic inflation adjustment - higher in Europe than the US</li></ul></div></div><div class=\"ge-formal\">A feedback mechanism: ΔP → ΔW → ΔP. Conditions: (1) labour market tightness (bargaining power), (2) backward-looking indexation, (3) de-anchored inflation expectations. The Bernanke-Blanchard (2023) model separates the one-time \"catchup\" effect from the persistent spiral dynamic.</div>"
      },
      "expert": {
        "bluf": "The wage-price spiral is the endogenous persistence mechanism in inflation dynamics. The Lorenzoni-Werning (2023) framework shows that spiral risk is a function of the relative speed of wage and price adjustment: when wages are stickier than prices, supply shocks cause temporary inflation; when prices are stickier than wages, the spiral can embed.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">The absence of a spiral in 2022-2023 despite 5%+ wage growth was the puzzle. The Bernanke-Blanchard decomposition showed that the inflation was driven by commodity shocks and supply chain disruptions, not by wage pressure. Wages were catching up to past price increases, not leading future ones. The real wage (adjusted for inflation) actually fell, meaning workers were not gaining purchasing power despite nominal wage gains.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Real wage growth:</strong> if real wages are falling (nominal wage growth < inflation), there is no spiral - workers are losing ground, not gaining</li><li><strong>Granger causality:</strong> test whether wages Granger-cause prices or vice versa - the direction of causation determines spiral risk</li><li><strong>Structural vs cyclical:</strong> the decline of unions, prevalence of fixed-term contracts, and gig economy weaken the institutional foundations for spirals</li><li><strong>Second-round effects:</strong> ECB terminology for wage-price feedback - monitored via negotiated wage trackers and price expectation surveys</li></ul></div></div><div class=\"ge-formal\">Endogenous inflation persistence via wage-price feedback. Lorenzoni-Werning (2023): spiral condition depends on relative price-wage stickiness. If wages adjust faster than prices, supply shocks are deflationary for real wages and the spiral does not embed. The decline of collective bargaining (union density: US ~10%, down from ~35%) has structurally weakened the spiral mechanism.</div>"

  "inflation": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Inflation is a sustained increase in the overall price level of goods and services, which reduces the purchasing power of money over time. When inflation rises, each unit of currency buys fewer things.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation affects how far wages go, how savings lose or keep value, how interest rates are set, and how governments and central banks make policy. Too much inflation erodes trust in money; too little can signal economic stagnation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Think of money as a measuring stick for value. Inflation means the stick is slowly shrinking. Prices aren't just going up randomly - the value of money itself is going down relative to goods and services across the economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a basket of everyday items costs $100 this year and $103 next year, the inflation rate is 3%. If your income didn't rise by at least 3%, you're effectively poorer, even though your paycheck is the same in dollar terms.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What inflation is not</div><div class=\"ge-body\"><ul><li>A one-time price increase for a single good</li><li>The same thing as \"high prices\" (inflation is about change, not level)</li><li>Always caused by greed or shortages alone</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Common causes</div><div class=\"ge-body\"><ul><li><strong>Demand-pull:</strong> too much spending chasing too few goods</li><li><strong>Cost-push:</strong> rising production costs passed to consumers</li><li><strong>Monetary factors:</strong> growth in the money supply faster than real output</li></ul></div></div><div class=\"ge-formal\">Inflation is the rate of change of a general price index (such as the Consumer Price Index) over time.</div>"
      },
      "moderate": {
        "bluf": "Inflation is the sustained rate of increase in the general price level, measured by indices like CPI or PCE. Central banks target ~2% as the sweet spot - high enough to avoid the zero lower bound, low enough to preserve purchasing power.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation determines real interest rates, erodes nominal debt burdens, affects wage negotiations, and is the primary variable central banks target. It transmits directly to bond yields, FX, and equity valuations.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is the economy's temperature gauge. Moderate inflation signals healthy demand. Too high means overheating. Deflation (negative inflation) is often worse than moderate inflation because it increases the real burden of debt and delays consumption.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US CPI at 3.1% means the consumer price basket rose 3.1% year-over-year. Core CPI strips out volatile food and energy to reveal the underlying trend. The Fed watches core PCE (not CPI) as its preferred gauge.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>Price level</strong> - inflation is the rate of <em>change</em>, not how expensive things are</li><li><strong>CPI</strong> - CPI is one index that measures inflation, not inflation itself</li><li><strong>Deflation</strong> - not just \"low inflation\" but sustained negative price changes</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Key types</div><div class=\"ge-body\"><ul><li><strong>Headline:</strong> all items including food and energy</li><li><strong>Core:</strong> excludes food and energy - the Fed's focus</li><li><strong>Supercore:</strong> core services excluding housing - the \"last mile\" measure</li></ul></div></div><div class=\"ge-formal\">The percentage change in a broad consumer price index over a defined period, typically expressed year-over-year.</div>"
      },
      "expert": {
        "bluf": "Inflation is the rate of change of the general price level. Operationally, the distinction between headline, core, trimmed mean, and supercore measures is critical - each captures different persistence dynamics and has different policy signal content.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation expectations anchoring is the central bank's most valuable asset. De-anchoring triggers nonlinear policy responses. The real interest rate (nominal minus expected inflation) drives all asset pricing, investment decisions, and currency valuation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is ultimately a monetary phenomenon in the long run (Friedman), but in the short run, supply shocks, expectations, and labour market tightness all matter. The Phillips Curve slope is nonlinear - flat at moderate unemployment, steep below ~4%.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Post-COVID US: headline CPI peaked at 9.1% (June 2022). Goods disinflation was rapid (supply chains), but services inflation - particularly shelter and core services ex-housing (supercore) - proved sticky. The \"last mile\" from 3% to 2% required 500bp of tightening and 18+ months of lag.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>CPI vs PCE:</strong> PCE uses Fisher weighting (substitution-adjusted), broader scope, typically 30-40bps below CPI</li><li><strong>Breakevens vs expectations:</strong> TIPS breakevens include an inflation risk premium, not pure expectations</li><li><strong>Transitory vs persistent:</strong> trimmed mean and median CPI better identify persistence than core</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Measurement nuances</div><div class=\"ge-body\"><ul><li><strong>Boskin bias:</strong> CPI overstates inflation by ~0.5-1pp (substitution, quality, new goods effects)</li><li><strong>Shelter lag:</strong> OER/rent of shelter lags market rents by 12-18 months - distorts turning points</li><li><strong>Trimmed mean:</strong> Dallas Fed 16% trimmed mean is the best real-time persistence signal</li></ul></div></div><div class=\"ge-formal\">The rate of change of a general price index. Operationally: π = ΔP/P, where measurement methodology (Laspeyres vs Fisher, scope, quality adjustment) materially affects the signal.</div>"
      }
    },
    "aliases": [],
    "relatedTerms": [],
    "metricLinks": []
  },

  "NAIRU": {
    "complexity": 3,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "The lowest unemployment rate an economy can sustain without triggering rising inflation. Below this level, workers have so much bargaining power that wages spiral upward, pushing prices higher. It is the unemployment equivalent of the economy's speed limit.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">NAIRU tells central banks when the job market is \"too hot.\" If unemployment falls below NAIRU, inflation tends to accelerate. If it is above NAIRU, there is room to stimulate without causing inflation. The challenge is that nobody knows the exact number - it has to be estimated, and the estimates keep changing.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">The US NAIRU is estimated at roughly 4-4.5%. When unemployment fell to 3.4% in 2023 - well below NAIRU - wage growth exceeded 5% and inflation remained elevated. But in the late 2010s, unemployment fell to 3.5% with much less inflation, suggesting NAIRU may have been lower than estimated.</div></div><div class=\"ge-formal\">The Non-Accelerating Inflation Rate of Unemployment - the unemployment rate consistent with stable inflation. Below NAIRU, inflation tends to accelerate; above it, inflation tends to decelerate.</div>"
      },
      "moderate": {
        "bluf": "NAIRU is the unemployment rate consistent with stable inflation - the point where the Phillips Curve crosses the x-axis. It is time-varying, unobservable, and estimated with wide confidence intervals (~1.5pp). The Fed's long-run unemployment projection in the SEP (~4.0-4.2%) is their implicit NAIRU estimate.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">NAIRU determines how much labour market tightness the economy can tolerate before inflation accelerates. If NAIRU is overestimated, the central bank tightens too early and creates unnecessary unemployment. If underestimated, it allows the economy to overheat. The 2015-2019 period challenged existing NAIRU estimates: unemployment fell below 4% without significant inflation acceleration, suggesting structural changes had lowered NAIRU.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Wide confidence interval:</strong> CBO estimates NAIRU at ~4.4% but the 95% CI is roughly 3.5-5.5% - nearly useless for real-time policy</li><li><strong>Time-varying:</strong> NAIRU moves with demographics, labour market institutions, and productivity growth</li><li><strong>Beveridge Curve shifts:</strong> post-COVID, more vacancies per unemployed worker suggested matching efficiency declined, temporarily raising NAIRU</li><li><strong>Immigration effect:</strong> increased labour supply from immigration can lower NAIRU by reducing wage pressure at given unemployment levels</li></ul></div></div><div class=\"ge-formal\">The Non-Accelerating Inflation Rate of Unemployment. Phillips Curve: inflation = expected inflation + slope x (NAIRU - u). Estimated via: Kalman filter (time-varying), Beveridge Curve (vacancy-unemployment relationship), or reduced-form Phillips Curve inversion. CBO estimate: ~4.4% (2024), with confidence interval approximately +/-1.5pp.</div>"
      },
      "expert": {
        "bluf": "NAIRU is the central unobservable in the Phillips Curve framework. Staiger-Stock-Watson (1997) showed its 95% confidence interval is 2-3pp wide - rendering it nearly uninformative for real-time policy. The post-COVID Beveridge Curve shift temporarily raised effective NAIRU, but normalisation of matching efficiency has brought it back toward pre-pandemic estimates.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">NAIRU estimation drives the entire monetary policy framework: the output gap, the neutral rate, and the appropriate policy stance all depend on it. Yet Staiger-Stock-Watson demonstrated that NAIRU is estimated with such imprecision that real-time policy guidance is minimal. The practical implication: central banks must monitor multiple indicators of labour market tightness (quits rate, wage growth, vacancy-to-unemployment ratio) rather than relying on a single NAIRU point estimate.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Multivariate estimation:</strong> combining unemployment, vacancies, wage growth, and inflation in a state-space model gives more stable NAIRU estimates than univariate Phillips Curve inversion</li><li><strong>Structural determinants:</strong> union density, unemployment benefits duration/generosity, labour market regulation, and demographic composition all affect NAIRU level</li><li><strong>Hysteresis in NAIRU:</strong> prolonged unemployment may raise NAIRU itself (insider-outsider models) - this was the European experience in the 1980s</li><li><strong>Short-run vs long-run:</strong> NAIRU may differ at different horizons - labour market frictions create a short-run NAIRU above the long-run equilibrium</li></ul></div></div><div class=\"ge-formal\">The Non-Accelerating Inflation Rate of Unemployment. Formally: the value u* such that E[inflation_t+1 | u_t = u*] = inflation_t. Estimation: Kalman filter on the Phillips Curve with time-varying u*. Staiger-Stock-Watson (1997) 95% CI: approximately +/-1.5pp. Ball-Mankiw (2002): NAIRU itself follows a random walk, making point estimation fundamentally uncertain.</div>"
      }
    },

  "GDP Growth": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "GDP Growth measures how fast a country's economy is expanding or shrinking. It is the single most important number for understanding whether an economy is healthy, struggling, or in recession.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">GDP Growth tells you whether there are more jobs being created, more goods being produced, and more income being earned than before. Governments, businesses, and investors all watch this number closely because it affects everything from tax revenue to corporate profits to your chances of getting a raise.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Think of the economy as a pie. GDP Growth tells you whether the pie is getting bigger or smaller. A growing pie means more to go around for everyone. A shrinking pie - recession - means painful choices about who gets less.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a country's GDP grew 2.5% this year, it means the total value of everything the economy produced went up by 2.5% compared to last year. If you earned $50,000 last year and the economy grew 2.5%, there is more national income to support wage growth, new hiring, and business expansion.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li>Growth above 3% in developed economies is strong - it typically means falling unemployment and rising wages</li><li>Growth near 0% signals stagnation - the economy is barely treading water</li><li>Negative growth for two consecutive quarters is the informal definition of a recession</li><li>China and India grow faster (4-7%) because they are catching up from lower starting points</li></ul></div></div><div class=\"ge-formal\">The annualised percentage change in real (inflation-adjusted) Gross Domestic Product over a given period.</div>"
      },
      "moderate": {
        "bluf": "GDP Growth is the annualised change in real output. It drives corporate earnings trajectories, fiscal arithmetic, employment, and is the macro variable most correlated with risk asset performance across cycles.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">GDP growth is the numerator in almost every macro ratio that matters - debt-to-GDP, deficit-to-GDP, earnings growth. Above-trend growth compresses credit spreads, supports equity multiples, and gives central banks room to normalise rates. Below-trend growth does the opposite. The growth rate also determines whether fiscal deficits are sustainable (the r-g dynamic).</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Growth is the economy's velocity. It determines whether the debt burden is rising or falling in real terms, whether tax receipts are expanding, and whether corporate top-line revenue growth is achievable. A 1% GDP miss typically translates to a 2-3% miss in earnings growth via operating leverage.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US GDP grew 2.5% in 2024 despite 525bp of cumulative rate hikes - a textbook soft landing. This above-trend growth supported S&P 500 earnings growth of ~8% and kept the unemployment rate below 4%. Contrast with Germany at 0.2% - near stagnation - where the DAX lagged and fiscal pressures mounted.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>Output gap:</strong> actual vs potential GDP - positive gap means overheating, negative means slack</li><li><strong>Composition:</strong> consumption-led growth is stickier than inventory-led growth</li><li><strong>Revisions:</strong> GDP data gets revised heavily - the first print is a rough estimate</li><li><strong>Leading indicators:</strong> PMIs, yield curve slope, and credit growth all lead GDP by 6-12 months</li></ul></div></div><div class=\"ge-formal\">The annualised percentage change in real GDP, typically reported quarterly with advance, second, and third estimates subject to significant revision.</div>"
      },
      "expert": {
        "bluf": "Real GDP growth is the broadest measure of aggregate output change. The r-g differential (real rate vs real growth) is the key structural variable for debt sustainability, while the output gap drives inflation dynamics via the Phillips Curve.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Growth is the denominator that makes everything else work. When g > r, debt-to-GDP ratios stabilise even with primary deficits. When r > g, fiscal consolidation becomes mathematically necessary. For markets, the growth-rate transition (acceleration vs deceleration) matters more than the level - equities price the second derivative.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition</div><div class=\"ge-body\">Potential growth is the economy's speed limit - determined by demographics (labour force growth), capital deepening, and TFP. Actual growth oscillates around potential. The gap between them is what central banks really target, since it maps to inflation pressure via the Phillips Curve. Secular stagnation thesis: potential growth has structurally declined across DM (from ~3% to ~1.5-2%) due to demographics and slowing productivity.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Japan's nominal GDP was roughly flat for two decades (1995-2015) despite massive fiscal stimulus, because deflation offset real growth. The lesson: nominal GDP growth (real + inflation) is what actually matters for debt dynamics, tax revenue, and corporate top-line. Abenomics targeted nominal GDP explicitly for this reason.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What to watch</div><div class=\"ge-body\"><ul><li><strong>GDI vs GDP:</strong> gross domestic income should equal GDP but divergences signal measurement noise - trust the average</li><li><strong>Residual seasonality:</strong> Q1 GDP in the US is systematically biased downward</li><li><strong>Nowcasting:</strong> Atlanta Fed GDPNow and NY Fed nowcast are real-time tracking estimates worth following</li><li><strong>Nominal vs real:</strong> for debt sustainability and corporate revenue, nominal GDP growth is the relevant metric</li></ul></div></div><div class=\"ge-formal\">The annualised rate of change in chain-weighted real GDP. Measurement: expenditure approach (C + I + G + NX) or income approach (GDI). The statistical discrepancy between the two averages ~0.5pp in any given quarter.</div>"
      }
    },
