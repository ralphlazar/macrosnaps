<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps - Global Economic Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00d4ff;--hot:#ff3d5a;--gold:#ffd700;--green:#00e68a;
  --font-display:'Space Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
html{background:#000;color:#e8e8e8;font-family:var(--font-body)}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Top Bar ── */
.top-bar{
  display:flex;align-items:center;justify-content:center;
  padding:16px 24px;position:relative;z-index:10;
  border-bottom:1px solid rgba(255,255,255,.14);flex-shrink:0;
}
.logo{
  position:absolute;left:28px;font-family:var(--font-display);
  font-size:14px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;line-height:1.3;
}
.logo span{color:#aaa;font-weight:400}
.logo .sub1{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#888;text-transform:uppercase;font-weight:400;margin-top:1px;
}
.logo .sub2{
  display:block;font-family:var(--font-body);font-size:9px;
  letter-spacing:1.5px;color:#666;text-transform:uppercase;font-weight:400;
}
.exp-group{display:flex;align-items:center;gap:6px}
.exp-btn{
  font-family:var(--font-display);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  padding:7px 20px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  background:transparent;color:#999;cursor:pointer;transition:all .25s;
}
.exp-btn:hover{border-color:var(--cyan);color:#ccc}
.exp-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 16px rgba(0,212,255,.12);
}

/* ── Tagline ── */
.tagline{
  text-align:center;padding:6px 0;
  font-family:var(--font-body);font-size:11px;font-style:italic;
  color:#777;letter-spacing:.3px;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}

/* ── Hero ── */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* ── News Icons ── */
.news-icons{
  display:flex;gap:48px;margin-bottom:20px;z-index:5;position:relative;
}
.news-icon{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:transform .2s;
}
.news-icon:hover{transform:translateY(-3px)}
.news-icon .ni-emoji{font-size:32px;filter:grayscale(.15);transition:filter .2s,transform .2s}
.news-icon:hover .ni-emoji{filter:none;transform:scale(1.15)}
.news-icon .ni-label{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#666;transition:color .25s;white-space:nowrap;
}
.news-icon:hover .ni-label{color:#aaa}
.news-icon.hot:hover .ni-label{color:var(--hot)}
.news-icon.movers:hover .ni-label{color:var(--gold)}
.news-icon.connection:hover .ni-label{color:var(--cyan)}
.news-icon::after{
  content:'';width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.35);transition:background .2s;
}
.news-icon.hot:hover::after{background:var(--hot)}
.news-icon.movers:hover::after{background:var(--gold)}
.news-icon.connection:hover::after{background:var(--cyan)}

/* ── Globe ── */
.globe-wrap{
  position:relative;width:min(65vh,600px);aspect-ratio:1;cursor:grab;z-index:1;
}
.globe-wrap:active{cursor:grabbing}
.globe-wrap canvas{width:100%!important;height:100%!important;display:block}
.globe-wrap::before{
  content:'';position:absolute;top:50%;left:50%;width:80%;height:80%;
  transform:translate(-50%,-50%);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(0,212,255,.18) 0%,rgba(0,212,255,.08) 30%,transparent 65%);
  box-shadow:0 0 100px 50px rgba(0,212,255,.08);
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.globe-hint{
  margin-top:14px;font-family:var(--font-display);font-size:9px;
  letter-spacing:2px;color:#777;text-transform:uppercase;z-index:5;
  animation:hintPulse 3s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:.9}}

/* ── Country Labels ── */
.country-label{
  position:absolute;padding:3px 8px;border-radius:3px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#ccc;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.16);
  cursor:pointer;transition:all .2s;pointer-events:auto;white-space:nowrap;
  text-transform:uppercase;z-index:5;
}
.country-label:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,.25)}
.country-label .flag{font-size:12px;margin-right:3px}

/* ── Tooltip ── */
.tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,15,15,0.98);border:1px solid #00d4ff;border-radius:8px;
  padding:16px;z-index:1000;width:90%;max-width:400px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,0.3);
  animation:ttIn .2s ease-out;
}
.tooltip.active{display:block}
@keyframes ttIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.tt-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#888;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.tt-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.tt-nav{
  position:absolute;top:12px;right:48px;display:flex;gap:3px;z-index:10;
}
.tt-nav-btn{
  width:28px;height:28px;
  background:rgba(255,255,255,.06);border:1px solid #333;border-radius:50%;
  color:#666;font-size:14px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.tt-nav-btn:hover{background:rgba(0,212,255,.1);color:var(--cyan);border-color:rgba(0,212,255,.3)}
.tt-title{font-size:16px;font-weight:700;color:#00d4ff;margin-bottom:10px;padding-right:100px}
.tt-story{font-size:12px;color:#ccc;line-height:1.6;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
.tt-source{font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#444;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.tt-section{margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid #333}
.tt-section:last-child{border-bottom:none;margin-bottom:0}
.tt-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.tt-value{font-size:16px;font-weight:600;color:#fff}
.tt-explanation{font-size:11px;color:#aaa;line-height:1.4;margin-top:6px}
.tt-source{font-size:10px;color:#666;margin-top:6px}

/* ── Card Overlay ── */
.card-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.country-card{
  width:92%;max-width:420px;background:#111;border:2px solid #444;border-radius:12px;
  padding:16px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:cardIn .25s ease-out;margin:auto;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.country-card:hover{border-color:#555}
.card-close{
  position:absolute;top:12px;right:12px;width:28px;height:28px;
  background:rgba(255,255,255,.08);border:1px solid #333;border-radius:50%;
  color:#888;font-size:16px;line-height:26px;text-align:center;cursor:pointer;transition:all .2s;z-index:10;
}
.card-close:hover{background:rgba(255,255,255,.15);color:#fff;border-color:#555}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card-head .c-flag{font-size:32px}
.card-head .c-name{font-size:24px;font-weight:600;color:#fff}
.weather-sec{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #222}
.w-icon{font-size:48px;line-height:1;margin-bottom:8px}
.w-icon.sunny{filter:none}
.w-icon.cloudy{filter:brightness(.65) contrast(1.05) saturate(.3)}
.w-icon.stormy{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.c-stories{list-style:none;padding:0;margin:0}
.c-stories li{font-size:13px;color:#bbb;line-height:1.6;padding-left:16px;position:relative;margin-bottom:3px}
.c-stories li::before{content:"•";position:absolute;left:0;color:#00d4ff;font-weight:bold}
.sec-head{margin:14px 0 8px;padding:6px 12px;background:linear-gradient(90deg,rgba(0,212,255,.2),transparent);border-left:3px solid #00d4ff;font-size:12px;color:#00d4ff;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.metrics{display:flex;flex-direction:column;margin-bottom:4px}
.metrics.mkt{background:rgba(255,255,255,.02);border-radius:8px;padding:8px 0}
.metric{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;transition:background .2s}
.metric:last-child{border-bottom:none}
.metric:hover{background:rgba(255,255,255,.05)}
.m-name{font-size:12px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.m-val{font-size:20px;font-weight:700;color:#fff}

/* ── Glossary ── */
.glossary-term{color:#8ec8f0;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(142,200,240,.45);text-underline-offset:2px;cursor:help;transition:color .15s;border-radius:2px}
.glossary-term:hover{color:#b8dcf8;text-decoration-color:rgba(142,200,240,.8);background:rgba(142,200,240,.07)}
.glossary-bubble{
  position:fixed;z-index:2000;background:rgba(20,22,28,.98);
  border:1px solid rgba(0,212,255,.45);border-radius:10px;padding:14px 16px 12px;
  max-width:320px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 12px rgba(0,212,255,.12);
  pointer-events:auto;animation:gbIn .15s ease-out;
}
@keyframes gbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.glossary-bubble::before{content:'';position:absolute;top:-6px;left:24px;width:10px;height:10px;background:rgba(20,22,28,.98);border-left:1px solid rgba(0,212,255,.45);border-top:1px solid rgba(0,212,255,.45);transform:rotate(45deg)}
.glossary-bubble.arrow-bottom::before{top:auto;bottom:-6px;border-left:none;border-top:none;border-right:1px solid rgba(0,212,255,.45);border-bottom:1px solid rgba(0,212,255,.45)}
.gb-term{font-size:11px;font-weight:700;color:#00d4ff;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;display:flex;align-items:center;gap:6px;padding-right:28px}
.gb-badge{display:inline-block;font-size:8px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase}
.gb-badge.basic{background:rgba(76,175,80,.2);color:#81c784;border:1px solid rgba(76,175,80,.3)}
.gb-badge.intermediate{background:rgba(255,183,77,.2);color:#ffcc80;border:1px solid rgba(255,183,77,.3)}
.gb-badge.advanced{background:rgba(239,83,80,.2);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}
.gb-def{font-size:12px;color:#ccc;line-height:1.55}
.gb-close{
  position:absolute;top:8px;right:8px;width:22px;height:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:50%;
  color:#666;font-size:13px;line-height:20px;text-align:center;cursor:pointer;transition:all .2s;
}
.gb-close:hover{background:rgba(255,255,255,.12);color:#ccc;border-color:#444}
.gb-level{display:flex;gap:3px;margin-bottom:8px}
.gb-level .lt-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 8px;border:1px solid rgba(255,255,255,.08);border-radius:3px;
  background:transparent;color:#444;cursor:pointer;transition:all .2s;
}
.gb-level .lt-btn:hover{border-color:rgba(0,212,255,.25);color:#888}
.gb-level .lt-btn.active{background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan)}

/* ── BLUF Read More Expansion ── */
.glossary-bubble.has-full{max-width:420px}
.glossary-bubble.has-full.expanded{max-height:70vh;overflow-y:auto}
.glossary-bubble.has-full.expanded::-webkit-scrollbar{width:3px}
.glossary-bubble.has-full.expanded::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.ge-expand{
  display:inline-block;font-family:var(--font-display);font-size:9px;
  letter-spacing:1px;text-transform:uppercase;color:var(--cyan);
  cursor:pointer;margin-top:8px;padding:0;border:none;background:none;
  transition:opacity .2s;opacity:.8;
}
.ge-expand:hover{opacity:1}
.ge-full{
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
  animation:geIn .2s ease-out;
}
.ge-full.open{display:block}
@keyframes geIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ge-section{margin-bottom:10px}
.ge-section:last-child{margin-bottom:0}
.ge-head{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--cyan);margin-bottom:4px;opacity:.8;
}
.ge-body{font-size:12px;color:#aaa;line-height:1.55}
.ge-body ul{margin:4px 0 0;padding:0;list-style:none}
.ge-body li{position:relative;padding-left:12px;margin-bottom:3px}
.ge-body li::before{content:'·';position:absolute;left:2px;color:var(--cyan);font-weight:bold}
.ge-formal{
  font-size:11px;color:#888;font-style:italic;line-height:1.5;
  padding:8px 10px;background:rgba(255,255,255,.02);border-radius:4px;
  border-left:2px solid rgba(0,212,255,.2);
}
/* Metric tooltip BLUF expand */
.tt-story .ge-expand{margin-top:12px;display:block}
.tt-story .ge-full{margin-top:8px;padding-top:8px}

/* ── Metric Chart ── */
.metric-chart-wrap{
  margin:10px 0;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.metric-chart-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.metric-chart-title{
  font-family:var(--font-display);font-size:8px;letter-spacing:1.5px;
  text-transform:uppercase;color:#555;
}
.metric-chart-range{display:flex;gap:2px}
.metric-chart-range .mcr-btn{
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border:1px solid rgba(255,255,255,.06);border-radius:2px;
  background:transparent;color:#444;cursor:pointer;transition:all .2s;
}
.metric-chart-range .mcr-btn:hover{border-color:rgba(0,212,255,.2);color:#888}
.metric-chart-range .mcr-btn.active{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.metric-chart-canvas{height:120px;position:relative}
.metric-chart-canvas canvas{width:100%!important;height:100%!important}
.metric-chart-minmax{
  display:flex;justify-content:space-between;margin-top:4px;
  font-family:var(--font-display);font-size:8px;letter-spacing:.5px;color:#444;
}
.metric-chart-nodata{
  height:80px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;
  color:#333;text-transform:uppercase;
}

/* ── Inline Level Toggle ── */
.level-toggle{
  display:flex;gap:4px;margin-bottom:12px;padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.level-toggle .lt-btn{
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#555;cursor:pointer;transition:all .2s;
}
.level-toggle .lt-btn:hover{border-color:rgba(0,212,255,.3);color:#999}
.level-toggle .lt-btn.active{
  background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan);
}

/* ── Policy Explainer ── */

/* ── Compare View ── */
.compare-btn{
  display:inline-flex;align-items:center;gap:5px;margin-top:10px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#666;cursor:pointer;transition:all .2s;
}
.compare-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.compare-btn .cb-icon{font-size:12px}
.compare-row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;
}
.compare-row:last-child{border-bottom:none}
.compare-row.highlight{background:rgba(0,212,255,.06);border-radius:4px;padding:7px 8px;margin:0 -8px}
.compare-row .cr-flag{font-size:16px;width:24px;text-align:center}
.compare-row .cr-name{font-size:11px;color:#888;width:50px;font-family:var(--font-display);letter-spacing:.5px}
.compare-row .cr-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden;position:relative}
.compare-row .cr-bar{height:100%;border-radius:2px;transition:width .4s ease-out;min-width:2px}
.compare-row .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.3),rgba(0,212,255,.5))}
.compare-row .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.3),rgba(255,61,90,.5))}
.compare-row.highlight .cr-bar.positive{background:linear-gradient(90deg,rgba(0,212,255,.5),rgba(0,212,255,.8))}
.compare-row.highlight .cr-bar.negative{background:linear-gradient(90deg,rgba(255,61,90,.5),rgba(255,61,90,.8))}
.compare-row .cr-val{font-size:11px;font-weight:600;color:#ccc;width:80px;text-align:right;font-family:var(--font-display);line-height:1.3}
.compare-row.highlight .cr-name{color:var(--cyan)}
.compare-row.highlight .cr-val{color:#fff}

/* Regime tag in compare rows */
.cr-regime{
  font-family:var(--font-display);font-size:8px;letter-spacing:.8px;text-transform:uppercase;
  color:#888;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:3px;padding:2px 6px;cursor:pointer;transition:all .2s;white-space:nowrap;
  flex-shrink:0;
}

/* ── Weather GDP Grid ── */
.weather-btn{
  display:inline-flex;align-items:center;gap:5px;margin-bottom:12px;
  font-family:var(--font-display);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;border:1px solid rgba(255,255,255,.1);border-radius:3px;
  background:transparent;color:#666;cursor:pointer;transition:all .2s;
}
.weather-btn:hover{border-color:rgba(0,212,255,.3);color:var(--cyan)}
.weather-btn .wb-icon{display:inline-flex;align-items:center;gap:2px}
.wg-table{width:100%;border-collapse:collapse;margin-top:10px}
.wg-table th{
  font-family:var(--font-display);font-size:8px;letter-spacing:1px;
  text-transform:uppercase;color:#555;padding:6px 4px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.wg-table th:first-child{text-align:left;color:#888}
.wg-table th.forecast{color:var(--cyan);font-style:italic}
.wg-table td{padding:5px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.wg-table td:first-child{text-align:left}
.wg-table tr:last-child td{border-bottom:none}
.wg-cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.wg-cell .wg-val{font-family:var(--font-display);font-size:8px;letter-spacing:.3px}
.wg-cell.sunny .wg-val{color:#e8c840}
.wg-cell.cloudy .wg-val{color:#555}
.wg-cell.storm .wg-val{color:#1a1a1a}
/* Weather icons - emoji based, matching card icons */
.wi{display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;width:24px;height:24px}
.wi-sun{filter:none}
.wi-cloud{filter:brightness(.65) contrast(1.05) saturate(.3)}
.wi-storm{filter:brightness(.15) contrast(1.2) saturate(0) drop-shadow(0 0 4px rgba(255,255,255,.35)) drop-shadow(0 0 8px rgba(255,255,255,.15))}
.wg-country{display:flex;align-items:center;gap:6px}
.wg-country .wg-flag{font-size:14px}
.wg-country .wg-code{font-family:var(--font-display);font-size:9px;letter-spacing:.5px;color:#aaa}
.wg-legend{
  display:flex;gap:12px;margin-top:10px;padding-top:8px;
  border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap;justify-content:center;
}
.wg-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#555}
.cr-regime:hover{border-color:rgba(0,212,255,.4);color:var(--cyan);background:rgba(0,212,255,.06)}
.cr-regime.free{border-color:rgba(0,230,138,.15);color:#5a9}
.cr-regime.managed{border-color:rgba(255,183,77,.15);color:#c96}
.cr-regime.peg{border-color:rgba(255,61,90,.15);color:#c66}
.cr-regime.euro{border-color:rgba(100,140,255,.15);color:#7a9cf0}

/* ── Footer ── */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:12px 24px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.9) 30%);
}
.footer-link{
  font-family:var(--font-display);font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:#777;cursor:pointer;
  transition:color .2s;text-decoration:none;
}
.footer-link:hover{color:var(--cyan)}
.footer-sep{color:#444;font-size:10px;user-select:none}

/* Footer tooltip overlay */
.footer-tooltip{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,15,15,.98);border:1px solid #00d4ff;border-radius:8px;
  padding:20px;z-index:1000;width:90%;max-width:500px;max-height:80vh;
  overflow-y:auto;box-shadow:0 8px 32px rgba(0,212,255,.3);
  animation:ttIn .2s ease-out;
}
.footer-tooltip.active{display:block}
.footer-tooltip h2{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin-bottom:14px;
}
.footer-tooltip h2::after{
  content:'';display:block;width:30px;height:1px;margin-top:8px;
  background:linear-gradient(90deg,#00d4ff,transparent);
}
.footer-tooltip p{font-size:13px;color:#bbb;line-height:1.7;margin-bottom:12px}
.footer-tooltip p strong{color:#e8e8e8;font-weight:600}
.footer-tooltip .ft-highlight{color:#00d4ff}
.footer-tooltip .ft-sub{
  font-family:var(--font-display);font-size:11px;letter-spacing:2px;
  color:#00d4ff;text-transform:uppercase;margin:20px 0 8px;font-weight:700;
}
.footer-tooltip .ft-legal{font-size:11px;color:#777;line-height:1.6;font-style:italic}
/* Contact form */
.contact-form{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.contact-form input,.contact-form textarea{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);

.contact-form textarea{min-height:100px;resize:vertical}
.contact-form button{

}
.contact-form button:hover{background:rgba(0,212,255,.2);box-shadow:0 0 16px rgba(0,212,255,.15)}

  "Phillips curve": {

  "inflation": {
    "complexity": 1,
    "category": "macro",
    "levels": {
      "beginner": {
        "bluf": "Inflation is a sustained increase in the overall price level of goods and services, which reduces the purchasing power of money over time. When inflation rises, each unit of currency buys fewer things.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation affects how far wages go, how savings lose or keep value, how interest rates are set, and how governments and central banks make policy. Too much inflation erodes trust in money; too little can signal economic stagnation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Think of money as a measuring stick for value. Inflation means the stick is slowly shrinking. Prices aren't just going up randomly - the value of money itself is going down relative to goods and services across the economy.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">If a basket of everyday items costs $100 this year and $103 next year, the inflation rate is 3%. If your income didn't rise by at least 3%, you're effectively poorer, even though your paycheck is the same in dollar terms.</div></div><div class=\"ge-section\"><div class=\"ge-head\">What inflation is not</div><div class=\"ge-body\"><ul><li>A one-time price increase for a single good</li><li>The same thing as \"high prices\" (inflation is about change, not level)</li><li>Always caused by greed or shortages alone</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Common causes</div><div class=\"ge-body\"><ul><li><strong>Demand-pull:</strong> too much spending chasing too few goods</li><li><strong>Cost-push:</strong> rising production costs passed to consumers</li><li><strong>Monetary factors:</strong> growth in the money supply faster than real output</li></ul></div></div><div class=\"ge-formal\">Inflation is the rate of change of a general price index (such as the Consumer Price Index) over time.</div>"
      },
      "moderate": {
        "bluf": "Inflation is the sustained rate of increase in the general price level, measured by indices like CPI or PCE. Central banks target ~2% as the sweet spot - high enough to avoid the zero lower bound, low enough to preserve purchasing power.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation determines real interest rates, erodes nominal debt burdens, affects wage negotiations, and is the primary variable central banks target. It transmits directly to bond yields, FX, and equity valuations.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is the economy's temperature gauge. Moderate inflation signals healthy demand. Too high means overheating. Deflation (negative inflation) is often worse than moderate inflation because it increases the real burden of debt and delays consumption.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">US CPI at 3.1% means the consumer price basket rose 3.1% year-over-year. Core CPI strips out volatile food and energy to reveal the underlying trend. The Fed watches core PCE (not CPI) as its preferred gauge.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>Price level</strong> - inflation is the rate of <em>change</em>, not how expensive things are</li><li><strong>CPI</strong> - CPI is one index that measures inflation, not inflation itself</li><li><strong>Deflation</strong> - not just \"low inflation\" but sustained negative price changes</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Key types</div><div class=\"ge-body\"><ul><li><strong>Headline:</strong> all items including food and energy</li><li><strong>Core:</strong> excludes food and energy - the Fed's focus</li><li><strong>Supercore:</strong> core services excluding housing - the \"last mile\" measure</li></ul></div></div><div class=\"ge-formal\">The percentage change in a broad consumer price index over a defined period, typically expressed year-over-year.</div>"
      },
      "expert": {
        "bluf": "Inflation is the rate of change of the general price level. Operationally, the distinction between headline, core, trimmed mean, and supercore measures is critical - each captures different persistence dynamics and has different policy signal content.",
        "full": "<div class=\"ge-section\"><div class=\"ge-head\">Why it matters</div><div class=\"ge-body\">Inflation expectations anchoring is the central bank's most valuable asset. De-anchoring triggers nonlinear policy responses. The real interest rate (nominal minus expected inflation) drives all asset pricing, investment decisions, and currency valuation.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Intuition / context</div><div class=\"ge-body\">Inflation is ultimately a monetary phenomenon in the long run (Friedman), but in the short run, supply shocks, expectations, and labour market tightness all matter. The Phillips Curve slope is nonlinear - flat at moderate unemployment, steep below ~4%.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Example</div><div class=\"ge-body\">Post-COVID US: headline CPI peaked at 9.1% (June 2022). Goods disinflation was rapid (supply chains), but services inflation - particularly shelter and core services ex-housing (supercore) - proved sticky. The \"last mile\" from 3% to 2% required 500bp of tightening and 18+ months of lag.</div></div><div class=\"ge-section\"><div class=\"ge-head\">Often confused with</div><div class=\"ge-body\"><ul><li><strong>CPI vs PCE:</strong> PCE uses Fisher weighting (substitution-adjusted), broader scope, typically 30-40bps below CPI</li><li><strong>Breakevens vs expectations:</strong> TIPS breakevens include an inflation risk premium, not pure expectations</li><li><strong>Transitory vs persistent:</strong> trimmed mean and median CPI better identify persistence than core</li></ul></div></div><div class=\"ge-section\"><div class=\"ge-head\">Measurement nuances</div><div class=\"ge-body\"><ul><li><strong>Boskin bias:</strong> CPI overstates inflation by ~0.5-1pp (substitution, quality, new goods effects)</li><li><strong>Shelter lag:</strong> OER/rent of shelter lags market rents by 12-18 months - distorts turning points</li><li><strong>Trimmed mean:</strong> Dallas Fed 16% trimmed mean is the best real-time persistence signal</li></ul></div></div><div class=\"ge-formal\">The rate of change of a general price index. Operationally: π = ΔP/P, where measurement methodology (Laspeyres vs Fisher, scope, quality adjustment) materially affects the signal.</div>"
      }
    },
    "aliases": [],
    "relatedTerms": [],
    "metricLinks": []
  },

    "ping": "<h2>Ping Me</h2>\n<p>Something to say? This is the place.</p>\n<form class=\"contact-form\" onsubmit=\"event.preventDefault();this.innerHTML='<p style=\\'color:#00d4ff;margin-top:12px\\'>Message sent. Thanks! ✓</p>';\">\n  <input type=\"text\" placeholder=\"Name\" required>\n  <input type=\"email\" placeholder=\"Email\" required>\n  <textarea placeholder=\"What's on your mind?\" required></textarea>\n  <button type=\"submit\">Send</button>\n</form>"

<script>

let currentLevel='beginner', activeBubble=null;

// ── DATA BOOTSTRAP ──
// Parse JSON data blocks into the variables the renderer expects
const _countries = JSON.parse(document.getElementById('countries-data').textContent);
const _glossary = JSON.parse(document.getElementById('glossary-data').textContent);
const _appConfig = JSON.parse(document.getElementById('app-config').textContent);

// ── Reconstruct countries array (renderer expects array of objects) ──
const countries = Object.values(_countries).map(c => ({
  code: c.code, name: c.name, flag: c.flag, lat: c.lat, lon: c.lon,
  weather: c.weather, metrics: c.metrics
}));

// ── Reconstruct cardStories {level: {code: [bullets]}} ──
const cardStories = {beginner:{}, moderate:{}, expert:{}};
Object.values(_countries).forEach(c => {
  ['beginner','moderate','expert'].forEach(lv => {
    if(c.stories && c.stories[lv]) cardStories[lv][c.code] = c.stories[lv];
  });
});

// ── Reconstruct glossary (renderer expects {term: {complexity, beginner, moderate, expert}}) ──
const glossary = {};
Object.entries(_glossary).forEach(([term, entry]) => {
  glossary[term] = { complexity: entry.complexity };
  ['beginner','moderate','expert'].forEach(lv => {
    const lev = entry.levels[lv];
    if(!lev) return;
    // If it has full content, keep as {bluf, full} object; otherwise just the string
    glossary[term][lv] = lev.full ? { bluf: lev.bluf, full: lev.full } : lev.bluf;
  });
});

// ── Reconstruct fxRegime {code: {label, beginner, moderate, expert}} ──
const fxRegime = {};
Object.values(_countries).forEach(c => {
  if(c.fxRegime) fxRegime[c.code] = c.fxRegime;
});

// ── Reconstruct historicalData {code: {metric: {...}}} ──
const historicalData = {};
Object.values(_countries).forEach(c => {
  if(c.historical) historicalData[c.code] = c.historical;
});

// ── Reconstruct weather grid data ──
const gdpAllCountries = {};
const cpiAllCountries = {};
Object.values(_countries).forEach(c => {
  if(c.weatherGrid.gdp) gdpAllCountries[c.code] = { flag: c.flag, v: c.weatherGrid.gdp.values };
  if(c.weatherGrid.cpi) cpiAllCountries[c.code] = { flag: c.flag, v: c.weatherGrid.cpi.values };
});

// ── Direct mappings ──
const newsData = _appConfig.globalStories;
const metricExpl = _appConfig.metricExpl;
const metricSources = _appConfig.metricSources;
const histAnnualLabels = _appConfig.chartConfig.annualLabels;
const histMonthlyLabels = _appConfig.chartConfig.monthlyLabels;
const gdpYears = _appConfig.chartConfig.weatherGridYears;
const footerContent = _appConfig.footer;
const fxSource = metricSources['FX'] || 'WM/Refinitiv · Bloomberg · National central banks';

// ── Expose consolidated data for future use ──
const DATA = { countries: _countries, glossary: _glossary, config: _appConfig };







// ── HISTORICAL DATA (dummy – Magic 3: USA, JPN, ITA) ──



// Chart instance tracker
let activeChart=null;

function renderMetricChart(container, metricName, countryCode, rangeMonths){
  if(activeChart){activeChart.destroy();activeChart=null;}
  const d=historicalData[countryCode];
  if(!d) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }
  const cfg=d[metricName];
  if(!cfg) { container.innerHTML='<div class="metric-chart-nodata">No historical data</div>'; return; }

  const isAnnual=!!cfg.annual;
  const allLabels=isAnnual?histAnnualLabels:histMonthlyLabels;
  const allVals=cfg.v;
  const n=rangeMonths&&!isAnnual?rangeMonths:allVals.length;
  const sliceVals=allVals.slice(-n);
  const sliceLabels=allLabels.slice(-n);
  const mn=Math.min(...sliceVals), mx=Math.max(...sliceVals);
  const range=mx-mn;
  const pad=range*0.15||(Math.abs(mx)*0.1)||1;

  container.innerHTML='<canvas></canvas>';
  const canvas=container.querySelector('canvas');
  canvas.addEventListener('click',e=>e.stopPropagation());
  const ctx=canvas.getContext('2d');

  // Colors
  const cyan='rgba(0,212,255,';
  const green='rgba(0,230,138,';
  const red='rgba(255,61,90,';

  let datasets, scaleMin, scaleMax;

  if(cfg.type==='bar'){
    // Bar chart - cyan positive, red negative
    datasets=[{
      data:sliceVals,
      backgroundColor:sliceVals.map(v=>v>=0?cyan+'.5)':red+'.5)'),
      borderColor:sliceVals.map(v=>v>=0?cyan+'.8)':red+'.8)'),
      borderWidth:1,
      borderRadius:2
    }];
    scaleMin=mn<0?mn-pad:0;
    scaleMax=mx>0?mx+pad:0;
  } else if(cfg.zeroLine){
    // Yield curve - green above 0, red below 0
    datasets=[{
      data:sliceVals,
      borderWidth:1.5,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.3,
      fill:false,
      segment:{
        borderColor:function(ctx){
          const y0=ctx.p0.parsed.y, y1=ctx.p1.parsed.y;
          if(y0>=0&&y1>=0) return green+'.8)';
          if(y0<0&&y1<0) return red+'.8)';
          return '#888';
        }
      }
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  } else {
    // Standard line chart - cyan with fill
    const grad=ctx.createLinearGradient(0,0,0,120);
    grad.addColorStop(0,cyan+'.18)');
    grad.addColorStop(1,cyan+'.01)');
    datasets=[{
      data:sliceVals,
      borderColor:cyan+'.8)',
      borderWidth:1.5,
      backgroundColor:grad,
      fill:true,
      pointRadius:0,
      pointHitRadius:8,
      pointHoverRadius:3,
      pointHoverBackgroundColor:'#00d4ff',
      pointHoverBorderColor:'#fff',
      pointHoverBorderWidth:1,
      tension:.35,
      stepped:cfg.stepped||false
    }];
    scaleMin=mn-pad;
    scaleMax=mx+pad;
  }

  activeChart=new Chart(ctx,{
    type:cfg.type==='bar'?'bar':'line',
    data:{labels:sliceLabels,datasets:datasets},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      events:['mousemove','mouseout','touchstart','touchmove'],
      layout:{padding:{left:2,right:2,top:4,bottom:0}},
      scales:{
        x:{
          display:true,
          grid:{display:false},
          ticks:{
            color:'#333',font:{family:"'Space Mono',monospace",size:8},
            maxRotation:0,autoSkip:true,maxTicksLimit:isAnnual?6:n<=12?6:n<=24?8:10
          },
          border:{display:false}
        },
        y:{
          display:true,
          position:'right',
          grid:{
            color:function(context){
              if(cfg.zeroLine && context.tick.value===0) return 'rgba(255,255,255,.2)';
              return 'rgba(255,255,255,.03)';
            },
            lineWidth:function(context){
              return (cfg.zeroLine && context.tick.value===0)?1.5:1;
            }
          },
          ticks:{
            color:'#444',font:{family:"'Space Mono',monospace",size:8},
            maxTicksLimit:5,
            callback:function(v){
              if(cfg.indexLabel&&v>=1000)return(v/1000).toFixed(v%1000===0?0:1)+'k';
              return v%1===0?v:v.toFixed(1);
            }
          },
          border:{display:false},
          min:scaleMin,
          max:scaleMax
        }
      },
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(15,15,20,.95)',
          borderColor:cfg.zeroLine?'rgba(150,150,150,.4)':'rgba(0,212,255,.4)',
          borderWidth:1,
          titleFont:{family:"'Space Mono',monospace",size:9},
          bodyFont:{family:"'DM Sans',sans-serif",size:11},
          titleColor:'#888',bodyColor:'#fff',
          cornerRadius:4,padding:8,displayColors:false,
          callbacks:{
            label:function(ctx){
              let v=ctx.parsed.y;
              if(cfg.indexLabel)return ' '+v.toLocaleString();
              if(cfg.zeroLine)return ' '+(v>=0?'+':'')+v+'bps';
              return ' '+v;
            }
          }
        }
      },
      interaction:{mode:'index',intersect:false},
      animation:{duration:400,easing:'easeOutCubic'}
    }
  });
}

function isFxMetric(name){ return name.includes('/'); }
function getCountryCode(countryName){ const c=countries.find(co=>co.name===countryName); return c?c.code:null; }

// ── GLOBE ──
function initGlobe(){
  const c=document.getElementById('globeContainer'),w=c.clientWidth,h=c.clientHeight;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,w/h,.1,1000);
  cam.position.z=2.8;
  const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
  ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));c.appendChild(ren.domElement);

  // Globe wireframe
  const gm=new THREE.Mesh(new THREE.SphereGeometry(1,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,wireframe:true,transparent:true,opacity:.13}));
  scene.add(gm);
  // Solid inner
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(.98,48,48),new THREE.MeshBasicMaterial({color:0x060612,transparent:true,opacity:.95})));
  // Atmosphere glow
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,48,48),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.10,side:THREE.BackSide})));

  // Lat/lon grid
  for(let i=-60;i<=60;i+=30){const r=Math.cos(i*Math.PI/180),y=Math.sin(i*Math.PI/180),p=[];for(let j=0;j<=360;j+=3){const t=j*Math.PI/180;p.push(new THREE.Vector3(r*Math.cos(t),y,r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.18})));}
  for(let i=0;i<360;i+=30){const p=[],t=i*Math.PI/180;for(let j=-90;j<=90;j+=3){const ph=j*Math.PI/180,r=Math.cos(ph);p.push(new THREE.Vector3(r*Math.cos(t),Math.sin(ph),r*Math.sin(t)));}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.15})));}

  // Country dots + invisible hit targets
  const dg=new THREE.Group();
  const hitTargets=new THREE.Group();
  countries.forEach(co=>{
    const pos=ll(co.lat,co.lon,1.005);
    // Visible dot
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.015,12,12),new THREE.MeshBasicMaterial({color:0x00d4ff}));
    dot.position.copy(pos);dg.add(dot);
    // Pulse ring
    const rn=new THREE.Mesh(new THREE.RingGeometry(.018,.028,24),new THREE.MeshBasicMaterial({color:0x00d4ff,transparent:true,opacity:.4,side:THREE.DoubleSide}));
    rn.position.copy(pos);rn.lookAt(pos.clone().multiplyScalar(2));rn.userData={pulse:true};dg.add(rn);
    // Invisible larger hit target
    const hit=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({visible:false}));
    hit.position.copy(pos);hit.userData=co;hitTargets.add(hit);
  });
  scene.add(dg);scene.add(hitTargets);

  // Drag vs click detection
  let rY=0,rX=.1,drag=false,pv={x:0,y:0},dragDist=0,camZ=2.8;
  c.addEventListener('mousedown',e=>{drag=true;dragDist=0;pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-pv.x,dy=e.clientY-pv.y;dragDist+=Math.abs(dx)+Math.abs(dy);rY+=dx*.005;rX=Math.max(-1.2,Math.min(1.2,rX+dy*.005));pv={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>{drag=false;});

  // Scroll to zoom
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    camZ=Math.max(1.8,Math.min(5,camZ+e.deltaY*.003));
    cam.position.z=camZ;
  },{passive:false});

  // Click only if not dragged
  const ray=new THREE.Raycaster(),ms=new THREE.Vector2();
  c.addEventListener('click',e=>{
    if(dragDist>5) return; // was a drag, not a click
    // Check if a country label was clicked (event delegation)
    const label=e.target.closest('.country-label');
    if(label){
      const co=countries.find(x=>x.code===label.dataset.code);
      if(co) showCard(co);
      return;
    }
    const r=c.getBoundingClientRect();
    ms.x=((e.clientX-r.left)/r.width)*2-1;
    ms.y=-((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ms,cam);
    const hits=ray.intersectObjects(hitTargets.children);
    if(hits.length>0 && hits[0].object.userData.code){
      showCard(hits[0].object.userData);
    }
  });

  let t=0;
  (function anim(){requestAnimationFrame(anim);t+=.01;
    gm.rotation.set(rX,rY,0);dg.rotation.set(rX,rY,0);hitTargets.rotation.set(rX,rY,0);
    scene.children.forEach(ch=>{if(ch.isLine)ch.rotation.set(rX,rY,0);if(ch!==gm&&ch!==dg&&ch!==hitTargets&&ch.geometry&&(ch.material.wireframe||ch.material.side===THREE.BackSide||ch.geometry.type==='SphereGeometry'))ch.rotation.set(rX,rY,0);});
    dg.children.forEach(ch=>{if(ch.userData.pulse){const s=1+.3*Math.sin(t*3+ch.position.x*10);ch.scale.set(s,s,s);ch.material.opacity=.3+.2*Math.sin(t*3+ch.position.x*10);}});
    // Labels - project from exact dot position, offset in screen space
    document.querySelectorAll('.country-label').forEach(el=>el.remove());
    countries.forEach(co=>{
      const p=ll(co.lat,co.lon,1.005);
      p.applyEuler(new THREE.Euler(rX,rY,0,'YXZ'));
      if(p.z<0.15) return;
      const pr=p.clone().project(cam),rc=c.getBoundingClientRect();
      const x=(pr.x*.5+.5)*rc.width, y=(-pr.y*.5+.5)*rc.height;
      const el=document.createElement('div');el.className='country-label';
      el.dataset.code=co.code;
      el.innerHTML=`<span class="flag">${co.flag}</span>${co.code}`;
      el.style.cssText=`left:${x}px;top:${y+16}px;transform:translate(-50%,0)`;
      c.appendChild(el);
    });
    ren.render(scene,cam);
  })();
  window.addEventListener('resize',()=>{const w=c.clientWidth,h=c.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();ren.setSize(w,h);});
}
function ll(lat,lon,r){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));}

// ── LEVEL TOGGLE HELPER ──
function levelToggleHTML(){
  return `<div class="level-toggle">
    <button class="lt-btn${currentLevel==='beginner'?' active':''}" data-lv="beginner">Beginner</button>
    <button class="lt-btn${currentLevel==='moderate'?' active':''}" data-lv="moderate">Moderate</button>
    <button class="lt-btn${currentLevel==='expert'?' active':''}" data-lv="expert">Expert</button>
  </div>`;
}
function setLevel(lv){
  currentLevel=lv;
  document.querySelectorAll('.exp-btn').forEach(b=>{b.classList.toggle('active',b.dataset.level===lv);});
}
function attachLevelToggle(container, refreshFn){
  container.querySelectorAll('.lt-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      setLevel(btn.dataset.lv);
      refreshFn();
    });
  });
}

// ── NEWS ICONS ──
let activeNewsIdx = null;
function assembleNewsData(idx) {
  const story = (newsData[currentLevel] || newsData.beginner)[idx] || null;
  return story ? {icon: story.icon, label: story.label, body: story.body, idx} : null;
}

function renderNews(d) {
  if (!d) return;
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.innerHTML = applyGlossary(`<div class="tt-close" onclick="this.parentElement.remove()">✕</div>${levelToggleHTML()}<div class="tt-title">${d.icon} ${d.label}</div><div class="tt-story">${d.body}</div>`);
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active'); attachGlossary(tt);
  attachLevelToggle(tt, () => { tt.remove(); showNewsTooltip(activeNewsIdx); });
  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showNewsTooltip(idx) {
  activeNewsIdx = idx;
  const d = assembleNewsData(idx);
  renderNews(d);
}
document.querySelectorAll('.news-icon').forEach(el=>{
  el.addEventListener('click',()=>{ closeAll(); showNewsTooltip(+el.dataset.idx); });
});

// ── CARD ──
let activeCardCountry = null;
function assembleCardData(co) {
  const stories = (cardStories[currentLevel] && cardStories[currentLevel][co.code]) || ['Data loading...'];
  const weatherClass = co.weather === '☀️' ? 'sunny' : co.weather === '☁️' ? 'cloudy' : co.weather === '⛈️' ? 'stormy' : '';
  const macroMetrics = Object.entries(co.metrics.macro).map(([k, v]) => ({name: k, val: v, section: 'macro'}));
  const marketMetrics = Object.entries(co.metrics.market).map(([k, v]) => ({name: k, val: v, section: 'market'}));
  return {
    code: co.code, name: co.name, flag: co.flag, weather: co.weather,
    weatherClass, stories, macroMetrics, marketMetrics
  };
}

function renderCard(d, co) {
  let mH = '', mkH = '';
  d.macroMetrics.forEach(m => { mH += `<div class="metric" data-m="${m.name}" data-v="${m.val}" data-c="${d.name}" data-s="macro"><div class="m-name">${m.name}</div><div class="m-val">${m.val}</div></div>`; });
  d.marketMetrics.forEach(m => { mkH += `<div class="metric" data-m="${m.name}" data-v="${m.val}" data-c="${d.name}" data-s="market"><div class="m-name">${m.name}</div><div class="m-val">${m.val}</div></div>`; });

  const o = document.createElement('div'); o.className = 'card-overlay';
  o.innerHTML = `<div class="country-card"><div class="card-close" onclick="this.closest('.card-overlay').remove()">✕</div>${levelToggleHTML()}<div class="card-head"><span class="c-flag">${d.flag}</span><span class="c-name">${d.name}</span></div><div class="weather-sec"><div class="w-icon ${d.weatherClass}">${d.weather}</div><ul class="c-stories">${d.stories.map(s => `<li>${applyGlossary(s)}</li>`).join('')}</ul></div><div class="sec-head">MACRO FORECASTS (2026)</div><div class="metrics">${mH}</div><div class="sec-head">MARKETS</div><div class="metrics mkt">${mkH}</div></div>`;
  document.body.appendChild(o);
  o.addEventListener('click', e => { if (e.target === o) o.remove(); });
  o.querySelectorAll('.metric').forEach(el => { el.addEventListener('click', e => { e.stopPropagation(); showMTT(el.dataset.m, el.dataset.v, el.dataset.c, el.dataset.s); }); });
  attachLevelToggle(o, () => { o.remove(); showCard(activeCardCountry); });
  attachGlossary(o);
}

function showCard(co) {
  activeCardCountry = co;
  closeAll();
  const d = assembleCardData(co);
  renderCard(d, co);
}

// ── METRIC TOOLTIP ──
let activeMTT = null;
// ── METRIC NAVIGATION HELPER ──
function getMetricList(countryName){
  const co=countries.find(c=>c.name===countryName);
  if(!co) return [];
  const macroKeys=Object.keys(co.metrics.macro).map(k=>({name:k,val:co.metrics.macro[k],sec:'macro'}));
  const mktKeys=Object.keys(co.metrics.market).map(k=>({name:k,val:co.metrics.market[k],sec:'market'}));
  return macroKeys.concat(mktKeys);
}

function assembleMTTData(n, v, co, sec) {
  const code = getCountryCode(co);
  const metricList = getMetricList(co);
  const currentIndex = metricList.findIndex(m => m.name === n);

  // Explanation (level-sensitive)
  const exEntry = (metricExpl[currentLevel] || metricExpl.moderate)[n]
    || (metricExpl[currentLevel] || metricExpl.moderate)['FX'] || null;
  const bluf = exEntry ? getBluf(exEntry) : null;
  const full = exEntry ? getFull(exEntry) : null;

  // Source
  const source = isFxMetric(n) ? fxSource : (metricSources[n] || null);

  // FX regime
  let fxRegimeInfo = null;
  if (isFxMetric(n) && code && fxRegime[code]) {
    fxRegimeInfo = {
      description: fxRegime[code][currentLevel] || fxRegime[code].beginner
    };
  }

  // Historical data
  const histEntry = (code && historicalData[code] && historicalData[code][n]) || null;
  let chart = null;
  if (histEntry) {
    const isAnnual = !!histEntry.annual;
    chart = {
      isAnnual,
      title: histEntry.indexLabel || (isAnnual ? n + ' (Annual)' : '5-Year History'),
      code
    };
  }

  return {
    metricName: n, value: v, countryName: co, section: sec, code,
    bluf, full, source, fxRegimeInfo, chart,
    metricList, currentIndex
  };
}

function renderMTT(d) {
  // Explanation HTML
  let exHTML = d.bluf || '';
  if (d.full) {
    exHTML += `<div class="ge-expand">Read more ›</div><div class="ge-full">${d.full}</div>`;
  }

  // FX regime HTML
  let regimeHTML = '';
  if (d.fxRegimeInfo) {
    regimeHTML = `<div class="tt-section"><div class="tt-label" style="color:#00d4ff">FX Regime</div><div class="tt-story" style="margin-bottom:0;padding-bottom:0;border-bottom:none">${d.fxRegimeInfo.description}</div></div>`;
  }

  // Chart HTML
  let chartHTML = '';
  if (d.chart) {
    if (d.chart.isAnnual) {
      chartHTML = `<div class="metric-chart-wrap">
        <div class="metric-chart-head">
          <div class="metric-chart-title">${d.chart.title}</div>
        </div>
        <div class="metric-chart-canvas" id="mttChart"></div>
      </div>`;
    } else {
      chartHTML = `<div class="metric-chart-wrap">
        <div class="metric-chart-head">
          <div class="metric-chart-title">${d.chart.title}</div>
          <div class="metric-chart-range">
            <button class="mcr-btn" data-r="12">1Y</button>
            <button class="mcr-btn" data-r="24">2Y</button>
            <button class="mcr-btn active" data-r="60">5Y</button>
          </div>
        </div>
        <div class="metric-chart-canvas" id="mttChart"></div>
      </div>`;
    }
  }

  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.innerHTML = applyGlossary(`<div class="tt-nav"><button class="tt-nav-btn" data-dir="up" title="Previous metric">▲</button><button class="tt-nav-btn" data-dir="down" title="Next metric">▼</button></div><div class="tt-close">✕</div>${levelToggleHTML()}<div class="tt-title">${d.metricName}</div><div class="tt-section"><div class="tt-label">${d.countryName}</div><div class="tt-value">${d.value}</div></div>${chartHTML}${exHTML ? `<div class="tt-story">${exHTML}</div>` : ''}${regimeHTML}${d.source ? `<div class="tt-source">Source: ${d.source}</div>` : ''}<button class="compare-btn" data-metric="${d.metricName}" data-country="${d.countryName}" data-sec="${d.section}"><span class="cb-icon">⇅</span> Compare All Countries</button>`, d.metricName);
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active'); attachGlossary(tt);

  // Close
  tt.querySelector('.tt-close').addEventListener('click', e => { e.stopPropagation(); if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); });

  // Metric navigation
  tt.querySelectorAll('.tt-nav-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (d.currentIndex < 0 || d.metricList.length === 0) return;
      const dir = btn.dataset.dir === 'up' ? -1 : 1;
      const nextIdx = (d.currentIndex + dir + d.metricList.length) % d.metricList.length;
      const next = d.metricList[nextIdx];
      if (activeChart) { activeChart.destroy(); activeChart = null; }
      tt.remove();
      showMTT(next.name, next.val, d.countryName, next.sec);
    });
  });

  // Render chart
  if (d.chart) {
    const chartContainer = tt.querySelector('#mttChart');
    renderMetricChart(chartContainer, d.metricName, d.chart.code, d.chart.isAnnual ? null : 60);
    if (!d.chart.isAnnual) {
      tt.querySelectorAll('.mcr-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          tt.querySelectorAll('.mcr-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const r = parseInt(btn.dataset.r);
          renderMetricChart(chartContainer, d.metricName, d.chart.code, r);
        });
      });
    }
  }

  // Level toggle
  attachLevelToggle(tt, () => {
    const expanded = []; tt.querySelectorAll('.ge-full').forEach((el, i) => { if (el.classList.contains('open')) expanded.push(i); });
    if (activeChart) { activeChart.destroy(); activeChart = null; }
    tt.remove(); const m = activeMTT; showMTT(m.n, m.v, m.co, m.sec);
    const newTT = document.querySelector('.tooltip');
    if (newTT && expanded.length) { newTT.querySelectorAll('.ge-full').forEach((el, i) => { if (expanded.includes(i)) { el.classList.add('open'); const btn = el.previousElementSibling; if (btn && btn.classList.contains('ge-expand')) btn.textContent = 'Show less ‹'; } }); }
  });

  // Compare button
  tt.querySelector('.compare-btn').addEventListener('click', e => { e.stopPropagation(); if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); showCompare(d.metricName, d.countryName, d.section); });

  // Read more toggles
  tt.querySelectorAll('.ge-expand').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const fullEl = btn.nextElementSibling;
      const isOpen = fullEl.classList.contains('open');
      fullEl.classList.toggle('open');
      btn.textContent = isOpen ? 'Read more ›' : 'Show less ‹';
    });
  });

  // Outside click close
  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { if (activeChart) { activeChart.destroy(); activeChart = null; } tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showMTT(n, v, co, sec) {
  activeMTT = {n, v, co, sec};
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const d = assembleMTTData(n, v, co, sec);
  renderMTT(d);
}


function gdpWeather(v){
  if(v>=3) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v>=0) return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
  return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
}

function assembleWeatherGrid(metric) {
  const codes = ['USA','CAN','GBR','JPN','DEU','FRA','ITA','CHN','IND'];
  const isGDP = metric === 'gdp';
  const dataSource = isGDP ? gdpAllCountries : cpiAllCountries;
  const weatherFn = isGDP ? gdpWeather : cpiWeather;
  const title = isGDP ? 'GDP Growth · Weather Map' : 'Inflation (CPI) · Weather Map';
  const subtitle = isGDP ? 'All Countries · 2020–2026F' : 'All Countries · 2020–2026F · Target ~2%';
  const legend = isGDP
    ? [{icon:'wi-sun', emoji:'☀️', label:'≥3%'}, {icon:'wi-cloud', emoji:'☁️', label:'0–3%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;0%'}]
    : [{icon:'wi-sun', emoji:'☀️', label:'1–3%'}, {icon:'wi-cloud', emoji:'☁️', label:'0–1% / 3–5%'}, {icon:'wi-storm', emoji:'☁️', label:'&lt;0% / &gt;5%'}];
  const showSign = isGDP;

  const years = gdpYears;
  const rows = codes.map(code => {
    const d = dataSource[code];
    if (!d) return null;
    const cells = d.v.map(v => {
      const w = weatherFn(v);
      const sign = (showSign && v > 0) ? '+' : '';
      return {cls: w.cls, icon: w.icon, label: `${sign}${v}%`};
    });
    return {code, flag: d.flag, cells};
  }).filter(Boolean);

  return {title, subtitle, legend, years, rows};
}

function renderWeatherGrid(d) {
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();

  let headerHTML = `<th></th>`;
  d.years.forEach((y, i) => {
    const cls = i === d.years.length - 1 ? ' class="forecast"' : '';
    headerHTML += `<th${cls}>${y}</th>`;
  });

  let bodyHTML = '';
  d.rows.forEach(r => {
    let cells = `<td><div class="wg-country"><span class="wg-flag">${r.flag}</span><span class="wg-code">${r.code}</span></div></td>`;
    r.cells.forEach(c => {
      cells += `<td><div class="wg-cell ${c.cls}">${c.icon}<span class="wg-val">${c.label}</span></div></td>`;
    });
    bodyHTML += `<tr>${cells}</tr>`;
  });

  let legendHTML = d.legend.map(l => `<div class="wg-legend-item"><span class="wi ${l.icon}" style="font-size:14px;width:18px;height:18px">${l.emoji}</span> ${l.label}</div>`).join('');

  const tt = document.createElement('div'); tt.className = 'tooltip';
  tt.style.maxWidth = '520px';
  tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
    <div class="tt-title">${d.title}</div>
    <div style="font-size:10px;color:#666;margin-bottom:8px;font-family:var(--font-display);letter-spacing:1px;text-transform:uppercase">${d.subtitle}</div>
    <table class="wg-table"><thead><tr>${headerHTML}</tr></thead><tbody>${bodyHTML}</tbody></table>
    <div class="wg-legend">${legendHTML}</div>`;
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active');
  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function cpiWeather(v){
  // Sunny = near 2% target (1-3%), Cloudy = off target, Stormy = far off (>5% or <0%)
  if(v>=1&&v<=3) return {icon:'<span class="wi wi-sun">☀️</span>',cls:'sunny'};
  if(v<0||v>5) return {icon:'<span class="wi wi-storm">☁️</span>',cls:'storm'};
  return {icon:'<span class="wi wi-cloud">☁️</span>',cls:'cloudy'};
}

function showWeatherCPI() {
  const d = assembleWeatherGrid('cpi');

}

// ── COMPARE VIEW ──
function parseNum(s){ const n=parseFloat(String(s).replace(/[^-\d.]/g,'')); return isNaN(n)?null:n; }
function assembleCompareData(metricName, highlightCountry, sec) {
  const isFx = isFxMetric(metricName);
  const rows = [];
  countries.forEach(co => {
    const pool = sec === 'macro' ? co.metrics.macro : co.metrics.market;
    let val = pool[metricName], fxKey = metricName;
    if (val === undefined && sec === 'market') {
      const keys = Object.keys(pool);
      fxKey = keys.find(k => k.includes('/'));
      if (fxKey) val = pool[fxKey];
    }
    if (val !== undefined) {
      const regime = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code][currentLevel] || fxRegime[co.code].beginner : null;
      const regimeLabel = (isFx || fxKey !== metricName) && fxRegime[co.code] ? fxRegime[co.code].label : null;
      rows.push({code: co.code, name: co.name, flag: co.flag, val, num: parseNum(val), fxKey: fxKey || metricName, regime, regimeLabel});
    }
  });
  rows.sort((a, b) => { if (a.num === null && b.num === null) return 0; if (a.num === null) return 1; if (b.num === null) return -1; return b.num - a.num; });
  const maxAbs = Math.max(...rows.filter(r => r.num !== null).map(r => Math.abs(r.num)), 0.01);
  const showRegimes = rows.some(r => r.regime);
  const hasWeatherBtn = metricName === 'GDP Growth' || metricName === 'Inflation (CPI)';
  return {metricName, highlightCountry, sec, rows, maxAbs, showRegimes, isFx, hasWeatherBtn};
}

function renderCompare(d) {
  function regimeClass(label) {
    if (!label) return '';
    const l = label.toLowerCase();
    if (l.includes('peg')) return 'peg';
    if (l.includes('euro')) return 'euro';
    if (l.includes('managed')) return 'managed';
    return 'free';
  }

  let rowsHTML = d.rows.map(r => {
    const isNeg = r.num < 0;
    const hl = r.name === d.highlightCountry ? ' highlight' : '';
    const regimeTag = (d.showRegimes && r.regimeLabel) ? `<span class="cr-regime ${regimeClass(r.regimeLabel)}" data-code="${r.code}">${r.regimeLabel}</span>` : '';
    return `<div class="compare-row${hl}">
      <span class="cr-flag">${r.flag}</span>
      <span class="cr-name">${r.code}</span>
      ${regimeTag}
      <span class="cr-bar-wrap"><span class="cr-bar ${isNeg ? 'negative' : 'positive'}" style="width:0%"></span></span>
      <span class="cr-val">${r.val}</span>
    </div>`;
  }).join('');

  const tt = document.createElement('div'); tt.className = 'tooltip';
  const weatherBtnHTML = d.hasWeatherBtn ? `<button class="weather-btn" id="weatherBtn"><span class="wb-icon"><span class="wi wi-sun" style="font-size:12px;width:14px;height:14px">☀️</span><span class="wi wi-cloud" style="font-size:12px;width:14px;height:14px">☁️</span><span class="wi wi-storm" style="font-size:12px;width:14px;height:14px">☁️</span></span> Over Time</button>` : '';
  tt.innerHTML = `<div class="tt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</div>
    <div class="tt-title">⇅ ${d.showRegimes ? 'Exchange Rates' : d.metricName}</div>
    <div style="font-size:10px;color:#666;margin-bottom:12px;font-family:var(--font-display);letter-spacing:1px;text-transform:uppercase">All Countries · Ranked</div>
    ${weatherBtnHTML}${rowsHTML}`;
  document.body.appendChild(tt); tt.offsetHeight; tt.classList.add('active');

  // Weather button
  const wBtn = tt.querySelector('#weatherBtn');
  if (wBtn) wBtn.addEventListener('click', e => {
    e.stopPropagation(); tt.remove();
    if (d.metricName === 'GDP Growth') showWeatherGDP();
    else if (d.metricName === 'Inflation (CPI)') showWeatherCPI();
  });

  // Regime tag click
  tt.querySelectorAll('.cr-regime').forEach(tag => {
    tag.addEventListener('click', e => {
      e.stopPropagation(); closeBubble();
      const code = tag.dataset.code;
      const fr = fxRegime[code]; if (!fr) return;
      const desc = fr[currentLevel] || fr.beginner;
      const b = document.createElement('div'); b.className = 'glossary-bubble';
      b.innerHTML = `<div class="gb-close" onclick="event.stopPropagation();closeBubble()">✕</div><div class="gb-term">${fr.label} · ${code}</div><div class="gb-def">${desc}</div>`;
      document.body.appendChild(b);
      const r = tag.getBoundingClientRect();
      let top = r.bottom + 8, left = r.left;
      if (left + 320 > innerWidth) left = innerWidth - 330; if (left < 10) left = 10;
      if (top + 200 > innerHeight) { top = r.top - 8 - 150; b.classList.add('arrow-bottom'); }
      b.style.left = left + 'px'; b.style.top = top + 'px'; activeBubble = b;
      setTimeout(() => { document.addEventListener('click', function cl(ev) { if (activeBubble && !activeBubble.contains(ev.target)) closeBubble(); document.removeEventListener('click', cl); }, {once: true}); }, 10);
    });
  });

  // Animate bars
  requestAnimationFrame(() => {
    tt.querySelectorAll('.cr-bar').forEach((bar, i) => {
      const pct = (Math.abs(d.rows[i].num) / d.maxAbs * 100);
      setTimeout(() => { bar.style.width = pct + '%'; }, i * 40);
    });
  });

  setTimeout(() => { document.addEventListener('click', function cl(e) { if (!tt.contains(e.target)) { tt.remove(); document.removeEventListener('click', cl); } }); }, 100);
}

function showCompare(metricName, highlightCountry, sec) {
  document.querySelectorAll('.tooltip').forEach(t => t.remove()); closeBubble();
  const d = assembleCompareData(metricName, highlightCountry, sec);
  renderCompare(d);
}

// ── GLOSSARY ──
function applyGlossary(h, skipTerm){
  h=h.replace(/<a data-term="([^"]+)">([^<]+)<\/a>/g,(_,t,x)=>`<span class="glossary-term" data-term="${t}">${x}</span>`);
  const skip=skipTerm?skipTerm.toLowerCase().replace(/\s*\(.*\)\s*/g,'').trim():'';
  Object.keys(glossary).forEach(t=>{const g=glossary[t];if(currentLevel==='moderate'&&g.complexity<2)return;if(currentLevel==='expert'&&g.complexity<3)return;if(skip&&(skip.includes(t.toLowerCase())||t.toLowerCase().includes(skip)))return;h=h.replace(new RegExp(`(?<![\\w-])\\b(${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b(?![^<]*>)`,'i'),m=>`<span class="glossary-term" data-term="${t}">${m}</span>`);});return h;
}
function attachGlossary(r){r.querySelectorAll('.glossary-term').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation();showBubble(el);});});}
// ── BLUF helpers ──
function getBluf(entry){ return (typeof entry==='object' && entry.bluf) ? entry.bluf : entry; }
function getFull(entry){ return (typeof entry==='object' && entry.full) ? entry.full : null; }

let activeBubbleTerm=null, activeBubbleEl=null;

function assembleGlossaryData(term) {
  const g = glossary[term] || null;
  if (!g) return null;
  const entry = g[currentLevel] || g.beginner;
  if (!entry) return null;
  return {
    term,
    glossaryEntry: g,
    bluf: getBluf(entry),
    full: getFull(entry)
  };
}

function renderBubbleContent(t, g){
  const d = assembleGlossaryData(t);
  const bluf = d ? d.bluf : t;
  const full = d ? d.full : null;
  let html=`<div class="gb-close">✕</div>`;
  html+=`<div class="gb-level">
    <button class="lt-btn${currentLevel==='beginner'?' active':''}" data-lv="beginner">Beginner</button>
    <button class="lt-btn${currentLevel==='moderate'?' active':''}" data-lv="moderate">Moderate</button>
    <button class="lt-btn${currentLevel==='expert'?' active':''}" data-lv="expert">Expert</button>
  </div>`;
  html+=`<div class="gb-term">${t}</div><div class="gb-def">${bluf}</div>`;
  if(full){
    html+=`<div class="ge-expand">Read more ›</div><div class="ge-full">${full}</div>`;
  }
  return {html, hasFull:!!full};
}

function showBubble(el){
  closeBubble();const t=el.dataset.term;
  const d=assembleGlossaryData(t);if(!d)return;
  const g=d.glossaryEntry;
  activeBubbleTerm=t; activeBubbleEl=el;
  const {html, hasFull}=renderBubbleContent(t,g);
  const b=document.createElement('div');b.className='glossary-bubble'+(hasFull?' has-full':'');
  b.innerHTML=html;
  document.body.appendChild(b);
  positionBubble(b, el, hasFull);
  activeBubble=b;
  attachBubbleHandlers(b, t, g, el);
  setTimeout(()=>{document.addEventListener('click',function cl(e){if(activeBubble&&!activeBubble.contains(e.target))closeBubble();document.removeEventListener('click',cl);},{once:true});},10);
}

function positionBubble(b, el, hasFull){
  const r=el.getBoundingClientRect();let top=r.bottom+8,left=r.left;
  const maxW=hasFull?420:320;
  if(left+maxW>innerWidth)left=innerWidth-maxW-10;if(left<10)left=10;
  if(top+200>innerHeight){top=r.top-8-150;b.classList.add('arrow-bottom');}
  b.style.left=left+'px';b.style.top=top+'px';
}

function attachBubbleHandlers(b, t, g, el){
  // Close button
  b.querySelector('.gb-close').addEventListener('click',e=>{e.stopPropagation();closeBubble();});
  // Level toggle
  b.querySelectorAll('.gb-level .lt-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      // Preserve expanded state
      const wasExpanded=!!b.querySelector('.ge-full.open');
      setLevel(btn.dataset.lv);
      // Re-render in place
      const {html, hasFull}=renderBubbleContent(t,g);
      b.className='glossary-bubble'+(hasFull?' has-full':'')+(wasExpanded&&hasFull?' expanded':'');
      b.innerHTML=html;
      // Restore expanded state
      if(wasExpanded&&hasFull){const fullEl=b.querySelector('.ge-full');if(fullEl)fullEl.classList.add('open');const expBtn=b.querySelector('.ge-expand');if(expBtn)expBtn.textContent='Show less ‹';}
      positionBubble(b, el, hasFull);
      attachBubbleHandlers(b, t, g, el);
    });
  });
  // Read more toggle
  const expBtn=b.querySelector('.ge-expand');
  if(expBtn){
    expBtn.addEventListener('click',e=>{
      e.stopPropagation();
      const fullEl=b.querySelector('.ge-full');
      const isOpen=fullEl.classList.contains('open');
      fullEl.classList.toggle('open');
      b.classList.toggle('expanded');
      expBtn.textContent=isOpen?'Read more ›':'Show less ‹';
      const bRect=b.getBoundingClientRect();
      if(bRect.bottom>innerHeight-10){b.style.top=Math.max(10,innerHeight-bRect.height-10)+'px';}
      if(bRect.top<10){b.style.top='10px';}
    });
  }
}
function closeBubble(){if(activeBubble){activeBubble.remove();activeBubble=null;}}
function closeAll(){if(activeChart){activeChart.destroy();activeChart=null;}document.querySelectorAll('.card-overlay,.tooltip').forEach(el=>el.remove());closeBubble();}

});
