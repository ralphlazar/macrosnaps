<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacroSnaps — Homepage Redesign v7 (Canopy-style mockup)</title>
<style>
  body {
    margin: 0;
    padding: 32px 24px;
    background: #f5f5f3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #1a1a18;
  }
  .page {
    max-width: 1200px;
    margin: 0 auto;
  }
  .wi { line-height: 1; display: inline-block; }
  .wi.sunny  { filter: none; }
  .wi.cloudy { filter: brightness(.65) contrast(1.05) saturate(.3); }
  .wi.stormy { filter: brightness(.4) contrast(1.2) saturate(0); }
  .ms-card {
    border-radius: 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .ms-card.clickable { cursor: pointer; }
  .ms-card.clickable:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="page">

<h2 class="sr-only">MacroSnaps homepage redesign v7: Canopy-style white-background two-column grid with editorial Today box, three weather matrices, twelve country tiles, and a commodities strip.</h2>

<div style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e8e8e5;">

  <!-- Header bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid #e8e8e5;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:28px;height:28px;background:#fff;border-radius:6px;border:1px solid #e8e8e5;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1e2a38;flex-shrink:0;line-height:1;">M</div>
      <div>
        <div style="font-size:15px;font-weight:600;color:#1a1a18;letter-spacing:-0.01em;line-height:1.2;">MacroSnaps</div>
        <div style="font-size:11px;color:#5f5e5a;">global macro &middot; daily</div>
      </div>
    </div>
    <div style="font-size:11px;color:#999896;" id="ms-date">23 April 2026</div>
  </div>

  <!-- 4-col grid container -->
  <div id="ms-grid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 24px 28px;align-items:start;"></div>

</div>

</div>

<script>
const grid = document.getElementById('ms-grid');

// ─────────────────────────────────────────────────────────────────────────
// Three icons only — sunny ☀️, cloudy ☁️, stormy ⛈️
// (matches macrosnaps-shell.html — no fourth icon ever)
// ─────────────────────────────────────────────────────────────────────────
function wi(cls, sz = 15) {
  const e = { sunny: '☀️', cloudy: '☁️', stormy: '⛈️' };
  return `<span class="wi ${cls}" style="font-size:${sz}px;">${e[cls]}</span>`;
}
const W = { sunny: wi('sunny'), cloudy: wi('cloudy'), stormy: wi('stormy') };

// ─────────────────────────────────────────────────────────────────────────
// Box 1: Today — editorial bullets card (span 2, stretches to row height)
// ─────────────────────────────────────────────────────────────────────────
function mkToday(num, bullets) {
  const rgb = [30, 42, 56]; // dark navy
  const [r, g, b] = rgb;
  const el = document.createElement('div');
  el.className = 'ms-card';
  el.style.cssText = `grid-column:span 2;align-self:stretch;border:2px solid rgba(${r},${g},${b},0.25);background:rgba(${r},${g},${b},0.025);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;`;
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <span style="width:24px;height:24px;border-radius:50%;background:#1e2a38;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;">${num}</span>
      <span style="font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#1a1a18;">Today</span>
      <span style="font-size:11px;color:#5f5e5a;margin-left:auto;">Editorial</span>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px;">
      ${bullets.map(b => `<div style="font-size:13px;line-height:1.45;color:#1a1a18;padding-left:14px;border-left:2px solid rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.35);">${b}</div>`).join('')}
    </div>`;
  grid.appendChild(el);
}

// ─────────────────────────────────────────────────────────────────────────
// Boxes 2-4: Matrix cards (Growth, Inflation, Stock Markets)
// 7 year columns × 12 country rows
// ─────────────────────────────────────────────────────────────────────────
function mkMatrix(rgb, num, color, title, sub, gridData) {
  const [r, g, b] = rgb;
  const el = document.createElement('div');
  el.className = 'ms-card clickable';
  el.style.cssText = `grid-column:span 2;align-self:stretch;border:2px solid rgba(${r},${g},${b},0.25);background:rgba(${r},${g},${b},0.025);border-radius:12px;padding:16px 18px;`;
  el.onmouseenter = () => { el.style.borderColor = `rgba(${r},${g},${b},0.5)`; };
  el.onmouseleave = () => { el.style.borderColor = `rgba(${r},${g},${b},0.25)`; };

  const yrs = ["'20","'21","'22","'23","'24","'25","'26"];
  const matrixHtml = `
    <div style="display:grid;grid-template-columns:28px repeat(7,1fr);row-gap:3px;column-gap:4px;">
      <div></div>
      ${yrs.map(y => `<div style="font-size:9px;color:#999896;text-align:center;padding-bottom:5px;font-weight:500;">${y}</div>`).join('')}
      ${gridData.map(([code, ...conds]) =>
        `<div style="font-size:9px;color:#5f5e5a;font-weight:600;display:flex;align-items:center;padding-right:2px;">${code}</div>` +
        conds.map(c => `<div style="display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.025);border-radius:3px;padding:4px 0;">${W[c] || W.cloudy}</div>`).join('')
      ).join('')}
    </div>
    <div style="margin-top:10px;font-size:10px;color:#999896;">Click any country to explore →</div>`;

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <span style="width:24px;height:24px;border-radius:50%;background:${color};display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;">${num}</span>
      <span style="font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#1a1a18;">${title}</span>
      <span style="font-size:11px;color:#5f5e5a;margin-left:auto;">${sub}</span>
    </div>
    ${matrixHtml}`;
  grid.appendChild(el);
}

// ─────────────────────────────────────────────────────────────────────────
// Render: Today + 3 matrices
// (matrix data below is MOCKUP only — replace with live data.json wiring)
// ─────────────────────────────────────────────────────────────────────────
mkToday(1, [
  'Asia\'s share of global growth keeps climbing. For the first time, Asia holds four of the top six spots.',
  'Germany has contracted for the second quarter running. Europe\'s biggest economy is stalling and nobody has a convincing plan to fix it.',
  'The Fed held again. Markets are pricing the first cut in September — if inflation keeps cooperating.'
]);

const gGrid = [
  ['US','sunny','sunny','cloudy','sunny','sunny','cloudy','cloudy'],
  ['CA','sunny','sunny','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['GB','cloudy','sunny','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['JP','cloudy','cloudy','cloudy','cloudy','sunny','cloudy','cloudy'],
  ['DE','cloudy','sunny','stormy','stormy','stormy','stormy','stormy'],
  ['FR','cloudy','sunny','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['IT','cloudy','sunny','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['CN','sunny','sunny','cloudy','sunny','sunny','sunny','sunny'],
  ['IN','sunny','sunny','sunny','sunny','sunny','sunny','sunny'],
  ['ZA','cloudy','cloudy','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['BR','cloudy','sunny','sunny','sunny','sunny','cloudy','cloudy'],
  ['RU','cloudy','sunny','stormy','sunny','sunny','sunny','sunny'],
];

const iGrid = [
  ['US','sunny','cloudy','stormy','stormy','cloudy','cloudy','cloudy'],
  ['CA','sunny','cloudy','stormy','stormy','cloudy','sunny','sunny'],
  ['GB','sunny','cloudy','stormy','stormy','cloudy','cloudy','cloudy'],
  ['JP','sunny','sunny','cloudy','cloudy','sunny','sunny','sunny'],
  ['DE','sunny','cloudy','stormy','stormy','cloudy','sunny','sunny'],
  ['FR','sunny','cloudy','stormy','stormy','cloudy','sunny','sunny'],
  ['IT','sunny','cloudy','stormy','stormy','cloudy','sunny','sunny'],
  ['CN','sunny','sunny','sunny','sunny','sunny','sunny','cloudy'],
  ['IN','cloudy','stormy','stormy','cloudy','cloudy','cloudy','cloudy'],
  ['ZA','cloudy','cloudy','stormy','cloudy','cloudy','cloudy','stormy'],
  ['BR','cloudy','stormy','stormy','cloudy','cloudy','stormy','stormy'],
  ['RU','cloudy','stormy','stormy','stormy','stormy','stormy','stormy'],
];

const sGrid = [
  ['US','sunny','sunny','stormy','sunny','sunny','sunny','sunny'],
  ['CA','sunny','sunny','cloudy','sunny','sunny','sunny','sunny'],
  ['GB','cloudy','sunny','cloudy','sunny','sunny','sunny','sunny'],
  ['JP','sunny','sunny','cloudy','sunny','sunny','sunny','sunny'],
  ['DE','cloudy','sunny','stormy','sunny','sunny','cloudy','cloudy'],
  ['FR','cloudy','sunny','stormy','sunny','sunny','cloudy','cloudy'],
  ['IT','cloudy','sunny','cloudy','sunny','sunny','sunny','sunny'],
  ['CN','cloudy','cloudy','stormy','cloudy','cloudy','sunny','sunny'],
  ['IN','sunny','sunny','sunny','sunny','sunny','cloudy','stormy'],
  ['ZA','cloudy','sunny','cloudy','cloudy','cloudy','cloudy','cloudy'],
  ['BR','cloudy','cloudy','sunny','sunny','sunny','sunny','sunny'],
  ['RU','sunny','sunny','stormy','cloudy','cloudy','sunny','cloudy'],
];

mkMatrix([26,74,46],   2, '#1a4a2e', 'Growth',        'GDP conditions, 12 economies',    gGrid);
mkMatrix([139,26,26],  3, '#8b1a1a', 'Inflation',     'Price conditions, 12 economies',  iGrid);
mkMatrix([74,111,163], 4, '#4a6fa3', 'Stock Markets', 'Equity performance, 12 economies', sGrid);

// ─────────────────────────────────────────────────────────────────────────
// 12 country navigation tiles — flag + full name + 2 weather icons
// ─────────────────────────────────────────────────────────────────────────
const ctries = [
  { flag: '🇺🇸', name: 'United States',  g: 'cloudy', i: 'cloudy' },
  { flag: '🇨🇦', name: 'Canada',         g: 'cloudy', i: 'sunny'  },
  { flag: '🇬🇧', name: 'United Kingdom', g: 'cloudy', i: 'cloudy' },
  { flag: '🇯🇵', name: 'Japan',          g: 'cloudy', i: 'sunny'  },
  { flag: '🇩🇪', name: 'Germany',        g: 'stormy', i: 'sunny'  },
  { flag: '🇫🇷', name: 'France',         g: 'cloudy', i: 'sunny'  },
  { flag: '🇮🇹', name: 'Italy',          g: 'cloudy', i: 'sunny'  },
  { flag: '🇨🇳', name: 'China',          g: 'sunny',  i: 'cloudy' },
  { flag: '🇮🇳', name: 'India',          g: 'sunny',  i: 'cloudy' },
  { flag: '🇿🇦', name: 'South Africa',   g: 'cloudy', i: 'stormy' },
  { flag: '🇧🇷', name: 'Brazil',         g: 'cloudy', i: 'stormy' },
  { flag: '🇷🇺', name: 'Russia',         g: 'sunny',  i: 'stormy' },
];

const cr = [26, 58, 92];
ctries.forEach(({ flag, name, g, i }) => {
  const el = document.createElement('div');
  el.className = 'ms-card clickable';
  el.style.cssText = `align-self:start;border:2px solid rgba(${cr[0]},${cr[1]},${cr[2]},0.25);background:rgba(${cr[0]},${cr[1]},${cr[2]},0.025);border-radius:12px;padding:13px 15px;min-width:0;`;
  el.onmouseenter = () => { el.style.borderColor = `rgba(${cr[0]},${cr[1]},${cr[2]},0.5)`; el.style.boxShadow = '0 2px 12px rgba(0,0,0,0.08)'; };
  el.onmouseleave = () => { el.style.borderColor = `rgba(${cr[0]},${cr[1]},${cr[2]},0.25)`; el.style.boxShadow = 'none'; };
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:9px;">
      <span style="font-size:20px;line-height:1;">${flag}</span>
      <span style="font-size:12px;font-weight:600;color:#1a1a18;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</span>
    </div>
    <div style="display:flex;gap:14px;">
      <div><div style="font-size:8px;color:#999896;margin-bottom:2px;letter-spacing:0.03em;text-transform:uppercase;">growth</div>${wi(g, 20)}</div>
      <div><div style="font-size:8px;color:#999896;margin-bottom:2px;letter-spacing:0.03em;text-transform:uppercase;">prices</div>${wi(i, 20)}</div>
    </div>`;
  grid.appendChild(el);
});

// ─────────────────────────────────────────────────────────────────────────
// Commodities strip (full-width, span 4)
// ─────────────────────────────────────────────────────────────────────────
const commEl = document.createElement('div');
commEl.className = 'ms-card clickable';
commEl.style.cssText = `grid-column:1/5;align-self:start;border:2px solid rgba(193,127,0,0.25);background:rgba(193,127,0,0.025);border-radius:12px;padding:16px 18px;`;
commEl.onmouseenter = () => { commEl.style.borderColor = 'rgba(193,127,0,0.5)'; commEl.style.boxShadow = '0 2px 12px rgba(0,0,0,0.08)'; };
commEl.onmouseleave = () => { commEl.style.borderColor = 'rgba(193,127,0,0.25)'; commEl.style.boxShadow = 'none'; };
commEl.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:24px;height:24px;border-radius:50%;background:#c17f00;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;">5</span>
      <span style="font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#1a1a18;">Commodities</span>
    </div>
    <span style="font-size:11px;color:#5f5e5a;">Key prices and weekly moves</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
    ${[
      ['WTI Crude','$94.63','+2.1%',1],
      ['Brent',    '$103.54','+2.4%',1],
      ['Gold',     '$4,723','-0.5%',-1],
      ['Silver',   '$75.79','+0.8%',1],
      ['Copper',   '$6.04','-0.3%',-1],
      ['Wheat',    '$612','+1.1%',1]
    ].map(([n,v,c,d]) => `
      <div style="background:rgba(0,0,0,0.025);border-radius:8px;padding:10px 12px;">
        <div style="font-size:10px;color:#999896;margin-bottom:5px;">${n}</div>
        <div style="font-size:15px;font-weight:600;color:#1a1a18;margin-bottom:2px;">${v}</div>
        <div style="font-size:11px;font-weight:600;color:${d===1?'#2d9b5a':'#d4542a'};">${c} this week</div>
      </div>`).join('')}
  </div>`;
grid.appendChild(commEl);
</script>

</body>
</html>
